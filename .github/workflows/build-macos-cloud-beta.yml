name: Release BeatGaler macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v0.8.0"
        required: true
        type: string
      release_notes:
        description: "Short release notes"
        required: false
        type: string

permissions:
  contents: read

env:
  PUBLIC_RELEASE_REPO: magosouljah/galer
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}

jobs:
  release-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify selected source
        shell: bash
        run: |
          set -euo pipefail
          echo "GitHub ref: $GITHUB_REF"
          echo "Release tag: $RELEASE_TAG"
          git log -1 --oneline
          git rev-parse HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust with both macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo and Tauri build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-universal-tauri-${{ hashFiles('src-tauri/Cargo.lock', 'package-lock.json') }}
          restore-keys: |
            macos-universal-tauri-

      - name: Cache downloaded macOS runtimes
        uses: actions/cache@v4
        with:
          path: |
            /tmp/beatgaler-ffmpeg
            /tmp/beatgaler-node
          key: macos-runtimes-ffmpeg-b6.1.1-node-22.18.0

      - name: Install npm dependencies
        run: npm ci

      - name: Verify BeatGaler version and release tag
        shell: bash
        run: |
          set -euo pipefail
          npm run version:check
          npm run test:regressions
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          if [ "v${VERSION_VALUE}" != "$RELEASE_TAG" ]; then
            echo "::error::VERSION (${VERSION_VALUE}) does not match release tag (${RELEASE_TAG})."
            exit 1
          fi

      - name: Require public release token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_RELEASE_TOKEN:-}" ]; then
            echo "::error::PUBLIC_RELEASE_TOKEN GitHub secret is missing."
            exit 1
          fi

      - name: Download and build universal FFmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FFMPEG_TAG="b6.1.1"
          REPO="eugeneware/ffmpeg-static"
          BASE_URL="https://github.com/${REPO}/releases/download/${FFMPEG_TAG}"
          mkdir -p src-tauri/resources /tmp/beatgaler-ffmpeg
          curl --fail --location --retry 3 "${BASE_URL}/ffmpeg-darwin-arm64" -o /tmp/beatgaler-ffmpeg/ffmpeg-arm64
          curl --fail --location --retry 3 "${BASE_URL}/ffmpeg-darwin-x64" -o /tmp/beatgaler-ffmpeg/ffmpeg-x64
          chmod +x /tmp/beatgaler-ffmpeg/ffmpeg-arm64 /tmp/beatgaler-ffmpeg/ffmpeg-x64

          RELEASE_JSON="$(gh api "repos/${REPO}/releases/tags/${FFMPEG_TAG}")"
          ARM_EXPECTED="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name=="ffmpeg-darwin-arm64") | .digest // empty' | sed 's/^sha256://')"
          X64_EXPECTED="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name=="ffmpeg-darwin-x64") | .digest // empty' | sed 's/^sha256://')"
          ARM_ACTUAL="$(shasum -a 256 /tmp/beatgaler-ffmpeg/ffmpeg-arm64 | awk '{print $1}')"
          X64_ACTUAL="$(shasum -a 256 /tmp/beatgaler-ffmpeg/ffmpeg-x64 | awk '{print $1}')"
          test -n "$ARM_EXPECTED" && test -n "$X64_EXPECTED"
          test "$ARM_EXPECTED" = "$ARM_ACTUAL"
          test "$X64_EXPECTED" = "$X64_ACTUAL"

          lipo -create /tmp/beatgaler-ffmpeg/ffmpeg-arm64 /tmp/beatgaler-ffmpeg/ffmpeg-x64 -output src-tauri/resources/ffmpeg
          chmod +x src-tauri/resources/ffmpeg
          lipo -archs src-tauri/resources/ffmpeg
          src-tauri/resources/ffmpeg -version | head -n 3

      - name: Download and build universal Node runtime
        shell: bash
        run: |
          set -euo pipefail
          NODE_VERSION="22.18.0"
          mkdir -p src-tauri/resources /tmp/beatgaler-node
          curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.gz" -o /tmp/beatgaler-node/node-arm64.tar.gz
          curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-x64.tar.gz" -o /tmp/beatgaler-node/node-x64.tar.gz
          tar -xzf /tmp/beatgaler-node/node-arm64.tar.gz -C /tmp/beatgaler-node
          tar -xzf /tmp/beatgaler-node/node-x64.tar.gz -C /tmp/beatgaler-node
          lipo -create \
            "/tmp/beatgaler-node/node-v${NODE_VERSION}-darwin-arm64/bin/node" \
            "/tmp/beatgaler-node/node-v${NODE_VERSION}-darwin-x64/bin/node" \
            -output src-tauri/resources/node
          chmod +x src-tauri/resources/node
          ARCHS="$(lipo -archs src-tauri/resources/node)"
          echo "$ARCHS" | grep -q "arm64"
          echo "$ARCHS" | grep -q "x86_64"
          src-tauri/resources/node --version

      - name: Build universal macOS DMG
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          set -euo pipefail
          npx tauri build --bundles dmg --target universal-apple-darwin

      - name: Verify Direct runtime and FFmpeg inside final DMG
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          test -n "$DMG_PATH" && test -f "$DMG_PATH"
          ATTACH_OUTPUT="$(hdiutil attach "$DMG_PATH" -nobrowse -readonly)"
          MOUNT_POINT="$(printf '%s\n' "$ATTACH_OUTPUT" | sed -n 's#^.*\(/Volumes/.*\)$#\1#p' | head -n 1)"
          test -n "$MOUNT_POINT" && test -d "$MOUNT_POINT"
          cleanup() { hdiutil detach "$MOUNT_POINT" -force >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          APP_PATH="$(find "$MOUNT_POINT" -maxdepth 2 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          FFMPEG_PATH="$APP_PATH/Contents/Resources/ffmpeg"
          NODE_PATH="$APP_PATH/Contents/Resources/node"
          HELPER_PATH="$APP_PATH/Contents/Resources/direct-transport/transport-helper.cjs"
          test -f "$FFMPEG_PATH"
          test -f "$NODE_PATH"
          test -f "$HELPER_PATH"
          test -x "$NODE_PATH"
          NODE_ARCHS="$(lipo -archs "$NODE_PATH")"
          echo "$NODE_ARCHS" | grep -q "arm64"
          echo "$NODE_ARCHS" | grep -q "x86_64"
          "$NODE_PATH" --version
          ARCHS="$(lipo -archs "$FFMPEG_PATH")"
          echo "$ARCHS" | grep -q "arm64"
          echo "$ARCHS" | grep -q "x86_64"
          "$FFMPEG_PATH" -version | head -n 3

      - name: Prepare public DMG
        shell: bash
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          SOURCE_DMG="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          mkdir -p release-assets
          cp "$SOURCE_DMG" "release-assets/Beat.Galer_${VERSION_VALUE}_universal.dmg"

      - name: Create or update public GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="${{ inputs.release_notes }}"
          if [ -z "$NOTES" ]; then NOTES="Beat Galer ${RELEASE_TAG}"; fi
          if ! gh release view "$RELEASE_TAG" --repo "$PUBLIC_RELEASE_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$PUBLIC_RELEASE_REPO" --target main --title "Beat Galer $RELEASE_TAG" --notes "$NOTES" || true
          fi
          gh release view "$RELEASE_TAG" --repo "$PUBLIC_RELEASE_REPO" >/dev/null
          DMG_PATH="$(find release-assets -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          gh release upload "$RELEASE_TAG" "$DMG_PATH" --repo "$PUBLIC_RELEASE_REPO" --clobber

      - name: Upload macOS DMG as private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatGaler-macOS-Universal
          path: release-assets/*.dmg
          if-no-files-found: error
