name: Migration checks with readable logs

on:
  workflow_dispatch:
  workflow_call:

jobs:
  migration-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migration checks and save readable logs
        id: migration_checks
        continue-on-error: true
        run: node scripts/run-migration-checks-with-logs.mjs

      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/migration-check-logs/
          if-no-files-found: error
          retention-days: 7

      - name: Fail workflow if any migration check failed
        if: steps.migration_checks.outcome == 'failure'
        run: |
          echo "One or more migration checks failed. Read the uploaded migration-check-logs artifact."
          exit 1
