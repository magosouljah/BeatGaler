name: Probe - Task 5.1 M0-E2 Web temp auth

on:
  pull_request:
    branches:
      - task-5.1-temp-auth-cross-platform-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m0_e2_web_temp_auth:
    name: M0-E2 Web temp auth live (Chrome Worker)
    if: "${{ github.event_name != 'pull_request' || github.head_ref == 'task-5.1-temp-auth-web-probe' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BEATGALER_M0_B2_API_ID: ${{ secrets.BEATGALER_M0_B2_API_ID }}
      BEATGALER_M0_B2_API_HASH: ${{ secrets.BEATGALER_M0_B2_API_HASH }}
      BEATGALER_M0_B2_BOT_TOKEN: ${{ secrets.BEATGALER_M0_B2_BOT_TOKEN }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          check-latest: false

      - name: Install locked npm graph
        run: npm ci

      - name: Validate M0-E2 harness syntax
        run: |
          node --check scripts/telegram-temp-auth-web-binder.mjs
          node --check wdio.m0-e2.conf.mjs
          node --check tests/probes/m0-e2-web.e2e.mjs
          node --check tests/probes/m0-e2-web-entry.js
          node --check tests/probes/m0-e2-web-worker.js

      - name: Require dedicated probe secrets without printing them
        run: |
          node -e "for (const n of ['BEATGALER_M0_B2_API_ID','BEATGALER_M0_B2_API_HASH','BEATGALER_M0_B2_BOT_TOKEN']) { if (!String(process.env[n] || '').trim()) throw new Error('Missing dedicated probe secret: ' + n); } console.log('Dedicated M0-E2 binder secrets are present; values remain hidden from browser/Vite.')"

      - name: Prove temporary auth from a real browser Web Worker
        run: npx --no-install wdio run wdio.m0-e2.conf.mjs
