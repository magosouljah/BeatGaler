name: Task 5.1 Migration Checks

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-5-1-checks.yml

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run migration checks and capture logs
        id: checks
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/migration-check-logs
          : > artifacts/migration-check-logs/summary.txt
          failed=0
          run_check() {
            name="$1"; shift
            echo "=== $name ===" | tee -a artifacts/migration-check-logs/summary.txt
            "$@" > "artifacts/migration-check-logs/${name}.log" 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "PASS $name" | tee -a artifacts/migration-check-logs/summary.txt
            else
              echo "FAIL $name exit=$status" | tee -a artifacts/migration-check-logs/summary.txt
              failed=1
            fi
          }
          run_check diff-check git diff --check d2afff16996ef1bff658d4604c75b9e1eb8609a9..HEAD
          run_check typecheck npm run test:typecheck
          run_check unit-ts npm run test:unit:ts
          run_check component-dom npm run test:component:dom
          run_check integration npm run test:integration
          run_check regressions npm run test:regressions
          run_check build-web npm run build:web
          run_check build npm run build
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: migration-check-logs-task-5-1-${{ github.run_id }}
          path: artifacts/migration-check-logs/
          if-no-files-found: error
      - name: Enforce result
        if: always()
        shell: bash
        env:
          FAILED: ${{ steps.checks.outputs.failed }}
        run: test "$FAILED" = "0"
