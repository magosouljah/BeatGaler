name: Task 10.3 cleanup and validate temp

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/task-10-3-cleanup-temp.yml

permissions:
  contents: write

jobs:
  cleanup-validate-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply cleanup and create local implementation commit
        id: implementation
        shell: bash
        run: |
          node scripts/task-10-3-cleanup-temp.cjs apply
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task-10-3-audit-temp.yml
          git rm .github/workflows/task-10-3-cleanup-temp.yml
          git rm --cached scripts/task-10-3-cleanup-temp.cjs
          git add src tests
          git diff --cached --check
          git commit -m "refactor(app): remove migration leftovers for 10.3"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Focused cleanup contract
        shell: bash
        run: |
          mkdir -p migration-check-logs
          set -o pipefail
          npx vitest run tests/integration/appMigrationCleanup.test.ts --environment jsdom 2>&1 | tee migration-check-logs/focused-cleanup.log
      - name: Strict unused and dependency audit
        shell: bash
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee migration-check-logs/strict-cleanup-audit.log
          import fs from 'node:fs';
          import path from 'node:path';
          import ts from 'typescript';
          const root = process.cwd();
          const configPath = ts.findConfigFile(root, ts.sys.fileExists, 'tsconfig.json');
          if (!configPath) throw new Error('tsconfig.json not found');
          const raw = ts.readConfigFile(configPath, ts.sys.readFile);
          const parsed = ts.parseJsonConfigFileContent(raw.config, ts.sys, root, { noUnusedLocals: true, noUnusedParameters: false, noEmit: true });
          const program = ts.createProgram(parsed.fileNames, parsed.options);
          const unused = ts.getPreEmitDiagnostics(program).filter(d => {
            if (!d.file || ![6133, 6192, 6196].includes(d.code)) return false;
            const rel = path.relative(root, d.file.fileName).replaceAll('\\', '/');
            return rel === 'src/App.tsx' || rel.startsWith('src/app/') || rel.startsWith('src/features/');
          });
          for (const d of unused) {
            const rel = path.relative(root, d.file.fileName).replaceAll('\\', '/');
            const pos = d.file.getLineAndCharacterOfPosition(d.start ?? 0);
            console.error(`${rel}:${pos.line + 1}:${pos.character + 1} TS${d.code} ${ts.flattenDiagnosticMessageText(d.messageText, ' ')}`);
          }
          if (unused.length) throw new Error(`Unused migration residue remains: ${unused.length}`);
          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) return walk(file);
              return /\.(ts|tsx)$/.test(entry.name) ? [file] : [];
            });
          }
          const forbidden = [];
          for (const file of walk(path.join(root, 'src/features'))) {
            const source = fs.readFileSync(file, 'utf8');
            const sf = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true);
            for (const st of sf.statements) {
              if ((!ts.isImportDeclaration(st) && !ts.isExportDeclaration(st)) || !st.moduleSpecifier || !ts.isStringLiteral(st.moduleSpecifier)) continue;
              const spec = st.moduleSpecifier.text;
              if (!spec.startsWith('.')) continue;
              const resolved = ts.resolveModuleName(spec, file, parsed.options, ts.sys).resolvedModule?.resolvedFileName;
              if (!resolved) continue;
              const rel = path.relative(root, resolved).replaceAll('\\', '/');
              if (rel === 'src/App.tsx' || rel.startsWith('src/app/')) forbidden.push(`${path.relative(root, file)} -> ${spec} -> ${rel}`);
            }
          }
          if (forbidden.length) throw new Error(`Feature -> app/root dependencies remain:\n${forbidden.join('\n')}`);
          console.log('Strict cleanup audit: PASS');
          NODE
      - name: Diff check
        shell: bash
        run: |
          set -o pipefail
          git diff HEAD^ HEAD --check 2>&1 | tee migration-check-logs/diff-check.log
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run test:typecheck 2>&1 | tee migration-check-logs/typecheck.log
      - name: Unit TS
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit:ts 2>&1 | tee migration-check-logs/unit-ts.log
      - name: Component DOM
        shell: bash
        run: |
          set -o pipefail
          npm run test:component:dom 2>&1 | tee migration-check-logs/component-dom.log
      - name: Integration
        shell: bash
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee migration-check-logs/integration.log
      - name: Regressions
        shell: bash
        run: |
          set -o pipefail
          npm run test:regressions 2>&1 | tee migration-check-logs/regressions.log
      - name: Build web
        shell: bash
        run: |
          set -o pipefail
          npm run build:web 2>&1 | tee migration-check-logs/build-web.log
      - name: Build desktop frontend
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee migration-check-logs/build-desktop.log
      - name: Summarize validation
        shell: bash
        run: |
          {
            echo "task=10.3"
            echo "implementation_sha=${{ steps.implementation.outputs.sha }}"
            echo "focused_cleanup=PASS"
            echo "strict_cleanup_audit=PASS"
            echo "diff_check=PASS"
            echo "typecheck=PASS"
            echo "unit_ts=PASS"
            echo "component_dom=PASS"
            echo "integration=PASS"
            echo "regressions=PASS"
            echo "build_web=PASS"
            echo "build_desktop_frontend=PASS"
          } | tee migration-check-logs/summary.txt
      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-10-3-${{ github.run_id }}
          path: migration-check-logs/
          if-no-files-found: warn
      - name: Publish validated implementation
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.implementation.outputs.sha }}"
          git diff --exit-code
          git diff --cached --exit-code
          git push origin HEAD:v0.9.0-test-noche
          remote_sha="$(git ls-remote origin refs/heads/v0.9.0-test-noche | awk '{print $1}')"
          test "$remote_sha" = "${{ steps.implementation.outputs.sha }}"
          echo "Validated implementation published: $remote_sha"
      - name: Close migration documents
        env:
          INITIAL_SHA: a5f06734f27e5450b89451bcff27e71c77e4f9fd
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
        shell: bash
        run: |
          remote_before_docs="$(git ls-remote origin refs/heads/v0.9.0-test-noche | awk '{print $1}')"
          test "$remote_before_docs" = "$IMPLEMENTATION_SHA"
          node scripts/task-10-3-cleanup-temp.cjs docs
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md migration/BeatGaler-agent-state.md
          git diff --cached --check
          git commit -m "docs(migration): close task 10.3"
          git push origin HEAD:v0.9.0-test-noche
      - name: Read remote HEAD after all writes
        shell: bash
        run: |
          final_sha="$(git ls-remote origin refs/heads/v0.9.0-test-noche | awk '{print $1}')"
          echo "Final remote HEAD: $final_sha"
