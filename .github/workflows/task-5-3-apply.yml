name: Task 5.3 Apply

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-5-3-apply.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Apply task 5.3 extraction
        run: |
          python3 <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          app = app_path.read_text()

          def replace_exact(old, new, label):
              global app
              if old not in app:
                  raise SystemExit(f'missing App anchor: {label}')
              app = app.replace(old, new, 1)

          # Imports and obsolete local type.
          app = app.replace(', uploadProjectToTelegram, getProjectCloudStatus, openBeatProject, updateProjectArchiveFromSource, inspectProjectDropSource', '')
          replace_exact('import { useBeatAssetUpdates } from "./features/edit/useBeatAssetUpdates";\n', 'import { useBeatAssetUpdates } from "./features/edit/useBeatAssetUpdates";\nimport { useBeatProjects } from "./features/projects/useBeatProjects";\n', 'project hook import')
          app = app.replace('type AutoProjectDropResult = "not-project" | "handled" | "started";\n\n', '', 1)
          app = app.replace('  const [openableCloudProjectIds, setOpenableCloudProjectIds] = useState<Set<string>>(new Set());\n', '', 1)

          notice = '''  const [projectUpdateNotice, setProjectUpdateNotice] = useState<string | null>(null);\n  useEffect(() => {\n    if (!projectUpdateNotice) return;\n    const timer = window.setTimeout(() => setProjectUpdateNotice(null), 9000);\n    return () => window.clearTimeout(timer);\n  }, [projectUpdateNotice]);\n'''
          if notice not in app:
              raise SystemExit('missing project notice state')
          app = app.replace(notice, '', 1)

          start = app.index('  const handleUploadProjectTelegram = useCallback(async (beat: Beat) => {')
          end = app.index('  const handleUploadBulk = useCallback(() => {', start)
          app = app[:start] + app[end:]

          start = app.index('  const refreshOpenableCloudProjects = useCallback(async () => {')
          end = app.index('  const updateExistingBeatFromFolder = useCallback', start)
          app = app[:start] + app[end:]

          hook_anchor = '''  } = useBeatAssetUpdates({\n    rejectOfflineMutation,\n    setBeatFileDrop,\n    setBeatCloudUpdateBusy,\n    beatRuntimeStatesRef,\n    transitionRuntime,\n    beatsLatestRef,\n    cloudLibrarySnapshotRef,\n    setBeats,\n    setDrawer,\n    waitForUploadedBeatPlaybackReady,\n  });\n\n'''
          hook_call = hook_anchor + '''  const {\n    openableCloudProjectIds,\n    projectUpdateNotice,\n    hasStoredProject,\n    startProjectAssetUpdate,\n    handleAutoProjectDrop,\n    handleBrowserProjectDrop,\n    handleUploadProjectTelegram,\n    handleOpenProject,\n    handleUpdateProject,\n  } = useBeatProjects({\n    beats,\n    connectionState,\n    rejectOfflineMutation,\n    transitionRuntime,\n    beatsLatestRef,\n    setBeats,\n    setDrawer,\n    runBeatCloudUpdate,\n    setBeatCloudUpdateBusy,\n  });\n\n'''
          replace_exact(hook_anchor, hook_call, 'useBeatProjects composition')

          start = app.index('  const hasStoredProject = useCallback(async (beat: Beat) => {')
          end = app.index('  const handleDroppedBeatFileRole = useCallback', start)
          app = app[:start] + app[end:]

          browser_old = '''    transitionRuntime(beat.id, { type: "SYNC_QUEUE_UPDATE" }, beat);\n    transitionRuntime(beat.id, { type: "SYNC_UPDATE_STARTED" }, beat);\n    try {\n      const committed = await platform.editor.commit(beat, beat, { PROJECT: file });\n      setBeats(current => {\n        const next = current.map(item => item.id === committed.id ? committed : item);\n        beatsLatestRef.current = next;\n        return next;\n      });\n      setDrawer(current => current?.beat.id === committed.id ? { ...current, beat: committed } : current);\n      transitionRuntime(beat.id, { type: "SYNC_UPDATE_SUCCEEDED" }, committed);\n      return false;\n    } catch (error) {\n      const message = sanitizeUserVisibleText(runtimeErrorMessage(error), "Cloud operation failed.");\n      transitionRuntime(beat.id, { type: "SYNC_FAILED", code: "WEB_FILE_UPDATE_FAILED", message, retryable: true }, beat);\n      throw error;\n    }\n  }, [handleBrowserBeatAssetDrop, transitionRuntime]);\n'''
          browser_new = '''    return handleBrowserProjectDrop(beat, file);\n  }, [handleBrowserBeatAssetDrop, handleBrowserProjectDrop]);\n'''
          replace_exact(browser_old, browser_new, 'browser PROJECT route')

          # updateExistingBeatFromFolder still owns a mixed folder merge; refresh via the project event instead.
          app = app.replace('      await refreshOpenableCloudProjects();\n', '      window.dispatchEvent(new CustomEvent("beatgaler:project-cloud-updated", { detail: { beatId: beat.id } }));\n', 1)
          app = app.replace('  }, [refreshOpenableCloudProjects, rejectOfflineMutation, transitionRuntime]);\n', '  }, [rejectOfflineMutation, transitionRuntime]);\n', 1)

          app_path.write_text(app)

          projects = Path('src/features/projects')
          projects.mkdir(parents=True, exist_ok=True)
          projects.joinpath('useBeatProjects.ts').write_text(r'''import { useCallback, useEffect, useState, type Dispatch, type MutableRefObject, type SetStateAction } from "react";
import type { Beat } from "../../types";
import { appAlert, appConfirm } from "../../lib/dialog";
import { libraryStateManager } from "../../lib/libraryStateManager";
import { sanitizeUserVisibleText } from "../../lib/userVisibleError";
import { platform } from "../../platform";
import {
  getProjectCloudStatus,
  inspectProjectDropSource,
  listOpenableCloudProjectBeatIds,
  openBeatProject,
  updateProjectArchiveFromSource,
  uploadDroppedFileToTelegram,
  uploadProjectToTelegram,
} from "../../lib/tauri";
import { cleanupStagedDropPaths } from "../dragdrop/dropStaging";
import { extensionFromPath, fileNameFromPath } from "../dragdrop/pathHelpers";
import type { BeatRuntimeRegistry } from "../state/useBeatRuntimeRegistry";

type ConnectionState = "checking" | "online" | "poor" | "offline";
type DrawerState = { beat: Beat; mode: "detail" | "edit" } | null;
export type AutoProjectDropResult = "not-project" | "handled" | "started";

type UseBeatProjectsOptions = {
  beats: Beat[];
  connectionState: ConnectionState;
  rejectOfflineMutation: (label: string) => boolean;
  transitionRuntime: BeatRuntimeRegistry["transitionRuntime"];
  beatsLatestRef: MutableRefObject<Beat[]>;
  setBeats: Dispatch<SetStateAction<Beat[]>>;
  setDrawer: Dispatch<SetStateAction<DrawerState>>;
  runBeatCloudUpdate: (beat: Beat, filePath: string, work: () => Promise<void>) => void;
  setBeatCloudUpdateBusy: (beatId: string, active: boolean, success?: boolean) => void;
};

function runtimeErrorMessage(error: unknown): string {
  return error instanceof Error ? error.message : String(error);
}

function isRuntimeConflictError(error: unknown): boolean {
  const message = runtimeErrorMessage(error).toLowerCase();
  return message.includes("409") || message.includes("conflict") || message.includes("revision mismatch") || message.includes("version mismatch");
}

export function useBeatProjects({
  beats,
  connectionState,
  rejectOfflineMutation,
  transitionRuntime,
  beatsLatestRef,
  setBeats,
  setDrawer,
  runBeatCloudUpdate,
  setBeatCloudUpdateBusy,
}: UseBeatProjectsOptions) {
  const [openableCloudProjectIds, setOpenableCloudProjectIds] = useState<Set<string>>(new Set());
  const [projectUpdateNotice, setProjectUpdateNotice] = useState<string | null>(null);

  useEffect(() => {
    if (!projectUpdateNotice) return;
    const timer = window.setTimeout(() => setProjectUpdateNotice(null), 9000);
    return () => window.clearTimeout(timer);
  }, [projectUpdateNotice]);

  const refreshOpenableCloudProjects = useCallback(async () => {
    try {
      const ids = await listOpenableCloudProjectBeatIds();
      setOpenableCloudProjectIds(new Set(ids));
    } catch (error) {
      console.warn("Could not refresh Open Project indicators", error);
    }
  }, []);

  useEffect(() => {
    void refreshOpenableCloudProjects();
  }, [beats, refreshOpenableCloudProjects]);

  useEffect(() => {
    const refresh = () => { void refreshOpenableCloudProjects(); };
    window.addEventListener("beatgaler:project-cloud-changed", refresh);
    window.addEventListener("beatgaler:project-cloud-updated", refresh);
    return () => {
      window.removeEventListener("beatgaler:project-cloud-changed", refresh);
      window.removeEventListener("beatgaler:project-cloud-updated", refresh);
    };
  }, [refreshOpenableCloudProjects]);

  const hasStoredProject = useCallback(async (beat: Beat) => {
    const status = await getProjectCloudStatus(beat);
    return status.valid || status.part_count > 0 || status.local_exists || status.state !== "LOCAL";
  }, []);

  const startProjectAssetUpdate = useCallback((beat: Beat, filePath: string, kind: "projectFile" | "projectFolder") => {
    runBeatCloudUpdate(beat, filePath, async () => {
      const inspection = kind === "projectFolder"
        ? await inspectProjectDropSource(filePath).catch(() => null)
        : null;
      if (inspection && !inspection.valid) {
        throw new Error(inspection.reason || "This project folder could not be inspected.");
      }
      if (inspection?.has_backups) {
        setProjectUpdateNotice(
          `Backup folders were found in “${fileNameFromPath(filePath)}”. BeatGaler will skip them and continue with the project update.`
        );
      }

      await updateProjectArchiveFromSource(beat, filePath, kind);
      await uploadProjectToTelegram(beat);
      window.dispatchEvent(new CustomEvent("beatgaler:project-cloud-updated", { detail: { beatId: beat.id } }));
      await libraryStateManager.commitSnapshot(beatsLatestRef.current, "project-sync");

      if (inspection?.has_backups) {
        setProjectUpdateNotice(
          `Backup folders were skipped from “${fileNameFromPath(filePath)}” and were not added to PROJECT.zip.`
        );
      }
    });
  }, [beatsLatestRef, runBeatCloudUpdate]);

  const startProjectZipReplacement = useCallback((beat: Beat, filePath: string) => {
    runBeatCloudUpdate(beat, filePath, async () => {
      await uploadDroppedFileToTelegram(beat, filePath, "PROJECT");
      window.dispatchEvent(new CustomEvent("beatgaler:project-cloud-updated", { detail: { beatId: beat.id } }));
      await libraryStateManager.commitSnapshot(beatsLatestRef.current, "project-sync");
    });
  }, [beatsLatestRef, runBeatCloudUpdate]);

  const handleAutoProjectDrop = useCallback(async (beat: Beat, filePath: string): Promise<AutoProjectDropResult> => {
    const ext = extensionFromPath(filePath);
    const obviousProjectSource = ext === "zip" || ["flp", "als", "logicx", "ptx", "ptf"].includes(ext);
    if (!obviousProjectSource) return "not-project";

    let inspection;
    try {
      inspection = await inspectProjectDropSource(filePath);
    } catch (error) {
      setBeatCloudUpdateBusy(beat.id, false, false);
      await cleanupStagedDropPaths([filePath]).catch(() => {});
      await appAlert({ title: "Project check failed", message: String(error), danger: true });
      return "handled";
    }

    if (inspection.kind !== "zip" && inspection.kind !== "project_file") return "not-project";

    if (!inspection.valid) {
      setBeatCloudUpdateBusy(beat.id, false, false);
      await cleanupStagedDropPaths([filePath]).catch(() => {});
      await appAlert({
        title: inspection.kind === "zip" ? "Invalid PROJECT" : "Project check failed",
        message: inspection.reason || "The project could not be validated.",
        danger: true,
      });
      return "handled";
    }

    const existing = await hasStoredProject(beat).catch(() => false);
    if (existing) {
      setBeatCloudUpdateBusy(beat.id, false, false);
      const replace = await appConfirm({
        title: inspection.kind === "zip" ? "Replace PROJECT ZIP?" : "Replace project file?",
        message: inspection.kind === "zip"
          ? `"${beat.name}" already has a PROJECT ZIP. Replace it with ${fileNameFromPath(filePath)}?`
          : `"${beat.name}" already has a project file. Replace it with ${fileNameFromPath(filePath)}?`,
        confirmLabel: "Replace",
        cancelLabel: "Cancel",
        danger: true,
      });
      if (!replace) {
        await cleanupStagedDropPaths([filePath]).catch(() => {});
        return "handled";
      }
    }

    if (inspection.has_backups) {
      setProjectUpdateNotice(
        `Backup folders were found in “${fileNameFromPath(filePath)}”. BeatGaler will skip them and continue with the PROJECT ZIP.`
      );
    }

    if (inspection.kind === "zip") startProjectZipReplacement(beat, filePath);
    else startProjectAssetUpdate(beat, filePath, "projectFile");
    return "started";
  }, [hasStoredProject, setBeatCloudUpdateBusy, startProjectAssetUpdate, startProjectZipReplacement]);

  const handleBrowserProjectDrop = useCallback(async (beat: Beat, file: File): Promise<boolean> => {
    transitionRuntime(beat.id, { type: "SYNC_QUEUE_UPDATE" }, beat);
    transitionRuntime(beat.id, { type: "SYNC_UPDATE_STARTED" }, beat);
    try {
      const committed = await platform.editor.commit(beat, beat, { PROJECT: file });
      setBeats(current => {
        const next = current.map(item => item.id === committed.id ? committed : item);
        beatsLatestRef.current = next;
        return next;
      });
      setDrawer(current => current?.beat.id === committed.id ? { ...current, beat: committed } : current);
      transitionRuntime(beat.id, { type: "SYNC_UPDATE_SUCCEEDED" }, committed);
      return false;
    } catch (error) {
      const message = sanitizeUserVisibleText(runtimeErrorMessage(error), "Cloud operation failed.");
      transitionRuntime(beat.id, { type: "SYNC_FAILED", code: "WEB_FILE_UPDATE_FAILED", message, retryable: true }, beat);
      throw error;
    }
  }, [beatsLatestRef, setBeats, setDrawer, transitionRuntime]);

  const syncCurrentProject = useCallback(async (beat: Beat, mode: "upload" | "update") => {
    if (rejectOfflineMutation(mode === "upload" ? "Uploading a project" : "Updating a project")) return;
    transitionRuntime(beat.id, { type: "SYNC_QUEUE_UPDATE" }, beat);
    transitionRuntime(beat.id, { type: "SYNC_UPDATE_STARTED" }, beat);
    try {
      await uploadProjectToTelegram(beat);
      await libraryStateManager.commitSnapshot(beatsLatestRef.current, "project-sync");
      transitionRuntime(beat.id, { type: "SYNC_UPDATE_SUCCEEDED" }, beat);
      window.dispatchEvent(new CustomEvent("beatgaler:project-cloud-updated", { detail: { beatId: beat.id } }));
      await appAlert({
        title: mode === "upload" ? "Project synced to Galer Cloud" : "Project updated",
        message: mode === "upload"
          ? `${beat.name}.zip is stored in Galer Cloud as one PROJECT file.`
          : "The current PROJECT.zip has been synced to Galer Cloud.",
      });
    } catch (error) {
      const message = sanitizeUserVisibleText(runtimeErrorMessage(error), "Cloud operation failed.");
      if (isRuntimeConflictError(error)) transitionRuntime(beat.id, { type: "SYNC_CONFLICT", message }, beat);
      else transitionRuntime(beat.id, {
        type: "SYNC_FAILED",
        code: mode === "upload" ? "PROJECT_UPLOAD_FAILED" : "PROJECT_UPDATE_FAILED",
        message,
        retryable: true,
      }, beat);
      await appAlert({
        title: mode === "upload" ? "Project upload failed" : "Project update failed",
        message,
        danger: true,
      });
    }
  }, [beatsLatestRef, rejectOfflineMutation, transitionRuntime]);

  const handleUploadProjectTelegram = useCallback((beat: Beat) => syncCurrentProject(beat, "upload"), [syncCurrentProject]);
  const handleUpdateProject = useCallback((beat: Beat) => syncCurrentProject(beat, "update"), [syncCurrentProject]);

  const handleOpenProject = useCallback(async (beat: Beat) => {
    if (connectionState !== "online" && !beat.offline_available) {
      await appAlert({
        title: "Project unavailable offline",
        message: "This project was not downloaded with Available Offline. Reconnect to open it.",
      });
      return;
    }
    try {
      await openBeatProject(beat);
      await appAlert({
        title: "Project opened",
        message: "Save normally in FL Studio. When you want those changes stored in Galer Cloud, return to BeatGaler and choose “Update Project”.",
      });
    } catch (error) {
      await appAlert({ title: "Project unavailable", message: runtimeErrorMessage(error), danger: true });
    }
  }, [connectionState]);

  return {
    openableCloudProjectIds,
    projectUpdateNotice,
    hasStoredProject,
    startProjectAssetUpdate,
    handleAutoProjectDrop,
    handleBrowserProjectDrop,
    handleUploadProjectTelegram,
    handleOpenProject,
    handleUpdateProject,
  };
}
''')

          test_path = Path('tests/integration/appBeatProjectsExtraction.test.ts')
          test_path.write_text(r'''import { readFileSync } from "node:fs";
import { resolve } from "node:path";
import { describe, expect, it } from "vitest";

const app = readFileSync(resolve(process.cwd(), "src/App.tsx"), "utf8");
const projects = readFileSync(resolve(process.cwd(), "src/features/projects/useBeatProjects.ts"), "utf8");

describe("Beat project extraction", () => {
  it("moves project ownership outside App", () => {
    expect(app).toContain("useBeatProjects({");
    expect(app).not.toContain("const handleOpenProject = useCallback");
    expect(app).not.toContain("const startProjectAssetUpdate = useCallback");
    expect(app).not.toContain("const refreshOpenableCloudProjects = useCallback");
    expect(projects).toContain("const handleOpenProject = useCallback");
    expect(projects).toContain("const startProjectAssetUpdate = useCallback");
    expect(projects).toContain("const refreshOpenableCloudProjects = useCallback");
  });

  it("preserves PROJECT replacement and Backup/Backups rules", () => {
    expect(projects).toContain("Replace PROJECT ZIP?");
    expect(projects).toContain("Replace project file?");
    expect(projects).toContain("inspectProjectDropSource(filePath)");
    expect(projects).toContain("Backup folders were skipped from");
    expect(projects).toContain("updateProjectArchiveFromSource(beat, filePath, kind)");
  });

  it("preserves desktop/web project routes and indicators", () => {
    expect(projects).toContain("openBeatProject(beat)");
    expect(projects).toContain("uploadProjectToTelegram(beat)");
    expect(projects).toContain("platform.editor.commit(beat, beat, { PROJECT: file })");
    expect(projects).toContain("listOpenableCloudProjectBeatIds()");
    expect(projects).toContain('libraryStateManager.commitSnapshot(beatsLatestRef.current, "project-sync")');
  });
});
''')

          old_test = Path('tests/integration/appBeatAssetUpdatesExtraction.test.ts')
          text = old_test.read_text()
          text = text.replace('  it("leaves project operations temporarily composed by App for task 5.3", () => {\n    expect(app).toContain("startProjectAssetUpdate");\n    expect(app).toContain("startProjectZipReplacement");\n    expect(app).toContain("platform.editor.commit(beat, beat, { PROJECT: file })");\n  });\n', '  it("keeps project operations outside the asset-update owner", () => {\n    expect(assetUpdates).not.toContain("startProjectAssetUpdate");\n    expect(assetUpdates).not.toContain("PROJECT: file");\n  });\n')
          old_test.write_text(text)

          reg = Path('scripts/regression-phase9cd.mjs')
          text = reg.read_text()
          text = text.replace('const assetUpdates = read("src/features/edit/useBeatAssetUpdates.ts");\n', 'const assetUpdates = read("src/features/edit/useBeatAssetUpdates.ts");\nconst projects = read("src/features/projects/useBeatProjects.ts");\n')
          text = text.replace("if (!app.includes('inspectProjectDropSource(filePath)')) fail(\"PROJECT auto-inspection disappeared.\");", "if (!projects.includes('inspectProjectDropSource(filePath)')) fail(\"PROJECT auto-inspection disappeared.\");")
          text = text.replace("if (!app.includes('updateProjectArchiveFromSource(beat, filePath, \"projectFile\")') && !app.includes('startProjectAssetUpdate(beat, filePath, \"projectFile\")')) fail(\"PROJECT file update route disappeared.\");", "if (!projects.includes('startProjectAssetUpdate(beat, filePath, \"projectFile\")')) fail(\"PROJECT file update route disappeared.\");")
          text = text.replace("if (!app.includes('startProjectAssetUpdate(beat, filePath, \"projectFolder\")')) fail(\"PROJECT folder/Samples update route disappeared.\");", "if (!projects.includes('startProjectAssetUpdate(beat, filePath, \"projectFolder\")')) fail(\"PROJECT folder/Samples update route disappeared.\");")
          text = text.replace("if (!app.includes('Project file required')) fail(\"folder updates no longer require an existing PROJECT.\");", "if (!app.includes('Project file required') || !projects.includes('hasStoredProject')) fail(\"folder updates no longer require an existing PROJECT.\");")
          text = text.replace("if (!app.includes('Replace PROJECT ZIP?') || !app.includes('Replace project file?')) fail(\"PROJECT replacement confirmation disappeared.\");", "if (!projects.includes('Replace PROJECT ZIP?') || !projects.includes('Replace project file?')) fail(\"PROJECT replacement confirmation disappeared.\");")
          text = text.replace("if (!app.includes('Backup folders were skipped from')) fail(\"nested Backup/Backups filtering no longer reaches the user.\");", "if (!projects.includes('Backup folders were skipped from')) fail(\"nested Backup/Backups filtering no longer reaches the user.\");")
          text = text.replace("if (!app.includes('libraryStateManager.commitSnapshot(beatsLatestRef.current, \"project-sync\")')) fail(\"PROJECT updates lost an authoritative commit.\");", "if (!projects.includes('libraryStateManager.commitSnapshot(beatsLatestRef.current, \"project-sync\")')) fail(\"PROJECT updates lost an authoritative commit.\");")
          reg.write_text(text)

          rr = Path('scripts/run-regressions.mjs')
          text = rr.read_text()
          owner_anchor = '  const beatAssetUpdates = readFileSync(path.join(root, "src", "features", "edit", "useBeatAssetUpdates.ts"), "utf8");\n'
          if owner_anchor in text and 'const beatProjects = ' not in text:
              text = text.replace(owner_anchor, owner_anchor + '  const beatProjects = readFileSync(path.join(root, "src", "features", "projects", "useBeatProjects.ts"), "utf8");\n', 1)
          text = text.replace("if (!app.includes('Replace PROJECT ZIP?') || !app.includes('Replace project file?')) fail(\"Existing PROJECT replacement lost its explicit Replace/Cancel confirmation.\");", "if (!beatProjects.includes('Replace PROJECT ZIP?') || !beatProjects.includes('Replace project file?')) fail(\"Existing PROJECT replacement lost its explicit Replace/Cancel confirmation.\");")
          rr.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run migration checks
        id: checks
        continue-on-error: true
        run: node scripts/run-migration-checks-with-logs.mjs

      - name: Upload readable migration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-5-3-${{ github.run_id }}
          path: artifacts/migration-check-logs/
          if-no-files-found: error
          retention-days: 7

      - name: Commit task 5.3 when green
        if: steps.checks.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/projects/useBeatProjects.ts tests/integration/appBeatProjectsExtraction.test.ts tests/integration/appBeatAssetUpdatesExtraction.test.ts scripts/regression-phase9cd.mjs scripts/run-regressions.mjs
          git rm .github/workflows/task-5-3-apply.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "refactor(projects): extract beat project operations"
          git push origin HEAD:v0.9.0-test-noche

      - name: Fail after artifact upload
        if: steps.checks.outcome == 'failure'
        run: exit 1
