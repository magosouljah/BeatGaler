name: Probe - Task 5.1 Pool Scalability

on:
  push:
    branches:
      - task-5.1-pool-scalability-admission
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-task-5-1-pool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pool-scalability:
    name: M0-G synthetic pool scalability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Run isolated pool scalability probe
        run: node scripts/probe-task-5.1-pool-scalability.cjs
