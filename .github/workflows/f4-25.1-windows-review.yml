name: F4 - 25.1 Windows Review Journey

on:
  pull_request:
    branches:
      - integration-v0.8.0-alpha.1
    paths:
      - '.github/workflows/f4-25.1-windows-review.yml'
      - 'scripts/run-review-e2e.mjs'
      - 'tests/e2e-harness/E2EReviewHarness.tsx'
      - 'tests/e2e/review-flow.e2e.mjs'
      - 'scripts/prepare-f4-25.1-embedded-driver.mjs'
      - 'scripts/run-desktop-e2e-isolated.mjs'
      - 'wdio.e2e.conf.mjs'
      - 'src/components/Drawer.tsx'

permissions:
  contents: read

jobs:
  windows-review:
    name: Windows Review functional journey
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact-head checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.0

      - name: Install locked npm graph
        run: npm ci

      - name: Prepare isolated embedded Tauri WebDriver
        run: node scripts/prepare-f4-25.1-embedded-driver.mjs

      - name: Run Windows Review E2E harness
        run: node scripts/run-review-e2e.mjs
