name: Task 2.2 verify

on:
  push:
    branches: [app-tsx-2.2]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-tsx-2.2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Locate suspect integration guards
        run: |
          echo "WEB_GUARD=$(grep -RlF 'routes web beat clicks through playbackSort' tests/integration | head -n 1)"
          grep -R -n -F 'onBeatClick={(beatId) => playBeat(beatId, { sort: playbackSort })}' src/App.tsx tests/integration || true
          grep -R -n -F 'function prepareCleanMp3Upload(' scripts/lib/prepare-clean-mp3.cjs src-tauri/direct-transport/transport-helper.cjs || true
      - name: Baseline suspect integration tests
        id: baseline
        continue-on-error: true
        run: |
          WEB_GUARD="$(grep -RlF 'routes web beat clicks through playbackSort' tests/integration | head -n 1)"
          test -n "$WEB_GUARD"
          npx vitest run tests/integration/cleanMp3Cloud.test.ts "$WEB_GUARD"
      - name: Apply exact extraction
        run: node scripts/task22-extract.mjs
      - name: Post-extraction suspect integration tests
        id: extracted
        continue-on-error: true
        run: |
          WEB_GUARD="$(grep -RlF 'routes web beat clicks through playbackSort' tests/integration | head -n 1)"
          npx vitest run tests/integration/cleanMp3Cloud.test.ts "$WEB_GUARD"
      - name: Report suspect comparison
        run: |
          echo "baseline=${{ steps.baseline.outcome }}"
          echo "extracted=${{ steps.extracted.outcome }}"
          test "${{ steps.baseline.outcome }}" = "success" -a "${{ steps.extracted.outcome }}" = "success"
      - run: npm run test:typecheck
      - run: npm run test:unit:ts
      - run: npm run test:component:dom
      - run: npm run test:integration
      - run: npm run test:regressions
      - run: npm run build:web
      - run: npm run build
      - name: Commit verified App extraction
        run: |
          rm scripts/task22-extract.mjs .github/workflows/task-2.2-verify.yml task22-integration-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(app): extract library controls"
          git push origin HEAD:app-tsx-2.2
