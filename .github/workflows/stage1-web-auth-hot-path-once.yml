name: Stage 1 Web auth hot path once

on:
  push:
    branches:
      - stage1/real-multi-account-e2e
    paths:
      - .github/workflows/stage1-web-auth-hot-path-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Patch Web auth hot path
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/components/AccountGate.tsx';
          let source = fs.readFileSync(file, 'utf8');
          const oldBlock = [
            '  if (platform.kind === "web") {',
            '    if (remembered && remembered !== sameOriginProxy) localStorage.removeItem(API_KEY);',
            '    if (sameOriginProxy && await probe(sameOriginProxy, 1500)) {',
            '      localStorage.setItem(API_KEY, sameOriginProxy);',
            '      return sameOriginProxy;',
            '    }',
            '    throw new Error("Could not reach BeatGaler Cloud.");',
            '  }',
          ].join('\n');
          const newBlock = [
            '  if (platform.kind === "web") {',
            '    if (!sameOriginProxy) throw new Error("Could not resolve BeatGaler Cloud API.");',
            '    if (remembered && remembered !== sameOriginProxy) localStorage.removeItem(API_KEY);',
            '    localStorage.setItem(API_KEY, sameOriginProxy);',
            '    return sameOriginProxy;',
            '  }',
          ].join('\n');
          if (source.split(oldBlock).length !== 2) throw new Error('Web resolve hot-path anchor changed');
          source = source.replace(oldBlock, newBlock);
          fs.writeFileSync(file, source, 'utf8');
          NODE

      - name: Patch Web origin regression
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tests/integration/webCloudApiOriginPolicy.test.ts';
          let source = fs.readFileSync(file, 'utf8');
          const healthMock = [
            '      if (url.endsWith("/auth/health")) {',
            '        return new Response(JSON.stringify({ ok: true, account_auth: true }), {',
            '          status: 200,',
            '          headers: { "Content-Type": "application/json" },',
            '        });',
            '      }',
            '',
          ].join('\n');
          if (source.split(healthMock).length !== 2) throw new Error('health mock anchor changed');
          source = source.replace(healthMock, '');
          const oldExpect = '    expect(requestedUrls).toContain(`${expectedBase}/auth/health`);\n    expect(requestedUrls).toContain(`${expectedBase}/auth/login`);';
          const newExpect = '    expect(requestedUrls).toEqual([`${expectedBase}/auth/login`]);';
          if (source.split(oldExpect).length !== 2) throw new Error('origin expectation anchor changed');
          source = source.replace(oldExpect, newExpect);
          fs.writeFileSync(file, source, 'utf8');
          NODE

      - name: Update Stage 1 health validation semantics
        shell: bash
        run: |
          cat > tests/e2e-web/stage1-health-validation.mjs <<'EOF'
          export function validateAuthHealth(entries, label) {
            const health = entries.filter(entry => entry.route === '/beatgaler-api/auth/health');
            const failure = health.find(entry => ['aborted', 'network-error'].includes(entry.state) || (entry.state === 'response' && entry.status !== 200));
            if (failure) throw Object.assign(new Error(`Account ${label} health failed: ${failure.state}, HTTP ${failure.status ?? 'none'}, ${failure.duration_ms}ms, phase=${failure.harness_phase}.`), { code: 'STAGE1_HEALTH_UNSTABLE', severity: 'P1' });
            return { observed: health.length, successful: health.filter(entry => entry.state === 'response' && entry.status === 200).length };
          }
          EOF

          cat > tests/e2e-web/stage1-health-validation.test.mjs <<'EOF'
          import { test } from 'node:test';
          import assert from 'node:assert/strict';
          import { validateAuthHealth } from './stage1-health-validation.mjs';
          const entry = phase => ({ route:'/beatgaler-api/auth/health', state:'response', status:200, harness_phase:phase, duration_ms:10 });
          test('successful final UI cannot hide an observed timed-out health probe', () => {
            assert.throws(() => validateAuthHealth([{...entry('simultaneous-reload'),state:'aborted',status:null,duration_ms:1501}], '01'), {code:'STAGE1_HEALTH_UNSTABLE'});
          });
          test('Web auth does not require health preflights, but any observed health failure remains fatal', () => {
            assert.deepEqual(validateAuthHealth([], '01'), {observed:0, successful:0});
            assert.deepEqual(validateAuthHealth([entry('diagnostic')], '01'), {observed:1, successful:1});
            assert.throws(() => validateAuthHealth([{...entry('diagnostic'),status:503}], '01'), {code:'STAGE1_HEALTH_UNSTABLE'});
          });
          EOF

          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tests/e2e-web/stage1-real-multi-account.e2e.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const oldText = '"No observed failed health probes; login and Reload health HTTP 200 for every account"';
          const newText = '"No observed health probe failed; Web auth no longer depends on a mandatory health preflight"';
          if (source.split(oldText).length !== 2) throw new Error('Stage1 health detail anchor changed');
          source = source.replace(oldText, newText);
          fs.writeFileSync(file, source, 'utf8');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Focused Web auth regressions
        run: |
          node tests/e2e-web/stage1-health-validation.test.mjs
          node tests/e2e-web/stage1-auth-observer.test.mjs
          npx vitest run tests/integration/webCloudApiOriginPolicy.test.ts --environment jsdom
          npx vitest run tests/component-dom/accountGateWeb.test.tsx --environment jsdom

      - name: Typecheck and Web build
        run: |
          npm run test:typecheck
          npm run build:web

      - name: Commit verified fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/stage1-web-auth-hot-path-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AccountGate.tsx tests/integration/webCloudApiOriginPolicy.test.ts tests/e2e-web/stage1-health-validation.mjs tests/e2e-web/stage1-health-validation.test.mjs tests/e2e-web/stage1-real-multi-account.e2e.mjs .github/workflows/stage1-web-auth-hot-path-once.yml
          git diff --cached --check
          git commit -m "fix(web): remove health probe from auth hot path"
          git push origin HEAD:stage1/real-multi-account-e2e
