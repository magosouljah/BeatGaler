name: Task 5.2 - Generate Cloud Lock

on:
  push:
    branches:
      - task-5.2-live-postgres-batch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate_cloud_lock:
    name: Generate locked cloud-server pg graph
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Generate package-lock deterministically
        working-directory: cloud-server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify generated lock installs and pg loads
        working-directory: cloud-server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const { Pool } = require('pg'); if (typeof Pool !== 'function') process.exit(1); console.log('PASS pg runtime load')"

      - name: Upload generated cloud lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task-5.2-cloud-package-lock
          path: cloud-server/package-lock.json
          if-no-files-found: error
