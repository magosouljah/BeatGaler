name: Temporary task 7.2 retry 3

on:
  push:
    branches:
      - v0.9.0-test-noche

permissions:
  contents: write

jobs:
  apply-task-7-2:
    if: contains(github.event.head_commit.message, '[apply-7.2-r3]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - name: Apply task 7.2 extraction
        run: python .github/task-7-2-retry.py
      - name: Adapt native import regression to extracted owner
        run: python .github/task-7-2-regression-fix.py
      - name: Verify patch formatting
        run: git diff --check
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused task 7.2 tests
        run: npx vitest run tests/component-dom/importDiscovery.test.tsx tests/component-dom/importReviewBasics.test.tsx tests/integration/appImportDiscoveryExtraction.test.ts tests/integration/appMigrationCharacterization.test.ts --environment jsdom
      - name: Run complete migration checks
        id: migration_checks
        continue-on-error: true
        run: node scripts/run-migration-checks-with-logs.mjs
      - name: Upload readable migration logs
        if: steps.migration_checks.outcome == 'success' || steps.migration_checks.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/migration-check-logs/
          if-no-files-found: error
          retention-days: 7
      - name: Commit implementation
        id: implementation
        if: steps.migration_checks.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(import): extract incremental Review discovery"
          git push origin HEAD:v0.9.0-test-noche
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Confirm tested remote HEAD
        if: steps.migration_checks.outcome == 'success'
        run: |
          remote_sha="$(git ls-remote origin refs/heads/v0.9.0-test-noche | cut -f1)"
          test "$remote_sha" = "${{ steps.implementation.outputs.sha }}"
          echo "Validated implementation SHA: $remote_sha"
      - name: Fail workflow if migration checks failed
        if: steps.migration_checks.outcome == 'failure'
        run: exit 1
