name: Close task 8.2 documentation

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-8-2-close-temp.yml

permissions:
  contents: write

concurrency:
  group: beatgaler-migration-v0.9.0-test-noche
  cancel-in-progress: false

jobs:
  close-task-8-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Apply coherent documentation closure
        shell: bash
        run: |
          set -euo pipefail
          target='v0.9.0-test-noche'
          implementation='1a1ab540a246bc7cd7b1b2a71191287292f02eb4'
          test "${GITHUB_REF_NAME}" = "$target"
          git merge-base --is-ancestor "$implementation" HEAD

          remote="$(git ls-remote origin "refs/heads/$target" | awk '{print $1}')"
          test "$remote" = "${GITHUB_SHA}"
          export HEAD_REMOTE_BEFORE_AGENT_STATE="$remote"

          unexpected="$(git diff --name-only "$implementation"..HEAD | grep -v -E '^(scripts/task-8-2-close-temp\.py|\.github/workflows/task-8-2-close-temp\.yml)$' || true)"
          test -z "$unexpected"

          python scripts/task-8-2-close-temp.py
          git diff --check

          git rm scripts/task-8-2-close-temp.py .github/workflows/task-8-2-close-temp.yml
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md migration/BeatGaler-agent-state.md
          git diff --cached --check

          grep -Fq '### [x] 8.2 — Separar recepción HTML y navegador' migration/BeatGaler-roadmap-para-trabajar-con-IAs.md
          test "$(grep -Fc '### Registro — 8.2' migration/Registro-de-avance.md)" = '1'
          grep -Fq '8.3 — Separar recepción nativa' migration/BeatGaler-agent-state.md
          grep -Fq 'SHA de implementación validada: `1a1ab540a246bc7cd7b1b2a71191287292f02eb4`' migration/BeatGaler-agent-state.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: close task 8.2'

          changed="$(git diff --name-only "$implementation"..HEAD | sort)"
          expected="$(printf '%s\n' \
            migration/BeatGaler-agent-state.md \
            migration/BeatGaler-roadmap-para-trabajar-con-IAs.md \
            migration/Registro-de-avance.md | sort)"
          test "$changed" = "$expected"
          test -z "$(git status --porcelain)"

          remote="$(git ls-remote origin "refs/heads/$target" | awk '{print $1}')"
          test "$remote" = "${GITHUB_SHA}"
          git push origin "$(git rev-parse HEAD):refs/heads/$target"
