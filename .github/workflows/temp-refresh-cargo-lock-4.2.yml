name: TEMP - Refresh Cargo lock for Task 4.2

on:
  pull_request:

permissions:
  contents: read

jobs:
  refresh-cargo-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.0

      - name: Move vulnerable Rust transitives to patched releases
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path src-tauri/Cargo.toml -p plist --precise 1.10.0
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null

      - name: Upload regenerated Cargo lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task-4.2-regenerated-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
