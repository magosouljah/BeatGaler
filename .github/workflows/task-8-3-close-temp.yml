name: Close task 8.3 documentation

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-8-3-close-temp.yml

permissions:
  contents: write

concurrency:
  group: beatgaler-migration-v0.9.0-test-noche
  cancel-in-progress: false

jobs:
  close-task-8-3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Apply coherent documentation closure
        shell: bash
        run: |
          set -euo pipefail
          target='v0.9.0-test-noche'
          implementation='b8b8c6376837687881510ddeeac11062db2fcd46'
          initial='f577cb324bcfce702957ea1d718b60f4c19a807b'
          test "${GITHUB_REF_NAME}" = "$target"
          git merge-base --is-ancestor "$implementation" HEAD

          remote="$(git ls-remote origin "refs/heads/$target" | awk '{print $1}')"
          test "$remote" = "${GITHUB_SHA}"
          export HEAD_REMOTE_BEFORE_AGENT_STATE="$remote"
          export IMPLEMENTATION_SHA="$implementation"
          export INITIAL_SHA="$initial"

          unexpected="$(git diff --name-only "$implementation"..HEAD | grep -v -E '^\.github/workflows/task-8-3-close-temp\.yml$' || true)"
          test -z "$unexpected"

          python - <<'PY'
          from pathlib import Path
          import os

          roadmap_path = Path('migration/BeatGaler-roadmap-para-trabajar-con-IAs.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          old = '### [ ] 8.3 — Separar recepción nativa'
          new = '### [x] 8.3 — Separar recepción nativa'
          if roadmap.count(old) != 1 or new in roadmap:
              raise SystemExit('unexpected roadmap state for 8.3')
          roadmap_path.write_text(roadmap.replace(old, new, 1), encoding='utf-8')

          registro_path = Path('migration/Registro-de-avance.md')
          registro = registro_path.read_text(encoding='utf-8')
          if '### Registro — 8.3' in registro:
              raise SystemExit('8.3 registro already exists')
          entry = r'''
          ### Registro — 8.3

          ```
          Tarea: 8.3 — Separar recepción nativa
          Estado: Terminada
          Fecha: 2026-09-08

          Base

          - Rama: v0.9.0-test-noche
          - SHA inicial de esta ejecución: f577cb324bcfce702957ea1d718b60f4c19a807b
          - SHA de implementación validada: b8b8c6376837687881510ddeeac11062db2fcd46
          - Última tarea verificada: 8.2 — Separar recepción HTML y navegador

          Cambio realizado

          - Se creó `src/features/dragdrop/useNativeLibraryDrop.ts` como owner del listener nativo de Tauri, feedback de drag, arbitraje y ejecución/routing del drop nativo.
          - `App.tsx` dejó de poseer `getCurrentWebview().onDragDropEvent` y `handleNativeDrop`; conserva un único punto de composición mediante `useNativeLibraryDrop({...})`.
          - Se conservaron las rutas originales de Explorer/Finder, el límite de 50 rutas, el uso directo de `payload.paths` y la importación zero-copy sin `DataTransfer.arrayBuffer`, `drop-staging` ni copia previa a Review.
          - Se conservaron `nativeDropArbiter`, sentinelas de imagen externa/browser, detección extraída de destinos y la prioridad del gesto nativo antes de la importación local.
          - La limpieza conserva desuscripción aun si el registro asíncrono del listener termina después del unmount, además de retirar el listener de imagen externa y limpiar el feedback visual.
          - No se inició 9.1.

          Adaptación de pruebas

          - Se añadió `tests/integration/appNativeLibraryDropExtraction.test.ts` para ownership, receptor único, límite/rutas originales, zero-copy, arbitraje/sentinelas y cleanup asíncrono.
          - `tests/integration/appNativeDropTargetsExtraction.test.ts` ahora sigue las llamadas a los resolvers hasta `useNativeLibraryDrop.ts` en vez de exigirlas físicamente en `App.tsx`.
          - `scripts/regression-import-native.mjs`, `scripts/run-regressions.mjs`, `scripts/regression-phase9cd.mjs` y `scripts/test-macos-portability.mjs` fueron adaptados para seguir el ownership extraído sin relajar sus invariantes.

          Archivos de implementación/pruebas afectados

          - scripts/regression-import-native.mjs
          - scripts/regression-phase9cd.mjs
          - scripts/run-regressions.mjs
          - scripts/test-macos-portability.mjs
          - src/App.tsx
          - src/features/dragdrop/useNativeLibraryDrop.ts
          - tests/integration/appNativeDropTargetsExtraction.test.ts
          - tests/integration/appNativeLibraryDropExtraction.test.ts

          Comprobaciones ejecutadas

          - GitHub Actions `Final task 8.3 validation`, run 34309637023 — SUCCESS.
          - Artifact `migration-check-logs-task-8-3-34309637023` generado.
          - Prueba focalizada `appNativeLibraryDropExtraction.test.ts` — PASS.
          - `node scripts/regression-import-native.mjs` — PASS.
          - `npm run test:typecheck` — PASS.
          - `npm run test:unit:ts` — PASS.
          - `npm run test:component:dom` — PASS.
          - `npm run test:integration` — PASS.
          - `npm run test:regressions` — PASS.
          - `npm run build:web` — PASS.
          - `npm run build` — PASS.
          - Contrato Mac afectado por drag & drop — PASS; el wrapper conserva únicamente la excepción baseline ya documentada del Direct helper.
          - La publicación del commit exacto validado terminó correctamente.

          Comprobaciones no ejecutadas

          - `npm run check` no se ejecutó como wrapper; la matriz ejecutó individualmente los checks aplicables.
          - Prueba física Desktop Windows/macOS no ejecutada ni inventada; la ronda trabaja mediante GitHub Actions.
          - E2E completos ajenos a drag & drop no se usaron como criterio de cierre.

          Prueba manual

          - No ejecutada ni inventada.
          - Sugerida: arrastrar desde Explorer/Finder archivos y carpetas sobre biblioteca, tarjeta, artwork y Drawer; desmontar/cambiar de vista durante el registro del listener y repetir con imagen externa de navegador.
          - Resultado esperado: un solo receptor efectivo por gesto, mismas rutas/destinos, sin copia previa innecesaria, sentinelas correctos y ningún listener residual.

          Pendientes / fuera de alcance

          - 9.1 — Separar sesión y ajustes queda pendiente y no fue iniciada.
          - La prueba física multiplataforma queda como comprobación manual opcional, no como bloqueo del cierre automatizado.

          Fallos encontrados y causa

          - Una assertion nueva confundió `.arrayBuffer(` dentro de un comentario con código ejecutable; se corrigió el test para inspeccionar código sin comentarios.
          - Un aplicador temporal calculó offsets de `App.tsx` antes de retirar imports; se corrigió el tooling para recalcularlos antes del reemplazo.
          - Typecheck confirmó que `App.tsx` aún usa `isBackupFolderPath` independientemente del receptor nativo; se conservó ese import.
          - Guards antiguos de 8.1/Phase 9/no-staging seguían el ownership físico dentro de `App.tsx`; se trasladaron al nuevo owner manteniendo los mismos contratos.
          - Run 34309637023 quedó verde y publicó `b8b8c6376837687881510ddeeac11062db2fcd46`.

          Veredicto

          Terminada.

          La recepción nativa quedó fuera de `App.tsx` conservando listener único, destinos, arbitraje, rutas originales, zero-copy, feedback y cleanup.

          Siguiente tarea

          9.1 — Separar sesión y ajustes.

          No iniciada.
          ```
          '''
          registro_path.write_text(registro.rstrip() + '\n\n' + entry.strip() + '\n', encoding='utf-8')

          head_before = os.environ['HEAD_REMOTE_BEFORE_AGENT_STATE']
          agent_path = Path('migration/BeatGaler-agent-state.md')
          agent = f'''# BeatGaler — Agent State

          ## Contexto

          - Fecha de ejecución: 2026-09-08
          - Rama de trabajo: `v0.9.0-test-noche`
          - Tarea trabajada: `8.3 — Separar recepción nativa`
          - Estado: `Terminada`
          - Última tarea terminada: `8.3 — Separar recepción nativa`

          ## Base de esta ejecución

          - SHA inicial: `f577cb324bcfce702957ea1d718b60f4c19a807b`
          - SHA de implementación validada: `b8b8c6376837687881510ddeeac11062db2fcd46`
          - HEAD remoto observado inmediatamente antes de la escritura final de agent-state: `{head_before}`
          - Run de implementación final: `34309637023` — `Final task 8.3 validation` — matriz aplicable y publicación del commit exacto correctas.
          - Artifact final: `migration-check-logs-task-8-3-34309637023`.
          - El SHA final real de la ronda es el HEAD remoto posterior a este cierre documental y debe releerse después de la última escritura.

          ## Resultado verificado

          - `src/features/dragdrop/useNativeLibraryDrop.ts` posee el listener nativo de Tauri, feedback, arbitraje y routing/ejecución del drop nativo.
          - `App.tsx` conserva un único punto de composición del hook y ya no posee `onDragDropEvent` ni `handleNativeDrop`.
          - Se conservan límite de 50 rutas, rutas originales Explorer/Finder y entrada zero-copy mediante `payload.paths`, sin staging/copia previa a Review.
          - Se conservan detección de destinos, `nativeDropArbiter`, sentinelas de imagen externa/browser y prioridad del receptor nativo.
          - El cleanup cubre registro asíncrono tardío, desuscripción del listener Tauri, listener de imagen externa y feedback visual.
          - Prueba focalizada, regresión nativa, typecheck, unit TS, component DOM, integración, regresiones, build Web y build Desktop pasaron sobre `b8b8c6376837687881510ddeeac11062db2fcd46`.
          - El contrato Mac de drag & drop afectado pasa; la excepción baseline del Direct helper sigue separada y no fue introducida por 8.3.

          ## Pendientes concretos

          - `9.1 — Separar sesión y ajustes`.

          ## Comprobaciones pendientes

          - Ninguna necesaria para cerrar 8.3.
          - Prueba física Desktop Windows/macOS no ejecutada ni inventada; no quedó como bloqueo porque ownership, routing, zero-copy, arbitraje, cleanup y ambos builds están cubiertos por la matriz automatizada.

          ## Siguiente tarea

          - `9.1 — Separar sesión y ajustes`
          - Estado: `Pendiente`
          - No iniciar hasta la próxima ronda.
          '''
          agent_path.write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in agent.splitlines()) + '\n', encoding='utf-8')
          PY

          git diff --check
          git rm .github/workflows/task-8-3-close-temp.yml
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md migration/BeatGaler-agent-state.md
          git diff --cached --check

          grep -Fq '### [x] 8.3 — Separar recepción nativa' migration/BeatGaler-roadmap-para-trabajar-con-IAs.md
          test "$(grep -Fc '### Registro — 8.3' migration/Registro-de-avance.md)" = '1'
          grep -Fq '9.1 — Separar sesión y ajustes' migration/BeatGaler-agent-state.md
          grep -Fq 'SHA de implementación validada: `b8b8c6376837687881510ddeeac11062db2fcd46`' migration/BeatGaler-agent-state.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: close task 8.3'

          changed="$(git diff --name-only "$implementation"..HEAD | sort)"
          expected="$(printf '%s\n' \
            migration/BeatGaler-agent-state.md \
            migration/BeatGaler-roadmap-para-trabajar-con-IAs.md \
            migration/Registro-de-avance.md | sort)"
          test "$changed" = "$expected"
          test -z "$(git status --porcelain)"

          remote="$(git ls-remote origin "refs/heads/$target" | awk '{print $1}')"
          test "$remote" = "${GITHUB_SHA}"
          git push origin "$(git rev-parse HEAD):refs/heads/$target"
