name: Task 10.2 live domain split temp

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/task-10-2-live-domain-split-temp.yml
      - scripts/task-10-2-live-domain-split-temp.cjs

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Extract live domain logic from root composition
        run: node scripts/task-10-2-live-domain-split-temp.cjs
      - name: Adapt moved artwork routing characterization
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'tests/integration/issue97WebRoutingContract.test.ts';
          let source = fs.readFileSync(path, 'utf8');
          const oldOwner = 'const app = readFileSync(resolve(process.cwd(), "src/app/useBeatGalerComposition.ts"), "utf8").replaceAll("../", "./");';
          const newOwner = 'const app = readFileSync(resolve(process.cwd(), "src/features/edit/useBeatEditing.ts"), "utf8").replaceAll("../", "./");';
          if (!source.includes(oldOwner)) throw new Error('Artwork routing characterization owner anchor changed');
          source = source.replace(oldOwner, newOwner);
          source = source.replace('return sourceSection(app, startMarker, endMarker, "App.tsx");', 'return sourceSection(app, startMarker, endMarker, "useBeatEditing.ts");');
          source = source.replace('      "const {\\n    runBeatCloudUpdate,",', '      "  const applyBulkUpdate = useCallback",');
          fs.writeFileSync(path, source);
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Focused architecture check
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('src/App.tsx', 'utf8');
          const beatGalerApp = fs.readFileSync('src/app/BeatGalerApp.tsx', 'utf8');
          const composition = fs.readFileSync('src/app/useBeatGalerComposition.ts', 'utf8');
          const appLines = app.trimEnd().split(/\r?\n/).length;
          const compositionLines = composition.trimEnd().split(/\r?\n/).length;
          console.log(`App.tsx lines=${appLines}; useBeatGalerComposition.ts lines=${compositionLines}`);
          if (appLines < 5 || appLines > 15) throw new Error(`App.tsx must remain 5-15 lines, got ${appLines}`);
          if (!app.includes('<BeatGalerApp />') || app.includes('AccountGate') || app.includes('platform.kind')) throw new Error('App.tsx is not a minimal entry point');
          if (!beatGalerApp.includes('platform.kind === "web"') || !beatGalerApp.includes('<AccountGate><BeatGalerWorkspace /></AccountGate>')) throw new Error('Platform authentication route changed');
          for (const forbidden of [
            'const handleEditBulk = useCallback',
            'const updateBeat = useCallback',
            'const handleDropArtwork = useCallback',
            'const handleDroppedBeatFileRole = useCallback',
            'const applyBulkUpdate = useCallback',
            'const beatCloudUpdateBusyIds = new Set',
          ]) {
            if (composition.includes(forbidden)) throw new Error(`Live domain logic remained in root composition: ${forbidden}`);
          }
          for (const required of ['useBeatEditing({', 'useBeatFileDropRouting({', 'isBeatCloudUpdateBusy,']) {
            if (!composition.includes(required)) throw new Error(`Missing extracted feature wiring: ${required}`);
          }
          NODE
      - name: Typecheck
        run: npm run test:typecheck
      - name: Unit TS
        run: npm run test:unit:ts
      - name: Component DOM
        run: npm run test:component:dom
      - name: Integration
        shell: bash
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee integration-10-2.log
      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: task-10-2-integration-log
          path: integration-10-2.log
          if-no-files-found: error
      - name: Regressions
        run: npm run test:regressions
      - name: Build web
        run: npm run build:web
      - name: Build desktop
        run: npm run build
      - name: Commit validated live domain split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(app): extract editing and drop routing from composition"
          git push origin HEAD:v0.9.0-test-noche