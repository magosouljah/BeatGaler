# task 3.1 verification trigger
name: Temporary Task 3.1 Verify

on:
  push:
    branches:
      - app-tsx-3.1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: app-tsx-3.1
          fetch-depth: 0

      - name: Use project Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply task 3.1 extraction
        run: node scripts/apply-task-3-1.mjs

      - name: Patch hygiene
        run: git diff --check

      - name: Typecheck
        run: npm run test:typecheck

      - name: TypeScript unit tests
        run: npm run test:unit:ts

      - name: Component DOM tests
        run: npm run test:component:dom

      - name: Integration tests
        run: npm run test:integration

      - name: Regression guards
        run: npm run test:regressions

      - name: Web build
        run: npm run build:web

      - name: Desktop frontend build
        run: npm run build

      - name: Upload verified task files
        uses: actions/upload-artifact@v4
        with:
          name: task-3-1-verified-files
          path: |
            src/App.tsx
            src/features/library/useLibraryState.ts
            tests/component-dom/libraryState.test.tsx
            tests/integration/libraryStateExtraction.test.ts
          if-no-files-found: error
