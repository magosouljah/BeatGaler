name: Temporary Task 3.1 Apply

on:
  push:
    branches:
      - app-tsx-3.1

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: app-tsx-3.1
          fetch-depth: 0

      - name: Use project Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply task 3.1 extraction
        run: node scripts/apply-task-3-1.mjs

      - name: Typecheck
        run: npm run test:typecheck

      - name: TypeScript unit tests
        run: npm run test:unit:ts

      - name: Component DOM tests
        run: npm run test:component:dom

      - name: Integration tests
        run: npm run test:integration

      - name: Regression guards
        run: npm run test:regressions

      - name: Web build
        run: npm run build:web

      - name: Desktop frontend build
        run: npm run build

      - name: Commit verified extraction and remove temporary machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-task-3-1.mjs .github/workflows/task-3-1-apply.yml
          git add src/App.tsx src/features/library/useLibraryState.ts tests/component-dom/libraryState.test.tsx tests/integration/libraryStateExtraction.test.ts
          git diff --cached --check
          git commit -m "refactor(app): extract library state"
          git push origin HEAD:app-tsx-3.1
