name: Finalize integration 3.1

on:
  push:
    branches:
      - integration-v0.8.0-alpha.1
    paths:
      - .github/workflows/finalize-integration-3-1.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration-v0.8.0-alpha.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync version and clean public tree
        shell: bash
        run: |
          set -euo pipefail
          node scripts/version.mjs set 0.8.0-alpha.1
          rm -f src/App.tsx.v2-backup-20260809-202442
          rm -f src/lib/tauri.ts.v2-backup-20260809-202442
          rm -f cls tqueue.binlog webhooks_db.binlog
          rm -rf templates
          rm -f .github/workflows/finalize-integration-3-1.yml
          node scripts/version.mjs check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(integration): finalize v0.8.0-alpha.1 tree"
          git push origin HEAD:integration-v0.8.0-alpha.1
