name: Temporary task 7.3 apply

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/temp-task-7-3-apply.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: v0.9.0-test-noche

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact task commit
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Verify exclusive branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply task 7.3 extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/temp-task-7-3-apply.py
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one occurrence, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # replace_between() already preserves its end marker. The temporary
          # applier included that marker in two replacement bodies, so normalize
          # the generated App before any tests run.
          app_path = Path("src/App.tsx")
          app_text = app_path.read_text(encoding="utf-8")
          function_marker = '  const updateExistingBeatFromFolder = useCallback'
          function_duplicate = function_marker + function_marker
          overlay_marker = '      {(dropActive || dropImporting) && !libraryDropStaging && !reviewBootstrap && !reviewQueue && ('
          overlay_duplicate = overlay_marker + overlay_marker
          if app_text.count(function_duplicate) != 1:
              raise SystemExit("expected exactly one duplicated updateExistingBeatFromFolder marker")
          if app_text.count(overlay_duplicate) != 1:
              raise SystemExit("expected exactly one duplicated drop overlay marker")
          app_text = app_text.replace(function_duplicate, function_marker, 1)
          app_text = app_text.replace(overlay_duplicate, overlay_marker, 1)
          app_path.write_text(app_text, encoding="utf-8")

          # Task 7.3 moves ownership of native conflict state into the hook, but
          # browser import is explicitly task 7.4 and still clears those states.
          # Expose the setters as a temporary bridge without moving browser flow.
          save_all_path = Path("src/features/import/useImportSaveAll.ts")
          replace_exact(
              save_all_path,
              '''  return {\n    audioConflictBatch,\n    dropImportBatch,\n    handleReviewedSaveAll,\n''',
              '''  return {\n    audioConflictBatch,\n    dropImportBatch,\n    setAudioConflictBatch,\n    setDropImportBatch,\n    handleReviewedSaveAll,\n''',
              "Save All conflict setter bridge",
          )
          replace_exact(
              app_path,
              '''  const {\n    audioConflictBatch,\n    dropImportBatch,\n    handleReviewedSaveAll,\n''',
              '''  const {\n    audioConflictBatch,\n    dropImportBatch,\n    setAudioConflictBatch,\n    setDropImportBatch,\n    handleReviewedSaveAll,\n''',
              "App conflict setter bridge",
          )

          # The structural test must verify ownership, not ban setter names that
          # the untouched browser-import callback still needs until task 7.4.
          ownership_test = Path("tests/integration/appImportSaveAllExtraction.test.ts")
          replace_exact(
              ownership_test,
              '''    expect(app).not.toContain("setAudioConflictBatch");\n    expect(app).not.toContain("setDropImportBatch");\n''',
              '''    expect(app).not.toContain("const [audioConflictBatch, setAudioConflictBatch] = useState");\n    expect(app).not.toContain("const [dropImportBatch, setDropImportBatch] = useState");\n    expect(app).toContain("setAudioConflictBatch(null);");\n    expect(app).toContain("setDropImportBatch(null);");\n''',
              "task 7.3 ownership assertions",
          )

          # Keep the component expectation generated by the applier as [ [] ].
          # importResolvedDecisions removes the staging map entry first; the
          # subsequent close callback may invoke cleanup([]), which deletes no
          # retained files and preserves the existing modal callback contract.
          PY

      - name: Remove temporary tooling before validation
        shell: bash
        run: |
          rm -f scripts/temp-task-7-3-apply.py
          rm -f .github/workflows/temp-task-7-3-apply.yml
          git diff --check

      - name: Run focused task 7.3 tests
        run: npx vitest run tests/component-dom/importSaveAll.test.tsx tests/component-dom/importDiscovery.test.tsx tests/integration/appImportSaveAllExtraction.test.ts tests/integration/appImportDiscoveryExtraction.test.ts tests/integration/appMigrationCharacterization.test.ts

      - name: Run migration matrix with readable logs
        id: migration_checks
        continue-on-error: true
        run: node scripts/run-migration-checks-with-logs.mjs

      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-7-3-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/migration-check-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop if migration checks failed
        if: steps.migration_checks.outcome == 'failure'
        run: exit 1

      - name: Publish only the tested tree to the test branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          if [ "$(git rev-parse origin/$TARGET_BRANCH)" != "$GITHUB_SHA" ]; then
            echo "Remote branch advanced during this run; refusing to overwrite concurrent work."
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(import): extract Save All and conflicts"
          git push origin HEAD:"$TARGET_BRANCH"
