name: Task 5.2 - Generate AWS Secrets Manager lock

on:
  push:
    branches:
      - task-5.2-aws-secret-provider
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task-5-2-aws-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task-5.2-aws-secret-provider

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Generate exact locked dependency
        working-directory: cloud-server
        run: npm install --save-exact --package-lock-only @aws-sdk/client-secrets-manager@3.1116.0

      - name: Commit generated manifests if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cloud-server/package.json cloud-server/package-lock.json; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-server/package.json cloud-server/package-lock.json
          git commit -m "build(data): lock AWS Secrets Manager client"
          git push origin HEAD:task-5.2-aws-secret-provider
