name: Apply Task 7.1 Capability Patch

on:
  push:
    branches:
      - woz/task-7.1-direct-capabilities

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: woz/task-7.1-direct-capabilities
          fetch-depth: 0
      - name: Apply initial scoped capability patch
        shell: bash
        run: |
          if grep -q 'MAX_ACTIVE_VAULTS_PER_BOT' cloud-server/direct-transport-control.js \
             && grep -q 'fn direct_capability_scope' src-tauri/src/commands.rs; then
            echo 'Initial Task 7.1 source patch already applied.'
          else
            node scripts/apply-task-7.1-capability-patch.mjs
          fi
      - name: Apply authorize-before-data-plane patch
        shell: bash
        run: node scripts/apply-task-7.1-authorize-patch.mjs
      - name: Close authorized operations on every local outcome
        shell: bash
        run: node scripts/apply-task-7.1-rust-cleanup-patch.mjs
      - name: Commit patched production sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source patch changes to commit.'
            exit 0
          fi
          git config user.name 'BeatGaler WOZ'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            cloud-server/direct-capability-boundary.js \
            cloud-server/http-containment.js \
            cloud-server/direct-transport-control.js \
            cloud-server/tests/direct-capability-boundary.test.cjs \
            src/features/cloud/webTransportSession.ts \
            src/features/cloud/webTransportController.ts \
            src-tauri/src/commands.rs
          git commit -m 'security(direct): close capabilities on local failure'
          git push origin HEAD:woz/task-7.1-direct-capabilities
