name: Final Task 9.1 Validation

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-9-1-final.yml

permissions:
  contents: write

jobs:
  task-9-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard target branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v0.9.0-test-noche"
          git fetch origin v0.9.0-test-noche
          test "$(git rev-parse origin/v0.9.0-test-noche)" = "${GITHUB_SHA}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply corrected extraction and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          python .github/task-9-1-retry.py
          python .github/task-9-1-fix.py
          rm .github/task-9-1-retry.py
          rm .github/task-9-1-fix.py
          rm .github/workflows/task-9-1-apply.yml
          rm .github/workflows/task-9-1-retry.yml
          rm .github/workflows/task-9-1-final.yml

      - name: Focused task 9.1 tests
        run: npx vitest run tests/component-dom/sessionState.test.tsx tests/integration/appSessionExtraction.test.ts

      - name: Diff check
        run: git diff --check

      - name: Run migration matrix
        run: node scripts/run-migration-checks-with-logs.mjs

      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-9-1-${{ github.run_id }}
          path: artifacts/migration-check-logs/
          if-no-files-found: warn

      - name: Commit exact validated implementation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/migration-check-logs
          git diff --check
          git fetch origin v0.9.0-test-noche
          test "$(git rev-parse origin/v0.9.0-test-noche)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract session and settings ownership"
          git push origin HEAD:v0.9.0-test-noche
