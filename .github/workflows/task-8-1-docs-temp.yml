name: Temporary task 8.1 documentation close

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-8-1-docs-temp.yml

permissions:
  contents: write

concurrency:
  group: beatgaler-migration-v0.9.0-test-noche
  cancel-in-progress: false

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Verify validated implementation ancestry
        shell: bash
        run: |
          set -euo pipefail
          implementation='00b56e94fbc790483e150de27202488eef166bb4'
          target='v0.9.0-test-noche'
          test "${GITHUB_REF_NAME}" = "$target"
          git merge-base --is-ancestor "$implementation" HEAD
          unexpected="$(git diff --name-only "$implementation"..HEAD | grep -v -E '^(\.github/workflows/task-8-1-docs-temp\.yml|scripts/task-8-1-docs-temp\.py)$' || true)"
          test -z "$unexpected"
          remote="$(git ls-remote origin "refs/heads/$target" | awk '{print $1}')"
          test "$remote" = "${GITHUB_SHA}"

      - name: Update migration documents
        shell: bash
        run: |
          set -euo pipefail
          python scripts/task-8-1-docs-temp.py
          git diff --check
          grep -Fq '### [x] 8.1 — Separar detección del destino' migration/BeatGaler-roadmap-para-trabajar-con-IAs.md
          grep -Fq '### [ ] 8.2 — Separar recepción HTML y navegador' migration/BeatGaler-roadmap-para-trabajar-con-IAs.md
          grep -Fq '### Registro — 8.1' migration/Registro-de-avance.md
          grep -Fq '8.2 — Separar recepción HTML y navegador' migration/BeatGaler-agent-state.md

      - name: Commit and publish documentation close
        shell: bash
        run: |
          set -euo pipefail
          target='v0.9.0-test-noche'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/task-8-1-docs-temp.yml scripts/task-8-1-docs-temp.py
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md migration/BeatGaler-agent-state.md
          git diff --cached --check
          git commit -m 'docs: close task 8.1'
          final="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin "refs/heads/$target" | awk '{print $1}')"
          test "$remote" = "${GITHUB_SHA}"
          git push origin "$final:refs/heads/$target"
