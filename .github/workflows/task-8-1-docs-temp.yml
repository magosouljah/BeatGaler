name: Temporary task 8.1 documentation close

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-8-1-docs-temp.yml

permissions:
  contents: write

concurrency:
  group: beatgaler-migration-v0.9.0-test-noche
  cancel-in-progress: false

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Verify validated implementation is parent
        shell: bash
        run: |
          set -euo pipefail
          implementation='00b56e94fbc790483e150de27202488eef166bb4'
          target='v0.9.0-test-noche'
          test "${GITHUB_REF_NAME}" = "$target"
          test "$(git rev-parse HEAD^)" = "$implementation"
          remote="$(git ls-remote origin "refs/heads/$target" | awk '{print $1}')"
          test "$remote" = "${GITHUB_SHA}"

      - name: Update roadmap, registro and agent state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('migration/BeatGaler-roadmap-para-trabajar-con-IAs.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '### [ ] 8.1 — Separar detección del destino'
          new = '### [x] 8.1 — Separar detección del destino'
          if text.count(old) != 1:
              raise RuntimeError(f'roadmap 8.1 marker expected once, found {text.count(old)}')
          if '### [x] 8.2 — Separar recepción HTML y navegador' in text:
              raise RuntimeError('8.2 must remain pending')
          roadmap.write_text(text.replace(old, new, 1), encoding='utf-8')

          registro = Path('migration/Registro-de-avance.md')
          current = registro.read_text(encoding='utf-8')
          if '### Registro — 8.1' in current:
              raise RuntimeError('8.1 registro already exists')
          entry = r'''

