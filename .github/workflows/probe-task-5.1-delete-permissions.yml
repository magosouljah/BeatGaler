name: Probe - Task 5.1 M0-F delete permissions

on:
  pull_request:
    branches:
      - task-5.1-temp-auth-web-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m0_f_delete_permissions:
    name: M0-F delete permissions live
    if: "${{ github.event_name != 'pull_request' || github.head_ref == 'task-5.1-delete-permission-probe' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BEATGALER_M0_F_CHAT_ID: ${{ secrets.BEATGALER_M0_F_CHAT_ID }}
      BEATGALER_M0_B2_BOT_TOKEN: ${{ secrets.BEATGALER_M0_B2_BOT_TOKEN }}
      BEATGALER_M0_F_BOT_B_TOKEN: ${{ secrets.BEATGALER_M0_F_BOT_B_TOKEN }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          check-latest: false

      - name: Validate probe syntax
        run: node --check scripts/telegram-delete-permission-live.mjs

      - name: Require isolated probe resources without printing values
        run: |
          node -e "for (const n of ['BEATGALER_M0_F_CHAT_ID','BEATGALER_M0_B2_BOT_TOKEN','BEATGALER_M0_F_BOT_B_TOKEN']) { if (!String(process.env[n] || '').trim()) throw new Error('Missing dedicated M0-F secret: ' + n); } console.log('Dedicated M0-F resources are configured; values remain hidden.')"

      - name: Prove own delete and cross-bot denial without admin rights
        run: node scripts/telegram-delete-permission-live.mjs
