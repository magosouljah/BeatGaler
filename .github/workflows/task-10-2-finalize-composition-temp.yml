name: Task 10.2 finalize composition temp

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/task-10-2-finalize-composition-temp.yml
      - scripts/task-10-2-finalize-composition-temp.cjs

permissions:
  contents: write

jobs:
  finalize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Finalize 10.2 composition
        run: node scripts/task-10-2-finalize-composition-temp.cjs
      - name: Focused 10.2 architecture check
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('src/App.tsx', 'utf8');
          const beatGalerApp = fs.readFileSync('src/app/BeatGalerApp.tsx', 'utf8');
          const composition = fs.readFileSync('src/app/useBeatGalerComposition.ts', 'utf8');
          const appLines = app.trimEnd().split(/\r?\n/).length;
          const beatGalerAppLines = beatGalerApp.trimEnd().split(/\r?\n/).length;
          const compositionLines = composition.trimEnd().split(/\r?\n/).length;
          console.log(`App.tsx=${appLines} lines; BeatGalerApp.tsx=${beatGalerAppLines}; composition=${compositionLines}`);
          if (appLines < 5 || appLines > 15) throw new Error(`App.tsx is not a minimal entry: ${appLines} lines`);
          if (!app.includes('<BeatGalerApp />') || app.includes('AccountGate') || app.includes('platform.kind')) throw new Error('App.tsx owns more than entry composition');
          if (!beatGalerApp.includes('platform.kind === "web"') || !beatGalerApp.includes('<AccountGate><BeatGalerWorkspace /></AccountGate>')) throw new Error('Single per-platform auth route changed');
          for (const forbidden of [
            'updateExistingBeatFromFolder',
            'inspectBeatUpdateFolder',
            'mergeFolderIntoExistingBeat',
            'const handleEditBulk = useCallback',
            'const updateBeat = useCallback',
            'const handleDropArtwork = useCallback',
            'const handleDroppedBeatFileRole = useCallback',
            'const applyBulkUpdate = useCallback',
            'const handleUploadTelegram = useCallback',
            'const handleDownloadTelegram = useCallback',
            'const rejectOfflineMutation = useCallback',
          ]) {
            if (composition.includes(forbidden)) throw new Error(`Domain logic still concentrated in composition: ${forbidden}`);
          }
          for (const required of [
            'useArtworkHydration({',
            'useCloudUploadQueue({',
            'useImportDiscovery({',
            'useImportReview({',
            'useImportSaveAll({',
            'useBeatEditing({',
            'useBeatAssetUpdates({',
            'useBeatProjects({',
            'useBeatFileDropRouting({',
            'useHtmlLibraryDrop({',
            'useNativeLibraryDrop({',
            'usePlaybackController({',
            'usePlaybackQueue({',
            'useTrashActions({',
          ]) {
            if (!composition.includes(required)) throw new Error(`Expected feature wiring missing: ${required}`);
          }
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Diff check
        run: git diff --check
      - name: Typecheck
        run: npm run test:typecheck
      - name: Unit TS
        run: npm run test:unit:ts
      - name: Component DOM
        run: npm run test:component:dom
      - name: Integration
        id: integration
        shell: bash
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee integration-10-2-final.log
      - name: Upload integration diagnostics
        if: always() && steps.integration.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: task-10-2-final-integration-log
          path: integration-10-2-final.log
          if-no-files-found: error
      - name: Regressions
        id: regressions
        shell: bash
        run: |
          set -o pipefail
          npm run test:regressions 2>&1 | tee regressions-10-2-final.log
      - name: Upload regression diagnostics
        if: always() && steps.regressions.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: task-10-2-final-regressions-log
          path: regressions-10-2-final.log
          if-no-files-found: error
      - name: Build web
        run: npm run build:web
      - name: Build desktop
        run: npm run build
      - name: Commit validated 10.2 implementation
        run: |
          rm -f .github/workflows/task-10-2-finalize-composition-temp.yml scripts/task-10-2-finalize-composition-temp.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(app): finalize minimal composition for 10.2"
          git push origin HEAD:v0.9.0-test-noche
