name: Task 6.4 Apply

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-6-4-apply.yml

permissions:
  contents: write

concurrency:
  group: app-tsx-nightly-v0.9.0-test-noche
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Verify branch and execution base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v0.9.0-test-noche"
          git merge-base --is-ancestor 0ef4255d528e726dd278ba7389575f6d260fe333 HEAD
          test -f .github/task-6-4.py
          git status --short

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Apply task 6.4 in runner workspace
        shell: bash
        run: |
          set -o pipefail
          mkdir -p migration-check-logs
          python .github/task-6-4.py apply 2>&1 | tee migration-check-logs/apply.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "PASS apply" > migration-check-logs/summary.txt
          else
            echo "FAIL apply exit=${status}" > migration-check-logs/summary.txt
            exit "$status"
          fi

      - name: Run implementation verification matrix
        id: implementation_checks
        shell: bash
        run: |
          set +e
          failed=0
          run_check() {
            name="$1"
            shift
            echo "===== implementation/${name} ====="
            "$@" >"migration-check-logs/implementation-${name}.log" 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "PASS implementation-${name}" | tee -a migration-check-logs/summary.txt
            else
              echo "FAIL implementation-${name} exit=${status}" | tee -a migration-check-logs/summary.txt
              failed=1
            fi
          }
          run_check npm-ci npm ci
          run_check diff-check git diff --check
          run_check typecheck npm run test:typecheck
          run_check unit-ts npm run test:unit:ts
          run_check component-dom npm run test:component:dom
          run_check integration npm run test:integration
          run_check regressions npm run test:regressions
          run_check build-web npm run build:web
          run_check build npm run build
          cat migration-check-logs/summary.txt
          exit "$failed"

      - name: Commit and publish validated implementation
        if: steps.implementation_checks.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx \
            src/features/cloud/useCloudUploadQueue.ts \
            tests/integration/appCloudUploadQueueExtraction.test.ts \
            tests/integration/appMigrationCharacterization.test.ts \
            scripts/run-regressions.mjs
          git diff --cached --check
          git commit -m "refactor(cloud): extract upload queue"
          implementation_sha="$(git rev-parse HEAD)"
          git push origin HEAD:v0.9.0-test-noche
          remote_sha="$(git ls-remote origin refs/heads/v0.9.0-test-noche | cut -f1)"
          test "$remote_sha" = "$implementation_sha"
          echo "IMPLEMENTATION_SHA=${implementation_sha}" >> "$GITHUB_ENV"

      - name: Prepare closure documents and remove temporary tooling
        if: steps.implementation_checks.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp .github/task-6-4.py /tmp/task-6-4.py
          python .github/task-6-4.py finalize-docs \
            0ef4255d528e726dd278ba7389575f6d260fe333 \
            "$IMPLEMENTATION_SHA" \
            "$GITHUB_RUN_ID"
          rm .github/task-6-4.py .github/workflows/task-6-4-apply.yml
          git diff --check

      - name: Revalidate after tooling removal
        id: closure_checks
        if: steps.implementation_checks.outcome == 'success'
        shell: bash
        run: |
          set +e
          failed=0
          run_check() {
            name="$1"
            shift
            echo "===== closure/${name} ====="
            "$@" >"migration-check-logs/closure-${name}.log" 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "PASS closure-${name}" | tee -a migration-check-logs/summary.txt
            else
              echo "FAIL closure-${name} exit=${status}" | tee -a migration-check-logs/summary.txt
              failed=1
            fi
          }
          run_check npm-ci npm ci
          run_check diff-check git diff --check
          run_check typecheck npm run test:typecheck
          run_check unit-ts npm run test:unit:ts
          run_check component-dom npm run test:component:dom
          run_check integration npm run test:integration
          run_check regressions npm run test:regressions
          run_check build-web npm run build:web
          run_check build npm run build
          cat migration-check-logs/summary.txt
          exit "$failed"

      - name: Commit closure state and read remote HEAD
        if: steps.closure_checks.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md \
            migration/Registro-de-avance.md \
            .github/task-6-4.py \
            .github/workflows/task-6-4-apply.yml
          git diff --cached --check
          git commit -m "docs(migration): close task 6.4 tooling"
          closure_sha="$(git rev-parse HEAD)"
          git push origin HEAD:v0.9.0-test-noche
          remote_sha="$(git ls-remote origin refs/heads/v0.9.0-test-noche | cut -f1)"
          test "$remote_sha" = "$closure_sha"
          echo "CLOSURE_SHA=${closure_sha}" >> "$GITHUB_ENV"

      - name: Write final agent state
        if: steps.closure_checks.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/task-6-4.py finalize-state \
            0ef4255d528e726dd278ba7389575f6d260fe333 \
            "$IMPLEMENTATION_SHA" \
            "$CLOSURE_SHA" \
            "$GITHUB_RUN_ID"
          git add migration/BeatGaler-agent-state.md
          git diff --cached --check
          git commit -m "docs(migration): finalize task 6.4 state"
          git push origin HEAD:v0.9.0-test-noche
          final_sha="$(git ls-remote origin refs/heads/v0.9.0-test-noche | cut -f1)"
          test "$final_sha" = "$(git rev-parse HEAD)"
          echo "FINAL_SHA=${final_sha}" >> "$GITHUB_ENV"

      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-6-4-${{ github.run_id }}
          path: migration-check-logs/
          if-no-files-found: error
          retention-days: 14

      - name: Report SHAs
        if: steps.closure_checks.outcome == 'success'
        shell: bash
        run: |
          echo "implementation=$IMPLEMENTATION_SHA"
          echo "closure=$CLOSURE_SHA"
          echo "final=$FINAL_SHA"
