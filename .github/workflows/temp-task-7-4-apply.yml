name: Temporary task 7.4 apply

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/temp-task-7-4-apply.yml

permissions:
  contents: write

concurrency:
  group: task-7-4-v0.9.0-test-noche
  cancel-in-progress: false

jobs:
  apply-validate-document:
    if: contains(github.event.head_commit.message, 'stage task 7.4 browser import extraction')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Verify exact starting point
        shell: bash
        run: |
          set -euo pipefail
          expected_initial="45ca0eae03d1685a1f938f4beaffb4259097882b"
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_initial"
          test "$(git rev-parse --abbrev-ref HEAD)" = "v0.9.0-test-noche"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply task 7.4 extraction and tests
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          app_path = Path("src/App.tsx")
          app = app_path.read_text(encoding="utf-8")
          app = replace_once(
              app,
              'import { useImportSaveAll } from "./features/import/useImportSaveAll";\n',
              'import { useImportSaveAll } from "./features/import/useImportSaveAll";\nimport { useBrowserImport } from "./features/import/useBrowserImport";\n',
              "App import",
          )
          app = replace_once(
              app,
              '''  const {\n    audioConflictBatch,\n    dropImportBatch,\n    setAudioConflictBatch,\n    setDropImportBatch,\n    handleReviewedSaveAll,\n''',
              '''  const {\n    audioConflictBatch,\n    dropImportBatch,\n    resetImportResolutionState,\n    handleReviewedSaveAll,\n''',
              "Save All bridge destructure",
          )
          app = replace_once(
              app,
              '''    addBeatsAndReview,\n  });\n\n  const updateExistingBeatFromFolder = useCallback''',
              '''    addBeatsAndReview,\n  });\n\n  const { importDroppedBrowserFiles } = useBrowserImport({\n    dropImporting,\n    setDropImporting,\n    rejectOfflineMutation,\n    setDropActive,\n    setShowAdd,\n    setReviewQueue,\n    completeImmediateReviewPreparation,\n    resetImportResolutionState,\n  });\n\n  const updateExistingBeatFromFolder = useCallback''',
              "Browser import hook wiring",
          )
          start_marker = "  const importDroppedBrowserFiles = useCallback(async (files: File[]) => {"
          end_marker = "  const handleBrowserBeatFileDrop = useCallback"
          if app.count(start_marker) != 1:
              raise SystemExit(f"Browser import body: expected one start marker, found {app.count(start_marker)}")
          start = app.index(start_marker)
          end = app.index(end_marker, start)
          app = app[:start] + app[end:]
          app_path.write_text(app, encoding="utf-8")

          save_path = Path("src/features/import/useImportSaveAll.ts")
          save = save_path.read_text(encoding="utf-8")
          save = replace_once(
              save,
              '''  const [audioConflictBatch, setAudioConflictBatch] = useState<ImportBatchPreview | null>(null);\n  const [dropImportBatch, setDropImportBatch] = useState<ImportBatchPreview | null>(null);\n\n''',
              '''  const [audioConflictBatch, setAudioConflictBatch] = useState<ImportBatchPreview | null>(null);\n  const [dropImportBatch, setDropImportBatch] = useState<ImportBatchPreview | null>(null);\n\n  const resetImportResolutionState = useCallback(() => {\n    setDeferredImportBatch(null);\n    setAudioConflictBatch(null);\n    setDropImportBatch(null);\n  }, [setDeferredImportBatch]);\n\n''',
              "Semantic reset callback",
          )
          save = replace_once(
              save,
              '''  return {\n    audioConflictBatch,\n    dropImportBatch,\n    setAudioConflictBatch,\n    setDropImportBatch,\n    handleReviewedSaveAll,\n''',
              '''  return {\n    audioConflictBatch,\n    dropImportBatch,\n    resetImportResolutionState,\n    handleReviewedSaveAll,\n''',
              "Semantic reset return",
          )
          save_path.write_text(save, encoding="utf-8")

          browser_path = Path("src/features/import/useBrowserImport.ts")
          if browser_path.exists():
              raise SystemExit("useBrowserImport.ts already exists; refusing to overwrite unexpected work")
          browser_path.write_text('''import { useCallback, type Dispatch, type SetStateAction } from "react";\nimport { appAlert } from "../../lib/dialog";\nimport { cleanTags } from "../../lib/metadataValidation";\nimport { platform } from "../../platform";\nimport type { ImportReviewQueueState } from "./useImportSession";\n\ntype UseBrowserImportOptions = {\n  dropImporting: boolean;\n  setDropImporting: Dispatch<SetStateAction<boolean>>;\n  rejectOfflineMutation: (action: string) => boolean;\n  setDropActive: Dispatch<SetStateAction<boolean>>;\n  setShowAdd: Dispatch<SetStateAction<boolean>>;\n  setReviewQueue: Dispatch<SetStateAction<ImportReviewQueueState | null>>;\n  completeImmediateReviewPreparation: () => void;\n  resetImportResolutionState: () => void;\n};\n\nexport function useBrowserImport({\n  dropImporting,\n  setDropImporting,\n  rejectOfflineMutation,\n  setDropActive,\n  setShowAdd,\n  setReviewQueue,\n  completeImmediateReviewPreparation,\n  resetImportResolutionState,\n}: UseBrowserImportOptions) {\n  const importDroppedBrowserFiles = useCallback(async (files: File[]) => {\n    if (rejectOfflineMutation("Importing beats")) return;\n    if (dropImporting) return;\n\n    const supported = files.filter(file =>\n      /\\.(mp3|wav)$/i.test(file.name) ||\n      file.type === "audio/mpeg" ||\n      file.type === "audio/wav" ||\n      file.type === "audio/x-wav"\n    );\n    if (supported.length === 0) {\n      await appAlert({ title: "Nothing to import", message: "Drop an MP3 or WAV file to add a beat." });\n      return;\n    }\n    if (supported.length > 1) {\n      await appAlert({ title: "Drop one beat at a time", message: "BeatGaler Web imports one beat per drag action." });\n      return;\n    }\n\n    setDropImporting(true);\n    setDropActive(false);\n    try {\n      const candidate = platform.importer.fromFile(supported[0]);\n      const hydrated = await candidate.hydrated.catch(() => candidate.beat);\n      const beat = { ...hydrated, tags: cleanTags(hydrated.tags || []).tags };\n      setShowAdd(false);\n      completeImmediateReviewPreparation();\n      resetImportResolutionState();\n      setReviewQueue({ beats: [beat], index: 0, total: 1, batchId: null, preparing: false });\n    } catch (error) {\n      await appAlert({ title: "Import failed", message: String(error), danger: true });\n    } finally {\n      setDropImporting(false);\n    }\n  }, [\n    completeImmediateReviewPreparation,\n    dropImporting,\n    rejectOfflineMutation,\n    resetImportResolutionState,\n    setDropActive,\n    setDropImporting,\n    setReviewQueue,\n    setShowAdd,\n  ]);\n\n  return { importDroppedBrowserFiles };\n}\n''', encoding="utf-8")

          test_path = Path("tests/integration/appImportSaveAllExtraction.test.ts")
          test = test_path.read_text(encoding="utf-8")
          first_start = test.index('  it("moves Save All and conflict state/callback ownership out of App while leaving browser import for 7.4", () => {')
          second_start = test.index('  it("closes Review before waiting for the shared background worker', first_start)
          replacement = '''  it("keeps Save All/conflict ownership out of App and exposes only a semantic browser reset bridge", () => {\n    expect(app).toContain("useImportSaveAll({");\n    expect(app).not.toContain("const handleReviewedSaveAll = useCallback");\n    expect(app).not.toContain("const [audioConflictBatch, setAudioConflictBatch] = useState");\n    expect(app).not.toContain("const [dropImportBatch, setDropImportBatch] = useState");\n    expect(app).not.toContain("setAudioConflictBatch(null);");\n    expect(app).not.toContain("setDropImportBatch(null);");\n    expect(app).toContain("resetImportResolutionState,");\n    expect(saveAll).toContain("const resetImportResolutionState = useCallback(() => {");\n    expect(saveAll).toContain("setDeferredImportBatch(null);");\n    expect(saveAll).toContain("setAudioConflictBatch(null);");\n    expect(saveAll).toContain("setDropImportBatch(null);");\n    expect(saveAll).toContain("saveMeta: saveBeatMeta,");\n    expect(app).not.toContain("const importDroppedBrowserFiles = useCallback");\n    expect(discovery).toContain("const [deferredImportBatch, setDeferredImportBatch]");\n    expect(discovery).not.toContain("setAudioConflictBatch");\n    expect(discovery).not.toContain("setDropImportBatch");\n  });\n\n'''
          test = test[:first_start] + replacement + test[second_start:]
          test_path.write_text(test, encoding="utf-8")

          static_test = Path("tests/integration/appBrowserImportExtraction.test.ts")
          if static_test.exists():
              raise SystemExit("appBrowserImportExtraction.test.ts already exists; refusing to overwrite unexpected work")
          static_test.write_text('''import { readFileSync } from "node:fs";\nimport { resolve } from "node:path";\nimport { describe, expect, it } from "vitest";\n\nconst app = readFileSync(resolve(process.cwd(), "src/App.tsx"), "utf8");\nconst browserImport = readFileSync(resolve(process.cwd(), "src/features/import/useBrowserImport.ts"), "utf8");\nconst review = readFileSync(resolve(process.cwd(), "src/features/import/useImportReview.ts"), "utf8");\nconst capabilities = readFileSync(resolve(process.cwd(), "src/platform/capabilities.ts"), "utf8");\n\ndescribe("task 7.4 browser import extraction", () => {\n  it("moves the browser File to Review path out of App and keeps App as capability-gated wiring", () => {\n    expect(app).toContain('import { useBrowserImport } from "./features/import/useBrowserImport";');\n    expect((app.match(/useBrowserImport\\(/g) ?? []).length).toBe(1);\n    expect(app).not.toContain("const importDroppedBrowserFiles = useCallback");\n    expect(app).toContain("onBrowserLibraryFileDrop: platform.capabilities.browserFileImport ? importDroppedBrowserFiles : undefined");\n  });\n\n  it("preserves one beat per gesture, hydration, tag cleanup and immediate Review preparation", () => {\n    expect(browserImport).toContain("if (supported.length > 1)");\n    expect(browserImport).toContain("BeatGaler Web imports one beat per drag action.");\n    expect(browserImport).toContain("platform.importer.fromFile(supported[0])");\n    expect(browserImport).toContain("candidate.hydrated.catch(() => candidate.beat)");\n    expect(browserImport).toContain("cleanTags(hydrated.tags || []).tags");\n    expect(browserImport).toContain("completeImmediateReviewPreparation();");\n    expect(browserImport).toContain("resetImportResolutionState();");\n    expect(browserImport).toContain("setReviewQueue({ beats: [beat], index: 0, total: 1, batchId: null, preparing: false });");\n  });\n\n  it("contains no native invocation path and leaves browser candidate release on Skip/Cancel", () => {\n    expect(browserImport).not.toContain("../../lib/tauri");\n    expect(browserImport).not.toContain("@tauri");\n    expect(browserImport).not.toContain("invoke(");\n    expect(review).toContain("if (currentBeat) releaseBeat?.(currentBeat.id);");\n    expect(review).toContain("for (const beat of queue.beats.slice(queue.index)) releaseBeat?.(beat.id);");\n    expect(app).toContain("? beatId => platform.importer.releaseBeat(beatId)");\n    expect(capabilities).toContain("browserFileImport: false,");\n    expect(capabilities).toContain("reviewBeatCloudCommit: false,");\n    expect(capabilities).toContain("browserFileImport: true,");\n    expect(capabilities).toContain("reviewBeatCloudCommit: true,");\n  });\n});\n''', encoding="utf-8")

          dom_test = Path("tests/component-dom/browserImport.test.tsx")
          if dom_test.exists():
              raise SystemExit("browserImport.test.tsx already exists; refusing to overwrite unexpected work")
          dom_test.write_text('''// @vitest-environment jsdom\nimport React, { act, useState } from "react";\nimport { createRoot, type Root } from "react-dom/client";\nimport { afterEach, describe, expect, it, vi } from "vitest";\nimport type { Beat } from "../../src/types";\nimport * as dialog from "../../src/lib/dialog";\nimport { platform } from "../../src/platform";\nimport { useBrowserImport } from "../../src/features/import/useBrowserImport";\nimport type { ImportReviewQueueState } from "../../src/features/import/useImportSession";\n\n(globalThis as typeof globalThis & { IS_REACT_ACT_ENVIRONMENT?: boolean }).IS_REACT_ACT_ENVIRONMENT = true;\n\ntype Latest = {\n  importDroppedBrowserFiles: ReturnType<typeof useBrowserImport>["importDroppedBrowserFiles"];\n  reviewQueue: ImportReviewQueueState | null;\n  dropImporting: boolean;\n  dropActive: boolean;\n  showAdd: boolean;\n};\n\nlet host: HTMLDivElement | null = null;\nlet root: Root | null = null;\nlet latest: Latest | null = null;\nlet preparationCalls = 0;\nlet resetCalls = 0;\n\nfunction Harness() {\n  const [dropImporting, setDropImporting] = useState(false);\n  const [dropActive, setDropActive] = useState(true);\n  const [showAdd, setShowAdd] = useState(true);\n  const [reviewQueue, setReviewQueue] = useState<ImportReviewQueueState | null>(null);\n  const { importDroppedBrowserFiles } = useBrowserImport({\n    dropImporting,\n    setDropImporting,\n    rejectOfflineMutation: () => false,\n    setDropActive,\n    setShowAdd,\n    setReviewQueue,\n    completeImmediateReviewPreparation: () => { preparationCalls += 1; },\n    resetImportResolutionState: () => { resetCalls += 1; },\n  });\n  latest = { importDroppedBrowserFiles, reviewQueue, dropImporting, dropActive, showAdd };\n  return <div />;\n}\n\nasync function renderHarness() {\n  host = document.createElement("div");\n  document.body.appendChild(host);\n  root = createRoot(host);\n  await act(async () => { root!.render(<Harness />); });\n}\n\nafterEach(async () => {\n  vi.restoreAllMocks();\n  if (root) await act(async () => root!.unmount());\n  root = null;\n  host?.remove();\n  host = null;\n  latest = null;\n  preparationCalls = 0;\n  resetCalls = 0;\n});\n\ndescribe("browser import entry", () => {\n  it("hydrates one browser File and opens exactly one Review candidate", async () => {\n    const sourceBeat = {\n      id: "browser-1",\n      name: "Browser Beat",\n      bpm: 128,\n      key: "c",\n      tags: ["trap"],\n      rating: 0,\n      mp3_path: "browser://browser-1",\n    } as Beat;\n    const fromFile = vi.spyOn(platform.importer, "fromFile").mockReturnValue({\n      beat: sourceBeat,\n      hydrated: Promise.resolve({ ...sourceBeat, tags: ["trap"] }),\n      release: vi.fn(),\n    } as any);\n    vi.spyOn(dialog, "appAlert").mockResolvedValue(undefined as any);\n    await renderHarness();\n\n    const file = new File([new Uint8Array([1, 2, 3])], "beat.mp3", { type: "audio/mpeg" });\n    await act(async () => { await latest!.importDroppedBrowserFiles([file]); });\n\n    expect(fromFile).toHaveBeenCalledTimes(1);\n    expect(fromFile).toHaveBeenCalledWith(file);\n    expect(latest!.reviewQueue?.beats.map(item => item.id)).toEqual(["browser-1"]);\n    expect(latest!.reviewQueue?.total).toBe(1);\n    expect(latest!.dropImporting).toBe(false);\n    expect(latest!.dropActive).toBe(false);\n    expect(latest!.showAdd).toBe(false);\n    expect(preparationCalls).toBe(1);\n    expect(resetCalls).toBe(1);\n  });\n\n  it("rejects a multi-beat browser gesture before creating any candidate", async () => {\n    const fromFile = vi.spyOn(platform.importer, "fromFile");\n    const alertSpy = vi.spyOn(dialog, "appAlert").mockResolvedValue(undefined as any);\n    await renderHarness();\n\n    const first = new File(["a"], "one.mp3", { type: "audio/mpeg" });\n    const second = new File(["b"], "two.wav", { type: "audio/wav" });\n    await act(async () => { await latest!.importDroppedBrowserFiles([first, second]); });\n\n    expect(fromFile).not.toHaveBeenCalled();\n    expect(alertSpy).toHaveBeenCalledWith({\n      title: "Drop one beat at a time",\n      message: "BeatGaler Web imports one beat per drag action.",\n    });\n    expect(latest!.reviewQueue).toBeNull();\n    expect(preparationCalls).toBe(0);\n    expect(resetCalls).toBe(0);\n  });\n});\n''', encoding="utf-8")

          workflow = Path(".github/workflows/temp-task-7-4-apply.yml")
          if not workflow.exists():
              raise SystemExit("Temporary workflow disappeared before self-cleanup")
          workflow.unlink()
          PY

          git diff --check
          git status --short

      - name: Commit exact implementation tree before validation
        id: implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract browser import entry"
          impl_sha="$(git rev-parse HEAD)"
          echo "sha=$impl_sha" >> "$GITHUB_OUTPUT"
          git diff --check 45ca0eae03d1685a1f938f4beaffb4259097882b.."$impl_sha"

      - name: Run full migration matrix on implementation commit
        id: checks
        continue-on-error: true
        run: node scripts/run-migration-checks-with-logs.mjs

      - name: Upload readable migration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-7-4-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/migration-check-logs/
          if-no-files-found: error
          retention-days: 7

      - name: Stop before publishing if validation failed
        if: steps.checks.outcome == 'failure'
        run: |
          echo "Task 7.4 implementation was not pushed because migration checks failed."
          exit 1

      - name: Publish validated implementation only to test branch
        if: steps.checks.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:v0.9.0-test-noche

      - name: Record task 7.4 completion
        if: steps.checks.outcome == 'success'
        id: docs
        shell: bash
        env:
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
        run: |
          set -euo pipefail
          python <<'PY'
          import os
          from pathlib import Path

          impl = os.environ["IMPLEMENTATION_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          initial = "45ca0eae03d1685a1f938f4beaffb4259097882b"

          roadmap_path = Path("migration/BeatGaler-roadmap-para-trabajar-con-IAs.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          old = "### [ ] 7.4 — Separar la entrada de importación web"
          new = "### [x] 7.4 — Separar la entrada de importación web"
          if roadmap.count(old) != 1:
              raise SystemExit(f"Roadmap 7.4 checkbox expected once, found {roadmap.count(old)}")
          roadmap_path.write_text(roadmap.replace(old, new, 1), encoding="utf-8")

          registro_path = Path("migration/Registro-de-avance.md")
          registro = registro_path.read_text(encoding="utf-8")
          marker = "### Registro — 7.4"
          if marker in registro:
              raise SystemExit("Registro 7.4 already exists; refusing duplicate")
          entry = f'''\n\n{marker}\n\n```\nTarea: 7.4 — Separar la entrada de importación web\nEstado: Terminada\nFecha: 2026-09-08\n\nBase\n\n- Rama: v0.9.0-test-noche\n- SHA inicial: {initial}\n- SHA de implementación validada: {impl}\n- Última tarea verificada: 7.3 — Separar Save All y conflictos\n\nCambio realizado\n\n- Se creó `src/features/import/useBrowserImport.ts` como owner de la recepción de `File` del navegador, filtrado MP3/WAV, regla de un beat por gesto, hidratación de metadata y entrada a Review.\n- `App.tsx` dejó de contener el cuerpo de `importDroppedBrowserFiles` y conserva únicamente el cableado del hook y el gate `platform.capabilities.browserFileImport`.\n- `useImportSaveAll.ts` dejó de exponer `setAudioConflictBatch` / `setDropImportBatch` hacia App y ahora ofrece `resetImportResolutionState()` como conexión semántica para sustituir el batch anterior antes de abrir Review web.\n- Skip/Cancel continúan liberando candidatos mediante `platform.importer.releaseBeat` a través de `useImportReview`; Desktop conserva `browserFileImport=false` y no entra a esta ruta.\n\nAdaptación de pruebas\n\n- Se añadió `tests/component-dom/browserImport.test.tsx` para ejecutar un `File` web, comprobar hidratación/Review y rechazar gestos con más de un beat antes de crear candidato.\n- Se añadió `tests/integration/appBrowserImportExtraction.test.ts` para proteger ownership, gate de capacidad, ausencia de Tauri/invoke en el nuevo hook y liberación de candidatos en Skip/Cancel.\n- `tests/integration/appImportSaveAllExtraction.test.ts` se actualizó para retirar la expectativa del puente temporal de setters y exigir el reset semántico.\n\nArchivos afectados\n\n- `src/App.tsx`\n- `src/features/import/useBrowserImport.ts`\n- `src/features/import/useImportSaveAll.ts`\n- `tests/component-dom/browserImport.test.tsx`\n- `tests/integration/appBrowserImportExtraction.test.ts`\n- `tests/integration/appImportSaveAllExtraction.test.ts`\n- `migration/BeatGaler-roadmap-para-trabajar-con-IAs.md`\n- `migration/Registro-de-avance.md`\n- `migration/BeatGaler-agent-state.md`\n\nComprobaciones ejecutadas\n\n- GitHub Actions `Temporary task 7.4 apply` / run {run_id}: aplicación, commit local de implementación y matriz sobre el árbol exacto de `{impl}`.\n- `git diff --check {initial}..{impl}` — PASS.\n- `npm run test:typecheck` — PASS.\n- `npm run test:unit:ts` — PASS.\n- `npm run test:component:dom` — PASS.\n- `npm run test:integration` — PASS.\n- `npm run test:regressions` — PASS.\n- `npm run build:web` — PASS.\n- `npm run build` — PASS.\n\nComprobaciones no ejecutadas\n\n- `npm run check` — no ejecutado como wrapper; los siete checks aplicables se ejecutaron individualmente mediante `scripts/run-migration-checks-with-logs.mjs`.\n\nPrueba manual\n\n- No ejecutada ni inventada. Para esta extracción, la conducta web requerida quedó cubierta por la prueba DOM del `File` web, las pruebas existentes de Save/Skip/Cancel, el contrato estático de ausencia de invocaciones nativas y ambos builds.\n- Comprobación manual opcional: en Web, arrastrar un MP3/WAV y confirmar que abre Review; guardar y verificar que entra a biblioteca; repetir y cancelar para confirmar que no deja candidato; arrastrar dos audios juntos y confirmar que se rechaza el gesto.\n\nPendientes / fuera de alcance\n\n- 8.1 — Separar detección del destino. No iniciada.\n- La recepción HTML completa y la recepción nativa siguen en App para 8.2/8.3; no se movieron en 7.4.\n\nRiesgos previos relevantes\n\n- Ningún riesgo nuevo de producto quedó abierto por 7.4.\n\nHerramientas temporales restantes\n\n- Ninguna. `.github/workflows/temp-task-7-4-apply.yml` se elimina dentro del mismo commit de implementación antes de ejecutar la matriz.\n\nVeredicto\n\nTerminada. La entrada de importación web tiene owner propio, conserva un beat por gesto, metadata y Review, no introduce invocaciones nativas y mantiene la liberación en Skip/Cancel.\n\nSiguiente tarea\n\n8.1 — Separar detección del destino.\n\nNo iniciada.\n```\n'''
          registro_path.write_text(registro.rstrip() + entry + "\n", encoding="utf-8")
          PY

          git diff --check
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md
          git commit -m "migration: record task 7.4 completion"
          git push origin HEAD:v0.9.0-test-noche
          docs_sha="$(git rev-parse HEAD)"
          echo "sha=$docs_sha" >> "$GITHUB_OUTPUT"

      - name: Write final agent state from observed remote HEAD
        if: steps.checks.outcome == 'success'
        shell: bash
        env:
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
          DOCS_SHA: ${{ steps.docs.outputs.sha }}
        run: |
          set -euo pipefail
          observed="$(git ls-remote origin refs/heads/v0.9.0-test-noche | cut -f1)"
          test "$observed" = "$DOCS_SHA"
          export OBSERVED_HEAD="$observed"
          python <<'PY'
          import os
          from pathlib import Path

          impl = os.environ["IMPLEMENTATION_SHA"]
          observed = os.environ["OBSERVED_HEAD"]
