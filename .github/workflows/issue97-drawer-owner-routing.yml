name: Issue 97 Drawer commit ownership patch

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-97-temp-auth-artwork-resilience-v2
          fetch-depth: 0
      - name: Apply Drawer commit ownership patch
        run: python scripts/issue97-drawer-owner-routing.py
      - name: Commit bounded patch
        run: |
          rm .github/workflows/issue97-drawer-owner-routing.yml scripts/issue97-drawer-owner-routing.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Drawer.tsx .github/workflows/issue97-drawer-owner-routing.yml scripts/issue97-drawer-owner-routing.py
          git commit -m "fix(web): make Drawer commit ownership explicit"
          git push origin HEAD:issue-97-temp-auth-artwork-resilience-v2
