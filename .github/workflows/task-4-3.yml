name: Temporary Task 4.3

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/task-4-3.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply task 4.3 extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          app = app_path.read_text()

          import_anchor = 'import { usePlaybackController } from "./features/playback/usePlaybackController";\n'
          assert import_anchor in app
          app = app.replace(import_anchor, import_anchor + 'import { usePlaybackQueue } from "./features/playback/usePlaybackQueue";\n', 1)

          state_block = '''  const [shuffleEnabled, setShuffleEnabled] = useState(false);\n  const [repeatMode, setRepeatMode] = useState<"off" | "all" | "one">("off");\n  const [showQueue, setShowQueue] = useState(false);\n  const [queueIds, setQueueIds] = useState<string[]>([]);\n  const lastHandledEndedSeqRef = useRef(0);\n\n'''
          assert state_block in app
          app = app.replace(state_block, '', 1)

          add_queue_block = '''  const addToQueue = useCallback((beat: Beat) => {\n    setQueueIds((ids) => (ids.includes(beat.id) ? ids : [...ids, beat.id]));\n  }, []);\n\n'''
          assert add_queue_block in app
          app = app.replace(add_queue_block, '', 1)

          app = app.replace('        setQueueIds(q => q.filter(id => !deleted.has(id)));\n', '', 1)
          app = app.replace('      setQueueIds(ids => ids.filter(id => id !== beat.id));\n', '', 1)
          app = app.replace('        setShowQueue(false);', '        closeQueue();', 1)

          displayed_anchor = '  const displayedBeats = filteredBeats.filter(beat => revealedBeatIds.has(beat.id));\n\n'
          assert displayed_anchor in app
          queue_call = '''  const {\n    shuffleEnabled,\n    repeatMode,\n    showQueue,\n    queuedBeats,\n    addToQueue,\n    handleNext,\n    handlePrev,\n    closeQueue,\n    toggleQueue,\n    toggleShuffle,\n    cycleRepeat,\n    playQueueIndex,\n  } = usePlaybackQueue({\n    beats,\n    displayedBeats,\n    playingId: audio.playingId,\n    progress: audio.progress,\n    endedSeq: audio.endedSeq,\n    handlePlay,\n    seek,\n    releaseFile,\n  });\n\n'''
          app = app.replace(displayed_anchor, displayed_anchor + queue_call, 1)

          start_marker = '  // The player/queue must never outlive the authoritative gallery.'
          end_marker = '  const currentBeat = beats.find(b => b.id === audio.playingId);'
          start = app.index(start_marker)
          end = app.index(end_marker, start)
          app = app[:start] + app[end:]

          app = app.replace('          onToggleShuffle={() => setShuffleEnabled((v) => !v)}', '          onToggleShuffle={toggleShuffle}', 1)
          app = app.replace('          onCycleRepeat={() => setRepeatMode((m) => (m === "off" ? "all" : m === "all" ? "one" : "off"))}', '          onCycleRepeat={cycleRepeat}', 1)
          app = app.replace('          onToggleQueue={() => setShowQueue((v) => !v)}', '          onToggleQueue={toggleQueue}', 1)
          old_play_queue = '''          onPlayQueueIndex={(index) => {\n            const target = queuedBeats[index];\n            if (!target) return;\n            handlePlay(target);\n            setQueueIds((ids) => ids.filter((id) => id !== target.id));\n          }}'''
          assert old_play_queue in app
          app = app.replace(old_play_queue, '          onPlayQueueIndex={playQueueIndex}', 1)

          forbidden = ['setQueueIds(', 'setShuffleEnabled(', 'setRepeatMode(', 'lastHandledEndedSeqRef']
          for token in forbidden:
              assert token not in app, token
          app_path.write_text(app)
          PY

          mkdir -p src/features/playback
          cat > src/features/playback/usePlaybackQueue.ts <<'EOF'
          import { useCallback, useEffect, useMemo, useRef, useState } from "react";
          import type { Beat } from "../../types";

          type RepeatMode = "off" | "all" | "one";

          type PlaybackQueueOptions = {
            beats: Beat[];
            displayedBeats: Beat[];
            playingId: string | null;
            progress: number;
            endedSeq: number;
            handlePlay: (beat: Beat) => void;
            seek: (progress: number) => void;
            releaseFile: () => void;
          };

          export function usePlaybackQueue({
            beats,
            displayedBeats,
            playingId,
            progress,
            endedSeq,
            handlePlay,
            seek,
            releaseFile,
          }: PlaybackQueueOptions) {
            const [shuffleEnabled, setShuffleEnabled] = useState(false);
            const [repeatMode, setRepeatMode] = useState<RepeatMode>("off");
            const [showQueue, setShowQueue] = useState(false);
            const [queueIds, setQueueIds] = useState<string[]>([]);
            const lastHandledEndedSeqRef = useRef(0);

            const closeQueue = useCallback(() => setShowQueue(false), []);
            const toggleQueue = useCallback(() => setShowQueue(value => !value), []);
            const toggleShuffle = useCallback(() => setShuffleEnabled(value => !value), []);
            const cycleRepeat = useCallback(() => {
              setRepeatMode(mode => mode === "off" ? "all" : mode === "all" ? "one" : "off");
            }, []);

            const addToQueue = useCallback((beat: Beat) => {
              setQueueIds(ids => ids.includes(beat.id) ? ids : [...ids, beat.id]);
            }, []);

            useEffect(() => {
              const liveIds = new Set(beats.map(beat => beat.id));
              setQueueIds(ids => ids.filter(id => liveIds.has(id)));
              if (playingId && !liveIds.has(playingId)) releaseFile();
              if (beats.length === 0) setShowQueue(false);
            }, [beats, playingId, releaseFile]);

            const playbackQueue = useMemo(() => {
              if (!playingId) return displayedBeats;
              if (displayedBeats.some(beat => beat.id === playingId)) return displayedBeats;
              return beats;
            }, [playingId, displayedBeats, beats]);

            const currentQueueIndex = useMemo(
              () => playbackQueue.findIndex(beat => beat.id === playingId),
              [playbackQueue, playingId],
            );

            const playFromQueueIndex = useCallback((index: number) => {
              if (index < 0 || index >= playbackQueue.length) return;
              const target = playbackQueue[index];
              if (target) handlePlay(target);
            }, [playbackQueue, handlePlay]);

            const handleNext = useCallback((fromEnded = false) => {
              if (beats.length === 0) return;
              if (queueIds.length > 0) {
                const nextId = queueIds[0];
                const nextBeat = beats.find(beat => beat.id === nextId);
                setQueueIds(ids => ids.slice(1));
                if (nextBeat) {
                  handlePlay(nextBeat);
                  return;
                }
              }

              if (playbackQueue.length === 0) return;
              if (currentQueueIndex === -1) {
                playFromQueueIndex(0);
                return;
              }

              if (fromEnded && repeatMode === "one") {
                playFromQueueIndex(currentQueueIndex);
                return;
              }

              if (shuffleEnabled) {
                if (playbackQueue.length === 1) {
                  if (!fromEnded || repeatMode !== "off") playFromQueueIndex(0);
                  return;
                }
                let nextIndex = currentQueueIndex;
                while (nextIndex === currentQueueIndex) {
                  nextIndex = Math.floor(Math.random() * playbackQueue.length);
                }
                playFromQueueIndex(nextIndex);
                return;
              }

              let nextIndex = currentQueueIndex + 1;
              if (nextIndex >= playbackQueue.length) {
                if (fromEnded && repeatMode === "off") return;
                nextIndex = 0;
              }
              playFromQueueIndex(nextIndex);
            }, [queueIds, beats, handlePlay, playbackQueue, currentQueueIndex, repeatMode, shuffleEnabled, playFromQueueIndex]);

            const handlePrev = useCallback(() => {
              if (beats.length === 0 || playbackQueue.length === 0) return;
              if (progress > 0.05) {
                seek(0);
                return;
              }
              if (shuffleEnabled && playbackQueue.length > 1) {
                let prevIndex = currentQueueIndex;
                while (prevIndex === currentQueueIndex) {
                  prevIndex = Math.floor(Math.random() * playbackQueue.length);
                }
                playFromQueueIndex(prevIndex);
                return;
              }
              if (currentQueueIndex <= 0) {
                playFromQueueIndex(playbackQueue.length - 1);
                return;
              }
              playFromQueueIndex(currentQueueIndex - 1);
            }, [beats.length, playbackQueue, progress, seek, shuffleEnabled, currentQueueIndex, playFromQueueIndex]);

            useEffect(() => {
              if (endedSeq === 0) return;
              if (endedSeq <= lastHandledEndedSeqRef.current) return;
              lastHandledEndedSeqRef.current = endedSeq;
              handleNext(true);
            }, [endedSeq, handleNext]);

            const queuedBeats = useMemo(() => {
              const map = new Map(beats.map(beat => [beat.id, beat] as const));
              return queueIds.map(id => map.get(id)).filter(Boolean) as Beat[];
            }, [queueIds, beats]);

            const playQueueIndex = useCallback((index: number) => {
              const target = queuedBeats[index];
              if (!target) return;
              handlePlay(target);
              setQueueIds(ids => ids.filter(id => id !== target.id));
            }, [queuedBeats, handlePlay]);

            return {
              shuffleEnabled,
              repeatMode,
              showQueue,
              queuedBeats,
              addToQueue,
              handleNext,
              handlePrev,
              closeQueue,
              toggleQueue,
              toggleShuffle,
              cycleRepeat,
              playQueueIndex,
            };
          }
          EOF

          cat > tests/integration/appPlaybackQueueExtraction.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { resolve } from "node:path";
          import { describe, expect, it } from "vitest";

          const appSource = readFileSync(resolve(process.cwd(), "src/App.tsx"), "utf8");
          const queueSource = readFileSync(resolve(process.cwd(), "src/features/playback/usePlaybackQueue.ts"), "utf8");

          describe("App playback queue extraction", () => {
            it("moves explicit queue, navigation, shuffle, repeat and ended handling out of App", () => {
              expect(appSource).toContain('usePlaybackQueue({');
              expect(appSource).not.toContain('setQueueIds(');
              expect(appSource).not.toContain('lastHandledEndedSeqRef');
              expect(appSource).not.toContain('Math.random() * playbackQueue.length');
              expect(queueSource).toContain('if (queueIds.length > 0)');
              expect(queueSource).toContain('if (fromEnded && repeatMode === "one")');
              expect(queueSource).toContain('if (shuffleEnabled)');
              expect(queueSource).toContain('if (endedSeq <= lastHandledEndedSeqRef.current) return;');
              expect(queueSource).toContain('setQueueIds(ids => ids.filter(id => liveIds.has(id)))');
              expect(queueSource).toContain('if (displayedBeats.some(beat => beat.id === playingId)) return displayedBeats;');
            });
          });
          EOF
      - name: Checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p migration-check-logs
          : > migration-check-logs/summary.txt
          failed=0
          run_check() { name="$1"; shift; echo "== $name ==" | tee -a migration-check-logs/summary.txt; if "$@" > "migration-check-logs/$name.log" 2>&1; then echo "PASS $name" | tee -a migration-check-logs/summary.txt; else echo "FAIL $name" | tee -a migration-check-logs/summary.txt; failed=1; fi; }
          run_check diff-check git diff --check
          run_check typecheck npm run test:typecheck
          run_check unit-ts npm run test:unit:ts
          run_check component-dom npm run test:component:dom
          run_check integration npm run test:integration
          run_check regressions npm run test:regressions
          run_check build-web npm run build:web
          run_check build npm run build
          exit "$failed"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-4-3-${{ github.run_id }}
          path: migration-check-logs/
      - name: Commit verified implementation
        if: success()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/features/playback/usePlaybackQueue.ts tests/integration/appPlaybackQueueExtraction.test.ts
          git commit -m "refactor(app): extract playback queue"
          git push origin HEAD:v0.9.0-test-noche
