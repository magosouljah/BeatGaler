name: Issue #97 integration diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: issue97-integration-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  issue97_integration_file:
    name: ${{ matrix.test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test:
          - tests/integration/issue97DrawerWebRoutingContract.test.ts
          - tests/integration/issue97IndexPriority.test.ts
          - tests/integration/issue97PlaybackOptimization.test.ts
          - tests/integration/issue97Resilience.test.ts
          - tests/integration/issue97RuntimeTraceContract.test.ts
          - tests/integration/issue97RuntimeWebFollowup.test.ts
          - tests/integration/issue97StartupRoutingRuntime.test.ts
          - tests/integration/issue97WebRoutingContract.test.ts
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked npm graph
        run: npm ci

      - name: Run isolated integration file
        run: npx vitest run "${{ matrix.test }}" --environment jsdom
