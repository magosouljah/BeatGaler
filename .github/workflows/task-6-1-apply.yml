name: Task 6.1 Apply

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/task-6-1-apply.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply task and run checks
        shell: bash
        run: |
          set +e
          mkdir -p migration-check-logs
          : > migration-check-logs/summary.txt
          failed=0

          # Apply the extraction, then only the fixes demonstrated by earlier check artifacts.
          python .github/task-6-1-apply.py > migration-check-logs/apply.log 2>&1
          apply_status=$?
          if [ "$apply_status" -eq 0 ]; then
            python .github/task-6-1-evidenced-fixes.py >> migration-check-logs/apply.log 2>&1
            apply_status=$?
          fi
          if [ "$apply_status" -eq 0 ]; then
            echo "PASS apply" | tee -a migration-check-logs/summary.txt
          else
            echo "FAIL apply exit=${apply_status}" | tee -a migration-check-logs/summary.txt
            cat migration-check-logs/apply.log
            exit "$apply_status"
          fi

          run_check() {
            name="$1"
            shift
            log="migration-check-logs/${name}.log"
            "$@" >"$log" 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "PASS ${name}" | tee -a migration-check-logs/summary.txt
            else
              echo "FAIL ${name} exit=${status}" | tee -a migration-check-logs/summary.txt
              failed=1
            fi
          }

          run_check npm-ci npm ci
          run_check diff-check git diff --check
          run_check typecheck npm run test:typecheck
          run_check unit-ts npm run test:unit:ts
          run_check component-dom npm run test:component:dom
          run_check integration npm run test:integration
          run_check regressions npm run test:regressions
          run_check build-web npm run build:web
          run_check build npm run build

          cat migration-check-logs/summary.txt
          exit "$failed"

      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-6-1-${{ github.run_id }}
          path: migration-check-logs/
          if-no-files-found: warn

      - name: Commit verified task 6.1 implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/task-6-1-apply.yml
          rm .github/task-6-1-apply.py
          rm .github/task-6-1-evidenced-fixes.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(app): extract beat downloads"
          git push origin HEAD:v0.9.0-test-noche

# Retry after moving the remaining download guards to useBeatDownloads owner.
