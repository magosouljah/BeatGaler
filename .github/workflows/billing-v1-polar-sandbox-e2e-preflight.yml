name: Billing V1 Polar Sandbox E2E Preflight Only

on:
  pull_request:
    paths:
      - 'cloud-server/scripts/polar-sandbox-daily-*.cjs'
      - 'cloud-server/scripts/polar-sandbox-e2e-guard.cjs'
      - 'cloud-server/billing-polar-*.js'
      - 'cloud-server/tests/billing-polar-daily*.cjs'
      - 'cloud-server/package.json'
      - '.github/workflows/billing-v1-polar-sandbox-e2e-preflight.yml'
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact billing/v1-policy SHA that will later be tested against real Polar Sandbox
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight-only-no-polar-pass:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout selected branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: billing/v1-policy

      - name: Assert exact requested HEAD
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_head || github.event.pull_request.head.sha }}"
          test "$(git branch --show-current)" = "billing/v1-policy"

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: cloud-server/package-lock.json

      - name: Install locked Cloud dependencies
        working-directory: cloud-server
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run policy, resolver and pinned Polar contracts
        working-directory: cloud-server
        run: npm run test:billing-v1

      - name: Syntax-check the real interactive E2E runner
        working-directory: cloud-server
        run: npm run preflight:polar-sandbox-e2e

      - name: Validate Billing migrations in isolated PostgreSQL
        working-directory: cloud-server
        env:
          BILLING_MIGRATION_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node --test tests/billing-v1-migrations.integration.cjs

      - name: Validate persistent checkout
        working-directory: cloud-server
        env:
          BILLING_CHECKOUT_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:billing-checkout-pg

      - name: Validate durable webhook inbox
        working-directory: cloud-server
        env:
          BILLING_WEBHOOK_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:billing-webhook-pg

      - name: Validate commercial lifecycle
        working-directory: cloud-server
        env:
          BILLING_LIFECYCLE_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:billing-lifecycle-pg

      - name: Validate reconciliation and safe logs
        working-directory: cloud-server
        env:
          BILLING_RECONCILIATION_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:billing-reconciliation-pg

      - name: Validate daily equivalents and resume database identity
        working-directory: cloud-server
        env:
          BILLING_E2E_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node --test tests/billing-polar-daily.integration.cjs

      - name: State preflight limitation explicitly
        run: echo 'PRECHECK PASS only. This workflow never proves a real Polar checkout, payment, webhook delivery, refund, failed payment, recovery, or cancellation journey.'
