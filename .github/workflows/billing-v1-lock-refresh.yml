name: Billing V1 Polar Lock Refresh

on:
  push:
    branches:
      - 'billing/v1-policy'
    paths:
      - 'cloud-server/package.json'
      - '.github/workflows/billing-v1-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-cloud-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: Regenerate Cloud lockfile from pinned manifest
        working-directory: cloud-server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prove locked install and pinned Polar SDK entry
        working-directory: cloud-server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const sdk=require('@polar-sh/sdk/2026-04'); if(typeof sdk.createPolar!=='function'||typeof sdk.webhooks?.validateEvent!=='function') process.exit(1)"
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- cloud-server/package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud-server/package-lock.json
          git commit -m 'build(billing): lock Polar sandbox SDK'
          git push origin HEAD:billing/v1-policy
