name: Temporary Task 4.1 Apply

on:
  push:
    branches: [v0.9.0-test-noche]
    paths: [.github/workflows/task-4-1-apply.yml]
  workflow_dispatch:

concurrency:
  group: task-4-1-v0.9.0-test-noche
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply-verify-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply task 4.1
        run: node scripts/apply-task-4-1.mjs
      - name: Prepare logs
        run: mkdir -p migration-check-logs
      - name: Diff check
        id: diffcheck
        continue-on-error: true
        run: set -o pipefail; git diff --check 2>&1 | tee migration-check-logs/git-diff-check.log
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: set -o pipefail; npm run test:typecheck 2>&1 | tee migration-check-logs/test-typecheck.log
      - name: Unit TypeScript
        id: unit
        continue-on-error: true
        run: set -o pipefail; npm run test:unit:ts 2>&1 | tee migration-check-logs/test-unit-ts.log
      - name: Component DOM
        id: component
        continue-on-error: true
        run: set -o pipefail; npm run test:component:dom 2>&1 | tee migration-check-logs/test-component-dom.log
      - name: Integration
        id: integration
        continue-on-error: true
        run: set -o pipefail; npm run test:integration 2>&1 | tee migration-check-logs/test-integration.log
      - name: Regressions
        id: regressions
        continue-on-error: true
        run: set -o pipefail; npm run test:regressions 2>&1 | tee migration-check-logs/test-regressions.log
      - name: Build web
        id: buildweb
        continue-on-error: true
        run: set -o pipefail; npm run build:web 2>&1 | tee migration-check-logs/build-web.log
      - name: Build
        id: build
        continue-on-error: true
        run: set -o pipefail; npm run build 2>&1 | tee migration-check-logs/build.log
      - name: Write summary
        if: always()
        run: |
          cat > migration-check-logs/summary.txt <<EOF
          git diff --check: ${{ steps.diffcheck.outcome }}
          npm run test:typecheck: ${{ steps.typecheck.outcome }}
          npm run test:unit:ts: ${{ steps.unit.outcome }}
          npm run test:component:dom: ${{ steps.component.outcome }}
          npm run test:integration: ${{ steps.integration.outcome }}
          npm run test:regressions: ${{ steps.regressions.outcome }}
          npm run build:web: ${{ steps.buildweb.outcome }}
          npm run build: ${{ steps.build.outcome }}
          EOF
      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-4-1-${{ github.run_id }}
          path: migration-check-logs/
      - name: Fail if verification failed
        if: steps.diffcheck.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.unit.outcome != 'success' || steps.component.outcome != 'success' || steps.integration.outcome != 'success' || steps.regressions.outcome != 'success' || steps.buildweb.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/apply-task-4-1.mjs .github/workflows/task-4-1-apply.yml
          git add src/App.tsx src/features/artwork/useArtworkHydration.ts tests/component-dom/artworkHydration.test.tsx tests/integration/artworkHydrationExtraction.test.ts
          git commit -m "refactor(app): extract artwork hydration"
          git push origin HEAD:v0.9.0-test-noche
          echo "IMPL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Close migration state
        env:
          RUN_ID: ${{ github.run_id }}
          INITIAL_SHA: ab25f9090d9e7ba322748b2ba344fa848fe34e9e
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          roadmap = Path('migration/BeatGaler-roadmap-para-trabajar-con-IAs.md')
          text = roadmap.read_text()
          needle = '### [ ] 4.1 — Separar la carga de portadas'
          if needle not in text: raise SystemExit('4.1 roadmap checkbox not found')
          roadmap.write_text(text.replace(needle, '### [x] 4.1 — Separar la carga de portadas', 1))

          impl = os.environ['IMPL_SHA']
          run_id = os.environ['RUN_ID']
          initial = os.environ['INITIAL_SHA']
          state = Path('migration/BeatGaler-agent-state.md')
          state.write_text(f'''# BeatGaler Agent State\n\n## Seguridad de la ronda nocturna\n\n- Rama exclusiva: `v0.9.0-test-noche`\n- Prohibido modificar o avanzar `integration-v0.9.0-alpha.2`, `main` o ramas `app-tsx-*`.\n- Prohibido merge, rebase, cherry-pick, fast-forward hacia otras ramas o PR de integración durante la prueba.\n- Todos los commits y pushes de la ronda deben quedar únicamente en `v0.9.0-test-noche`.\n\n## Estado operativo\n\n- Tarea trabajada: `4.1 — Separar la carga de portadas`\n- Estado: `Terminada`\n- Última tarea terminada: `4.1 — Separar la carga de portadas`\n- SHA inicial de esta ejecución: `{initial}`\n- SHA final de implementación verificada: `{impl}`\n- Pendientes concretos: ninguno de 4.1.\n- Comprobaciones pendientes: ninguna necesaria para reabrir 4.1.\n- Siguiente tarea: `4.2 — Separar preparación y control del audio`\n- Estado de la siguiente tarea: `Pendiente`\n- Fecha de ejecución: `2026-09-08`\n\n## Evidencia de cierre de 4.1\n\n- Implementación: hidratación y reutilización de portadas extraídas a `src/features/artwork/useArtworkHydration.ts`.\n- GitHub Actions: `Temporary Task 4.1 Apply`, run `{run_id}`.\n- Checks verdes requeridos: diff check, typecheck, unit TypeScript, component DOM, integration, regressions, build web y build.\n- La hidratación visual no llama guardado de metadata, commit de biblioteca ni sincronización cloud.\n\n## Regla de actualización\n\nAl cerrar cada ejecución:\n- si la tarea queda `Terminada`, marcar solo su `[x]` en el roadmap, agregar su registro al final de `Registro-de-avance.md` y dejar aquí la siguiente tarea como `Pendiente`;\n- si queda `En curso` o `Por verificar`, mantener esa misma tarea como tarea actual y registrar exactamente lo que falta;\n- nunca iniciar una segunda tarea en la misma ejecución.\n''')

          log = Path('migration/Registro-de-avance.md')
          existing = log.read_text()
          if '### Registro — 4.1' in existing: raise SystemExit('4.1 already registered')
          entry = f'''\n\n### Registro — 4.1\n\n```\nTarea: 4.1 — Separar la carga de portadas\nEstado: Terminada\nFecha: 2026-09-08\n\nBase\n\n- Rama: v0.9.0-test-noche\n- SHA inicial: {initial}\n- Última tarea verificada: 3.4 — Separar selección y reordenamiento\n\nCambio realizado\n\n- Se extrajo `ensureArtworkReady` de `App.tsx` a `src/features/artwork/useArtworkHydration.ts`.\n- El nuevo hook posee las promesas de hidratación, deduplicación, lectura/escritura del thumbnail cache, decodificación y carga por `platform.media.loadArtwork`.\n- Se conservó el modo cache-only y el fallback de beats sin artwork.\n- `App.tsx` conserva solo la composición necesaria para actualizar fingerprints de snapshots tras una hidratación de red, evitando que una carga visual parezca una edición.\n- Las limpiezas previas del mapa de promesas ahora llaman `clearArtworkHydration`.\n\nAdaptación de pruebas\n\n- `tests/component-dom/artworkHydration.test.tsx` cubre caché local sin red, deduplicación de carga remota y modo cache-only.\n- `tests/integration/artworkHydrationExtraction.test.ts` comprueba ownership fuera de App y que el hook no invoque guardado/commit cloud.\n\nArchivos afectados\n\n- src/App.tsx\n- src/features/artwork/useArtworkHydration.ts\n- tests/component-dom/artworkHydration.test.tsx\n- tests/integration/artworkHydrationExtraction.test.ts\n- migration/BeatGaler-roadmap-para-trabajar-con-IAs.md\n- migration/Registro-de-avance.md\n- migration/BeatGaler-agent-state.md\n\nComprobaciones ejecutadas\n\n- GitHub Actions `Temporary Task 4.1 Apply`, run {run_id} — SUCCESS.\n- npm ci — OK.\n- git diff --check — OK.\n- npm run test:typecheck — OK.\n- npm run test:unit:ts — OK.\n- npm run test:component:dom — OK.\n- npm run test:integration — OK.\n- npm run test:regressions — OK.\n- npm run build:web — OK.\n- npm run build — OK.\n\nComprobaciones no ejecutadas\n\n- npm run check — no requerido para esta extracción; sus checks relevantes se ejecutaron individualmente.\n- E2E import/download/recovery — no aplican a hidratación de artwork.\n- Pruebas nativas físicas Windows/macOS — no necesarias: no cambiaron adapters ni comandos nativos.\n\nPrueba manual\n\n- No requerida como bloqueo de cierre; comportamiento de hidratación/caché y ausencia de side effects de guardado están cubiertos directamente.\n\nPendientes / fuera de alcance\n\n- No se inició 4.2 ni se modificó playback.\n- El riesgo previo de `handleRemoveBulk` permanece fuera de alcance.\n\nRiesgos previos relevantes\n\n- Ninguno nuevo causado por 4.1.\n\nHerramientas temporales restantes\n\n- Ninguna: workflow y applier temporales se eliminaron en el commit verificado.\n\nVeredicto\n\nTerminada.\n\nLa carga visual de portadas conserva caché, decodificación, reutilización y carga por plataforma sin convertir hidratación en edición o commit cloud.\n\nSiguiente tarea\n\n4.2 — Separar preparación y control del audio.\n\nNo iniciada.\n```'''
          log.write_text(existing.rstrip() + entry + '\n')
          PY
          git diff --check
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md migration/BeatGaler-agent-state.md
          git commit -m "chore(migration): close task 4.1 state"
          git push origin HEAD:v0.9.0-test-noche
