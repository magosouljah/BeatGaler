name: Release - Desktop Updater
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v0.8.0"
        required: true
        type: string
      windows_run_id:
        description: "Successful Build - Windows run ID"
        required: true
        type: string
      macos_run_id:
        description: "Successful Build - macOS run ID"
        required: true
        type: string
      release_notes:
        description: "Short release notes"
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-desktop-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release-desktop-updater:
    name: Publish verified Desktop release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify selected build runs and bind source SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          MACOS_RUN_ID: ${{ inputs.macos_run_id }}
        run: |
          set -euo pipefail
          WIN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WINDOWS_RUN_ID")"
          MAC_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MACOS_RUN_ID")"
          WIN_NAME="$(printf '%s' "$WIN_JSON" | jq -r '.name')"
          MAC_NAME="$(printf '%s' "$MAC_JSON" | jq -r '.name')"
          WIN_RESULT="$(printf '%s' "$WIN_JSON" | jq -r '.conclusion')"
          MAC_RESULT="$(printf '%s' "$MAC_JSON" | jq -r '.conclusion')"
          WIN_SHA="$(printf '%s' "$WIN_JSON" | jq -r '.head_sha')"
          MAC_SHA="$(printf '%s' "$MAC_JSON" | jq -r '.head_sha')"
          test "$WIN_NAME" = "Build - Windows"
          test "$MAC_NAME" = "Build - macOS"
          test "$WIN_RESULT" = "success"
          test "$MAC_RESULT" = "success"
          if [ "$WIN_SHA" != "$MAC_SHA" ]; then
            echo "::error::Windows and macOS builds came from different commits."
            echo "Windows: $WIN_SHA"
            echo "macOS:   $MAC_SHA"
            exit 1
          fi
          test -n "$WIN_SHA"
          echo "RELEASE_SOURCE_SHA=$WIN_SHA" >> "$GITHUB_ENV"
          echo "Verified shared source commit: $WIN_SHA"

      - name: Pin release tools to verified build SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_SOURCE_SHA"
          git checkout --detach "$RELEASE_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          echo "Release tools pinned to artifact source SHA: $RELEASE_SOURCE_SHA"

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Load canonical release manifest
        run: node scripts/release-manifest.mjs github-env

      - name: Download Windows build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: BeatGaler-Windows-x64
          path: release-input/windows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.windows_run_id }}

      - name: Download macOS build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: BeatGaler-macOS-Universal
          path: release-input/macos
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.macos_run_id }}

      - name: Verify versions, provenance and prepare Desktop release
        shell: bash
        run: |
          set -euo pipefail
          WIN_VERSION="$(tr -d '\r\n' < release-input/windows/VERSION)"
          MAC_VERSION="$(tr -d '\r\n' < release-input/macos/VERSION)"
          if [ "$WIN_VERSION" != "$MAC_VERSION" ]; then
            echo "::error::Windows version ($WIN_VERSION) differs from macOS version ($MAC_VERSION)."
            exit 1
          fi
          if [ "v$WIN_VERSION" != "${{ inputs.release_tag }}" ]; then
            echo "::error::Build version ($WIN_VERSION) does not match release tag (${{ inputs.release_tag }})."
            exit 1
          fi
          SOURCE_VERSION="$(tr -d '\r\n' < VERSION)"
          if [ "$SOURCE_VERSION" != "$WIN_VERSION" ]; then
            echo "::error::Pinned source VERSION ($SOURCE_VERSION) differs from artifacts ($WIN_VERSION)."
            exit 1
          fi

          WIN_EXE="$(find release-input/windows -type f -name '*.exe' | head -n 1)"
          WIN_SIG="${WIN_EXE}.sig"
          WIN_PROVENANCE="$(find release-input/windows -type f -name 'runtime-provenance-windows.json' | head -n 1)"
          WIN_SUMS="$(find release-input/windows -type f -name 'SHA256SUMS-Windows.txt' | head -n 1)"
          MAC_DMG="$(find release-input/macos -type f -name '*.dmg' | head -n 1)"
          MAC_UPDATER="$(find release-input/macos -type f -name '*.app.tar.gz' | head -n 1)"
          MAC_SIG="${MAC_UPDATER}.sig"
          MAC_PROVENANCE="$(find release-input/macos -type f -name 'runtime-provenance-macos.json' | head -n 1)"
          MAC_SUMS="$(find release-input/macos -type f -name 'SHA256SUMS-macOS.txt' | head -n 1)"

          for file in "$WIN_EXE" "$WIN_SIG" "$WIN_PROVENANCE" "$WIN_SUMS" "$MAC_DMG" "$MAC_UPDATER" "$MAC_SIG" "$MAC_PROVENANCE" "$MAC_SUMS"; do
            test -n "$file" && test -s "$file"
          done

          WIN_PROVENANCE_SHA="$(jq -r '.gitSha // empty' "$WIN_PROVENANCE")"
          MAC_PROVENANCE_SHA="$(jq -r '.gitSha // empty' "$MAC_PROVENANCE")"
          test "$WIN_PROVENANCE_SHA" = "$RELEASE_SOURCE_SHA"
          test "$MAC_PROVENANCE_SHA" = "$RELEASE_SOURCE_SHA"

          verify_digest() {
            local sums="$1"
            local file="$2"
            local expected actual
            expected="$(awk -v name="$(basename "$file")" '$2 == name {print $1; exit}' "$sums")"
            actual="$(sha256sum "$file" | awk '{print $1}')"
            test -n "$expected"
            test "$expected" = "$actual"
          }
          verify_digest "$WIN_SUMS" "$WIN_EXE"
          verify_digest "$WIN_SUMS" "$WIN_SIG"
          verify_digest "$MAC_SUMS" "$MAC_DMG"
          verify_digest "$MAC_SUMS" "$MAC_UPDATER"
          verify_digest "$MAC_SUMS" "$MAC_SIG"

          mkdir -p release-assets
          WIN_NAME="Beat.Galer_${WIN_VERSION}_x64-setup.exe"
          MAC_DMG_NAME="Beat.Galer_${WIN_VERSION}_universal.dmg"
          MAC_UPDATER_NAME="Beat.Galer_${WIN_VERSION}_universal.app.tar.gz"
          cp "$WIN_EXE" "release-assets/$WIN_NAME"
          cp "$WIN_SIG" "release-assets/$WIN_NAME.sig"
          cp "$MAC_DMG" "release-assets/$MAC_DMG_NAME"
          cp "$MAC_UPDATER" "release-assets/$MAC_UPDATER_NAME"
          cp "$MAC_SIG" "release-assets/$MAC_UPDATER_NAME.sig"
          cp "$WIN_PROVENANCE" release-assets/runtime-provenance-windows.json
          cp "$MAC_PROVENANCE" release-assets/runtime-provenance-macos.json

          WIN_URL="https://github.com/${BEATGALER_PUBLIC_RELEASE_REPO}/releases/download/${{ inputs.release_tag }}/$WIN_NAME"
          MAC_URL="https://github.com/${BEATGALER_PUBLIC_RELEASE_REPO}/releases/download/${{ inputs.release_tag }}/$MAC_UPDATER_NAME"

          node scripts/updater-manifest.mjs generate \
            --version "$WIN_VERSION" \
            --platform windows-x86_64 \
            --artifact "release-assets/$WIN_NAME" \
            --signature "release-assets/$WIN_NAME.sig" \
            --url "$WIN_URL" \
            --output release-assets/latest-windows.json \
            --notes "Beat Galer $WIN_VERSION"
          node scripts/updater-manifest.mjs generate \
            --version "$WIN_VERSION" \
            --platform darwin-aarch64 \
            --artifact "release-assets/$MAC_UPDATER_NAME" \
            --signature "release-assets/$MAC_UPDATER_NAME.sig" \
            --url "$MAC_URL" \
            --output release-assets/latest-arm.json \
            --notes "Beat Galer $WIN_VERSION" \
            --merge-existing release-assets/latest-windows.json
          node scripts/updater-manifest.mjs generate \
            --version "$WIN_VERSION" \
            --platform darwin-x86_64 \
            --artifact "release-assets/$MAC_UPDATER_NAME" \
            --signature "release-assets/$MAC_UPDATER_NAME.sig" \
            --url "$MAC_URL" \
            --output release-assets/latest.json \
            --notes "Beat Galer $WIN_VERSION" \
            --merge-existing release-assets/latest-arm.json
          node scripts/updater-manifest.mjs validate-release release-assets/latest.json
          rm release-assets/latest-windows.json release-assets/latest-arm.json

          (cd release-assets && sha256sum \
            "$WIN_NAME" "$WIN_NAME.sig" \
            "$MAC_DMG_NAME" "$MAC_UPDATER_NAME" "$MAC_UPDATER_NAME.sig" \
            latest.json runtime-provenance-windows.json runtime-provenance-macos.json \
            | sort > SHA256SUMS)

      - name: Create immutable public Desktop Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          NOTES="${{ inputs.release_notes }}"
          if [ -z "$NOTES" ]; then NOTES="Beat Galer $TAG"; fi
          if gh release view "$TAG" --repo "$BEATGALER_PUBLIC_RELEASE_REPO" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. BeatGaler release assets are immutable; use a new version/tag."
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$BEATGALER_PUBLIC_RELEASE_REPO" \
            --target "$RELEASE_SOURCE_SHA" \
            --title "Beat Galer $TAG" \
            --notes "$NOTES"
          gh release upload "$TAG" \
            release-assets/*.exe \
            release-assets/*.exe.sig \
            release-assets/*.dmg \
            release-assets/*.app.tar.gz \
            release-assets/*.app.tar.gz.sig \
            release-assets/latest.json \
            release-assets/runtime-provenance-windows.json \
            release-assets/runtime-provenance-macos.json \
            release-assets/SHA256SUMS \
            --repo "$BEATGALER_PUBLIC_RELEASE_REPO"
