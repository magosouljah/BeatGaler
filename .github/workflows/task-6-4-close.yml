name: Task 6.4 Close

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-6-4-close.yml

permissions:
  contents: write

concurrency:
  group: app-tsx-nightly-v0.9.0-test-noche
  cancel-in-progress: false

jobs:
  close-and-revalidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Verify validated implementation and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v0.9.0-test-noche"
          git merge-base --is-ancestor f9b7029a807966837c39e0844dac03c063024ce3 HEAD
          test -f src/features/cloud/useCloudUploadQueue.ts
          grep -q 'useCloudUploadQueue({' src/App.tsx
          test -f .github/task-6-4-close.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Prepare final documentation and remove all task 6.4 tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration-check-logs
          cp .github/task-6-4-close.py /tmp/task-6-4-close.py
          python .github/task-6-4-close.py docs "$GITHUB_RUN_ID" 2>&1 | tee migration-check-logs/prepare-close.log
          rm -f .github/task-6-4.py \
                .github/task-6-4-fix.py \
                .github/task-6-4-close.py \
                .github/workflows/task-6-4-apply.yml \
                .github/workflows/task-6-4-close.yml
          git diff --check
          echo "PASS prepare-close" > migration-check-logs/summary.txt

      - name: Revalidate final executable state
        id: closure_checks
        shell: bash
        run: |
          set +e
          failed=0
          run_check() {
            name="$1"
            shift
            echo "===== closure/${name} ====="
            "$@" >"migration-check-logs/closure-${name}.log" 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "PASS closure-${name}" | tee -a migration-check-logs/summary.txt
            else
              echo "FAIL closure-${name} exit=${status}" | tee -a migration-check-logs/summary.txt
              failed=1
            fi
          }
          run_check npm-ci npm ci
          run_check diff-check git diff --check
          run_check typecheck npm run test:typecheck
          run_check unit-ts npm run test:unit:ts
          run_check component-dom npm run test:component:dom
          run_check integration npm run test:integration
          run_check regressions npm run test:regressions
          run_check build-web npm run build:web
          run_check build npm run build
          cat migration-check-logs/summary.txt
          exit "$failed"

      - name: Commit revalidated closure state
        if: steps.closure_checks.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md
          git diff --cached --check
          git commit -m "docs(migration): close task 6.4"
          closure_sha="$(git rev-parse HEAD)"
          git push origin HEAD:v0.9.0-test-noche
          remote_sha="$(git ls-remote origin refs/heads/v0.9.0-test-noche | cut -f1)"
          test "$remote_sha" = "$closure_sha"
          echo "CLOSURE_SHA=${closure_sha}" >> "$GITHUB_ENV"

      - name: Write final agent state
        if: steps.closure_checks.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/task-6-4-close.py state "$CLOSURE_SHA" "$GITHUB_RUN_ID"
          git add migration/BeatGaler-agent-state.md
          git diff --cached --check
          git commit -m "docs(migration): finalize task 6.4 state"
          git push origin HEAD:v0.9.0-test-noche
          final_sha="$(git ls-remote origin refs/heads/v0.9.0-test-noche | cut -f1)"
          test "$final_sha" = "$(git rev-parse HEAD)"
          echo "FINAL_SHA=${final_sha}" >> "$GITHUB_ENV"

      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-6-4-close-${{ github.run_id }}
          path: migration-check-logs/
          if-no-files-found: error
          retention-days: 14

      - name: Report SHAs
        if: steps.closure_checks.outcome == 'success'
        shell: bash
        run: |
          echo "implementation=f9b7029a807966837c39e0844dac03c063024ce3"
          echo "closure=$CLOSURE_SHA"
          echo "final=$FINAL_SHA"
