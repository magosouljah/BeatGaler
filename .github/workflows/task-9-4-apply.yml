name: Temporary Task 9.4 Apply

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-9-4-apply.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: v0.9.0-test-noche

jobs:
  apply-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Guard exclusive branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git branch --show-current)" = "${TARGET_BRANCH}"

      - name: Apply task 9.4 extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-task-9-4.py
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused task 9.4 checks
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/migration-check-logs
          npx vitest run \
            tests/integration/appConnectivityCloudEventsExtraction.test.ts \
            tests/integration/appSessionExtraction.test.ts \
            tests/integration/appStartupBootstrapExtraction.test.ts \
            2>&1 | tee artifacts/migration-check-logs/00-task-9-4-focused.log

      - name: Run migration matrix
        id: matrix
        continue-on-error: true
        run: node scripts/run-migration-checks-with-logs.mjs

      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-9-4-${{ github.run_id }}
          path: artifacts/migration-check-logs
          if-no-files-found: error

      - name: Require focused and matrix PASS
        shell: bash
        run: |
          set -euo pipefail
          echo "focused=${{ steps.focused.outcome }}"
          echo "matrix=${{ steps.matrix.outcome }}"
          test "${{ steps.focused.outcome }}" = "success"
          test "${{ steps.matrix.outcome }}" = "success"

      - name: Commit exact validated implementation and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/migration-check-logs
          rm -f scripts/apply-task-9-4.py .github/workflows/task-9-4-apply.yml
          git diff --check
          test ! -e scripts/apply-task-9-4.py
          test ! -e .github/workflows/task-9-4-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit" >&2
            exit 1
          fi
          git commit -m "refactor(app): extract connectivity and cloud events"
          git push origin HEAD:${TARGET_BRANCH}
          echo "IMPLEMENTATION_SHA=$(git rev-parse HEAD)"
