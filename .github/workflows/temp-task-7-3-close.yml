name: Temporary task 7.3 close

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/temp-task-7-3-close.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: v0.9.0-test-noche

jobs:
  close-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact closure commit
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Verify exclusive branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$GITHUB_SHA"

      - name: Close task 7.3 documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/temp-task-7-3-close.py
          git diff --check

      - name: Commit closure only on test branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          if [ "$(git rev-parse origin/$TARGET_BRANCH)" != "$GITHUB_SHA" ]; then
            echo "Remote branch advanced during closure; refusing to overwrite concurrent work."
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(migration): close task 7.3"
          git push origin HEAD:"$TARGET_BRANCH"
