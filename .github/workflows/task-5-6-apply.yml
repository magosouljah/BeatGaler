name: Task 5.6 Apply

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/task-5-6-apply.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify expected base
        run: |
          test "$(git branch --show-current)" = "v0.9.0-test-noche"
          grep -F 'const [tagRename, setTagRename]' src/App.tsx
          grep -F 'const confirmTagRename = useCallback' src/App.tsx
          grep -F '{tagRename && (() => {' src/App.tsx
      - name: Extract tag rename ownership
        run: |
          mkdir -p src/features/tags/components tests/integration
          cat > src/features/tags/useTagRename.ts <<'EOF'
          import { useCallback, useMemo, useState } from "react";
          import type { Beat } from "../../types";
          import { renameTagEverywhere } from "../../lib/tauri";
          import { renameTagColor } from "../../lib/tagColors";
          import { registerJob, updateJob } from "../../lib/jobStore";
          import { sanitizeUserVisibleText } from "../../lib/userVisibleError";

          export type TagRenameState = {
            oldTag: string;
            newTag: string;
            stage: "name" | "confirm";
          };

          type Params = {
            beats: Beat[];
            setBeats: React.Dispatch<React.SetStateAction<Beat[]>>;
            replaceTagFilter: (oldTag: string, newTag: string) => void;
          };

          function runtimeErrorMessage(error: unknown): string {
            return error instanceof Error ? error.message : String(error);
          }

          export function useTagRename({ beats, setBeats, replaceTagFilter }: Params) {
            const [tagRename, setTagRename] = useState<TagRenameState | null>(null);
            const [tagRenameBusy, setTagRenameBusy] = useState(false);
            const [tagRenameError, setTagRenameError] = useState<string | null>(null);

            const normalizedOldTag = tagRename?.oldTag.trim().toLowerCase() ?? "";
            const affectedBeats = useMemo(() => {
              if (!normalizedOldTag) return [];
              return beats.filter(beat => beat.tags.some(tag => tag.trim().toLowerCase() === normalizedOldTag));
            }, [beats, normalizedOldTag]);

            const openTagRename = useCallback((tag: string) => {
              const oldTag = tag.trim().toLowerCase();
              setTagRename({ oldTag, newTag: oldTag, stage: "name" });
              setTagRenameError(null);
            }, []);

            const setNewTag = useCallback((newTag: string) => {
              setTagRename(current => current ? { ...current, newTag } : current);
            }, []);

            const continueTagRename = useCallback(() => {
              setTagRename(current => {
                if (!current) return current;
                const oldTag = current.oldTag.trim().toLowerCase();
                const newTag = current.newTag.trim().toLowerCase();
                if (!newTag || newTag === oldTag) return current;
                return { ...current, stage: "confirm" };
              });
            }, []);

            const backTagRename = useCallback(() => {
              if (tagRenameBusy) return;
              setTagRename(current => current ? { ...current, stage: "name" } : current);
            }, [tagRenameBusy]);

            const cancelTagRename = useCallback(() => {
              if (tagRenameBusy) return;
              setTagRename(null);
              setTagRenameError(null);
            }, [tagRenameBusy]);

            const confirmTagRename = useCallback(async () => {
              if (!tagRename) return;
              const oldTag = tagRename.oldTag.trim().toLowerCase();
              const newTag = tagRename.newTag.trim().toLowerCase();
              if (!oldTag || !newTag || oldTag === newTag) return;
              const jobId = `tag-rename-${Date.now()}`;
              setTagRenameBusy(true);
              setTagRenameError(null);
              registerJob(jobId, `Rename “${oldTag}” → “${newTag}”`, "tag-rename");
              updateJob(jobId, { status: "processing", progress: 0, message: "Preparing journal…" });
              try {
                await renameTagEverywhere(oldTag, newTag, jobId);
                setBeats(current => current.map(beat => {
                  if (!beat.tags.some(tag => tag.trim().toLowerCase() === oldTag)) return beat;
                  const renamed = beat.tags.map(tag => tag.trim().toLowerCase() === oldTag ? newTag : tag);
                  return { ...beat, tags: Array.from(new Set(renamed)) };
                }));
                replaceTagFilter(oldTag, newTag);
                renameTagColor(oldTag, newTag);
                setTagRename(null);
              } catch (error) {
                const message = sanitizeUserVisibleText(runtimeErrorMessage(error), "Could not rename tag.");
                setTagRenameError(message);
                updateJob(jobId, { status: "error", message });
              } finally {
                setTagRenameBusy(false);
              }
            }, [tagRename, replaceTagFilter, setBeats]);

            return {
              tagRename,
              tagRenameBusy,
              tagRenameError,
              affectedCount: affectedBeats.length,
              affectedMp3Count: affectedBeats.filter(beat => !!beat.mp3_path).length,
              affectedWavCount: affectedBeats.filter(beat => !!beat.wav_path).length,
              openTagRename,
              setNewTag,
              continueTagRename,
              backTagRename,
              cancelTagRename,
              confirmTagRename,
            };
          }
          EOF

          cat > src/features/tags/components/TagRenameDialog.tsx <<'EOF'
          import React from "react";
          import ReactDOM from "react-dom";
          import type { TagRenameState } from "../useTagRename";

          type Props = {
            rename: TagRenameState;
            busy: boolean;
            error: string | null;
            affectedCount: number;
            mp3Count: number;
            wavCount: number;
            onNewTagChange: (value: string) => void;
            onContinue: () => void;
            onBack: () => void;
            onCancel: () => void;
            onConfirm: () => void;
          };

          export default function TagRenameDialog({
            rename, busy, error, affectedCount, mp3Count, wavCount,
            onNewTagChange, onContinue, onBack, onCancel, onConfirm,
          }: Props) {
            const normalizedOld = rename.oldTag.trim().toLowerCase();
            const normalizedNew = rename.newTag.trim().toLowerCase();

            return ReactDOM.createPortal(
              <>
                <div style={{ position: "fixed", inset: 0, zIndex: 10020, background: "rgba(0,0,0,0.72)", backdropFilter: "blur(5px)" }} />
                <div style={{ position: "fixed", zIndex: 10021, width: 430, maxWidth: "calc(100vw - 32px)", left: "50%", top: "50%", transform: "translate(-50%,-50%)", background: "#121212", border: "1px solid #292929", borderRadius: 14, padding: 22, boxShadow: "0 28px 90px rgba(0,0,0,.8)" }}>
                  <div style={{ fontSize: 16, color: "#eee", fontWeight: 600 }}>Rename tag globally</div>
                  {rename.stage === "name" ? (
                    <>
                      <div style={{ marginTop: 8, fontSize: 12, color: "#777" }}>The original metadata order will be preserved; only the matching tag name changes.</div>
                      <input autoFocus value={rename.newTag} onChange={event => onNewTagChange(event.target.value)}
                        onKeyDown={event => { if (event.key === "Enter" && normalizedNew && normalizedNew !== normalizedOld) onContinue(); }}
                        style={{ width: "100%", marginTop: 16, padding: "10px 12px", borderRadius: 8, border: "1px solid #333", background: "#191919", color: "#fff", outline: "none" }} />
                      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 16 }}>
                        <button onClick={onCancel} style={{ padding: "8px 13px", borderRadius: 7, border: "1px solid #333", background: "transparent", color: "#999", cursor: "pointer" }}>Cancel</button>
                        <button disabled={!normalizedNew || normalizedNew === normalizedOld} onClick={onContinue} style={{ padding: "8px 13px", borderRadius: 7, border: 0, background: "#eee", color: "#111", cursor: "pointer" }}>Continue</button>
                      </div>
                    </>
                  ) : (
                    <>
                      <div style={{ marginTop: 14, padding: 14, borderRadius: 9, background: "#191919", color: "#aaa", fontSize: 12, lineHeight: 1.7 }}>
                        <div><b style={{ color: "#ddd" }}>{normalizedOld}</b> → <b style={{ color: "#ddd" }}>{normalizedNew}</b></div>
                        <div style={{ marginTop: 8 }}>This will rewrite metadata in:</div>
                        <div> {affectedCount} beats</div><div> {mp3Count} MP3 files</div><div> {wavCount} WAV files</div>
                        <div style={{ marginTop: 8, color: "#fbbf24" }}>Do not close Beat Galer while it is running. A recovery journal will roll back an interrupted operation on the next start.</div>
                      </div>
                      {error && <div style={{ marginTop: 10, color: "#f87171", fontSize: 11 }}>{error}</div>}
                      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 16 }}>
                        <button disabled={busy} onClick={onBack} style={{ padding: "8px 13px", borderRadius: 7, border: "1px solid #333", background: "transparent", color: "#999", cursor: "pointer" }}>Back</button>
                        <button disabled={busy || affectedCount === 0} onClick={onConfirm} style={{ padding: "8px 13px", borderRadius: 7, border: 0, background: "#ef4444", color: "#fff", cursor: "pointer" }}>{busy ? "Renaming…" : "Rename everywhere"}</button>
                      </div>
                    </>
                  )}
                </div>
              </>, document.body
            );
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace('import ReactDOM from "react-dom";\n', '')
          s = s.replace('import { sanitizeUserVisibleText } from "./lib/userVisibleError";\n', '')
          s = s.replace('import { useTagColors, setTagColor, renameTagColor } from "./lib/tagColors";\n', 'import { useTagColors, setTagColor } from "./lib/tagColors";\n')
          s = s.replace('import { registerJob, updateJob } from "./lib/jobStore";\n', 'import { registerJob, updateJob } from "./lib/jobStore";\n')
          s = s.replace('saveBeatMeta, renameTagEverywhere, startImportReviewStream', 'saveBeatMeta, startImportReviewStream')
          anchor = 'import { useTagFilters } from "./features/tags/useTagFilters";\n'
          s = s.replace(anchor, anchor + 'import { useTagRename } from "./features/tags/useTagRename";\nimport TagRenameDialog from "./features/tags/components/TagRenameDialog";\n')
          old_state = '''  const [tagColorMenu, setTagColorMenu] = useState<{ tag: string; x: number; y: number } | null>(null);\n  const [tagRename, setTagRename] = useState<{ oldTag: string; newTag: string; stage: "name" | "confirm" } | null>(null);\n  const [tagRenameBusy, setTagRenameBusy] = useState(false);\n  const [tagRenameError, setTagRenameError] = useState<string | null>(null);\n'''
          new_state = '''  const [tagColorMenu, setTagColorMenu] = useState<{ tag: string; x: number; y: number } | null>(null);\n  const {\n    tagRename, tagRenameBusy, tagRenameError, affectedCount: tagRenameAffectedCount,\n    affectedMp3Count: tagRenameMp3Count, affectedWavCount: tagRenameWavCount,\n    openTagRename, setNewTag: setTagRenameNewTag, continueTagRename, backTagRename,\n    cancelTagRename, confirmTagRename,\n  } = useTagRename({ beats, setBeats, replaceTagFilter });\n'''
          if old_state not in s: raise SystemExit('tag rename state block not found')
          s = s.replace(old_state, new_state, 1)
          start = s.index('const confirmTagRename = useCallback(async () => {')
          end_marker = '\n\nconst handleTagClick = useCallback'
          end = s.index(end_marker, start)
          s = s[:start] + s[end+2:]
          old_open = '''    onRename={() => {\n      const oldTag = tagColorMenu.tag.trim().toLowerCase();\n      setTagColorMenu(null);\n      setTagRename({ oldTag, newTag: oldTag, stage: "name" });\n      setTagRenameError(null);\n    }}\n'''
          new_open = '''    onRename={() => {\n      openTagRename(tagColorMenu.tag);\n      setTagColorMenu(null);\n    }}\n'''
          if old_open not in s: raise SystemExit('tag rename open block not found')
          s = s.replace(old_open, new_open, 1)
          dialog_start = s.index('{tagRename && (() => {')
          dialog_end_marker = '\n\n      {/* Grid — OS file drag-drop */}'
          dialog_end = s.index(dialog_end_marker, dialog_start)
          dialog = '''{tagRename && (\n  <TagRenameDialog\n    rename={tagRename}\n    busy={tagRenameBusy}\n    error={tagRenameError}\n    affectedCount={tagRenameAffectedCount}\n    mp3Count={tagRenameMp3Count}\n    wavCount={tagRenameWavCount}\n    onNewTagChange={setTagRenameNewTag}\n    onContinue={continueTagRename}\n    onBack={backTagRename}\n    onCancel={cancelTagRename}\n    onConfirm={confirmTagRename}\n  />\n)}'''
          s = s[:dialog_start] + dialog + s[dialog_end:]
          p.write_text(s)
          PY

          cat > tests/integration/appTagRenameExtraction.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import fs from "node:fs";

          const app = fs.readFileSync("src/App.tsx", "utf8");
          const hook = fs.readFileSync("src/features/tags/useTagRename.ts", "utf8");
          const dialog = fs.readFileSync("src/features/tags/components/TagRenameDialog.tsx", "utf8");

          describe("App tag rename extraction", () => {
            it("moves global rename operation and operation state to useTagRename", () => {
              expect(app).toContain('useTagRename({ beats, setBeats, replaceTagFilter })');
              expect(app).not.toContain('renameTagEverywhere(');
              expect(app).not.toContain('const [tagRenameBusy');
              expect(hook).toContain('await renameTagEverywhere(oldTag, newTag, jobId)');
              expect(hook).toContain('registerJob(jobId');
              expect(hook).toContain('updateJob(jobId, { status: "processing"');
              expect(hook).toContain('updateJob(jobId, { status: "error", message })');
            });

            it("preserves beat order, filter replacement, color rename and recovery feedback", () => {
              expect(hook).toContain('setBeats(current => current.map');
              expect(hook).toContain('beat.tags.map');
              expect(hook).toContain('Array.from(new Set(renamed))');
              expect(hook).toContain('replaceTagFilter(oldTag, newTag)');
              expect(hook).toContain('renameTagColor(oldTag, newTag)');
              expect(dialog).toContain('The original metadata order will be preserved');
              expect(dialog).toContain('A recovery journal will roll back an interrupted operation on the next start.');
            });

            it("moves the dialog while preserving pre-run cancel, back, busy and error feedback", () => {
              expect(app).toContain('<TagRenameDialog');
              expect(app).not.toContain('Rename tag globally</div>');
              expect(dialog).toContain('Rename tag globally');
              expect(dialog).toContain('onClick={onCancel}');
              expect(dialog).toContain('disabled={busy} onClick={onBack}');
              expect(dialog).toContain('disabled={busy || affectedCount === 0}');
              expect(dialog).toContain('{busy ? "Renaming…" : "Rename everywhere"}');
              expect(dialog).toContain('{error &&');
            });
          });
          EOF

          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Run migration checks
        id: checks
        shell: bash
        run: |
          mkdir -p migration-check-logs
          : > migration-check-logs/summary.txt
          failed=0
          run_check() {
            name="$1"; shift
            echo "===== $name =====" > "migration-check-logs/$name.log"
            if "$@" >> "migration-check-logs/$name.log" 2>&1; then
              echo "$name PASS" | tee -a migration-check-logs/summary.txt
            else
              code=$?
              echo "$name FAIL exit=$code" | tee -a migration-check-logs/summary.txt
              failed=1
            fi
          }
          run_check typecheck npm run test:typecheck
          run_check unit-ts npm run test:unit:ts
          run_check component-dom npm run test:component:dom
          run_check integration npm run test:integration
          run_check regressions npm run test:regressions
          run_check build-web npm run build:web
          run_check build npm run build
          exit "$failed"
      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-5-6-${{ github.run_id }}-${{ github.run_attempt }}
          path: migration-check-logs/
      - name: Commit verified implementation
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/tags/useTagRename.ts src/features/tags/components/TagRenameDialog.tsx tests/integration/appTagRenameExtraction.test.ts
          git commit -m "refactor(tags): extract global tag rename"
          git push origin HEAD:v0.9.0-test-noche
