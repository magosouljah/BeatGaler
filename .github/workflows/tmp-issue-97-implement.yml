name: TMP Issue 97 implementation

on:
  push:
    branches:
      - issue-97-instant-stable-library-reveal

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-97-instant-stable-library-reveal
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Apply Issue 97 patch
        run: python scripts/tmp-issue-97-patch.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run test:typecheck

      - name: Component DOM tests
        run: npm run test:component:dom

      - name: Integration tests
        run: npm run test:integration

      - name: Web production build
        run: npm run build:web

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/BeatCard.tsx src/lib/libraryStateManager.ts src/features/artwork/artworkThumbnailCache.ts deploy/web/beatgaler.com.conf tests/component-dom/artworkThumbnailCache.test.ts tests/component-dom/startupRevealArchitecture.test.ts tests/integration/coreIntegration.test.tsx
          git commit -m "F2/97: make library reveal instant and position-stable"
          git push origin HEAD:issue-97-instant-stable-library-reveal
