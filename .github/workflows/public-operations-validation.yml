name: Public Operations - Validate

on:
  pull_request:
    paths:
      - 'public/.well-known/security.txt'
      - 'public/status/**'
      - 'deploy/web/beatgaler.com.conf'
      - 'deploy/web/beatgaler.com.bootstrap.conf'
      - 'deploy/web/install-web-production.sh'
      - 'scripts/test-public-operations-pages.mjs'
      - '.github/workflows/public-operations-validation.yml'
  schedule:
    - cron: '23 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Validate security and status sources
        run: node scripts/test-public-operations-pages.mjs
      - name: Validate EC2 installer syntax
        run: bash -n deploy/web/install-web-production.sh
