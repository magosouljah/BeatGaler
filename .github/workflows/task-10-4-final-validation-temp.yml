name: Task 10.4 final validation temp

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-10-4-final-validation-temp.yml

permissions:
  contents: read

jobs:
  core-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked graph
        run: npm ci

      - name: Prepare readable logs
        run: mkdir -p artifacts/migration-check-logs

      - name: Migration matrix
        run: node scripts/run-migration-checks-with-logs.mjs

      - name: Full check wrapper
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee artifacts/migration-check-logs/08-full-check.log

      - name: Web smoke
        shell: bash
        run: |
          set -o pipefail
          npm run test:web:smoke 2>&1 | tee artifacts/migration-check-logs/09-web-smoke.log

      - name: Packaging and static portability
        shell: bash
        run: |
          set -o pipefail
          npm run test:packaging:static 2>&1 | tee artifacts/migration-check-logs/10-packaging-static.log

      - name: Upload readable logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-${{ github.run_id }}-${{ github.run_attempt }}-core
          path: artifacts/migration-check-logs/
          if-no-files-found: error
          retention-days: 7

  windows-e2e:
    name: Windows E2E - ${{ matrix.flow }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        flow:
          - desktop
          - edit
          - playback
          - offline
          - trash
          - import
          - downloads
          - recovery
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked graph
        run: npm ci

      - name: Run isolated desktop flow
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/migration-check-logs | Out-Null
          $flow = "${{ matrix.flow }}"
          switch ($flow) {
            "edit" { $env:BEATGALER_E2E_FLOW = "1" }
            "playback" { $env:BEATGALER_E2E_PLAYBACK = "1" }
            "offline" { $env:BEATGALER_E2E_OFFLINE = "1" }
            "trash" { $env:BEATGALER_E2E_TRASH = "1" }
            "import" { $env:BEATGALER_E2E_IMPORT = "1" }
            "downloads" { $env:BEATGALER_E2E_DOWNLOADS = "1" }
            "recovery" { $env:BEATGALER_E2E_RECOVERY = "1" }
          }
          node scripts/run-desktop-e2e-isolated.mjs 2>&1 | Tee-Object -FilePath "artifacts/migration-check-logs/e2e-$flow.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload readable E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-${{ github.run_id }}-${{ github.run_attempt }}-windows-${{ matrix.flow }}
          path: artifacts/migration-check-logs/
          if-no-files-found: error
          retention-days: 7

  macos-native:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked graph
        run: npm ci

      - name: Prepare readable logs
        run: mkdir -p artifacts/migration-check-logs

      - name: macOS portability suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:mac-portability 2>&1 | tee artifacts/migration-check-logs/macos-portability.log

      - name: Native macOS release compile
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee artifacts/migration-check-logs/macos-frontend-build.log
          cargo build --locked --manifest-path src-tauri/Cargo.toml --release 2>&1 | tee artifacts/migration-check-logs/macos-native-build.log

      - name: Upload readable macOS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-${{ github.run_id }}-${{ github.run_attempt }}-macos
          path: artifacts/migration-check-logs/
          if-no-files-found: error
          retention-days: 7
