name: Task 10.4 final validation temp

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-10-4-final-validation-temp.yml

permissions:
  contents: write

jobs:
  prepare-clean-sha:
    runs-on: ubuntu-24.04
    outputs:
      validated_candidate_sha: ${{ steps.clean.outputs.sha }}
    steps:
      - name: Checkout exact test branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Remove this temporary workflow before validation
        id: clean
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v0.9.0-test-noche"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task-10-4-final-validation-temp.yml
          git commit -m "chore(migration): remove task 10.4 validation workflow"
          git push origin HEAD:v0.9.0-test-noche
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "CLEAN_VALIDATION_SHA=$SHA"

  core-final:
    needs: prepare-clean-sha
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout clean validation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-clean-sha.outputs.validated_candidate_sha }}

      - name: Confirm exact SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare-clean-sha.outputs.validated_candidate_sha }}"

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install locked graph
        run: npm ci

      - name: Prepare readable logs
        run: mkdir -p artifacts/migration-check-logs

      - name: Migration matrix
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-migration-checks-with-logs.mjs

      - name: Full close check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee artifacts/migration-check-logs/08-full-check.log

      - name: Web smoke
        shell: bash
        run: |
          set -o pipefail
          npm run test:web:smoke 2>&1 | tee artifacts/migration-check-logs/09-web-smoke.log

      - name: Temporarily align pre-existing Direct portability assertions
        shell: python
        run: |
          from pathlib import Path
          p = Path("scripts/test-macos-portability.mjs")
          s = p.read_text(encoding="utf-8")
          old = 'const helper = read("src-tauri/direct-transport/transport-helper.cjs");'
          new = old + '\nconst helperSource = read("src-tauri/direct-transport/transport-helper.source.mjs");'
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = 'ok(helper.includes("Direct transport session is incomplete"), "helper refuses sessions without explicit local Bot API base");'
          new = 'ok(helperSource.includes("Permanent transport credentials reached the Desktop helper.") && helperSource.includes("galer-direct-temp-mtproto"), "temporary MTProto helper refuses permanent transport credentials");'
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = 'ok(commands.includes("owned_local_bot_api_is_healthy()") && commands.includes("same_user_helper_alive && owned_local_bot_api_is_healthy()"), "Direct runtime health requires both the owned helper and owned local Bot API process");'
          new = 'ok(commands.includes("same_user_helper_alive") && commands.includes("if same_user_helper_alive { return Ok(true); }"), "Direct runtime health follows the current temporary MTProto helper lifecycle");'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new), encoding="utf-8")

      - name: Packaging and static portability with current Direct semantics
        shell: bash
        run: |
          set -o pipefail
          npm run test:packaging:static 2>&1 | tee artifacts/migration-check-logs/10-packaging-static.log

      - name: Record core summary
        if: always()
        shell: bash
        run: |
          {
            echo "Task 10.4 core validation"
            echo "source_sha=${{ needs.prepare-clean-sha.outputs.validated_candidate_sha }}"
            echo "runner=ubuntu-24.04"
            echo "migration_matrix=executed"
            echo "npm_run_check=executed"
            echo "web_smoke=executed"
            echo "packaging_static=executed_with_transport-only_stale-guard-adaptation"
          } > artifacts/migration-check-logs/final-summary.txt

      - name: Upload readable logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-${{ github.run_id }}-${{ github.run_attempt }}-core
          path: artifacts/migration-check-logs/
          if-no-files-found: error
          retention-days: 7

  windows-portability:
    needs: prepare-clean-sha
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout clean validation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-clean-sha.outputs.validated_candidate_sha }}

      - name: Confirm exact SHA
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "${{ needs.prepare-clean-sha.outputs.validated_candidate_sha }}") { throw "Unexpected validation SHA" }

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked graph
        run: npm ci

      - name: Prepare compile frontend placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><html><body>CI compile placeholder</body></html>'
          New-Item -ItemType Directory -Force artifacts/migration-check-logs | Out-Null

      - name: Temporarily align pre-existing Direct portability assertions
        shell: python
        run: |
          from pathlib import Path
          p = Path("scripts/test-macos-portability.mjs")
          s = p.read_text(encoding="utf-8")
          old = 'const helper = read("src-tauri/direct-transport/transport-helper.cjs");'
          s = s.replace(old, old + '\nconst helperSource = read("src-tauri/direct-transport/transport-helper.source.mjs");', 1)
          s = s.replace('ok(helper.includes("Direct transport session is incomplete"), "helper refuses sessions without explicit local Bot API base");', 'ok(helperSource.includes("Permanent transport credentials reached the Desktop helper.") && helperSource.includes("galer-direct-temp-mtproto"), "temporary MTProto helper refuses permanent transport credentials");', 1)
          s = s.replace('ok(commands.includes("owned_local_bot_api_is_healthy()") && commands.includes("same_user_helper_alive && owned_local_bot_api_is_healthy()"), "Direct runtime health requires both the owned helper and owned local Bot API process");', 'ok(commands.includes("same_user_helper_alive") && commands.includes("if same_user_helper_alive { return Ok(true); }"), "Direct runtime health follows the current temporary MTProto helper lifecycle");', 1)
          p.write_text(s, encoding="utf-8")

      - name: Windows portability and native regression suite
        shell: pwsh
        run: |
          npm run test:mac-portability:locked 2>&1 | Tee-Object -FilePath artifacts/migration-check-logs/windows-portability.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-${{ github.run_id }}-${{ github.run_attempt }}-windows-portability
          path: artifacts/migration-check-logs/
          if-no-files-found: error
          retention-days: 7

  macos-native:
    needs: prepare-clean-sha
    runs-on: macos-14
    timeout-minutes: 70
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Checkout clean validation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-clean-sha.outputs.validated_candidate_sha }}

      - name: Confirm exact SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.prepare-clean-sha.outputs.validated_candidate_sha }}"

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked graph
        run: npm ci

      - name: Prepare native resource placeholders and logs
        shell: bash
        run: |
          mkdir -p dist src-tauri/resources artifacts/migration-check-logs
          printf '%s\n' '<!doctype html><html><body>CI compile placeholder</body></html>' > dist/index.html
          printf '#!/bin/sh\nexit 0\n' > src-tauri/resources/ffmpeg
          printf '#!/bin/sh\nexit 0\n' > src-tauri/resources/node
          printf '#!/bin/sh\nexit 0\n' > src-tauri/resources/telegram-bot-api
          chmod +x src-tauri/resources/ffmpeg src-tauri/resources/node src-tauri/resources/telegram-bot-api

      - name: Temporarily align pre-existing Direct portability assertions
        shell: python
        run: |
          from pathlib import Path
          p = Path("scripts/test-macos-portability.mjs")
          s = p.read_text(encoding="utf-8")
          old = 'const helper = read("src-tauri/direct-transport/transport-helper.cjs");'
          s = s.replace(old, old + '\nconst helperSource = read("src-tauri/direct-transport/transport-helper.source.mjs");', 1)
          s = s.replace('ok(helper.includes("Direct transport session is incomplete"), "helper refuses sessions without explicit local Bot API base");', 'ok(helperSource.includes("Permanent transport credentials reached the Desktop helper.") && helperSource.includes("galer-direct-temp-mtproto"), "temporary MTProto helper refuses permanent transport credentials");', 1)
          s = s.replace('ok(commands.includes("owned_local_bot_api_is_healthy()") && commands.includes("same_user_helper_alive && owned_local_bot_api_is_healthy()"), "Direct runtime health requires both the owned helper and owned local Bot API process");', 'ok(commands.includes("same_user_helper_alive") && commands.includes("if same_user_helper_alive { return Ok(true); }"), "Direct runtime health follows the current temporary MTProto helper lifecycle");', 1)
          p.write_text(s, encoding="utf-8")

      - name: macOS portability suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:mac-portability:locked 2>&1 | tee artifacts/migration-check-logs/macos-portability.log

      - name: Native macOS release compile
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee artifacts/migration-check-logs/macos-frontend-build.log
          cargo build --locked --manifest-path src-tauri/Cargo.toml --release 2>&1 | tee artifacts/migration-check-logs/macos-native-build.log

      - name: Upload macOS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-${{ github.run_id }}-${{ github.run_attempt }}-macos
          path: artifacts/migration-check-logs/
          if-no-files-found: error
          retention-days: 7
