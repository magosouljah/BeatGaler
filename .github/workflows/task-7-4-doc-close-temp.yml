name: Temporary task 7.4 documentation closer

on:
  push:
    branches: [v0.9.0-test-noche]
    paths: [.github/workflows/task-7-4-doc-close-temp.yml]

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close documentation
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3c485083e4fe6e896017e2e26f4a33d9e25902b5 HEAD
          python .github/task-7-4-doc-close.py
          rm .github/task-7-4-doc-close.py
          rm .github/workflows/task-7-4-doc-close-temp.yml
          git diff --check
          actual="$(git diff --name-only 3c485083e4fe6e896017e2e26f4a33d9e25902b5 -- | sort)"
          expected="$(printf '%s\n' migration/BeatGaler-agent-state.md migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close task 7.4'
          git push origin HEAD:v0.9.0-test-noche
