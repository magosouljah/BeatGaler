name: Temporary task 7.4 documentation closer

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-7-4-doc-close-temp.yml

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify staged closer parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3c485083e4fe6e896017e2e26f4a33d9e25902b5"
          test "${GITHUB_REF_NAME}" = "v0.9.0-test-noche"

      - name: Close task 7.4 documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          roadmap_path = Path('migration/BeatGaler-roadmap-para-trabajar-con-IAs.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          old = '### [ ] 7.4 — Separar la entrada de importación web'
          new = '### [x] 7.4 — Separar la entrada de importación web'
          if new not in roadmap:
              if old not in roadmap:
                  raise SystemExit('7.4 roadmap marker not found')
              roadmap = roadmap.replace(old, new, 1)
              roadmap_path.write_text(roadmap, encoding='utf-8')

          registro_path = Path('migration/Registro-de-avance.md')
          registro = registro_path.read_text(encoding='utf-8')
