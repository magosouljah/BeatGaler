name: Upgrade 21.2 Staging

on:
  pull_request:
    branches:
      - integration-v0.8.0-alpha.1

permissions:
  contents: read

concurrency:
  group: upgrade-21-2-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  BEATGALER_UPDATER_ENDPOINT: https://github.com/magosouljah/galer/releases/latest/download/latest.json

jobs:
  windows-upgrade:
    name: Windows 0.7.4 in-place upgrade staging
    if: ${{ github.head_ref == 'bbb/task-21.2-upgrade-matrix' }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc

      - name: Install locked frontend graph
        run: npm ci

      - name: Stage deterministic packaging fixtures
        shell: pwsh
        run: |
          $resourceDir = "src-tauri/resources/windows"
          New-Item -ItemType Directory -Force $resourceDir | Out-Null
          Copy-Item -LiteralPath (Get-Command node.exe -ErrorAction Stop).Source -Destination "$resourceDir/node.exe"
          Set-Content -LiteralPath "$resourceDir/ffmpeg.exe" -Value "21.2 staging fixture" -Encoding ascii
          Set-Content -LiteralPath "$resourceDir/telegram-bot-api.exe" -Value "21.2 staging fixture" -Encoding ascii

      - name: Build unsigned NSIS staging installer from exact SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "${{ github.event.pull_request.head.sha }}") { throw "staging checkout SHA mismatch: $actual" }
          npx tauri build --bundles nsis --config src-tauri/tauri.windows-upgrade-staging.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Windows staging bundle failed" }

      - name: Execute literal 0.7.4 to Galer upgrade probe
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS staging installer was not produced" }
          & ./scripts/test-windows-074-upgrade.ps1 -Installer $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Windows 0.7.4 upgrade probe failed" }
          New-Item -ItemType Directory -Force artifacts/upgrade-21.2 | Out-Null
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ sourceSha = "${{ github.event.pull_request.head.sha }}"; installer = $installer.Name; sha256 = $hash; probe = "PASS" } | ConvertTo-Json | Set-Content artifacts/upgrade-21.2/windows.json -Encoding utf8

      - name: Upload Windows staging evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-21.2-windows-${{ github.event.pull_request.head.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            artifacts/upgrade-21.2/windows.json
          if-no-files-found: error

  macos-upgrade:
    name: macOS identity/migration staging (${{ matrix.arch }})
    if: ${{ github.head_ref == 'bbb/task-21.2-upgrade-matrix' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.0

      - name: Install locked frontend graph
        run: npm ci

      - name: Stage deterministic packaging fixtures
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          printf '#!/bin/sh\nexit 0\n' > src-tauri/resources/ffmpeg
          printf '#!/bin/sh\nexit 0\n' > src-tauri/resources/node
          printf '#!/bin/sh\nexit 0\n' > src-tauri/resources/telegram-bot-api
          chmod +x src-tauri/resources/ffmpeg src-tauri/resources/node src-tauri/resources/telegram-bot-api

      - name: Build unsigned macOS staging app from exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          npx tauri build --bundles app --config src-tauri/tauri.macos-upgrade-staging.conf.json

      - name: Verify Galer identity and packaged migration-capable app
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$APP"
          ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Contents/Info.plist")"
          test "$ID" = "com.beatgaler.app"
          test "$NAME" = "Galer"
          test -x "$APP/Contents/MacOS/Galer"
          test -f "$APP/Contents/Resources/ffmpeg"
          test -f "$APP/Contents/Resources/node"
          test -f "$APP/Contents/Resources/telegram-bot-api"
          mkdir -p artifacts/upgrade-21.2
          printf '{"sourceSha":"%s","arch":"%s","bundleIdentifier":"%s","productName":"%s","probe":"PASS"}\n' \
            "${{ github.event.pull_request.head.sha }}" "${{ matrix.arch }}" "$ID" "$NAME" > "artifacts/upgrade-21.2/macos-${{ matrix.arch }}.json"

      - name: Upload macOS staging evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-21.2-macos-${{ matrix.arch }}-${{ github.event.pull_request.head.sha }}
          path: |
            src-tauri/target/release/bundle/macos/*.app
            artifacts/upgrade-21.2/macos-${{ matrix.arch }}.json
          if-no-files-found: error
