name: Task 5.5 Close

on:
  push:
    branches: [v0.9.0-test-noche]

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Update migration state
        run: python3 scripts/task-5-5-close-temp.py

      - name: Normalize register EOF
        run: python3 -c "from pathlib import Path; p=Path('migration/Registro-de-avance.md'); p.write_text(p.read_text().rstrip() + '\\n')"

      - name: Commit closure and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task-5-5-close.yml scripts/task-5-5-close-temp.py
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md migration/BeatGaler-agent-state.md
          git diff --cached --check
          git commit -m "docs(migration): close task 5.5"
          git push origin HEAD:v0.9.0-test-noche
