name: TEMP 12.1 Web runtime patch

on:
  push:
    branches:
      - aaa/12.1-web-login-loader-dismiss
    paths:
      - .github/workflows/tmp-12-1-web-runtime-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Apply focused Web runtime fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/lib/tauri.ts",
              '} from "../types";\n',
              '} from "../types";\nimport { getWebClientId } from "../platform/webClientId";\n',
          )

          replace_once(
              "src/lib/tauri.ts",
              '''export async function flushOfflineTrashIntents(): Promise<number> {\n  await initTauri();\n  if (!invoke) throw new Error("Tauri not available");\n  return invoke<number>("flush_offline_trash_intents");\n}''',
              '''export async function flushOfflineTrashIntents(): Promise<number> {\n  await initTauri();\n  if (!invoke) return 0;\n  return invoke<number>("flush_offline_trash_intents");\n}''',
          )

          replace_once(
              "src/lib/tauri.ts",
              '''export async function getSettings(): Promise<AppSettings> {\n  await initTauri();\n  if (!invoke) return { beats_folder: null, incomplete_warnings_enabled: true, custom_cursor_enabled: true };\n  return invoke<AppSettings>("get_settings");\n}''',
              '''export async function getSettings(): Promise<AppSettings> {\n  await initTauri();\n  if (!invoke) {\n    return {\n      beats_folder: null,\n      incomplete_warnings_enabled: true,\n      custom_cursor_enabled: true,\n      beatgaler_user_id: getWebClientId(),\n      telegram_cloud_connected: true,\n      telegram_cloud_username: null,\n    };\n  }\n  return invoke<AppSettings>("get_settings");\n}''',
          )

          replace_once(
              "src/lib/tauri.ts",
              '''export async function pollTelegramCloudStatus(): Promise<TelegramCloudStatus> {\n  await initTauri();\n  if (!invoke) return { connected: false, reachable: false, username: null };\n  return invoke<TelegramCloudStatus>("poll_telegram_cloud_status");\n}''',
              '''export async function pollTelegramCloudStatus(): Promise<TelegramCloudStatus> {\n  await initTauri();\n  if (!invoke) {\n    const reachable = typeof navigator === "undefined" || navigator.onLine !== false;\n    return { connected: true, reachable, username: null };\n  }\n  return invoke<TelegramCloudStatus>("poll_telegram_cloud_status");\n}''',
          )

          replace_once(
              "src/lib/tauri.ts",
              '''export async function getTelegramCloudStatus(): Promise<TelegramCloudStatus> {\n  await initTauri();\n  if (!invoke) return { connected: false, reachable: false, username: null };\n  return invoke<TelegramCloudStatus>("get_telegram_cloud_status");\n}''',
              '''export async function getTelegramCloudStatus(): Promise<TelegramCloudStatus> {\n  await initTauri();\n  if (!invoke) {\n    const reachable = typeof navigator === "undefined" || navigator.onLine !== false;\n    return { connected: true, reachable, username: null };\n  }\n  return invoke<TelegramCloudStatus>("get_telegram_cloud_status");\n}''',
          )

          replace_once(
              "src/App.tsx",
              '''  useEffect(() => {\n    let unlisten: (() => void) | undefined;\n    let disposed = false;\n\n    void listen<BackgroundDownloadEvent>("beatgaler-download-event", event => {''',
              '''  useEffect(() => {\n    if (!isTauriAvailable) return;\n\n    let unlisten: (() => void) | undefined;\n    let disposed = false;\n\n    void listen<BackgroundDownloadEvent>("beatgaler-download-event", event => {''',
          )

          replace_once(
              "cloud-server/productive-temp-auth-boundary.js",
              '  if (session.ok === false) return safe;',
              '  if (session.ok !== true) return safe;',
          )

      - name: Install locked dependencies
        run: npm ci

      - name: Verify browser build and boundary syntax
        run: |
          node --check cloud-server/productive-temp-auth-boundary.js
          npm run build:web

      - name: Commit verified patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-12-1-web-runtime-patch.yml
          git config user.name "BeatGaler Task 12.1 automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/tauri.ts src/App.tsx cloud-server/productive-temp-auth-boundary.js
          git commit -m "fix(web): route startup through browser Cloud runtime"
          git push origin HEAD:aaa/12.1-web-login-loader-dismiss
