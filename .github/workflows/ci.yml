# CI de V1: Web y Cloud se comprueban en cada push a `main` o a una rama de revisión `local/**` que cambie código, pruebas,
# scripts o migraciones SQL. El catálogo PostgreSQL (suites con su descriptor y PG efímero) sigue en catalog-checks.yml.
# Los workflows de pull_request existentes no se tocan (pueden ser checks requeridos de la protección de main).
# Sin secretos, AWS, Telegram ni producción: PostgreSQL es un service container desechable sin datos, con centinela.
name: CI V1 - Web y Cloud

on:
  push:
    branches:
      - main
      - 'local/**'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cloud-server/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.node-version'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cloud-server/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.node-version'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, unit, component-dom, integration, guardas, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Instalar dependencias bloqueadas
        run: npm ci --no-audit --no-fund
      - name: Guard browser startup bridge
        run: node scripts/regression-web-startup-bridge.mjs
      - name: Guard bound-temp Web RPC seam
        run: node scripts/regression-web-bound-temp-rpc.mjs
      - name: Pruebas Web (npm run test:web)
        run: npm run test:web
      - name: Prueba TLS readiness del deploy Web
        run: bash tests/v1-web-tls-readiness.test.sh
      - name: Build Web como producción
        env:
          VITE_CATALOG_API_ENABLED: 'true'
        run: npm run build:web

  cloud:
    name: Cloud (unitarias + integración PostgreSQL efímero)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109
        env:
          POSTGRES_USER: bg_ci_admin
          # Contenedor efímero del job; no es credencial de ningún entorno real.
          POSTGRES_PASSWORD: bg-ci-ephemeral
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bg_ci_admin -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: cloud-server/package-lock.json
      - name: Instalar dependencias de cloud-server sin scripts
        run: npm ci --prefix cloud-server --ignore-scripts --no-audit --no-fund
      - name: Cloud unitarias (scripts/run-cloud-tests.mjs)
        run: node scripts/run-cloud-tests.mjs
      - name: Centinela de la instancia PostgreSQL efímera
        env:
          BEATGALER_CLOUD_TEST_ADMIN_URL: postgres://bg_ci_admin:bg-ci-ephemeral@127.0.0.1:5432/postgres
        run: |
          id="bgct-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(node -e "process.stdout.write(require('crypto').randomBytes(16).toString('hex'))")"
          echo "BEATGALER_CLOUD_TEST_INSTANCE_ID=$id" >> "$GITHUB_ENV"
          BEATGALER_CLOUD_TEST_INSTANCE_ID="$id" node -e "
            const { Client } = require('./cloud-server/node_modules/pg');
            const c = new Client({ connectionString: process.env.BEATGALER_CLOUD_TEST_ADMIN_URL });
            (async () => { await c.connect();
              await c.query('CREATE SCHEMA bg_test_lab');
              await c.query('CREATE TABLE bg_test_lab.lab_identity(instance_id text PRIMARY KEY)');
              await c.query('INSERT INTO bg_test_lab.lab_identity VALUES (\$1)', [process.env.BEATGALER_CLOUD_TEST_INSTANCE_ID]);
              await c.end(); console.log('sentinel ok'); })().catch((e) => { console.error(e.message); process.exit(1); });"
      - name: Cloud integración PostgreSQL efímero
        env:
          BEATGALER_CLOUD_TEST_ADMIN_URL: postgres://bg_ci_admin:bg-ci-ephemeral@127.0.0.1:5432/postgres
        run: node scripts/run-cloud-tests.mjs --integration

  metrics:
    name: Trinquete de métricas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Generar tablas de métricas
        continue-on-error: true
        run: |
          mkdir -p metrics-out
          node scripts/metrics/metrics.mjs . > metrics-out/metrics.tsv
          node scripts/metrics/classify-tests.mjs . summary > metrics-out/classify-tests.tsv
          node scripts/metrics/cloud-reach.mjs . summary > metrics-out/cloud-reach.tsv
          node scripts/metrics/src-reach.mjs . summary > metrics-out/src-reach.tsv
      - name: Bloquear regresiones de métricas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=HEAD^
          fi
          node scripts/metrics/ratchet.mjs . --against "$BASE_SHA"
      - name: Publicar métricas
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metrics
          path: metrics-out/
          if-no-files-found: ignore
