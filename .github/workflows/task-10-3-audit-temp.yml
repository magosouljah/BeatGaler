name: Task 10.3 cleanup audit temp

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/task-10-3-audit-temp.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit migration cleanup
        shell: bash
        run: |
          mkdir -p migration-check-logs
          node --input-type=module <<'NODE' | tee migration-check-logs/summary.txt
          import fs from 'node:fs';
          import path from 'node:path';
          import ts from 'typescript';

          const root = process.cwd();
          const configPath = ts.findConfigFile(root, ts.sys.fileExists, 'tsconfig.json');
          if (!configPath) throw new Error('tsconfig.json not found');
          const raw = ts.readConfigFile(configPath, ts.sys.readFile);
          const parsed = ts.parseJsonConfigFileContent(raw.config, ts.sys, root, {
            noUnusedLocals: true,
            noUnusedParameters: false,
            noEmit: true,
          });
          const program = ts.createProgram(parsed.fileNames, parsed.options);
          const diagnostics = ts.getPreEmitDiagnostics(program);
          const migrationFiles = diagnostics.filter(d => {
            if (!d.file) return false;
            const rel = path.relative(root, d.file.fileName).replaceAll('\\\\', '/');
            return (rel.startsWith('src/app/') || rel.startsWith('src/features/')) && [6133, 6192, 6196].includes(d.code);
          });

          console.log('=== UNUSED LOCALS / IMPORTS IN src/app + src/features ===');
          if (migrationFiles.length === 0) console.log('NONE');
          for (const d of migrationFiles) {
            const rel = path.relative(root, d.file.fileName).replaceAll('\\\\', '/');
            const pos = d.file.getLineAndCharacterOfPosition(d.start ?? 0);
            console.log(`${rel}:${pos.line + 1}:${pos.character + 1} TS${d.code} ${ts.flattenDiagnosticMessageText(d.messageText, ' ')}`);
          }

          function walk(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(p));
              else if (/\.(ts|tsx)$/.test(entry.name)) out.push(p);
            }
            return out;
          }

          const featureFiles = walk(path.join(root, 'src/features'));
          const forbidden = [];
          for (const file of featureFiles) {
            const source = fs.readFileSync(file, 'utf8');
            const sf = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true);
            for (const st of sf.statements) {
              if ((!ts.isImportDeclaration(st) && !ts.isExportDeclaration(st)) || !st.moduleSpecifier || !ts.isStringLiteral(st.moduleSpecifier)) continue;
              const spec = st.moduleSpecifier.text;
              if (!spec.startsWith('.')) continue;
              const resolved = ts.resolveModuleName(spec, file, parsed.options, ts.sys).resolvedModule?.resolvedFileName;
              if (!resolved) continue;
              const relResolved = path.relative(root, resolved).replaceAll('\\\\', '/');
              if (relResolved === 'src/App.tsx' || relResolved.startsWith('src/app/')) {
                forbidden.push(`${path.relative(root, file).replaceAll('\\\\', '/')}: ${spec} -> ${relResolved}`);
              }
            }
          }
          console.log('\n=== FEATURE -> ROOT/APP DEPENDENCIES ===');
          if (forbidden.length === 0) console.log('NONE');
          else forbidden.forEach(x => console.log(x));

          console.log('\n=== TRANSITION / OBSOLETE-COMMENT CANDIDATES ===');
          const commentCandidates = [];
          for (const base of [path.join(root, 'src/app'), path.join(root, 'src/features')]) {
            for (const file of walk(base)) {
              const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
              lines.forEach((line, i) => {
                if (/temporar|transition|transici[oó]n|TODO|FIXME|migrat|App\.tsx|mega-App/i.test(line)) {
                  commentCandidates.push(`${path.relative(root, file).replaceAll('\\\\', '/')}:${i + 1}: ${line.trim()}`);
                }
              });
            }
          }
          if (commentCandidates.length === 0) console.log('NONE');
          else commentCandidates.forEach(x => console.log(x));

          console.log('\n=== TEMP/PROBE TOOLING CANDIDATES ===');
          const tooling = [];
          for (const dir of ['.github/workflows', 'scripts']) {
            const abs = path.join(root, dir);
            if (!fs.existsSync(abs)) continue;
            for (const name of fs.readdirSync(abs)) {
              if (/temp|probe-task|task-\d/i.test(name)) tooling.push(`${dir}/${name}`);
            }
          }
          if (tooling.length === 0) console.log('NONE');
          else tooling.sort().forEach(x => console.log(x));

          console.log('\n=== APP SHELL TRANSITIONAL GLOBAL PASS-THROUGH ===');
          const composition = fs.readFileSync(path.join(root, 'src/app/useBeatGalerComposition.ts'), 'utf8');
          const shell = fs.readFileSync(path.join(root, 'src/app/AppShell.tsx'), 'utf8');
          for (const name of ['Event', 'HTMLElement']) {
            console.log(`${name}: compositionReturn=${new RegExp(`return \\{[^}]*\\b${name}\\b`, 's').test(composition)} shellDestructure=${new RegExp(`const \\{[^}]*\\b${name}\\b`, 's').test(shell)}`);
          }
          NODE
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-10-3-audit-${{ github.run_id }}
          path: migration-check-logs/summary.txt
          if-no-files-found: error
