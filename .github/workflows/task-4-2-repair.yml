name: Temporary Task 4.2 Repair

on:
  push:
    branches: [v0.9.0-test-noche]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - name: Repair and retrigger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/task-4-2-apply.yml')
          s = p.read_text()
          s = s.replace("    if: github.event.head_commit.message == 'chore(migration): run task 4.2 apply'\n", '')
          p.write_text(s)
          PY
          rm .github/workflows/task-4-2-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/task-4-2-apply.yml .github/workflows/task-4-2-repair.yml
          git commit -m "chore(migration): run task 4.2 apply"
          git push origin HEAD:v0.9.0-test-noche
