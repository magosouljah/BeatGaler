name: Close task 9.1 documentation v2

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-9-1-close-temp-v2.yml

permissions:
  contents: write

env:
  ENTRY_B64: ""
  AGENT_B64: ""

jobs:
  close-task-9-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard target branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v0.9.0-test-noche"
          git fetch origin v0.9.0-test-noche
          test "$(git rev-parse origin/v0.9.0-test-noche)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor f381d77a50280a4a1c19bbfbd7c717019ba9fd3b "${GITHUB_SHA}"

      - name: Update roadmap and append Registro
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          roadmap_path = Path("migration/BeatGaler-roadmap-para-trabajar-con-IAs.md")
          roadmap = roadmap_path.read_text()
          old = "### [ ] 9.1 — Separar sesión y ajustes"
          new = "### [x] 9.1 — Separar sesión y ajustes"
          if roadmap.count(old) != 1:
              raise SystemExit(f"roadmap 9.1: expected one unchecked task, got {roadmap.count(old)}")
          roadmap_path.write_text(roadmap.replace(old, new, 1))
          registro_path = Path("migration/Registro-de-avance.md")
          registro = registro_path.read_text()
          if "### Registro — 9.1" in registro:
              raise SystemExit("Registro 9.1 already exists; refusing duplicate append")
          entry = base64.b64decode(os.environ["ENTRY_B64"]).decode("utf-8")
          registro_path.write_text(registro.rstrip() + "\n\n" + entry + "\n")
          PY

      - name: Observe remote HEAD before agent-state
        id: observe
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v0.9.0-test-noche
          observed="$(git rev-parse origin/v0.9.0-test-noche)"
          test "$observed" = "${GITHUB_SHA}"
          echo "head=$observed" >> "$GITHUB_OUTPUT"

      - name: Write agent-state and remove closers
        shell: bash
        env:
          OBSERVED_HEAD: ${{ steps.observe.outputs.head }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          text = base64.b64decode(os.environ["AGENT_B64"]).decode("utf-8")
          text = text.replace("{OBSERVED_HEAD}", os.environ["OBSERVED_HEAD"])
          text = text.replace("{RUN_ID}", os.environ["GITHUB_RUN_ID"])
          Path("migration/BeatGaler-agent-state.md").write_text(text)
          PY
          rm -f .github/workflows/task-9-1-close-temp.yml
          rm -f .github/workflows/task-9-1-close-temp-v2.yml

      - name: Verify documentation-only final tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only f381d77a50280a4a1c19bbfbd7c717019ba9fd3b -- | sort)"
          expected="$(printf '%s\n' migration/BeatGaler-agent-state.md migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md | sort)"
          test "$actual" = "$expected"
          git diff --quiet f381d77a50280a4a1c19bbfbd7c717019ba9fd3b -- src scripts tests package.json package-lock.json src-tauri

      - name: Commit documentation closure
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v0.9.0-test-noche
          test "$(git rev-parse origin/v0.9.0-test-noche)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close task 9.1"
          git push origin HEAD:v0.9.0-test-noche
