name: Task 5.4 Apply

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-5-4-apply.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Guard branch
        run: |
          test "$GITHUB_REF_NAME" = "v0.9.0-test-noche"
          test "$(git branch --show-current)" = "v0.9.0-test-noche"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply task 5.4 extraction
        run: |
          python3 .github/task-5-4-apply.py
          python3 .github/task-5-4-fix-tests.py

      - name: Run migration checks and save readable logs
        run: node scripts/run-migration-checks-with-logs.mjs

      - name: Diff check
        run: git diff --check

      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-5-4-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/migration-check-logs/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce migration summary
        run: grep -Fx "Migration checks: PASS" artifacts/migration-check-logs/summary.txt

      - name: Commit verified implementation
        run: |
          rm .github/workflows/task-5-4-apply.yml .github/task-5-4-apply.py .github/task-5-4-fix-tests.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/offline/useOfflineAvailability.ts tests/integration/appOfflineAvailabilityExtraction.test.ts tests/integration/appPlaybackExtraction.test.ts scripts/run-regressions.mjs .github/workflows/task-5-4-apply.yml .github/task-5-4-apply.py .github/task-5-4-fix-tests.py
          git diff --cached --check
          git commit -m "refactor(app): extract offline availability"
          test "$(git branch --show-current)" = "v0.9.0-test-noche"
          git push origin HEAD:v0.9.0-test-noche
