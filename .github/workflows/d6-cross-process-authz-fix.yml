name: D6 Scoped Cross-Process Authz Fix

on:
  push:
    branches:
      - woz/task-6.1-unified-authorization

permissions:
  contents: write

jobs:
  patch-authz-wiring:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: woz/task-6.1-unified-authorization
          fetch-depth: 0

      - name: Apply scoped D6 patch
        run: node scripts/d6-cross-process-authz-fix.cjs

      - name: Verify patched syntax
        run: |
          node --check cloud-server/http-containment.js
          node --check cloud-server/postgres-installation-claim-coordinator.js
          node --check cloud-server/tests/postgres-installation-claim-coordinator.test.cjs
          node --check cloud-server/tests/postgres-installation-claim-cross-process.integration.cjs
          node --check scripts/regression-http-containment.mjs

      - name: Commit scoped patch and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BeatGaler WOZ"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/d6-cross-process-authz-fix.yml scripts/d6-cross-process-authz-fix.cjs
          git add cloud-server/http-containment.js scripts/regression-http-containment.mjs .github/workflows/test-desktop-portability.yml
          git diff --cached --check
          git commit -m "security(authz): coordinate installation claims across processes"
          git push origin HEAD:woz/task-6.1-unified-authorization
