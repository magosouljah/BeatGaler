name: temp task 10.1 validation

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/temp-task-10-1.yml
      - .github/scripts/temp-task-10-1.mjs
      - .github/scripts/temp-task-10-1-fix.mjs
      - .github/scripts/temp-task-10-1-regression-fix.mjs

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply task 10.1 extraction
        run: |
          node .github/scripts/temp-task-10-1.mjs
          node .github/scripts/temp-task-10-1-fix.mjs
          node .github/scripts/temp-task-10-1-regression-fix.mjs
      - name: Focused characterization
        run: npx vitest run tests/component-dom/appShellExtraction.test.ts
      - name: Typecheck
        run: npm run test:typecheck
      - name: Unit TS
        run: npm run test:unit:ts
      - name: Component DOM
        run: npm run test:component:dom
      - name: Integration
        id: integration
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee integration.log
      - name: Capture integration failure
        if: steps.integration.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f integration.log
          git commit -m "chore(migration): capture task 10.1 integration contract"
          git push origin HEAD:v0.9.0-test-noche
          exit 1
      - name: Regressions
        id: regressions
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:regressions 2>&1 | tee regressions.log
      - name: Capture regression failure
        if: steps.regressions.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f regressions.log
          git commit -m "chore(migration): capture task 10.1 regression contract"
          git push origin HEAD:v0.9.0-test-noche
          exit 1
      - name: Web build
        run: npm run build:web
      - name: Desktop frontend build
        run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/app/AppShell.tsx src/app/useAppShortcuts.ts src/features/publishing/usePublishingActions.ts scripts/run-regressions.mjs tests/component-dom/appShellExtraction.test.ts tests/component-dom/startupRevealArchitecture.test.ts tests/integration/issue97RuntimeWebFollowup.test.ts tests/integration/appBeatDownloadsExtraction.test.ts tests/integration/appCloudUploadQueueExtraction.test.ts tests/integration/appImportSaveAllExtraction.test.ts tests/integration/appLibraryReloadExtraction.test.ts tests/integration/appMigrationCharacterization.test.ts tests/integration/appSessionExtraction.test.ts tests/integration/appTagRenameExtraction.test.ts tests/integration/issue97DrawerWebRoutingContract.test.ts tests/integration/selectionReorderExtraction.test.ts
          git commit -m "refactor(app): extract remaining visual shell"
          git push origin HEAD:v0.9.0-test-noche
