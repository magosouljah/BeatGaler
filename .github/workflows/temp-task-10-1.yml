name: temp task 10.1 validation

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/temp-task-10-1.yml
      - .github/scripts/temp-task-10-1-close.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - name: Verify validated implementation remains in branch history
        run: git merge-base --is-ancestor 869b47565d794fcdeedff13340d0f57bf7545424 HEAD
      - name: Close task 10.1
        run: python3 .github/scripts/temp-task-10-1-close.py
      - name: Commit closure and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temp-task-10-1.yml .github/workflows/temp-task-10-1-close.yml
          git rm -f .github/scripts/temp-task-10-1*.mjs .github/scripts/temp-task-10-1-close.py || true
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/BeatGaler-agent-state.md migration/Registro-de-avance.md
          git commit -m "docs(migration): close task 10.1"
          git push origin HEAD:v0.9.0-test-noche
