name: Fix integration lock version

on:
  push:
    branches:
      - integration-v0.8.0-alpha.1
    paths:
      - .github/workflows/fix-integration-lock-version.yml

permissions:
  contents: write

jobs:
  fix-lock-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration-v0.8.0-alpha.1
          fetch-depth: 0

      - name: Align package-lock version and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('package-lock.json')
          text = path.read_text(encoding='utf-8')
          old = '"version": "0.7.0"'
          if text.count(old) < 2:
              raise SystemExit('Expected at least two 0.7.0 version entries in package-lock.json')
          text = text.replace(old, '"version": "0.7.4"', 2)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-integration-lock-version.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/fix-integration-lock-version.yml
          git diff --cached --check
          git commit -m "fix(integration): align package lock version"
          git push origin HEAD:integration-v0.8.0-alpha.1
