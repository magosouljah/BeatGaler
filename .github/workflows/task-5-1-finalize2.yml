name: Task 5.1 Finalize 2

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-5-1-finalize2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - name: Apply versioned finalizer
        run: python scripts/task-5-1-finalize-temp.py
      - name: Verify and publish close
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('migration/Registro-de-avance.md'); p.write_text(p.read_text().rstrip(chr(10)) + chr(10))"
          rm -f .github/workflows/task-5-1-checks.yml
          rm -f .github/workflows/task-5-1-finalize.yml
          rm -f .github/workflows/task-5-1-finalize2.yml
          rm -f scripts/task-5-1-finalize-temp.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs(migration): close task 5.1"
          git push origin HEAD:v0.9.0-test-noche
