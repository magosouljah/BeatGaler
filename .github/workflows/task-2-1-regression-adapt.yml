name: Temporary Task 2.1 Regression Adapt

on:
  push:
    branches:
      - app-tsx-migration
    paths:
      - .github/workflows/task-2-1-regression-adapt.yml

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-tsx-migration
          fetch-depth: 0

      - name: Retarget regression guard to extracted modal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run-regressions.mjs')
          text = path.read_text(encoding='utf-8')

          app_anchor = '  const app = readFileSync(path.join(root, "src", "App.tsx"), "utf8");\n'
          modal_read = '  const beatFileDropModal = readFileSync(path.join(root, "src", "features", "dragdrop", "components", "BeatFileDropModal.tsx"), "utf8");\n'
          if modal_read not in text:
              if app_anchor not in text:
                  raise SystemExit('App source guard anchor not found')
              text = text.replace(app_anchor, app_anchor + modal_read, 1)

          old_roles = '  if (app.includes(\'projectSamples\') || app.includes(\'projectAudio\') || app.includes(\'role: "other"\')) fail("Existing-beat drop chooser reintroduced Samples/Audio split or Other.");'
          new_roles = '  if (beatFileDropModal.includes(\'projectSamples\') || beatFileDropModal.includes(\'projectAudio\') || beatFileDropModal.includes(\'role: "other"\')) fail("Existing-beat drop chooser reintroduced Samples/Audio split or Other.");'
          if old_roles not in text:
              raise SystemExit('Existing-beat role guard not found')
          text = text.replace(old_roles, new_roles, 1)

          old_coming_soon = '  if (!app.includes(\'Loop · Coming soon\') || !app.includes(\'Stems · Coming soon\')) fail("Loop/Stems must remain visible as Coming soon, not active upload destinations.");'
          new_coming_soon = '  if (!beatFileDropModal.includes(\'Loop · Coming soon\') || !beatFileDropModal.includes(\'Stems · Coming soon\')) fail("Loop/Stems must remain visible as Coming soon, not active upload destinations.");'
          if old_coming_soon not in text:
              raise SystemExit('Loop/Stems guard not found')
          text = text.replace(old_coming_soon, new_coming_soon, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit test adaptation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task-2-1-regression-adapt.yml
          git add scripts/run-regressions.mjs
          git commit -m "test: follow extracted beat file drop modal"
          git push origin HEAD:app-tsx-migration
