name: Auth public registration hardening

on:
  push:
    branches:
      - feat/auth-public-registration-hardening
  pull_request:
    branches:
      - release/0.9.0-beta.1

jobs:
  auth-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Syntax
        run: |
          node --check cloud-server/auth-public-registration-hardening.js
          node --check cloud-server/provider-identity-authority.js
          node --check cloud-server/sensitive-auth-containment.js
          node --check cloud-server/session-security.js
          node --check cloud-server/auth-durable-abuse-controls.js
          node --check cloud-server/staged-email-change.js
          node --check cloud-server/staged-email-change-routes.js
          node --check cloud-server/pending-signup-runtime.js
          node --check cloud-server/pending-signup-service.js
          node --check cloud-server/pending-signup-boundary.js
          node --check cloud-server/auth-delivery-worker.js
          node --check cloud-server/auth-identity-preflight.js
          node --check cloud-server/scripts/auth-identity-preflight.cjs
          node --check cloud-server/account-lifecycle-verified-email-activation.js
          node --check cloud-server/server-core-auth-bridge-loader.js
          node --check cloud-server/signup-activation-coordinator.js
          node --check cloud-server/postgres-auth-multiprocess-compat.js
          node --check cloud-server/control-plane-cutover-runtime.js
          node --check cloud-server/master-storage.js
          node --check cloud-server/server.js
          node --check cloud-server/tests/auth-public-registration-hardening.test.cjs
          node --check cloud-server/tests/auth-identity-preflight.test.cjs
          node --check cloud-server/tests/pending-signup-safety.test.mjs
          node --check cloud-server/tests/signup-activation-safety.test.cjs
          node --check cloud-server/tests/server-core-auth-bridge-loader.test.cjs
          node --check cloud-server/tests/postgres-auth-multiprocess-compat.test.cjs
          node --check cloud-server/tests/provider-identity-authority.test.cjs
          node --check cloud-server/tests/sensitive-auth-containment.test.cjs
          node --check cloud-server/tests/staged-email-change.test.cjs
          node --check cloud-server/tests/staged-email-change-routes.test.cjs
          node --check cloud-server/tests/account-email-ses-staged.test.cjs
      - name: Focused auth tests
        working-directory: cloud-server
        run: npm run test:auth-hardening
