name: Temporary Task 4.2 Final 2
on:
  push:
    branches: [v0.9.0-test-noche]
    paths: [.github/workflows/task-4-2-final2.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply task 4.2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/task-4-2-retry.yml').read_text(); marker="          python - <<'PY'\n"; starts=[]; pos=0
          while True:
              i=text.find(marker,pos)
              if i<0: break
              starts.append(i+len(marker)); pos=i+len(marker)
          def script_at(start):
              end=text.index("\n          PY",start)
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())
          first=script_at(starts[0]).replace("assert 'cookingPlaybackUrlRef' not in s\n",'').replace("assert 'cookingWarmPromisesRef' not in s\n",'')
          exec(compile(first,'<extract>','exec'),{})
          exec(compile(script_at(starts[1]),'<guards>','exec'),{})

          p=Path('src/features/playback/usePlaybackController.ts'); s=p.read_text()
          event_marker='''    useEffect(() => {\n      window.addEventListener("beatgaler:playback-cache-cleared", clearPlaybackPreparation);'''
          addition='''    const invalidatePlaybackPreparation = useCallback((beatId: string) => {\n      cookingPlaybackUrlRef.current.delete(beatId);\n      cookingWarmPromisesRef.current.delete(beatId);\n    }, []);\n\n'''
          if 'const invalidatePlaybackPreparation' not in s:
              s=s.replace(event_marker,addition+event_marker,1)
          s=s.replace('return { clearPlaybackPreparation, ensureWarmPlaybackUrl, handlePlay, handleWarm, waitForUploadedBeatPlaybackReady };','return { clearPlaybackPreparation, ensureWarmPlaybackUrl, handlePlay, handleWarm, invalidatePlaybackPreparation, waitForUploadedBeatPlaybackReady };')
          p.write_text(s)

          p=Path('src/App.tsx'); s=p.read_text()
          s=s.replace('const { clearPlaybackPreparation, ensureWarmPlaybackUrl, handlePlay, handleWarm, waitForUploadedBeatPlaybackReady } = usePlaybackController({','const { clearPlaybackPreparation, ensureWarmPlaybackUrl, handlePlay, handleWarm, invalidatePlaybackPreparation, waitForUploadedBeatPlaybackReady } = usePlaybackController({',1)
          s=s.replace('cookingPlaybackUrlRef.current.delete(beat.id);','invalidatePlaybackPreparation(beat.id);')
          s=s.replace('cookingWarmPromisesRef.current.delete(beat.id);','')
          p.write_text(s)

          p=Path('scripts/run-regressions.mjs'); s=p.read_text()
          s=s.replace('if (!app.includes(\'beatCloudUpdateBusyIds.has(beat.id)\')) fail("Queue/direct Play can bypass a running slot/project update.");','if (!playbackController.includes(\'isBeatCloudUpdateBusy(inputBeat.id)\')) fail("Queue/direct Play can bypass a running slot/project update.");',1)
          p.write_text(s)
          PY
          cat > tests/integration/appPlaybackExtraction.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { resolve } from "node:path";
          import { describe, expect, it } from "vitest";
          const appSource = readFileSync(resolve(process.cwd(), "src/App.tsx"), "utf8");
          const controllerSource = readFileSync(resolve(process.cwd(), "src/features/playback/usePlaybackController.ts"), "utf8");
          describe("App playback extraction", () => {
            it("moves playback preparation, invalidation, audio events and play routing out of App", () => {
              expect(appSource).toContain('usePlaybackController({');
              expect(appSource).not.toContain('const ensureWarmPlaybackUrl = useCallback');
              expect(appSource).not.toContain('APP_HANDLE_PLAY_ENTER');
              expect(appSource).not.toContain('beatgaler:playback-cache-cleared');
              expect(appSource).not.toContain('cookingPlaybackUrlRef');
              expect(controllerSource).toContain('beatgaler:playback-cache-cleared');
              expect(controllerSource).toContain('beatgaler:audio-playing');
              expect(controllerSource).toContain('invalidatePlaybackPreparation');
              expect(controllerSource).toContain('APP_HANDLE_PLAY_ENTER');
              expect(controllerSource).toContain('if (!isTauriAvailable)');
              expect(controllerSource).toContain('prepareBeatForPlayback(beat)');
            });
          });
          EOF
      - name: Checks
        shell: bash
        run: |
          mkdir -p migration-check-logs; : > migration-check-logs/summary.txt; failed=0
          run_check() { name="$1"; shift; echo "== $name ==" | tee -a migration-check-logs/summary.txt; if "$@" > "migration-check-logs/$name.log" 2>&1; then echo "PASS $name" | tee -a migration-check-logs/summary.txt; else echo "FAIL $name" | tee -a migration-check-logs/summary.txt; failed=1; fi; }
          run_check diff-check git diff --check
          run_check typecheck npm run test:typecheck
          run_check unit-ts npm run test:unit:ts
          run_check component-dom npm run test:component:dom
          run_check integration npm run test:integration
          run_check regressions npm run test:regressions
          run_check build-web npm run build:web
          run_check build npm run build
          exit "$failed"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-4-2-${{ github.run_id }}
          path: migration-check-logs/
      - name: Commit implementation
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/features/playback/usePlaybackController.ts tests/integration/appPlaybackExtraction.test.ts tests/integration/appMigrationCharacterization.test.ts tests/integration/issue97RuntimeWebFollowup.test.ts scripts/run-regressions.mjs
          git commit -m "refactor(app): extract playback controller"
          git push origin HEAD:v0.9.0-test-noche
