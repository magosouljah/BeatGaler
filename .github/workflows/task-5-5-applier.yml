name: Task 5.5 Trash Actions Applier

on:
  push:
    branches: [v0.9.0-test-noche]

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Apply task 5.5 extraction
        run: python3 scripts/task-5-5-applier-temp.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migration checks and save readable logs
        id: migration_checks
        continue-on-error: true
        run: node scripts/run-migration-checks-with-logs.mjs

      - name: Upload migration check logs after failure
        if: steps.migration_checks.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-5-5-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/migration-check-logs/
          if-no-files-found: error
          retention-days: 7

      - name: Fail if migration checks failed
        if: steps.migration_checks.outcome == 'failure'
        run: exit 1

      - name: Commit verified task 5.5 and remove temporary tooling
        if: steps.migration_checks.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task-5-5-applier.yml scripts/task-5-5-applier-temp.py
          git add src/App.tsx src/features/trash/useTrashActions.ts scripts/run-regressions.mjs
          git diff --cached --check
          git commit -m "refactor(app): extract trash actions"
          git push origin HEAD:v0.9.0-test-noche
