name: Task 5.4 Close

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-5-4-close.yml

permissions:
  contents: write

jobs:
  close-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Guard branch
        run: |
          test "$GITHUB_REF_NAME" = "v0.9.0-test-noche"
          test "$(git branch --show-current)" = "v0.9.0-test-noche"
          test "$(git rev-parse 3b437aee8454b392e832b8bce65485be731e045b^{commit})" = "3b437aee8454b392e832b8bce65485be731e045b"

      - name: Close task 5.4 documentation
        run: python3 .github/task-5-4-close.py

      - name: Verify closure diff
        run: |
          git diff --check
          git diff -- migration/BeatGaler-roadmap-para-trabajar-con-IAs.md | grep -F -- '### [x] 5.4 — Separar Available Offline'
          grep -F '### Registro — 5.4' migration/Registro-de-avance.md
          grep -F '5.5 — Separar papelera y restauración' migration/BeatGaler-agent-state.md

      - name: Commit closure and remove temporary tooling
        run: |
          rm .github/workflows/task-5-4-close.yml .github/task-5-4-close.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md migration/BeatGaler-agent-state.md .github/workflows/task-5-4-close.yml .github/task-5-4-close.py
          git diff --cached --check
          git commit -m "docs(migration): close task 5.4"
          test "$(git branch --show-current)" = "v0.9.0-test-noche"
          git push origin HEAD:v0.9.0-test-noche
