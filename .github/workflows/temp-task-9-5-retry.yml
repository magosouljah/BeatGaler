name: Temporary Task 9.5 Integration Diagnostic

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/temp-task-9-5-retry.yml

permissions:
  contents: write

jobs:
  diagnose-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Apply validated-so-far task 9.5 candidate
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/temp-task-9-5-apply.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end]) + '\n'
          exec(compile(code, '<task-9-5-apply>', 'exec'), {'__name__': '__main__'})
          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          anchor = 'import { useLibraryReveal } from "./features/startup/useLibraryReveal";\n'
          app_path.write_text(app.replace(anchor, anchor + 'import { dismissBeatGalerStartupLoader } from "./features/startup/startupLoader";\n', 1))
          test_path = Path('tests/component-dom/startupRevealArchitecture.test.ts')
          test = test_path.read_text()
          test = test.replace('const app = readFileSync("src/App.tsx", "utf8");\n', 'const app = readFileSync("src/App.tsx", "utf8");\nconst libraryRevealOwner = readFileSync("src/features/startup/useLibraryReveal.ts", "utf8");\n', 1)
          test = test.replace('    expect(app).toContain("title + artwork are enough to show a beat");', '    expect(libraryRevealOwner).toContain("Authority pass: title + artwork reveal a card. Audio remains a later viewport warmup.");', 1)
          test_path.write_text(test)
          PY
      - name: Capture integration failure
        shell: bash
        run: |
          set +e
          npm run test:integration > task-9-5-integration.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> task-9-5-integration.txt
          cat task-9-5-integration.txt
          exit 0
      - name: Publish diagnostic on test branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task-9-5-integration.txt
          git commit -m "chore(migration): capture task 9.5 integration failure"
          git push origin HEAD:v0.9.0-test-noche
