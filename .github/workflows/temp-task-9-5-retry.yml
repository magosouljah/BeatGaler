name: Temporary Task 9.5 Final Validation

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/temp-task-9-5-retry.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 2
      - name: Verify expected base
        shell: bash
        run: |
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "595b4dfca7464c019ceeca3367d50487687c9c68" || { echo "Unexpected base: $parent"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Apply task 9.5 candidate and align architecture contract
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/temp-task-9-5-apply.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end]) + '\n'
          exec(compile(code, '<task-9-5-apply>', 'exec'), {'__name__': '__main__'})

          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          anchor = 'import { useLibraryReveal } from "./features/startup/useLibraryReveal";\n'
          assert anchor in app
          app = app.replace(anchor, anchor + 'import { dismissBeatGalerStartupLoader } from "./features/startup/startupLoader";\n', 1)
          app_path.write_text(app)

          test_path = Path('tests/component-dom/startupRevealArchitecture.test.ts')
          test = test_path.read_text()
          old = '''  assert.match(\n    appSource,\n    /prevModeRef\\.current === "library" && mode !== "library"/,\n    "App should own the first eligible library reveal transition",\n  );'''
          new = '''  assert.match(\n    revealHookSource,\n    /prevModeRef\\.current === "library" && mode !== "library"/,\n    "the reveal hook should own the first eligible library reveal transition",\n  );'''
          assert old in test, 'stale architecture assertion not found'
          test_path.write_text(test.replace(old, new, 1))
          PY
      - name: Focused 9.5 tests
        run: npx vitest run tests/integration/appLibraryRevealExtraction.test.ts tests/integration/appStartupBootstrapExtraction.test.ts --environment jsdom
      - name: Typecheck
        run: npm run test:typecheck
      - name: Unit TypeScript
        run: npm run test:unit:ts
      - name: Component DOM
        run: npm run test:component:dom
      - name: Integration
        run: npm run test:integration
      - name: Regressions
        run: npm run test:regressions
      - name: Core E2E
        run: npm run e2e:core
      - name: App guard
        run: npm run guard:app
      - name: Web build
        run: npm run build:web
      - name: Full build
        run: npm run build
      - name: Publish validated implementation on test branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f task-9-5-component.log
          git add src/App.tsx src/features/startup/startupLoader.ts src/features/startup/useLibraryReveal.ts tests/integration/appLibraryRevealExtraction.test.ts tests/component-dom/startupRevealArchitecture.test.ts scripts/run-regressions.mjs
          git add -u task-9-5-component.log || true
          git commit -m "refactor(app): extract library reveal orchestration"
          git push origin HEAD:v0.9.0-test-noche
