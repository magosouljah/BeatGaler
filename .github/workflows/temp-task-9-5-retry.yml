name: Temporary Task 9.5 Close

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/temp-task-9-5-retry.yml

permissions:
  contents: write

jobs:
  close-task-9-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 30
      - name: Verify expected base
        shell: bash
        run: |
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "a023e30dd936caef4df90d9a3d220b15f040625e" || { echo "Unexpected base: $parent"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Apply task 9.5 candidate
        run: python3 .github/scripts/temp-task-9-5-close.py apply
      - name: Focused task 9.5 characterization
        run: npx vitest run tests/integration/appLibraryRevealExtraction.test.ts tests/integration/appStartupBootstrapExtraction.test.ts --environment jsdom
      - name: Typecheck
        run: npm run test:typecheck
      - name: Unit TS
        run: npm run test:unit:ts
      - name: Component DOM
        run: npm run test:component:dom
      - name: Integration
        run: npm run test:integration
      - name: Regressions
        run: npm run test:regressions
      - name: Web build
        run: npm run build:web
      - name: Desktop frontend build
        run: npm run build
      - name: Commit validated implementation
        shell: bash
        run: |
          rm -f .github/workflows/temp-task-9-5-apply.yml .github/workflows/temp-task-9-5-retry.yml
          rm -f task-9-5-component.log task-9-5-integration.txt task-9-5-e2e.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/startup/useLibraryReveal.ts src/features/startup/startupLoader.ts tests/integration/appLibraryRevealExtraction.test.ts tests/component-dom/startupRevealArchitecture.test.ts tests/integration/issue97RuntimeWebFollowup.test.ts scripts/run-regressions.mjs .github/workflows/temp-task-9-5-apply.yml .github/workflows/temp-task-9-5-retry.yml task-9-5-component.log task-9-5-integration.txt task-9-5-e2e.txt
          git commit -m "refactor(startup): extract library reveal"
          echo "IMPLEMENTATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:v0.9.0-test-noche
      - name: Update migration evidence
        shell: bash
        run: |
          python3 .github/scripts/temp-task-9-5-close.py docs "$IMPLEMENTATION_SHA"
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/BeatGaler-agent-state.md migration/Registro-de-avance.md .github/scripts/temp-task-9-5-close.py
          git rm .github/scripts/temp-task-9-5-close.py
          git commit -m "docs(migration): close task 9.5"
          git push origin HEAD:v0.9.0-test-noche
