name: Temporary Task 9.5 Retry

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/temp-task-9-5-retry.yml

permissions:
  contents: write

jobs:
  retry-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 2
      - name: Verify expected base
        shell: bash
        run: |
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "25e8c326ff95d125ddb758d77d5da1258c8e2bbf" || { echo "Unexpected base: $parent"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Reapply extraction with loader import fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/temp-task-9-5-apply.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          lines = []
          for line in workflow[start:end]:
              lines.append(line[10:] if line.startswith('          ') else line)
          code = '\n'.join(lines) + '\n'
          exec(compile(code, '<task-9-5-apply>', 'exec'), {'__name__': '__main__'})

          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          anchor = 'import { useLibraryReveal } from "./features/startup/useLibraryReveal";\n'
          assert anchor in app
          app = app.replace(anchor, anchor + 'import { dismissBeatGalerStartupLoader } from "./features/startup/startupLoader";\n', 1)
          app_path.write_text(app)
          PY
      - name: Focused 9.5 tests
        run: npx vitest run tests/integration/appLibraryRevealExtraction.test.ts tests/integration/appStartupBootstrapExtraction.test.ts --environment jsdom
      - run: npm run test:typecheck
      - run: npm run test:unit:ts
      - run: npm run test:component:dom
      - run: npm run test:integration
      - run: npm run test:regressions
      - run: npm run build:web
      - run: npm run build
      - name: Commit validated implementation and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/temp-task-9-5-apply.yml .github/workflows/temp-task-9-5-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/startup/useLibraryReveal.ts src/features/startup/startupLoader.ts tests/integration/appLibraryRevealExtraction.test.ts scripts/run-regressions.mjs .github/workflows/temp-task-9-5-apply.yml .github/workflows/temp-task-9-5-retry.yml
          git commit -m "refactor(startup): extract library reveal"
          git push origin HEAD:v0.9.0-test-noche
