name: Temporary Task 9.5 Diagnostic

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/temp-task-9-5-retry.yml

permissions:
  contents: write

jobs:
  diagnose-component-dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 2
      - name: Verify expected base
        shell: bash
        run: |
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "7d740c9a81450c046875dd54ec2a99e7981c35c6" || { echo "Unexpected base: $parent"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Reapply task 9.5 candidate
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/temp-task-9-5-apply.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          lines = []
          for line in workflow[start:end]:
              lines.append(line[10:] if line.startswith('          ') else line)
          code = '\n'.join(lines) + '\n'
          exec(compile(code, '<task-9-5-apply>', 'exec'), {'__name__': '__main__'})
          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          anchor = 'import { useLibraryReveal } from "./features/startup/useLibraryReveal";\n'
          assert anchor in app
          app = app.replace(anchor, anchor + 'import { dismissBeatGalerStartupLoader } from "./features/startup/startupLoader";\n', 1)
          app_path.write_text(app)
          PY
      - name: Capture component DOM failure
        shell: bash
        run: |
          set +e
          npm run test:component:dom > task-9-5-component.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> task-9-5-component.log
          cat task-9-5-component.log
          exit 0
      - name: Publish diagnostic log on test branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task-9-5-component.log
          git commit -m "chore(migration): capture task 9.5 component failure"
          git push origin HEAD:v0.9.0-test-noche
