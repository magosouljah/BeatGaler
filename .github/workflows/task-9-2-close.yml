name: Task 9.2 Close

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-9-2-close.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Guard branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v0.9.0-test-noche"
          git fetch origin v0.9.0-test-noche
          test "$(git rev-parse origin/v0.9.0-test-noche)" = "${GITHUB_SHA}"
          echo "PRE_CLOSE_HEAD=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Write documentation
        shell: bash
        run: python .github/task-9-2-close.py

      - name: Validate and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/task-9-2-close.py
          rm -f .github/workflows/task-9-2-close.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .github/task-9-2-close.py .github/workflows/task-9-2-close.yml migration/BeatGaler-agent-state.md migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md | sort)"
          test "${changed}" = "${expected}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close task 9.2"
          git push origin HEAD:v0.9.0-test-noche
