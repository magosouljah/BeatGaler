name: Temporary Task 3.2 Apply

on:
  push:
    branches:
      - app-tsx-3.2

permissions:
  contents: write

concurrency:
  group: task-3-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: app-tsx-3.2
          fetch-depth: 0

      - name: Use project Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply task 3.2 extraction
        run: node scripts/apply-task-3-2.mjs

      - name: Patch hygiene
        run: git diff --check

      - name: Typecheck
        run: npm run test:typecheck

      - name: TypeScript unit tests
        run: npm run test:unit:ts

      - name: Component DOM tests
        run: npm run test:component:dom

      - name: Integration tests
        run: npm run test:integration

      - name: Regression guards
        run: npm run test:regressions

      - name: Web build
        run: npm run build:web

      - name: Desktop frontend build
        run: npm run build

      - name: Publish verified extraction and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/state/useBeatRuntimeRegistry.ts tests/component-dom/beatRuntimeRegistry.test.tsx scripts/run-regressions.mjs
          git rm scripts/apply-task-3-2.mjs .github/workflows/task-3-2-apply.yml
          git diff --cached --check
          git commit -m "refactor(app): extract beat runtime registry"
          git push origin HEAD:app-tsx-3.2
