name: Temporary Task 4.2 Retry

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/task-4-2-retry.yml

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply corrected extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/task-4-2-apply.yml').read_text()
          start_marker = "          cat > src/features/playback/usePlaybackController.ts <<'EOF'\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index("\n          EOF", start)
          block = workflow[start:end]
          lines = [(line[10:] if line.startswith('          ') else line) for line in block.splitlines()]
          controller = '\n'.join(lines) + '\n'
          controller = controller.replace(
              'return { clearPlaybackPreparation, handlePlay, handleWarm, waitForUploadedBeatPlaybackReady };',
              'return { clearPlaybackPreparation, ensureWarmPlaybackUrl, handlePlay, handleWarm, waitForUploadedBeatPlaybackReady };'
          )
          Path('src/features/playback/usePlaybackController.ts').write_text(controller)

          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace('import { isBeatPlaybackBlocked } from "./features/playback/playbackReadiness";\n', '')
          s = s.replace('import { playTrace } from "./features/playback/playTrace";\n', '')
          anchor = 'import { useWebPlaybackSortRouting } from "./features/playback/useWebPlaybackSortRouting";\n'
          assert anchor in s
          s = s.replace(anchor, anchor + 'import { usePlaybackController } from "./features/playback/usePlaybackController";\n', 1)
          old_refs = '''  const cookingPlaybackUrlRef = useRef<Map<string, { telegramFileId: string; url: string }>>(new Map());\n  const cookingWarmPromisesRef = useRef<Map<string, Promise<string | null>>>(new Map());\n  // Incremented whenever temporary playback cache is cleared. Warm promises\n  // capture the epoch so a promise started before Clear cache cannot repopulate\n  // the Fast Play map with a URL backed by files that were just deleted.\n  const playbackCacheEpochRef = useRef(0);\n'''
          assert old_refs in s
          s = s.replace(old_refs, '')
          audio_anchor = '  const { state: audio, play, togglePause, seek, setVolume, releaseFile } = useAudio();\n'
          hook = '''  const { state: audio, play, togglePause, seek, setVolume, releaseFile } = useAudio();\n  const { clearPlaybackPreparation, ensureWarmPlaybackUrl, handlePlay, handleWarm, waitForUploadedBeatPlaybackReady } = usePlaybackController({\n    audio,\n    play,\n    beatsLatestRef,\n    beatRuntimeStatesRef,\n    transitionRuntime,\n    setBeats,\n    cloudSessionVerified,\n    connectionState,\n    isBeatCloudUpdateBusy: beatId => beatCloudUpdateBusyIds.has(beatId),\n  });\n'''
          assert audio_anchor in s
          s = s.replace(audio_anchor, hook, 1)

          start = s.index('  useEffect(() => {\n    const onPlaybackCacheCleared = () => {')
          mid = s.index('  useEffect(() => {\n    const onTelegramConnected = (event: Event) => {', start)
          s = s[:start] + s[mid:]
          start = s.index('  const ensureWarmPlaybackUrl = useCallback((beat: Beat): Promise<string | null> => {')
          end = s.index('  const handleUpload = useCallback((beat: Beat) => {', start)
          s = s[:start] + s[end:]

          s = s.replace('cookingWarmPromisesRef.current.clear();\n      cookingPlaybackUrlRef.current.clear();', 'clearPlaybackPreparation();')
          s = s.replace('cookingWarmPromisesRef.current.clear();\n          cookingPlaybackUrlRef.current.clear();', 'clearPlaybackPreparation();')
          s = s.replace('cookingPlaybackUrlRef.current.clear();\n    cookingWarmPromisesRef.current.clear();', 'clearPlaybackPreparation();')
          s = s.replace('cookingPlaybackUrlRef.current.clear();\n        cookingWarmPromisesRef.current.clear();', 'clearPlaybackPreparation();')
          s = s.replace('cookingWarmPromisesRef.current.clear();', '')
          s = s.replace('cookingPlaybackUrlRef.current.clear();', 'clearPlaybackPreparation();')
          assert 'cookingPlaybackUrlRef' not in s
          assert 'cookingWarmPromisesRef' not in s
          p.write_text(s)
          PY
      - name: Adapt source-location guards to the new owner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/integration/appMigrationCharacterization.test.ts')
          s = p.read_text()
          s = s.replace('const app = readFileSync(resolve(process.cwd(), "src/App.tsx"), "utf8");\n', 'const app = readFileSync(resolve(process.cwd(), "src/App.tsx"), "utf8");\nconst playbackController = readFileSync(resolve(process.cwd(), "src/features/playback/usePlaybackController.ts"), "utf8");\n')
          old = '''  it("keeps playback cache invalidation, real audio events and Web/Desktop preparation paths distinct", () => {\n    const audioEvents = section("const onPlaybackCacheCleared = () =>", "const previousAudioBeatIdRef = useRef");\n    expectOrdered(audioEvents, [\n      "playbackCacheEpochRef.current += 1",\n      "cookingPlaybackUrlRef.current.clear()",\n      "cookingWarmPromisesRef.current.clear()",\n    ]);\n    expect(audioEvents).toContain('window.addEventListener("beatgaler:audio-playing", onAudioPlaying)');\n    expect(audioEvents).toContain('transitionRuntime(beatId, { type: "PLAYBACK_PLAYING" })');\n\n    const play = section("const handlePlay = useCallback", "const handleUpload = useCallback");\n    expectOrdered(play, [\n      "if (!isTauriAvailable)",\n      "const prepared = await platform.media.preparePlayback(beat)",\n      "const ready = await prepareBeatForPlayback(beat)",\n    ]);\n    expect(play).toContain("platform.media.releasePlayback(beat.id)");\n  });'''
          new = '''  it("keeps playback cache invalidation, real audio events and Web/Desktop preparation paths distinct", () => {\n    expectOrdered(playbackController, [\n      "playbackCacheEpochRef.current += 1",\n      "cookingPlaybackUrlRef.current.clear()",\n      "cookingWarmPromisesRef.current.clear()",\n    ]);\n    expect(playbackController).toContain('window.addEventListener("beatgaler:audio-playing", onAudioPlaying)');\n    expect(playbackController).toContain('transitionRuntime(beatId, { type: "PLAYBACK_PLAYING" })');\n    expectOrdered(playbackController, [\n      "if (!isTauriAvailable)",\n      "const prepared = await platform.media.preparePlayback(beat)",\n      "const ready = await prepareBeatForPlayback(beat)",\n    ]);\n    expect(playbackController).toContain("platform.media.releasePlayback(beat.id)");\n    expect(app).toContain("usePlaybackController({");\n  });'''
          assert old in s
          p.write_text(s.replace(old, new))

          p = Path('tests/integration/issue97RuntimeWebFollowup.test.ts')
          s = p.read_text()
          old = '''  it("does not let Web card warming queue native cooking ahead of Play", () => {\n    const app = source("src/App.tsx");\n    expect(app).toContain('if (!platform.capabilities.playbackCache || !cloudSessionVerified || connectionState !== "online") return;');\n    expect(app).toContain("Math.min(isTauriAvailable ? 6 : 1, queue.length)");\n  });'''
          new = '''  it("does not let Web card warming queue native cooking ahead of Play", () => {\n    const app = source("src/App.tsx");\n    const playbackController = source("src/features/playback/usePlaybackController.ts");\n    expect(playbackController).toContain('if (!platform.capabilities.playbackCache || !cloudSessionVerified || connectionState !== "online") return;');\n    expect(app).toContain("Math.min(isTauriAvailable ? 6 : 1, queue.length)");\n  });'''
          assert old in s
          p.write_text(s.replace(old, new))

          p = Path('scripts/run-regressions.mjs')
          s = p.read_text()
          anchor = '  const audioHook = readFileSync(path.join(root, "src", "hooks", "useAudio.ts"), "utf8");\n'
          assert anchor in s
          s = s.replace(anchor, anchor + '  const playbackController = readFileSync(path.join(root, "src", "features", "playback", "usePlaybackController.ts"), "utf8");\n', 1)
          old = '''  if (!audioHook.includes('beatgaler:audio-playing') || !app.includes('window.addEventListener("beatgaler:audio-playing"')) fail("Playback runtime no longer waits for the real HTMLAudioElement playing event.");\n  if (app.includes('transitionRuntime(beat.id, { type: "PLAYBACK_PLAYING" }, beat);') || app.includes('transitionRuntime(beat.id, { type: "PLAYBACK_PLAYING" }, ready);')) fail("Playback state is marked playing before audio actually starts.");'''
          new = '''  if (!audioHook.includes('beatgaler:audio-playing') || !playbackController.includes('window.addEventListener("beatgaler:audio-playing"')) fail("Playback runtime no longer waits for the real HTMLAudioElement playing event.");\n  if ([app, playbackController].some(source => source.includes('transitionRuntime(beat.id, { type: "PLAYBACK_PLAYING" }, beat);') || source.includes('transitionRuntime(beat.id, { type: "PLAYBACK_PLAYING" }, ready);'))) fail("Playback state is marked playing before audio actually starts.");'''
          assert old in s
          p.write_text(s.replace(old, new))
          PY
          cat > tests/integration/appPlaybackExtraction.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { resolve } from "node:path";
          import { describe, expect, it } from "vitest";

          const appSource = readFileSync(resolve(process.cwd(), "src/App.tsx"), "utf8");
          const controllerSource = readFileSync(resolve(process.cwd(), "src/features/playback/usePlaybackController.ts"), "utf8");

          describe("App playback extraction", () => {
            it("moves playback preparation, cache invalidation, audio events and play routing out of App", () => {
              expect(appSource).toContain('usePlaybackController({');
              expect(appSource).not.toContain('const ensureWarmPlaybackUrl = useCallback');
              expect(appSource).not.toContain('APP_HANDLE_PLAY_ENTER');
              expect(appSource).not.toContain('beatgaler:playback-cache-cleared');
              expect(controllerSource).toContain('beatgaler:playback-cache-cleared');
              expect(controllerSource).toContain('beatgaler:audio-playing');
              expect(controllerSource).toContain('APP_HANDLE_PLAY_ENTER');
              expect(controllerSource).toContain('if (!isTauriAvailable)');
              expect(controllerSource).toContain('prepareBeatForPlayback(beat)');
            });
          });
          EOF
      - name: Checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p migration-check-logs
          : > migration-check-logs/summary.txt
          failed=0
          run_check() { name="$1"; shift; echo "== $name ==" | tee -a migration-check-logs/summary.txt; if "$@" > "migration-check-logs/$name.log" 2>&1; then echo "PASS $name" | tee -a migration-check-logs/summary.txt; else echo "FAIL $name" | tee -a migration-check-logs/summary.txt; failed=1; fi; }
          run_check diff-check git diff --check
          run_check typecheck npm run test:typecheck
          run_check unit-ts npm run test:unit:ts
          run_check component-dom npm run test:component:dom
          run_check integration npm run test:integration
          run_check regressions npm run test:regressions
          run_check build-web npm run build:web
          run_check build npm run build
          exit "$failed"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-4-2-${{ github.run_id }}
          path: migration-check-logs/
      - name: Commit verified implementation
        if: success()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/features/playback/usePlaybackController.ts tests/integration/appPlaybackExtraction.test.ts tests/integration/appMigrationCharacterization.test.ts tests/integration/issue97RuntimeWebFollowup.test.ts scripts/run-regressions.mjs
          git commit -m "refactor(app): extract playback controller"
          git push origin HEAD:v0.9.0-test-noche
