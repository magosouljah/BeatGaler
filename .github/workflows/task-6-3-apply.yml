name: Task 6.3 Apply

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-6-3-apply.yml

permissions:
  contents: write

concurrency:
  group: app-tsx-nightly-v0.9.0-test-noche
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Verify branch and execution base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v0.9.0-test-noche"
          git merge-base --is-ancestor 988a0e2af912a06a0d186008de8f6b0a3d28f64e HEAD
          git status --short

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Apply task 6.3 in runner workspace
        shell: bash
        run: |
          set -o pipefail
          mkdir -p migration-check-logs
          python .github/task-6-3.py apply 2>&1 | tee migration-check-logs/apply.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "PASS apply" > migration-check-logs/summary.txt
          else
            echo "FAIL apply exit=${status}" > migration-check-logs/summary.txt
            exit "$status"
          fi

      - name: Run migration verification matrix
        id: checks
        shell: bash
        run: |
          set +e
          failed=0

          run_check() {
            name="$1"
            shift
            echo "===== ${name} ====="
            "$@" >"migration-check-logs/${name}.log" 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "PASS ${name}" | tee -a migration-check-logs/summary.txt
            else
              echo "FAIL ${name} exit=${status}" | tee -a migration-check-logs/summary.txt
              failed=1
            fi
          }

          run_check npm-ci npm ci
          run_check diff-check git diff --check
          run_check typecheck npm run test:typecheck
          run_check unit-ts npm run test:unit:ts
          run_check component-dom npm run test:component:dom
          run_check integration npm run test:integration
          run_check regressions npm run test:regressions
          run_check build-web npm run build:web
          run_check build npm run build

          cat migration-check-logs/summary.txt
          exit "$failed"

      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-6-3-${{ github.run_id }}
          path: migration-check-logs/
          if-no-files-found: error
          retention-days: 14

      - name: Commit and publish verified implementation
        if: steps.checks.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx \
            src/features/cloud/desktopBeatUploadPipeline.ts \
            tests/integration/appDesktopBeatUploadPipelineExtraction.test.ts \
            tests/integration/appMigrationCharacterization.test.ts \
            scripts/run-regressions.mjs
          git diff --cached --check
          git commit -m "refactor(cloud): extract desktop beat upload pipeline"
          implementation_sha="$(git rev-parse HEAD)"
          git push origin HEAD:v0.9.0-test-noche
          remote_sha="$(git ls-remote origin refs/heads/v0.9.0-test-noche | cut -f1)"
          test "$remote_sha" = "$implementation_sha"
          echo "IMPLEMENTATION_SHA=${implementation_sha}" >> "$GITHUB_ENV"
          echo "REMOTE_IMPLEMENTATION_SHA=${remote_sha}" >> "$GITHUB_ENV"

      - name: Finalize migration documents and remove temporary tooling
        if: steps.checks.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python .github/task-6-3.py finalize \
            988a0e2af912a06a0d186008de8f6b0a3d28f64e \
            "$IMPLEMENTATION_SHA" \
            "$GITHUB_RUN_ID" \
            "$REMOTE_IMPLEMENTATION_SHA"
          rm .github/task-6-3.py .github/workflows/task-6-3-apply.yml
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md \
            migration/Registro-de-avance.md \
            migration/BeatGaler-agent-state.md \
            .github/task-6-3.py \
            .github/workflows/task-6-3-apply.yml
          git diff --cached --check
          git commit -m "docs(migration): close task 6.3"
          git push origin HEAD:v0.9.0-test-noche
