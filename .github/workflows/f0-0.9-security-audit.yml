name: F0 0.9 - AI-assisted Security Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f0-0-9-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security_audit:
    name: Security audit regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install Linux Tauri test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install locked root graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install locked cloud graph
        run: npm ci --prefix cloud-server --ignore-scripts --no-audit --no-fund

      - name: Audit root dependencies for high or critical advisories
        run: npm audit --audit-level=high

      - name: Audit cloud dependencies for high or critical advisories
        run: npm audit --prefix cloud-server --audit-level=high

      - name: Reproduce DNS rebinding SSRF and verify pinning
        run: node --test cloud-server/tests/outbound-dns-pinning.test.cjs

      - name: Run security boundary suite
        run: npm run test:security-boundary

      - name: Run TypeScript unit and adversarial fuzz tests
        run: npm run test:unit:ts

      - name: Run cloud security unit contracts
        run: npm run test:unit:cloud

      - name: Run Rust unit contracts
        run: npm run test:unit:rust

      - name: Run containment, trust-boundary, path and legacy regressions
        run: npm run test:regressions

      - name: Verify immutable GitHub Action pins
        run: node scripts/check-workflow-action-pins.mjs
