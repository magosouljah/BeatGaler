name: Task 5.2 Finalize

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-5-2-apply.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Finalize migration documents
        run: python3 scripts/task-5-2-finalize-temp.py

      - name: Review and commit closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task-5-2-apply.yml
          git rm scripts/task-5-2-apply-temp.py scripts/task-5-2-finalize-temp.py
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md migration/BeatGaler-agent-state.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "docs(migration): close task 5.2"
          git push origin HEAD:v0.9.0-test-noche
