name: Task 5.2 Apply

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-5-2-apply.yml

permissions:
  contents: write

env:
  TASK_BASE_SHA: 731c74df9c958d593184e71c0b9b5e21df71beae

jobs:
  apply-and-check:
    if: github.event.head_commit.message == 'chore(migration): stage task 5.2 extraction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Apply task 5.2 extraction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          app = app_path.read_text()

          import_anchor = 'import { useDrawerCloudPersistence } from "./features/edit/useDrawerCloudPersistence";\n'
          import_line = 'import { useBeatAssetUpdates } from "./features/edit/useBeatAssetUpdates";\n'
          assert import_anchor in app
          assert import_line not in app
          app = app.replace(import_anchor, import_anchor + import_line, 1)

          old_runner = '''  const runBeatCloudUpdate = useCallback((beat: Beat, filePath: string, work: () => Promise<void>) => {
            if (rejectOfflineMutation("Updating beat files")) {
              setBeatFileDrop(null);
              void cleanupStagedDropPaths([filePath]);
              return;
            }
            // Once the user chose a destination, the chooser is done. The long Telegram/
            // ZIP task belongs to the beat card, not to a blocking modal.
            setBeatFileDrop(null);
            setBeatCloudUpdateBusy(beat.id, true);
            const before = beatRuntimeStatesRef.current[beat.id] ?? createBeatRuntimeState(beat);
            if (before.sync_state === "synced") transitionRuntime(beat.id, { type: "SYNC_QUEUE_UPDATE" }, beat);
            transitionRuntime(beat.id, { type: "SYNC_UPDATE_STARTED" }, beat);

            void (async () => {
              let succeeded = false;
              try {
                await work();
                transitionRuntime(beat.id, { type: "SYNC_UPDATE_SUCCEEDED" }, beat);
                succeeded = true;
                setBeatCloudUpdateBusy(beat.id, false, true);
                try {
                  const audio = new Audio(uploadCompleteWav);
                  audio.volume = 0.72;
                  void audio.play().catch(() => {});
                } catch {}
              } catch (error) {
                console.error(error);
                const message = sanitizeUserVisibleText(runtimeErrorMessage(error), "Cloud operation failed.");
                if (isRuntimeConflictError(error)) transitionRuntime(beat.id, { type: "SYNC_CONFLICT", message }, beat);
                else transitionRuntime(beat.id, { type: "SYNC_FAILED", code: "BEAT_UPDATE_FAILED", message, retryable: true }, beat);
                setBeatCloudUpdateBusy(beat.id, false, false);
                await appAlert({ title: "Beat update failed", message, danger: true });
              } finally {
                // Drag/drop roots are private staging copies. The user can keep working
                // while the task runs, then the staging is reclaimed regardless of outcome.
                await cleanupStagedDropPaths([filePath]).catch(() => {});
                if (!succeeded) setBeatCloudUpdateBusy(beat.id, false, false);
              }
            })();
          }, [rejectOfflineMutation, transitionRuntime]);
'''
          assert old_runner in app
          new_runner = '''  const {
            runBeatCloudUpdate,
            startMasterAssetUpdate,
            startWavAssetUpdate,
            handleBrowserBeatAssetDrop,
          } = useBeatAssetUpdates({
            rejectOfflineMutation,
            setBeatFileDrop,
            setBeatCloudUpdateBusy,
            beatRuntimeStatesRef,
            transitionRuntime,
            beatsLatestRef,
            setBeats,
            setDrawer,
            waitForUploadedBeatPlaybackReady,
          });
'''
          app = app.replace(old_runner, new_runner, 1)

          old_main = '''    if (role === "main") {
              if (ext !== "mp3") return;
              runBeatCloudUpdate(beat, filePath, async () => {
                await uploadDroppedFileToTelegram(beat, filePath, "MASTER");
                const refreshed = await loadLibrary();
                beatsLatestRef.current = refreshed;
                setBeats(refreshed);
                const cloudBacked = refreshed.filter(item => !!item.telegram_file_id);
                cloudLibrarySnapshotRef.current = cloudBacked.map(cloudBeatFingerprint).join("\\u001c");
                await libraryStateManager.commitSnapshot(refreshed, "dropped-master");

                const updated = refreshed.find(item => item.id === beat.id);
                if (updated?.telegram_file_id) {
                  const ready = await waitForUploadedBeatPlaybackReady(updated);
                  if (!ready) throw new Error("The new MASTER uploaded, but did not become playback-ready in time.");
                }
              });
              return;
            }

            if (role === "wav") {
              if (ext !== "wav") return;
              runBeatCloudUpdate(beat, filePath, async () => {
                await uploadDroppedFileToTelegram(beat, filePath, "WAV");
                await libraryStateManager.commitSnapshot(beatsLatestRef.current, "project-sync");
              });
              return;
            }
'''
          assert old_main in app
          new_main = '''    if (role === "main") {
              if (ext !== "mp3") return;
              startMasterAssetUpdate(beat, filePath);
              return;
            }

            if (role === "wav") {
              if (ext !== "wav") return;
              startWavAssetUpdate(beat, filePath);
              return;
            }
'''
          app = app.replace(old_main, new_main, 1)
          app = app.replace('  }, [beatFileDrop, hasStoredProject, runBeatCloudUpdate, startProjectAssetUpdate, waitForUploadedBeatPlaybackReady]);', '  }, [beatFileDrop, hasStoredProject, startMasterAssetUpdate, startProjectAssetUpdate, startWavAssetUpdate]);', 1)

          old_browser_tail = '''    if (kind === "MASTER" && beat.telegram_file_id) {
              const replace = await appConfirm({
                title: "Replace MASTER?",
                message: `Replace the current MASTER for "${beat.name}" with ${file.name}?`,
                confirmLabel: "Replace",
                cancelLabel: "Cancel",
                danger: true,
              });
              if (!replace) return false;
            }

            transitionRuntime(beat.id, { type: "SYNC_QUEUE_UPDATE" }, beat);
            transitionRuntime(beat.id, { type: "SYNC_UPDATE_STARTED" }, beat);
            try {
              const committed = await platform.editor.commit(beat, beat, { [kind]: file });
              setBeats(current => {
                const next = current.map(item => item.id === committed.id ? committed : item);
                beatsLatestRef.current = next;
                return next;
              });
              setDrawer(current => current?.beat.id === committed.id ? { ...current, beat: committed } : current);
              transitionRuntime(beat.id, { type: "SYNC_UPDATE_SUCCEEDED" }, committed);
              return false;
            } catch (error) {
              const message = sanitizeUserVisibleText(runtimeErrorMessage(error), "Cloud operation failed.");
              transitionRuntime(beat.id, { type: "SYNC_FAILED", code: "WEB_FILE_UPDATE_FAILED", message, retryable: true }, beat);
              throw error;
            }
          }, [transitionRuntime]);
'''
          assert old_browser_tail in app
          new_browser_tail = '''    if (kind === "MASTER" || kind === "WAV") {
              return handleBrowserBeatAssetDrop(beat, file, kind);
            }

            transitionRuntime(beat.id, { type: "SYNC_QUEUE_UPDATE" }, beat);
            transitionRuntime(beat.id, { type: "SYNC_UPDATE_STARTED" }, beat);
            try {
              const committed = await platform.editor.commit(beat, beat, { PROJECT: file });
              setBeats(current => {
                const next = current.map(item => item.id === committed.id ? committed : item);
                beatsLatestRef.current = next;
                return next;
              });
              setDrawer(current => current?.beat.id === committed.id ? { ...current, beat: committed } : current);
              transitionRuntime(beat.id, { type: "SYNC_UPDATE_SUCCEEDED" }, committed);
              return false;
            } catch (error) {
              const message = sanitizeUserVisibleText(runtimeErrorMessage(error), "Cloud operation failed.");
              transitionRuntime(beat.id, { type: "SYNC_FAILED", code: "WEB_FILE_UPDATE_FAILED", message, retryable: true }, beat);
              throw error;
            }
          }, [handleBrowserBeatAssetDrop, transitionRuntime]);
'''
          app = app.replace(old_browser_tail, new_browser_tail, 1)
          app_path.write_text(app)
          PY

          cat > src/features/edit/useBeatAssetUpdates.ts <<'EOF'
          import { useCallback, type Dispatch, type MutableRefObject, type SetStateAction } from "react";
          import uploadCompleteWav from "../../assets/status/upload-complete.wav";
          import type { Beat } from "../../types";
          import { appAlert, appConfirm } from "../../lib/dialog";
          import { libraryStateManager } from "../../lib/libraryStateManager";
          import { sanitizeUserVisibleText } from "../../lib/userVisibleError";
          import { platform } from "../../platform";
          import { loadLibrary, uploadDroppedFileToTelegram } from "../../lib/tauri";
          import { cleanupStagedDropPaths } from "../dragdrop/dropStaging";
          import { createBeatRuntimeState, type BeatRuntimeState } from "../state/beatRuntimeState";
          import type { BeatRuntimeRegistry } from "../state/useBeatRuntimeRegistry";

          type BeatFileDropState = { beat: Beat; filePath: string; kind: "file" | "directory" } | null;
          type DrawerState = { beat: Beat; mode: "detail" | "edit" } | null;

          type UseBeatAssetUpdatesOptions = {
            rejectOfflineMutation: (label: string) => boolean;
            setBeatFileDrop: Dispatch<SetStateAction<BeatFileDropState>>;
            setBeatCloudUpdateBusy: (beatId: string, active: boolean, success?: boolean) => void;
            beatRuntimeStatesRef: MutableRefObject<Record<string, BeatRuntimeState>>;
            transitionRuntime: BeatRuntimeRegistry["transitionRuntime"];
            beatsLatestRef: MutableRefObject<Beat[]>;
            setBeats: Dispatch<SetStateAction<Beat[]>>;
            setDrawer: Dispatch<SetStateAction<DrawerState>>;
            waitForUploadedBeatPlaybackReady: (beat: Beat) => Promise<boolean>;
          };

          function runtimeErrorMessage(error: unknown): string {
            return error instanceof Error ? error.message : String(error);
          }

          function isRuntimeConflictError(error: unknown): boolean {
            const message = runtimeErrorMessage(error).toLowerCase();
            return message.includes("409") || message.includes("conflict") || message.includes("revision mismatch") || message.includes("version mismatch");
          }

          export function useBeatAssetUpdates({
            rejectOfflineMutation,
            setBeatFileDrop,
            setBeatCloudUpdateBusy,
            beatRuntimeStatesRef,
            transitionRuntime,
            beatsLatestRef,
            setBeats,
            setDrawer,
            waitForUploadedBeatPlaybackReady,
          }: UseBeatAssetUpdatesOptions) {
            const runBeatCloudUpdate = useCallback((beat: Beat, filePath: string, work: () => Promise<void>) => {
              if (rejectOfflineMutation("Updating beat files")) {
                setBeatFileDrop(null);
                void cleanupStagedDropPaths([filePath]);
                return;
              }

              // Once a destination is chosen the modal is no longer the owner of the
              // long update. Keep the card busy while upload/preparation continues.
              setBeatFileDrop(null);
              setBeatCloudUpdateBusy(beat.id, true);
              const before = beatRuntimeStatesRef.current[beat.id] ?? createBeatRuntimeState(beat);
              if (before.sync_state === "synced") transitionRuntime(beat.id, { type: "SYNC_QUEUE_UPDATE" }, beat);
              transitionRuntime(beat.id, { type: "SYNC_UPDATE_STARTED" }, beat);

              void (async () => {
                let succeeded = false;
                try {
                  await work();
                  transitionRuntime(beat.id, { type: "SYNC_UPDATE_SUCCEEDED" }, beat);
                  succeeded = true;
                  setBeatCloudUpdateBusy(beat.id, false, true);
                  try {
                    const audio = new Audio(uploadCompleteWav);
                    audio.volume = 0.72;
                    void audio.play().catch(() => {});
                  } catch {}
                } catch (error) {
                  console.error(error);
                  const message = sanitizeUserVisibleText(runtimeErrorMessage(error), "Cloud operation failed.");
                  if (isRuntimeConflictError(error)) transitionRuntime(beat.id, { type: "SYNC_CONFLICT", message }, beat);
                  else transitionRuntime(beat.id, { type: "SYNC_FAILED", code: "BEAT_UPDATE_FAILED", message, retryable: true }, beat);
                  setBeatCloudUpdateBusy(beat.id, false, false);
                  await appAlert({ title: "Beat update failed", message, danger: true });
                } finally {
                  // Drop roots are private staging copies and must be reclaimed on
                  // success, failure, offline rejection, and user cancellation paths.
                  await cleanupStagedDropPaths([filePath]).catch(() => {});
                  if (!succeeded) setBeatCloudUpdateBusy(beat.id, false, false);
                }
              })();
            }, [beatRuntimeStatesRef, rejectOfflineMutation, setBeatCloudUpdateBusy, setBeatFileDrop, transitionRuntime]);

            const startMasterAssetUpdate = useCallback((beat: Beat, filePath: string) => {
              runBeatCloudUpdate(beat, filePath, async () => {
                await uploadDroppedFileToTelegram(beat, filePath, "MASTER");
                const refreshed = await loadLibrary();
                beatsLatestRef.current = refreshed;
                setBeats(refreshed);
                await libraryStateManager.commitSnapshot(refreshed, "dropped-master");

                const updated = refreshed.find(item => item.id === beat.id);
                if (updated?.telegram_file_id) {
                  const ready = await waitForUploadedBeatPlaybackReady(updated);
                  if (!ready) throw new Error("The new MASTER uploaded, but did not become playback-ready in time.");
                }
              });
            }, [beatsLatestRef, runBeatCloudUpdate, setBeats, waitForUploadedBeatPlaybackReady]);

            const startWavAssetUpdate = useCallback((beat: Beat, filePath: string) => {
              runBeatCloudUpdate(beat, filePath, async () => {
                await uploadDroppedFileToTelegram(beat, filePath, "WAV");
                await libraryStateManager.commitSnapshot(beatsLatestRef.current, "project-sync");
              });
            }, [beatsLatestRef, runBeatCloudUpdate]);

            const handleBrowserBeatAssetDrop = useCallback(async (beat: Beat, file: File, kind: "MASTER" | "WAV"): Promise<boolean> => {
              if (kind === "MASTER" && beat.telegram_file_id) {
                const replace = await appConfirm({
                  title: "Replace MASTER?",
                  message: `Replace the current MASTER for "${beat.name}" with ${file.name}?`,
                  confirmLabel: "Replace",
                  cancelLabel: "Cancel",
                  danger: true,
                });
                if (!replace) return false;
              }

              transitionRuntime(beat.id, { type: "SYNC_QUEUE_UPDATE" }, beat);
              transitionRuntime(beat.id, { type: "SYNC_UPDATE_STARTED" }, beat);
              try {
                const committed = await platform.editor.commit(beat, beat, { [kind]: file });
                setBeats(current => {
                  const next = current.map(item => item.id === committed.id ? committed : item);
                  beatsLatestRef.current = next;
                  return next;
                });
                setDrawer(current => current?.beat.id === committed.id ? { ...current, beat: committed } : current);
                transitionRuntime(beat.id, { type: "SYNC_UPDATE_SUCCEEDED" }, committed);
                return false;
              } catch (error) {
                const message = sanitizeUserVisibleText(runtimeErrorMessage(error), "Cloud operation failed.");
                transitionRuntime(beat.id, { type: "SYNC_FAILED", code: "WEB_FILE_UPDATE_FAILED", message, retryable: true }, beat);
                throw error;
              }
            }, [beatsLatestRef, setBeats, setDrawer, transitionRuntime]);

            return {
              runBeatCloudUpdate,
              startMasterAssetUpdate,
              startWavAssetUpdate,
              handleBrowserBeatAssetDrop,
            };
          }
          EOF

          cat > tests/integration/appBeatAssetUpdatesExtraction.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import test from "node:test";
          import assert from "node:assert/strict";

          const app = readFileSync("src/App.tsx", "utf8");
          const assetUpdates = readFileSync("src/features/edit/useBeatAssetUpdates.ts", "utf8");

          test("beat asset update ownership lives outside App", () => {
            assert.match(app, /useBeatAssetUpdates\(\{/);
            assert.doesNotMatch(app, /uploadDroppedFileToTelegram\(beat, filePath, "MASTER"\)/);
            assert.doesNotMatch(app, /uploadDroppedFileToTelegram\(beat, filePath, "WAV"\)/);
            assert.match(assetUpdates, /uploadDroppedFileToTelegram\(beat, filePath, "MASTER"\)/);
            assert.match(assetUpdates, /uploadDroppedFileToTelegram\(beat, filePath, "WAV"\)/);
          });

          test("MASTER keeps playback readiness and browser replacement confirmation", () => {
            assert.match(assetUpdates, /waitForUploadedBeatPlaybackReady\(updated\)/);
            assert.match(assetUpdates, /Replace MASTER\?/);
            assert.match(assetUpdates, /platform\.editor\.commit\(beat, beat, \{ \[kind\]: file \}\)/);
          });

          test("busy state, runtime failure and staging cleanup remain owned by the operation", () => {
            assert.match(assetUpdates, /setBeatCloudUpdateBusy\(beat\.id, true\)/);
            assert.match(assetUpdates, /SYNC_UPDATE_STARTED/);
            assert.match(assetUpdates, /SYNC_CONFLICT/);
            assert.match(assetUpdates, /BEAT_UPDATE_FAILED/);
            assert.match(assetUpdates, /cleanupStagedDropPaths\(\[filePath\]\)/);
          });

          test("project operations stay temporarily composed by App for task 5.3", () => {
            assert.match(app, /startProjectAssetUpdate/);
            assert.match(app, /startProjectZipReplacement/);
            assert.match(app, /platform\.editor\.commit\(beat, beat, \{ PROJECT: file \}\)/);
          });
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run migration checks
        id: checks
        continue-on-error: true
        run: node scripts/run-migration-checks-with-logs.mjs

      - name: Upload readable migration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-5-2-${{ github.run_id }}
          path: artifacts/migration-check-logs/
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified implementation
        if: steps.checks.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/edit/useBeatAssetUpdates.ts tests/integration/appBeatAssetUpdatesExtraction.test.ts
          git diff --cached --check
          git commit -m "refactor(edit): extract beat asset updates"
          git push origin HEAD:v0.9.0-test-noche

      - name: Fail after artifact upload
        if: steps.checks.outcome == 'failure'
        run: exit 1
