name: F4 - 25.1 Functional Matrix

on:
  pull_request:
    branches:
      - integration-v0.8.0-alpha.1
    paths:
      - 'release/f4-25.1-functional-matrix.json'
      - 'scripts/test-f4-25.1-functional-matrix.mjs'
      - '.github/workflows/f4-25.1-functional-matrix.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  matrix-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Validate dependency-safe matrix contract
        run: node scripts/test-f4-25.1-functional-matrix.mjs
