name: Temporary Task 9.5 Apply

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/temp-task-9-5-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 2
      - name: Verify expected base
        shell: bash
        run: |
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "35df8fb1ddb8e4b081cb23c478d063e05ebf35eb" || { echo "Unexpected base: $parent"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Apply task 9.5 extraction
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          app_path = Path('src/App.tsx')
          app = app_path.read_text()

          old = 'import { useStartupBootstrap } from "./features/startup/useStartupBootstrap";\n'
          new = old + 'import { useLibraryReveal } from "./features/startup/useLibraryReveal";\n'
          assert old in app and 'useLibraryReveal' not in app
          app = app.replace(old, new, 1)

          helper = '''function dismissBeatGalerStartupLoader(): void {\n  const loader = document.getElementById("beatgaler-startup-loader");\n  if (!loader) return;\n  loader.remove();\n}\n\n'''
          assert helper in app
          app = app.replace(helper, '', 1)

          state_block = '''  const [loading, setLoading] = useState(() => initialLoading);\n  const [startupCookingGate, setStartupCookingGate] = useState(() => (startupCachedBeatsRef.current ?? []).length === 0);\n  const [revealedBeatIds, setRevealedBeatIds] = useState<Set<string>>(() => new Set(\n    (startupCachedBeatsRef.current ?? [])\n      .filter(beat => Boolean(beat.image_preview_base64 || beat.image_base64))\n      .map(beat => beat.id)\n  ));\n  const startupCookingResolvedRef = useRef(false);\n  const startupPipelineStartedRef = useRef(false);\n  const startupEnginePrimeReadyRef = useRef(false);\n  const progressiveRevealRunRef = useRef(0);\n'''
          replacement = '''  const [loading, setLoading] = useState(() => initialLoading);\n  const startupCookingResolvedRef = useRef(false);\n  const startupPipelineStartedRef = useRef(false);\n  const startupEnginePrimeReadyRef = useRef(false);\n'''
          assert state_block in app
          app = app.replace(state_block, replacement, 1)

          tag_filter_end = '''  } = useTagFilters();\n'''
          derived = '''  const filteredBeats = selectFilteredAndSortedBeats(\n    beats,\n    search,\n    includedTags,\n    excludedTags,\n    sortBy,\n  );\n\n'''
          assert tag_filter_end in app
          app = app.replace(tag_filter_end, tag_filter_end + derived, 1)

          session_end = '''  } = useSessionState();\n'''
          reveal_call = '''  const {\n    startupCookingGate,\n    setStartupCookingGate,\n    revealedBeatIds,\n    setRevealedBeatIds,\n    progressiveRevealRunRef,\n  } = useLibraryReveal({\n    initialCachedBeats: startupCachedBeatsRef.current ?? [],\n    filteredBeats,\n    loading,\n    settings,\n    cloudSessionVerified,\n    connectionState,\n    ensureArtworkReady,\n    startupCookingResolvedRef,\n    startupPipelineStartedRef,\n    nativeParallelism: isTauriAvailable ? 6 : 1,\n  });\n'''
          assert session_end in app
          app = app.replace(session_end, session_end + reveal_call, 1)

          duplicate = '''  const filteredBeats = selectFilteredAndSortedBeats(\n    beats,\n    search,\n    includedTags,\n    excludedTags,\n    sortBy,\n  );\n\n  const filteredBeatIdsKey = filteredBeats.map(beat => beat.id).join("|");\n  const displayedBeats = filteredBeats.filter(beat => revealedBeatIds.has(beat.id));\n'''
          assert duplicate in app
          app = app.replace(duplicate, '  const displayedBeats = filteredBeats.filter(beat => revealedBeatIds.has(beat.id));\n', 1)

          start = app.index('  const revealBeat = useCallback((beatId: string) => {')
          end = app.index('\n\n  const currentBeat =', start)
          removed = app[start:end]
          for marker in ['ensureArtworkReady(beat, false)', 'ensureArtworkReady(beat, true)', 'progressiveRevealRunRef.current', 'dismissBeatGalerStartupLoader()']:
              assert marker in removed
          app = app[:start] + app[end:]

          app_path.write_text(app)

          Path('src/features/startup/startupLoader.ts').write_text('''export function dismissBeatGalerStartupLoader(): void {\n  const loader = document.getElementById("beatgaler-startup-loader");\n  if (!loader) return;\n  loader.remove();\n}\n''')

          Path('src/features/startup/useLibraryReveal.ts').write_text('''import { useCallback, useEffect, useRef, useState, type MutableRefObject } from "react";\nimport type { Beat } from "../../types";\nimport { dismissBeatGalerStartupLoader } from "./startupLoader";\n\ntype RevealSettings = {\n  telegram_cloud_connected?: boolean;\n};\n\ntype UseLibraryRevealOptions = {\n  initialCachedBeats: Beat[];\n  filteredBeats: Beat[];\n  loading: boolean;\n  settings: RevealSettings | null;\n  cloudSessionVerified: boolean;\n  connectionState: string;\n  ensureArtworkReady: (beat: Beat, allowNetwork: boolean) => Promise<boolean>;\n  startupCookingResolvedRef: MutableRefObject<boolean>;\n  startupPipelineStartedRef: MutableRefObject<boolean>;\n  nativeParallelism: number;\n};\n\nexport function useLibraryReveal({\n  initialCachedBeats,\n  filteredBeats,\n  loading,\n  settings,\n  cloudSessionVerified,\n  connectionState,\n  ensureArtworkReady,\n  startupCookingResolvedRef,\n  startupPipelineStartedRef,\n  nativeParallelism,\n}: UseLibraryRevealOptions) {\n  const [startupCookingGate, setStartupCookingGate] = useState(() => initialCachedBeats.length === 0);\n  const [revealedBeatIds, setRevealedBeatIds] = useState<Set<string>>(() => new Set(\n    initialCachedBeats\n      .filter(beat => Boolean(beat.image_preview_base64 || beat.image_base64))\n      .map(beat => beat.id)\n  ));\n  const progressiveRevealRunRef = useRef(0);\n  const filteredBeatIdsKey = filteredBeats.map(beat => beat.id).join("|");\n\n  const revealBeat = useCallback((beatId: string) => {\n    setRevealedBeatIds(current => {\n      if (current.has(beatId)) return current;\n      const next = new Set(current);\n      next.add(beatId);\n      return next;\n    });\n  }, []);\n\n  // Instant paint is presentation-only: use local artwork/cache and never wait for audio.\n  useEffect(() => {\n    if (filteredBeats.length === 0) return;\n    let cancelled = false;\n    const queue = filteredBeats.filter(beat => !revealedBeatIds.has(beat.id));\n\n    void Promise.all(queue.map(async beat => {\n      const ready = await ensureArtworkReady(beat, false);\n      if (!cancelled && ready) revealBeat(beat.id);\n    })).then(() => {\n      if (!cancelled) {\n        setStartupCookingGate(false);\n        dismissBeatGalerStartupLoader();\n      }\n    });\n\n    return () => { cancelled = true; };\n    // revealedBeatIds intentionally stays out of deps: one cache sweep per library shape.\n  }, [filteredBeatIdsKey, ensureArtworkReady, revealBeat]);\n\n  // Authority pass: title + artwork reveal a card. Audio remains a later viewport warmup.\n  useEffect(() => {\n    if (loading || settings === null) return;\n\n    if (connectionState === "checking") {\n      if (filteredBeats.length === 0) setStartupCookingGate(true);\n      return;\n    }\n\n    if (connectionState !== "online" || !settings.telegram_cloud_connected) {\n      setRevealedBeatIds(new Set(filteredBeats.map(beat => beat.id)));\n      startupCookingResolvedRef.current = true;\n      startupPipelineStartedRef.current = false;\n      setStartupCookingGate(false);\n      dismissBeatGalerStartupLoader();\n      return;\n    }\n\n    if (!cloudSessionVerified) {\n      setStartupCookingGate(filteredBeats.length === 0);\n      return;\n    }\n\n    startupCookingResolvedRef.current = true;\n    startupPipelineStartedRef.current = false;\n    setStartupCookingGate(false);\n    dismissBeatGalerStartupLoader();\n\n    if (filteredBeats.length === 0) return;\n\n    const runId = ++progressiveRevealRunRef.current;\n    const queue = filteredBeats.filter(beat =>\n      !beat.image_base64 && !beat.image_preview_base64\n    );\n    let cursor = 0;\n    const workerCount = Math.min(nativeParallelism, queue.length);\n\n    const worker = async () => {\n      while (cursor < queue.length) {\n        const index = cursor++;\n        const beat = queue[index];\n        if (!beat || progressiveRevealRunRef.current !== runId) return;\n\n        let ready = false;\n        for (let attempt = 0; attempt < 4 && !ready; attempt += 1) {\n          ready = await ensureArtworkReady(beat, true);\n          if (ready || progressiveRevealRunRef.current !== runId) break;\n          const delay = [350, 900, 1800, 3200][attempt] ?? 3200;\n          await new Promise(resolve => window.setTimeout(resolve, delay));\n        }\n\n        if (progressiveRevealRunRef.current !== runId) return;\n        if (ready) revealBeat(beat.id);\n      }\n    };\n\n    void Promise.all(Array.from({ length: workerCount }, () => worker()));\n\n    return () => {\n      if (progressiveRevealRunRef.current === runId) progressiveRevealRunRef.current += 1;\n    };\n    // revealedBeatIds intentionally stays out of deps so each reveal does not restart workers.\n  }, [\n    loading, settings, cloudSessionVerified, connectionState, filteredBeatIdsKey,\n    ensureArtworkReady, revealBeat, nativeParallelism,\n  ]);\n\n  return {\n    startupCookingGate,\n    setStartupCookingGate,\n    revealedBeatIds,\n    setRevealedBeatIds,\n    progressiveRevealRunRef,\n  };\n}\n''')

          test = '''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst app = readFileSync("src/App.tsx", "utf8");\nconst reveal = readFileSync("src/features/startup/useLibraryReveal.ts", "utf8");\nconst loader = readFileSync("src/features/startup/startupLoader.ts", "utf8");\nconst startup = readFileSync("src/features/startup/useStartupBootstrap.ts", "utf8");\n\nfunction expectOrdered(source: string, markers: string[]): void {\n  let previous = -1;\n  for (const marker of markers) {\n    const index = source.indexOf(marker);\n    expect(index, `Missing task 9.5 marker: ${marker}`).toBeGreaterThan(previous);\n    previous = index;\n  }\n}\n\ndescribe("task 9.5 library reveal extraction", () => {\n  it("moves reveal and startup-loader ownership out of App", () => {\n    expect(app).toContain('import { useLibraryReveal } from "./features/startup/useLibraryReveal";');\n    expect(app).toContain("useLibraryReveal({");\n    expect(app).not.toContain("const revealBeat = useCallback");\n    expect(app).not.toContain("function dismissBeatGalerStartupLoader");\n    expect(app).not.toContain("ensureArtworkReady(beat, false)");\n    expect(app).not.toContain("ensureArtworkReady(beat, true)");\n    expect(loader).toContain('document.getElementById("beatgaler-startup-loader")');\n    expect(loader).toContain("loader.remove()");\n  });\n\n  it("preserves cache-first reveal and authority gating without waiting for audio", () => {\n    expect(reveal).toContain("ensureArtworkReady(beat, false)");\n    expectOrdered(reveal, [\n      'if (connectionState === "checking")',\n      'if (connectionState !== "online" || !settings.telegram_cloud_connected)',\n      'if (!cloudSessionVerified)',\n      'const runId = ++progressiveRevealRunRef.current',\n    ]);\n    expect(reveal).toContain("ensureArtworkReady(beat, true)");\n    expect(reveal).toContain("const delay = [350, 900, 1800, 3200][attempt] ?? 3200");\n    expect(reveal).toContain("const workerCount = Math.min(nativeParallelism, queue.length)");\n    expect(reveal).not.toContain("prepareBeatForPlayback");\n    expect(reveal).not.toContain("warmBeatForPlayback");\n  });\n\n  it("keeps validated Offline startup atomic before the reveal owner exposes cards", () => {\n    expectOrdered(startup, [\n      "const offline = await loadOfflineLibrary()",\n      "setRevealedBeatIds(new Set(offline.map(beat => beat.id)))",\n      "setBeats(offline)",\n    ]);\n    expect(reveal).toContain('if (connectionState === "checking")');\n    expect(reveal).toContain('if (connectionState !== "online" || !settings.telegram_cloud_connected)');\n  });\n});\n'''
          Path('tests/integration/appLibraryRevealExtraction.test.ts').write_text(test)

          regress = Path('scripts/run-regressions.mjs')
          text = regress.read_text()
          anchor = '  const startupBootstrap = readFileSync(path.join(root, "src", "features", "startup", "useStartupBootstrap.ts"), "utf8");\n'
          assert anchor in text
          text = text.replace(anchor, anchor + '  const libraryReveal = readFileSync(path.join(root, "src", "features", "startup", "useLibraryReveal.ts"), "utf8");\n', 1)
          old_guard = '  if (!app.includes(\'if (connectionState === "checking")\')) fail("Startup can reveal cached cards before connectivity has been verified.");'
          new_guard = '  if (!libraryReveal.includes(\'if (connectionState === "checking")\')) fail("Startup can reveal cached cards before connectivity has been verified.");'
          assert old_guard in text
          text = text.replace(old_guard, new_guard, 1)
          regress.write_text(text)
          PY
      - name: Focused 9.5 tests
        run: npx vitest run tests/integration/appLibraryRevealExtraction.test.ts tests/integration/appStartupBootstrapExtraction.test.ts --environment jsdom
      - run: npm run test:typecheck
      - run: npm run test:unit:ts
      - run: npm run test:component:dom
      - run: npm run test:integration
      - run: npm run test:regressions
      - run: npm run build:web
      - run: npm run build
      - name: Commit validated implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-task-9-5-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/startup/useLibraryReveal.ts src/features/startup/startupLoader.ts tests/integration/appLibraryRevealExtraction.test.ts scripts/run-regressions.mjs .github/workflows/temp-task-9-5-apply.yml
          git commit -m "refactor(startup): extract library reveal"
          git push origin HEAD:v0.9.0-test-noche
