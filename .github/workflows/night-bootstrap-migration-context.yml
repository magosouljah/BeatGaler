name: Night bootstrap migration context

on:
  push:
    branches:
      - v0.9.0-test-noche

permissions:
  contents: write

concurrency:
  group: night-bootstrap-migration-context
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated night branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Rebuild persistent migration context
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/plan.zlib
          for f in .night-bootstrap/chunks/plan.part*; do
            base64 --decode "$f" >> /tmp/plan.zlib
          done
          : > /tmp/registro.zlib
          for f in .night-bootstrap/chunks/registro.part*; do
            base64 --decode "$f" >> /tmp/registro.zlib
          done
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          fs.mkdirSync('migration', { recursive: true });
          fs.writeFileSync(
            'migration/BeatGaler-roadmap-para-trabajar-con-IAs.md',
            zlib.inflateSync(Buffer.from(fs.readFileSync('.night-bootstrap/roadmap.zlib.b64', 'utf8').trim(), 'base64'))
          );
          fs.writeFileSync(
            'migration/BeatGaler-plan-de-migracion.md',
            zlib.inflateSync(fs.readFileSync('/tmp/plan.zlib'))
          );
          fs.writeFileSync(
            'migration/Registro-de-avance.md',
            zlib.inflateSync(fs.readFileSync('/tmp/registro.zlib'))
          );

          const roadmapPath = 'migration/BeatGaler-roadmap-para-trabajar-con-IAs.md';
          let roadmap = fs.readFileSync(roadmapPath, 'utf8');
          roadmap = roadmap.replace(
            '**Estado inicial:** todas las tareas están pendientes. Este documento organiza la implementación; todavía no se ha realizado la migración.',
            '**Estado actual de referencia:** las tareas 1.1–3.3 están terminadas. La siguiente tarea pendiente es 3.4. El estado operativo de cada ejecución se toma de `BeatGaler-agent-state.md` y debe contrastarse con Git, código, tests y este roadmap.'
          );
          roadmap = roadmap.replace(
            '**Tu papel:** elegir la siguiente tarea, comprobar el comportamiento visible cuando corresponda y conservar el registro de avance. La IA se encarga de localizar código, moverlo, adaptar pruebas y explicar el resultado.',
            '**Flujo autónomo:** `BeatGaler-agent-state.md` indica la tarea actual. La IA debe comprobarla contra este roadmap, el registro y el estado real del repositorio antes de trabajar. Al cerrar una tarea, actualiza la casilla correspondiente, agrega el registro al final y deja la siguiente tarea pendiente en `BeatGaler-agent-state.md`.'
          );
          roadmap = roadmap.replace(
            'Sustituye `[ID]` por la tarea, por ejemplo `2.1`. Adjunta este roadmap y el plan completo, o proporciona sus ubicaciones en el entorno de esa IA.',
            'La tarea no se proporciona manualmente: se toma de `BeatGaler-agent-state.md` y se valida contra este roadmap, el registro y el repositorio real.'
          );
          fs.writeFileSync(roadmapPath, roadmap);
          NODE

      - name: Verify initial migration state
        shell: bash
        run: |
          set -euo pipefail
          grep -F '### [x] 3.1 — Separar el estado de la biblioteca' migration/BeatGaler-roadmap-para-trabajar-con-IAs.md
          grep -F '### [x] 3.2 — Separar los estados de operación por beat' migration/BeatGaler-roadmap-para-trabajar-con-IAs.md
          grep -F '### [x] 3.3 — Separar búsqueda, filtros y etiquetas' migration/BeatGaler-roadmap-para-trabajar-con-IAs.md
          grep -F '### [ ] 3.4 — Separar selección y reordenamiento' migration/BeatGaler-roadmap-para-trabajar-con-IAs.md
          grep -F 'Estado actual de referencia:' migration/BeatGaler-roadmap-para-trabajar-con-IAs.md
          grep -F 'Tarea 3.3 — Separar búsqueda, filtros y etiquetas' migration/Registro-de-avance.md
          grep -F 'migration-check-logs-*' migration/BeatGaler-plan-de-migracion.md
          grep -F 'Tarea actual: `3.4 — Separar selección y reordenamiento`' migration/BeatGaler-agent-state.md
          grep -F 'Estado: `Pendiente`' migration/BeatGaler-agent-state.md

      - name: Commit final persistent context and remove bootstrap tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .night-bootstrap
          rm -f .github/workflows/night-bootstrap-migration-context.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(migration): bootstrap nightly migration context'
          git push origin HEAD:v0.9.0-test-noche
