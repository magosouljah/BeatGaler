name: Night bootstrap migration context

on:
  push:
    branches:
      - v0.9.0-test-noche

permissions:
  contents: write

concurrency:
  group: night-bootstrap-migration-context
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated night branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Rebuild and verify persistent migration context
        shell: bash
        run: |
          set -euo pipefail
          cat .night-bootstrap/chunks/plan.part* > /tmp/plan.b64
          cat .night-bootstrap/chunks/registro.part* > /tmp/registro.b64
          printf '%s  %s\n' 'a6549dffc05d7adf5ba131516b4f0adef736770ee1f2e242ca18dde88b44569a' '/tmp/plan.b64' | sha256sum -c -
          printf '%s  %s\n' '9d6280e7e8d688f8bbd83bd07d31b9a4741243d2ae6562259da3afbef9aeaf68' '/tmp/registro.b64' | sha256sum -c -
          printf '%s  %s\n' 'fe5de1eb70e111cf616e3490b7fc1cb7c04aa3ce2b87b954e2182b2bb6da5724' '.night-bootstrap/roadmap.zlib.b64' | sha256sum -c -
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const files = [
            ['.night-bootstrap/roadmap.zlib.b64', 'migration/BeatGaler-roadmap-para-trabajar-con-IAs.md'],
            ['/tmp/plan.b64', 'migration/BeatGaler-plan-de-migracion.md'],
            ['/tmp/registro.b64', 'migration/Registro-de-avance.md'],
          ];
          fs.mkdirSync('migration', { recursive: true });
          for (const [source, target] of files) {
            const encoded = fs.readFileSync(source, 'utf8').trim();
            fs.writeFileSync(target, zlib.inflateSync(Buffer.from(encoded, 'base64')));
          }
          NODE

      - name: Verify initial migration state
        shell: bash
        run: |
          set -euo pipefail
          grep -F '### [x] 3.1 — Separar el estado de la biblioteca' migration/BeatGaler-roadmap-para-trabajar-con-IAs.md
          grep -F '### [x] 3.2 — Separar los estados de operación por beat' migration/BeatGaler-roadmap-para-trabajar-con-IAs.md
          grep -F '### [x] 3.3 — Separar búsqueda, filtros y etiquetas' migration/BeatGaler-roadmap-para-trabajar-con-IAs.md
          grep -F '### [ ] 3.4 — Separar selección y reordenamiento' migration/BeatGaler-roadmap-para-trabajar-con-IAs.md
          grep -F 'Tarea 3.3 — Separar búsqueda, filtros y etiquetas' migration/Registro-de-avance.md
          grep -F 'migration-check-logs-*' migration/BeatGaler-plan-de-migracion.md
          grep -F 'Tarea actual: `3.4 — Separar selección y reordenamiento`' migration/BeatGaler-agent-state.md
          grep -F 'Estado: `Pendiente`' migration/BeatGaler-agent-state.md

      - name: Commit final persistent context and remove bootstrap tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .night-bootstrap
          rm -f .github/workflows/night-bootstrap-migration-context.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(migration): bootstrap nightly migration context'
          git push origin HEAD:v0.9.0-test-noche
