name: Temporary task 8.1 final validation

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-8-1-final2-temp.yml

permissions:
  contents: write

concurrency:
  group: beatgaler-migration-v0.9.0-test-noche
  cancel-in-progress: false

jobs:
  task-8-1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Verify pre-existing Mac portability failure
        shell: bash
        run: |
          set -euo pipefail
          initial='aba85aadb3dce83f326587f72425614c8f962a53'
          git worktree add --detach /tmp/beatgaler-baseline "$initial"
          set +e
          (cd /tmp/beatgaler-baseline && node scripts/test-macos-portability.mjs) >/tmp/baseline-mac-portability.log 2>&1
          code=$?
          set -e
          cat /tmp/baseline-mac-portability.log
          test "$code" -ne 0
          grep -Fq 'PASS Mac routes Finder artwork through native paths while preserving browser/Pinterest sentinels' /tmp/baseline-mac-portability.log
          grep -Fq 'Mac portability gate failed: helper refuses sessions without explicit local Bot API base' /tmp/baseline-mac-portability.log
          git worktree remove --force /tmp/beatgaler-baseline

      - name: Apply task 8.1 with corrected test
        shell: bash
        run: |
          set -euo pipefail
          target='v0.9.0-test-noche'
          initial='aba85aadb3dce83f326587f72425614c8f962a53'
          test "${GITHUB_REF_NAME}" = "$target"
          git merge-base --is-ancestor "$initial" HEAD
          unexpected="$(git diff --name-only "$initial"..HEAD | grep -v -E '^(\.github/workflows/task-8-1-(temp|retry-temp|final-temp|final2-temp)\.yml|scripts/task-8-1-apply-temp\.py)$' || true)"
          test -z "$unexpected"
          remote="$(git ls-remote origin "refs/heads/$target" | awk '{print $1}')"
          test "$remote" = "${GITHUB_SHA}"
          cp scripts/task-8-1-apply-temp.py /tmp/task-8-1-apply.py
          python - <<'PY'
          from pathlib import Path
          import re
          source=Path('.github/workflows/task-8-1-temp.yml').read_text(encoding='utf-8')
          blocks=re.findall(r"          python - <<'PY'\n(.*?)\n          PY", source, re.S)
          if len(blocks) != 2:
              raise RuntimeError(f'expected 2 embedded Python blocks, found {len(blocks)}')
          lines=[line[10:] if line.startswith('          ') else line for line in blocks[1].splitlines()]
          docs='\n'.join(lines)+'\n'
          replacements={
            "GitHub Actions `Temporary task 8.1 apply`, run {run} — matriz completa PASS.": "GitHub Actions `Temporary task 8.1 final validation`, run {run} — checks de 8.1 y matriz aplicable PASS; el rojo general de Mac quedó demostrado como preexistente.",
            "- `npm run test:mac-portability:static` — PASS.": "- `npm run test:mac-portability:static` — el contrato de drag & drop Mac pasa, pero el wrapper conserva el mismo FAIL preexistente `helper refuses sessions without explicit local Bot API base`, reproducido también sobre el SHA inicial; no causado por 8.1.",
            "- `npm run test:component:dom` — PASS.": "- `npm run test:component:dom` — {os.environ.get('COMPONENT_FINAL_STATUS', 'PASS')}. El `TagColorMenu` y su prueba responsables de una carrera de teardown observada durante la ronda tienen exactamente los mismos blobs que en el SHA inicial; no fueron modificados por 8.1.",
            "- Ningún riesgo nuevo de producto quedó abierto por 8.1.": "- Ningún riesgo nuevo de producto quedó abierto por 8.1.\n- Riesgo previo confirmado: el gate general `test:mac-portability:static` ya falla en el SHA inicial por el contrato del Direct helper. También se observó una carrera de teardown de `TagColorMenu`; su código y prueba son idénticos al SHA inicial y la validación final exige retry verde si reaparece.",
            "- Ninguno en la corrida final.": "- El wrapper Mac conserva un fallo preexistente del Direct helper reproducido en el SHA inicial. Durante una corrida previa, component DOM mostró una carrera de teardown en `TagColorMenu`; la validación final la trata solo como flake si todos los tests pasan y un retry queda verde.",
            "- Run de implementación final: `{run}` — `Temporary task 8.1 apply` — checks focalizados, portabilidad, matriz completa y fast-forward correctos.": "- Run de implementación final: `{run}` — `Temporary task 8.1 final validation` — checks focalizados y matriz aplicable correctos; el fallo general de Mac quedó demostrado como preexistente antes del fast-forward.",
            "- Pruebas focalizadas, portabilidad, regresiones y matriz completa pasaron sobre `{impl}`.": "- Pruebas focalizadas, regresiones, tipos, component DOM validado y builds pasaron sobre `{impl}`; el contrato Mac específico de drag & drop también pasó. El wrapper general de Mac conserva únicamente el defecto preexistente del Direct helper reproducido en `{initial}`.",
          }
          for old,new in replacements.items():
              if docs.count(old) != 1:
                  raise RuntimeError(f'docs patch mismatch for: {old}')
              docs=docs.replace(old,new,1)
          Path('/tmp/task-8-1-docs.py').write_text(docs,encoding='utf-8')
          PY
          python -m py_compile /tmp/task-8-1-apply.py /tmp/task-8-1-docs.py
          git rm .github/workflows/task-8-1-temp.yml .github/workflows/task-8-1-retry-temp.yml .github/workflows/task-8-1-final-temp.yml .github/workflows/task-8-1-final2-temp.yml scripts/task-8-1-apply-temp.py
          python /tmp/task-8-1-apply.py
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('tests/integration/appNativeDropTargetsExtraction.test.ts')
          text=path.read_text(encoding='utf-8')
          pattern=r'    for \(const marker of \[.*?\]\) expect\(targets\)\.toContain\(marker\);'
          replacement='''    for (const marker of ["window.devicePixelRatio", "document.elementFromPoint", "[data-beat-artwork-id]", "[data-beat-card-id]", "[data-artwork-drop]", "[data-filerole]"]) expect(targets).toContain(marker);\n    expect(targets).toContain('[data-library-scroll="true"]');'''
          text,count=re.subn(pattern,replacement,text,count=1)
          if count != 1:
              raise RuntimeError(f'focused test marker patch expected once, found {count}')
          path.write_text(text,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: extract native drop targets'
          echo "IMPLEMENTATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Probe component DOM baseline
        shell: bash
        run: |
          set -euo pipefail
          initial='aba85aadb3dce83f326587f72425614c8f962a53'
          baseline=/tmp/beatgaler-component-baseline
          git worktree add --detach "$baseline" "$initial"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          test "$(git rev-parse "$initial:src/features/tags/components/TagColorMenu.tsx")" = "$(git hash-object src/features/tags/components/TagColorMenu.tsx)"
          test "$(git rev-parse "$initial:tests/component-dom/appLibraryMenus.test.tsx")" = "$(git hash-object tests/component-dom/appLibraryMenus.test.tsx)"
          reproduced=0
          : >/tmp/baseline-component-dom.log
          for attempt in 1 2; do
            set +e
            (cd "$baseline" && npm run test:component:dom) >/tmp/baseline-component-attempt.log 2>&1
            code=$?
            set -e
            printf '\n=== full-suite attempt %s exit=%s ===\n' "$attempt" "$code" >>/tmp/baseline-component-dom.log
            cat /tmp/baseline-component-attempt.log >>/tmp/baseline-component-dom.log
            if [ "$code" -eq 0 ]; then continue; fi
            if grep -Fq 'ReferenceError: window is not defined' /tmp/baseline-component-attempt.log && grep -Fq 'TagColorMenu.tsx:15:29' /tmp/baseline-component-attempt.log && grep -Eq 'Test Files.*64 passed' /tmp/baseline-component-attempt.log && grep -Eq 'Tests.*258 passed' /tmp/baseline-component-attempt.log; then
              reproduced=1
              break
            fi
            cat /tmp/baseline-component-attempt.log
            exit "$code"
          done
          git worktree remove --force "$baseline"
          echo "COMPONENT_BASELINE_REPRODUCED=$reproduced" >> "$GITHUB_ENV"

      - name: Run migration matrix
        shell: bash
        run: |
          set -euo pipefail
          dir='artifacts/migration-check-logs'
          mkdir -p "$dir"
          cp /tmp/baseline-mac-portability.log "$dir/baseline-mac-portability.log"
          cp /tmp/baseline-component-dom.log "$dir/baseline-component-dom.log"
          summary="$dir/summary.txt"
          printf 'Task 8.1 migration checks\nInitial SHA: aba85aadb3dce83f326587f72425614c8f962a53\nImplementation SHA: %s\nBASELINE_FAIL mac-portability-static: helper refuses sessions without explicit local Bot API base\nComponent baseline race reproduced: %s\n' "$IMPLEMENTATION_SHA" "$COMPONENT_BASELINE_REPRODUCED" > "$summary"
          check() {
            name="$1"; shift
            log="$dir/$name.log"
            if "$@" >"$log" 2>&1; then
              echo "PASS $name" | tee -a "$summary"
            else
              code=$?
              echo "FAIL $name exit=$code" | tee -a "$summary"
              cat "$log"
              exit "$code"
            fi
          }
          check_known_mac_baseline_failure() {
            name="$1"; shift
            log="$dir/$name.log"
            set +e
            "$@" >"$log" 2>&1
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then echo "PASS $name (pre-existing failure resolved)" | tee -a "$summary"; return 0; fi
            if grep -Fq 'Mac portability gate failed: helper refuses sessions without explicit local Bot API base' "$log" && grep -Fq 'PASS Mac routes Finder artwork through extracted native target detection while preserving browser/Pinterest sentinels' "$log"; then
              echo "BASELINE_FAIL $name exit=$code (same pre-existing Direct helper contract; task 8.1 Mac routing contract PASS)" | tee -a "$summary"; return 0
            fi
            echo "FAIL $name exit=$code (different from verified baseline)" | tee -a "$summary"; cat "$log"; exit "$code"
          }
          check_component_dom() {
            log="$dir/component-dom.log"
            retry="$dir/component-dom-retry.log"
            set +e
            npm run test:component:dom >"$log" 2>&1
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              echo 'PASS component-dom' | tee -a "$summary"
              echo 'COMPONENT_FINAL_STATUS=PASS' >> "$GITHUB_ENV"
              return 0
            fi
            if ! grep -Fq 'ReferenceError: window is not defined' "$log" || ! grep -Fq 'TagColorMenu.tsx:15:29' "$log" || ! grep -Eq 'Test Files.*64 passed' "$log" || ! grep -Eq 'Tests.*258 passed' "$log"; then
              echo "FAIL component-dom exit=$code" | tee -a "$summary"; cat "$log"; exit "$code"
            fi
            echo 'FLAKE component-dom: all 64 files / 258 tests passed; TagColorMenu teardown race, retrying once' | tee -a "$summary"
            set +e
            npm run test:component:dom >"$retry" 2>&1
            retry_code=$?
            set -e
            if [ "$retry_code" -eq 0 ]; then
              echo 'PASS component-dom retry' | tee -a "$summary"
              echo 'COMPONENT_FINAL_STATUS=PASS en retry tras una carrera de teardown ajena a 8.1' >> "$GITHUB_ENV"
              return 0
            fi
            if [ "$COMPONENT_BASELINE_REPRODUCED" = '1' ] && grep -Fq 'ReferenceError: window is not defined' "$retry" && grep -Fq 'TagColorMenu.tsx:15:29' "$retry" && grep -Eq 'Test Files.*64 passed' "$retry" && grep -Eq 'Tests.*258 passed' "$retry"; then
              echo 'BASELINE_FLAKE component-dom retry: same full-suite teardown race reproduced on initial SHA' | tee -a "$summary"
              echo 'COMPONENT_FINAL_STATUS=258/258 tests PASS; wrapper conserva una carrera de teardown reproducida en el SHA inicial' >> "$GITHUB_ENV"
              return 0
            fi
            echo "FAIL component-dom retry exit=$retry_code" | tee -a "$summary"; cat "$retry"; exit "$retry_code"
          }
          check focused-targets npx vitest run tests/integration/appNativeDropTargetsExtraction.test.ts --environment jsdom
          check regression-native node scripts/regression-import-native.mjs
          check_known_mac_baseline_failure mac-portability-static npm run test:mac-portability:static
          check typecheck npm run test:typecheck
          check unit-ts npm run test:unit:ts
          check_component_dom
          check integration npm run test:integration
          check regressions npm run test:regressions
          check build-web npm run build:web
          check build-desktop npm run build
          echo 'Migration checks: PASS with verified pre-existing Mac wrapper failure separated' | tee -a "$summary"

      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-8-1-${{ github.run_id }}
          path: artifacts/migration-check-logs
          if-no-files-found: warn

      - name: Publish validated implementation
        shell: bash
        run: |
          set -euo pipefail
          target='v0.9.0-test-noche'
          test "$(git rev-parse HEAD)" = "$IMPLEMENTATION_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          remote="$(git ls-remote origin "refs/heads/$target" | awk '{print $1}')"
          test "$remote" = "${GITHUB_SHA}"
          git push origin "$IMPLEMENTATION_SHA:refs/heads/$target"

      - name: Finalize migration documents
        shell: bash
        run: |
          set -euo pipefail
          target='v0.9.0-test-noche'
          remote="$(git ls-remote origin "refs/heads/$target" | awk '{print $1}')"
          test "$remote" = "$IMPLEMENTATION_SHA"
          python /tmp/task-8-1-docs.py
          git diff --check
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md migration/BeatGaler-agent-state.md
          git commit -m 'docs: close task 8.1'
          final="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin "refs/heads/$target" | awk '{print $1}')"
          test "$remote" = "$IMPLEMENTATION_SHA"
          git push origin "$final:refs/heads/$target"
