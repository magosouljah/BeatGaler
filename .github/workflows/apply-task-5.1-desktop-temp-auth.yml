name: Apply - Task 5.1 Desktop Temp Auth Seam

on:
  pull_request:
    paths:
      - "src-tauri/direct-transport/transport-helper.source.mjs"
      - "scripts/build-direct-temp-helper.mjs"
      - ".github/workflows/apply-task-5.1-desktop-temp-auth.yml"

permissions:
  contents: write

jobs:
  apply-exact-seam:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'task-5.1-productive-temp-auth-migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task-5.1-productive-temp-auth-migration
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked npm graph
        run: npm ci

      - name: Build self-contained temporary-auth helper
        run: node scripts/build-direct-temp-helper.mjs

      - name: Apply exact Rust seam replacements
        shell: python
        run: |
          from pathlib import Path
          p = Path("src-tauri/src/commands.rs")
          s = p.read_text(encoding="utf-8")

          old_spawn = '''    // The Bot API server MUST run on the same machine as the file paths used by
              // this helper. BeatGaler owns the exact child and passes its dynamic loopback
              // endpoint explicitly; the helper never guesses or trusts a fixed port.
              let bot_api_base = ensure_local_bot_api(session)?;
          '''
          new_spawn = '''    // Productive Direct uses a client-owned temporary MTProto auth key. Keep
              // the legacy local Bot API bootstrap only for non-temp compatibility paths;
              // no permanent transport credential may reach the temp helper.
              let temp_mode = session.get("mode").and_then(|v| v.as_str()) == Some("galer-direct-temp-mtproto");
              let bot_api_base = if temp_mode { None } else { Some(ensure_local_bot_api(session)?) };
          '''
          if old_spawn not in s:
              raise SystemExit("spawn seam did not match exact baseline")
          s = s.replace(old_spawn, new_spawn, 1)

          old_insert = '''    let mut helper_session = session.clone();
              if let Some(object) = helper_session.as_object_mut() {
                  object.insert("bot_api_base".to_string(), Value::String(bot_api_base));
              }
          '''
          new_insert = '''    let mut helper_session = session.clone();
              if let (Some(object), Some(bot_api_base)) = (helper_session.as_object_mut(), bot_api_base) {
                  object.insert("bot_api_base".to_string(), Value::String(bot_api_base));
              }
          '''
          if old_insert not in s:
              raise SystemExit("helper payload seam did not match exact baseline")
          s = s.replace(old_insert, new_insert, 1)

          old_mode = '''    if response.get("mode").and_then(|v| v.as_str()) != Some("telegram-direct-botapi-local") {
                  return Err("Galer Cloud did not offer the required local storage transport.".to_string());
              }
          '''
          new_mode = '''    if response.get("mode").and_then(|v| v.as_str()) != Some("galer-direct-temp-mtproto") {
                  return Err("Galer Cloud did not offer the required temporary storage transport.".to_string());
              }
          '''
          if old_mode not in s:
              raise SystemExit("Direct mode seam did not match exact baseline")
          s = s.replace(old_mode, new_mode, 1)

          needle = '''        let value: Value = serde_json::from_str(raw)
                  .map_err(|e| format!("Direct transport helper returned invalid JSON: {}", e))?;
              if let Some(expected) = expected_request_id {
          '''
          replacement = '''        let value: Value = serde_json::from_str(raw)
                  .map_err(|e| format!("Direct transport helper returned invalid JSON: {}", e))?;
              if value.get("op").and_then(|v| v.as_str()) == Some("temp_auth_metadata") {
                  let metadata = value.get("temp_auth_metadata").cloned()
                      .ok_or_else(|| "Desktop temporary-auth helper returned no binding metadata.".to_string())?;
                  let url = format!("{}/transport/session/start", telegram_cloud_api_base());
                  let body = json!({
                      "beatgalerUserId": runtime.user_id,
                      "tempAuthMetadata": metadata,
                  });
                  let bound = post_json_cloud_auth_timeout(&url, &body, 45)
                      .map_err(|e| format!("Galer Cloud temporary-auth bind unavailable: {}", e))?;
                  if bound.get("mode").and_then(|v| v.as_str()) != Some("galer-direct-temp-mtproto")
                      || bound.get("session_id").and_then(|v| v.as_str()) != Some(runtime.session_id.as_str())
                      || bound.get("generation").and_then(|v| v.as_i64()) != Some(runtime.generation)
                  {
                      return Err("Galer Cloud returned a mismatched Desktop temporary-auth lease.".to_string());
                  }
                  let reply = json!({ "op": "temp_auth_binding", "session": bound });
                  writeln!(runtime.stdin, "{}", reply)
                      .map_err(|e| format!("Direct temporary-auth binding write failed: {}", e))?;
                  runtime.stdin.flush()
                      .map_err(|e| format!("Direct temporary-auth binding flush failed: {}", e))?;
                  continue;
              }
              if let Some(expected) = expected_request_id {
          '''
          if needle not in s:
              raise SystemExit("helper message seam did not match exact baseline")
          s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding="utf-8")

      - name: Enforce narrow diff
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git diff -- src-tauri/src/commands.rs
          test "$(git diff --numstat -- src-tauri/src/commands.rs | awk '{print $1+$2}')" -le 70
          grep -q 'galer-direct-temp-mtproto' src-tauri/src/commands.rs
          ! grep -q '/bot${session.token}' src-tauri/direct-transport/transport-helper.cjs

      - name: Commit exact generated seam
        shell: bash
        run: |
          if git diff --quiet -- src-tauri/src/commands.rs src-tauri/direct-transport/transport-helper.cjs; then
            echo "Desktop temp-auth seam already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/commands.rs src-tauri/direct-transport/transport-helper.cjs
          git commit -m "feat(desktop): migrate Direct runtime to temporary auth"
          git push origin HEAD:task-5.1-productive-temp-auth-migration
