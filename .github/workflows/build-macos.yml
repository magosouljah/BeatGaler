name: Build - macOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  BOT_API_COMMIT: adfd7f6a8e990272851777eeb3ae0def4216f161
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  BEATGALER_UPDATER_ENDPOINT: https://github.com/magosouljah/galer/releases/latest/download/latest.json
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  APPLE_SIGNING_IDENTITY: "-"

jobs:
  bot-api-arm64:
    name: Build pinned Bot API arm64
    runs-on: macos-15
    steps:
      - name: Build static arm64 runtime
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake gperf openssl@3
          ROOT=/tmp/beatgaler-telegram-bot-api-arm64
          rm -rf "$ROOT"
          git init "$ROOT"
          git -C "$ROOT" remote add origin https://github.com/tdlib/telegram-bot-api.git
          git -C "$ROOT" fetch --depth 1 origin "$BOT_API_COMMIT"
          git -C "$ROOT" checkout --detach FETCH_HEAD
          git -C "$ROOT" submodule update --init --recursive --depth 1
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$BOT_API_COMMIT"
          cmake -S "$ROOT" -B "$ROOT/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build "$ROOT/build" --target telegram-bot-api --parallel 3
          mkdir -p runtime
          cp "$ROOT/build/telegram-bot-api" runtime/telegram-bot-api
          chmod +x runtime/telegram-bot-api
          test "$(lipo -archs runtime/telegram-bot-api)" = "arm64"
          if otool -L runtime/telegram-bot-api | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/Library/)' | grep -q .; then
            echo "::error::arm64 telegram-bot-api contains a non-system dylib dependency"
            otool -L runtime/telegram-bot-api
            exit 1
          fi
          echo "$BOT_API_COMMIT" > runtime/telegram-bot-api.commit
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-bot-api-arm64
          path: runtime/
          if-no-files-found: error

  bot-api-x86_64:
    name: Build pinned Bot API x86_64
    runs-on: macos-15-intel
    steps:
      - name: Build static Intel runtime
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake gperf openssl@3
          ROOT=/tmp/beatgaler-telegram-bot-api-x86_64
          rm -rf "$ROOT"
          git init "$ROOT"
          git -C "$ROOT" remote add origin https://github.com/tdlib/telegram-bot-api.git
          git -C "$ROOT" fetch --depth 1 origin "$BOT_API_COMMIT"
          git -C "$ROOT" checkout --detach FETCH_HEAD
          git -C "$ROOT" submodule update --init --recursive --depth 1
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$BOT_API_COMMIT"
          cmake -S "$ROOT" -B "$ROOT/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build "$ROOT/build" --target telegram-bot-api --parallel 3
          mkdir -p runtime
          cp "$ROOT/build/telegram-bot-api" runtime/telegram-bot-api
          chmod +x runtime/telegram-bot-api
          test "$(lipo -archs runtime/telegram-bot-api)" = "x86_64"
          if otool -L runtime/telegram-bot-api | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/Library/)' | grep -q .; then
            echo "::error::Intel telegram-bot-api contains a non-system dylib dependency"
            otool -L runtime/telegram-bot-api
            exit 1
          fi
          echo "$BOT_API_COMMIT" > runtime/telegram-bot-api.commit
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-bot-api-x86_64
          path: runtime/
          if-no-files-found: error

  release-macos:
    name: Build Tauri-signed Universal release
    needs: [bot-api-arm64, bot-api-x86_64]
    runs-on: macos-15

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify selected source
        shell: bash
        run: |
          set -euo pipefail
          echo "GitHub ref: $GITHUB_REF"
          git log -1 --oneline
          git rev-parse HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust with both macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo and Tauri build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-universal-tauri-${{ hashFiles('src-tauri/Cargo.lock', 'package-lock.json') }}
          restore-keys: |
            macos-universal-tauri-

      - name: Cache downloaded macOS runtimes
        uses: actions/cache@v4
        with:
          path: |
            /tmp/beatgaler-ffmpeg
            /tmp/beatgaler-node
          key: macos-runtimes-ffmpeg-b6.1.1-node-22.18.0

      - name: Install npm dependencies
        run: npm ci

      - name: Verify BeatGaler version and portable frontend/architecture gate
        shell: bash
        run: |
          set -euo pipefail
          npm run version:check
          npm run test:mac-portability:static
          npm run test:unit:ts
          npm run test:regressions

      - name: Require updater signing secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY GitHub secret is missing."
            exit 1
          fi

      - name: Download and build universal FFmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FFMPEG_TAG="b6.1.1"
          REPO="eugeneware/ffmpeg-static"
          BASE_URL="https://github.com/${REPO}/releases/download/${FFMPEG_TAG}"
          mkdir -p src-tauri/resources /tmp/beatgaler-ffmpeg
          curl --fail --location --retry 3 "${BASE_URL}/ffmpeg-darwin-arm64" -o /tmp/beatgaler-ffmpeg/ffmpeg-arm64
          curl --fail --location --retry 3 "${BASE_URL}/ffmpeg-darwin-x64" -o /tmp/beatgaler-ffmpeg/ffmpeg-x64
          chmod +x /tmp/beatgaler-ffmpeg/ffmpeg-arm64 /tmp/beatgaler-ffmpeg/ffmpeg-x64

          RELEASE_JSON="$(gh api "repos/${REPO}/releases/tags/${FFMPEG_TAG}")"
          ARM_EXPECTED="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name=="ffmpeg-darwin-arm64") | .digest // empty' | sed 's/^sha256://')"
          X64_EXPECTED="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name=="ffmpeg-darwin-x64") | .digest // empty' | sed 's/^sha256://')"
          ARM_ACTUAL="$(shasum -a 256 /tmp/beatgaler-ffmpeg/ffmpeg-arm64 | awk '{print $1}')"
          X64_ACTUAL="$(shasum -a 256 /tmp/beatgaler-ffmpeg/ffmpeg-x64 | awk '{print $1}')"
          test -n "$ARM_EXPECTED" && test -n "$X64_EXPECTED"
          test "$ARM_EXPECTED" = "$ARM_ACTUAL"
          test "$X64_EXPECTED" = "$X64_ACTUAL"

          lipo -create /tmp/beatgaler-ffmpeg/ffmpeg-arm64 /tmp/beatgaler-ffmpeg/ffmpeg-x64 -output src-tauri/resources/ffmpeg
          chmod +x src-tauri/resources/ffmpeg
          ARCHS="$(lipo -archs src-tauri/resources/ffmpeg)"
          echo "$ARCHS" | grep -q arm64
          echo "$ARCHS" | grep -q x86_64

      - name: Download and build universal Node runtime
        shell: bash
        run: |
          set -euo pipefail
          NODE_VERSION="22.18.0"
          mkdir -p src-tauri/resources /tmp/beatgaler-node
          curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.gz" -o /tmp/beatgaler-node/node-arm64.tar.gz
          curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-x64.tar.gz" -o /tmp/beatgaler-node/node-x64.tar.gz
          tar -xzf /tmp/beatgaler-node/node-arm64.tar.gz -C /tmp/beatgaler-node
          tar -xzf /tmp/beatgaler-node/node-x64.tar.gz -C /tmp/beatgaler-node
          lipo -create \
            "/tmp/beatgaler-node/node-v${NODE_VERSION}-darwin-arm64/bin/node" \
            "/tmp/beatgaler-node/node-v${NODE_VERSION}-darwin-x64/bin/node" \
            -output src-tauri/resources/node
          chmod +x src-tauri/resources/node
          ARCHS="$(lipo -archs src-tauri/resources/node)"
          echo "$ARCHS" | grep -q arm64
          echo "$ARCHS" | grep -q x86_64
          src-tauri/resources/node --version

      - name: Combine pinned Bot API into Universal runtime
        uses: actions/download-artifact@v4
        with:
          pattern: telegram-bot-api-*
          path: /tmp/beatgaler-bot-api-halves

      - name: Verify and combine Bot API halves
        shell: bash
        run: |
          set -euo pipefail
          ARM="/tmp/beatgaler-bot-api-halves/telegram-bot-api-arm64/telegram-bot-api"
          INTEL="/tmp/beatgaler-bot-api-halves/telegram-bot-api-x86_64/telegram-bot-api"
          test -x "$ARM" && test -x "$INTEL"
          test "$(cat /tmp/beatgaler-bot-api-halves/telegram-bot-api-arm64/telegram-bot-api.commit)" = "$BOT_API_COMMIT"
          test "$(cat /tmp/beatgaler-bot-api-halves/telegram-bot-api-x86_64/telegram-bot-api.commit)" = "$BOT_API_COMMIT"
          test "$(lipo -archs "$ARM")" = "arm64"
          test "$(lipo -archs "$INTEL")" = "x86_64"
          mkdir -p src-tauri/resources
          lipo -create "$ARM" "$INTEL" -output src-tauri/resources/telegram-bot-api
          chmod +x src-tauri/resources/telegram-bot-api
          ARCHS="$(lipo -archs src-tauri/resources/telegram-bot-api)"
          echo "$ARCHS" | grep -q arm64
          echo "$ARCHS" | grep -q x86_64
      - name: Verify Universal runtimes have only Apple system dylib dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-macos-runtime-dylibs.sh \
            src-tauri/resources/ffmpeg \
            src-tauri/resources/node \
            src-tauri/resources/telegram-bot-api

      - name: Verify Universal runtime minimum macOS versions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-macos-min-version.mjs src-tauri/resources/ffmpeg "$MACOSX_DEPLOYMENT_TARGET"
          node scripts/check-macos-min-version.mjs src-tauri/resources/node "$MACOSX_DEPLOYMENT_TARGET"
          node scripts/check-macos-min-version.mjs src-tauri/resources/telegram-bot-api "$MACOSX_DEPLOYMENT_TARGET"

      - name: Ad-hoc sign embedded Universal Mach-O runtimes
        shell: bash
        run: |
          set -euo pipefail
          for path in src-tauri/resources/ffmpeg src-tauri/resources/node src-tauri/resources/telegram-bot-api; do
            codesign --force --sign - "$path"
            codesign --verify --strict --verbose=2 "$path"
          done

      - name: Compile and run Rust unit tests with all Universal runtimes present
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Universal macOS DMG and Tauri-signed updater bundle
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null
          npx tauri build --bundles dmg --target universal-apple-darwin

      - name: Verify Universal runtimes and ad-hoc signatures inside final DMG
        shell: bash
        run: |
          set -euo pipefail
          ROOT="src-tauri/target/universal-apple-darwin/release/bundle"
          DMG_PATH="$(find "$ROOT/dmg" -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          test -n "$DMG_PATH" && test -f "$DMG_PATH"

          ATTACH_OUTPUT="$(hdiutil attach "$DMG_PATH" -nobrowse -readonly)"
          MOUNT_POINT="$(printf '%s\n' "$ATTACH_OUTPUT" | sed -n 's#^.*\(/Volumes/.*\)$#\1#p' | head -n 1)"
          test -n "$MOUNT_POINT" && test -d "$MOUNT_POINT"
          cleanup() { hdiutil detach "$MOUNT_POINT" -force >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          APP_PATH="$(find "$MOUNT_POINT" -maxdepth 2 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          APP_MAIN_PATH="$(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f -perm -111 | head -n 1)"
          FFMPEG_PATH="$APP_PATH/Contents/Resources/ffmpeg"
          NODE_PATH="$APP_PATH/Contents/Resources/node"
          BOT_API_PATH="$APP_PATH/Contents/Resources/telegram-bot-api"
          HELPER_PATH="$APP_PATH/Contents/Resources/direct-transport/transport-helper.cjs"
          WATCHDOG_PATH="$APP_PATH/Contents/Resources/direct-transport/runtime-watchdog.cjs"

          for path in "$APP_MAIN_PATH" "$FFMPEG_PATH" "$NODE_PATH" "$BOT_API_PATH"; do
            test -x "$path"
            ARCHS="$(lipo -archs "$path")"
            echo "$path -> $ARCHS"
            echo "$ARCHS" | grep -q arm64
            echo "$ARCHS" | grep -q x86_64
          done
          test -f "$HELPER_PATH"
          test -f "$WATCHDOG_PATH"
          for path in "$APP_MAIN_PATH" "$FFMPEG_PATH" "$NODE_PATH" "$BOT_API_PATH"; do
            node scripts/check-macos-min-version.mjs "$path" "$MACOSX_DEPLOYMENT_TARGET"
          done
          bash scripts/check-macos-runtime-dylibs.sh "$FFMPEG_PATH" "$NODE_PATH" "$BOT_API_PATH"
          for path in "$APP_MAIN_PATH" "$FFMPEG_PATH" "$NODE_PATH" "$BOT_API_PATH"; do
            codesign --verify --strict --verbose=2 "$path"
          done
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          UPDATER_PATH="$(find "$ROOT/macos" -maxdepth 1 -type f -name '*.app.tar.gz' | head -n 1)"
          test -n "$UPDATER_PATH" && test -f "$UPDATER_PATH"
          test -s "${UPDATER_PATH}.sig"

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatGaler-macOS-Universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            VERSION
          if-no-files-found: error

