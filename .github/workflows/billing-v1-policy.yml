name: Billing V1 Policy and Polar Sandbox Adapter

on:
  pull_request:
    paths:
      - 'BLUEPRINT/BILLING-V1-POLAR-SANDBOX-COMPATIBILITY.md'
      - 'cloud-server/package.json'
      - 'cloud-server/package-lock.json'
      - 'cloud-server/billing-access-resolver.js'
      - 'cloud-server/billing-commercial-catalog.js'
      - 'cloud-server/billing-polar-sandbox.js'
      - 'cloud-server/billing-polar-lifecycle-adapter.js'
      - 'cloud-server/billing-polar-renewal-proof.js'
      - 'cloud-server/scripts/polar-sandbox-daily-*.cjs'
      - 'cloud-server/scripts/polar-sandbox-e2e-guard.cjs'
      - 'cloud-server/tests/billing-polar-daily*.cjs'
      - 'cloud-server/tests/billing-access-resolver.test.cjs'
      - 'cloud-server/tests/billing-commercial-catalog.test.cjs'
      - 'cloud-server/tests/billing-polar-sandbox.test.cjs'
      - 'cloud-server/tests/billing-polar-sdk-contract.test.cjs'
      - 'cloud-server/scripts/polar-sandbox-smoke.cjs'
      - '.github/workflows/billing-v1-policy.yml'
      - '.github/workflows/billing-v1-polar-sandbox-smoke.yml'

permissions:
  contents: read

jobs:
  billing-v1-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: cloud-server/package-lock.json
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Install locked Cloud dependencies
        working-directory: cloud-server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Billing V1 policy, catalog, adapter and real SDK contract
        working-directory: cloud-server
        run: npm run test:billing-v1
