name: Fast BeatGaler macOS Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-build-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  BOT_API_COMMIT: adfd7f6a8e990272851777eeb3ae0def4216f161
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  bot-api-arm64:
    name: Build Bot API arm64
    runs-on: macos-15

    steps:
      - name: Restore Bot API arm64 cache
        id: botapi-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: runtime/telegram-bot-api
          key: beatgaler-bot-api-${{ runner.os }}-${{ runner.arch }}-${{ env.BOT_API_COMMIT }}

      - name: Build static arm64 runtime
        if: steps.botapi-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake gperf openssl@3
          ROOT=/tmp/beatgaler-telegram-bot-api-arm64
          rm -rf "$ROOT"
          git init "$ROOT"
          git -C "$ROOT" remote add origin https://github.com/tdlib/telegram-bot-api.git
          git -C "$ROOT" fetch --depth 1 origin "$BOT_API_COMMIT"
          git -C "$ROOT" checkout --detach FETCH_HEAD
          git -C "$ROOT" submodule update --init --recursive --depth 1
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$BOT_API_COMMIT"
          cmake -S "$ROOT" -B "$ROOT/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build "$ROOT/build" --target telegram-bot-api --parallel 3
          mkdir -p runtime
          cp "$ROOT/build/telegram-bot-api" runtime/telegram-bot-api

      - name: Verify Bot API arm64
        shell: bash
        run: |
          set -euo pipefail
          chmod +x runtime/telegram-bot-api
          ARCHS="$(lipo -archs runtime/telegram-bot-api)"
          echo "ARM64 Bot API architectures: $ARCHS"
          [[ "$ARCHS" == *"arm64"* ]]
          echo "$BOT_API_COMMIT" > runtime/telegram-bot-api.commit
          shasum -a 256 runtime/telegram-bot-api | awk '{print $1}' > runtime/telegram-bot-api.sha256

      - name: Upload Bot API arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telegram-bot-api-arm64
          path: runtime/
          if-no-files-found: error

  bot-api-x86_64:
    name: Build Bot API x86_64
    runs-on: macos-15-intel

    steps:
      - name: Restore Bot API x86_64 cache
        id: botapi-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: runtime/telegram-bot-api
          key: beatgaler-bot-api-${{ runner.os }}-${{ runner.arch }}-${{ env.BOT_API_COMMIT }}

      - name: Build static Intel runtime
        if: steps.botapi-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake gperf openssl@3
          ROOT=/tmp/beatgaler-telegram-bot-api-x86_64
          rm -rf "$ROOT"
          git init "$ROOT"
          git -C "$ROOT" remote add origin https://github.com/tdlib/telegram-bot-api.git
          git -C "$ROOT" fetch --depth 1 origin "$BOT_API_COMMIT"
          git -C "$ROOT" checkout --detach FETCH_HEAD
          git -C "$ROOT" submodule update --init --recursive --depth 1
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$BOT_API_COMMIT"
          cmake -S "$ROOT" -B "$ROOT/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build "$ROOT/build" --target telegram-bot-api --parallel 3
          mkdir -p runtime
          cp "$ROOT/build/telegram-bot-api" runtime/telegram-bot-api

      - name: Verify Bot API x86_64
        shell: bash
        run: |
          set -euo pipefail
          chmod +x runtime/telegram-bot-api
          ARCHS="$(lipo -archs runtime/telegram-bot-api)"
          echo "Intel Bot API architectures: $ARCHS"
          [[ "$ARCHS" == *"x86_64"* ]]
          echo "$BOT_API_COMMIT" > runtime/telegram-bot-api.commit
          shasum -a 256 runtime/telegram-bot-api | awk '{print $1}' > runtime/telegram-bot-api.sha256

      - name: Upload Bot API x86_64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telegram-bot-api-x86_64
          path: runtime/
          if-no-files-found: error

  build-dmg:
    name: Build Universal test DMG
    needs:
      - bot-api-arm64
      - bot-api-x86_64
    runs-on: macos-15

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup pinned Rust Universal targets
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      - name: Run portable gates
        shell: bash
        run: |
          set -euo pipefail
          npm run version:check
          npm run test:mac-portability:static
          npm run test:unit:ts
          npm run test:regressions

      - name: Download Bot API halves
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: telegram-bot-api-*
          path: /tmp/beatgaler-bot-api-halves

      - name: Build and verify Universal Bot API runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources
          ARM_DIR="/tmp/beatgaler-bot-api-halves/telegram-bot-api-arm64"
          INTEL_DIR="/tmp/beatgaler-bot-api-halves/telegram-bot-api-x86_64"
          ARM="$ARM_DIR/telegram-bot-api"
          INTEL="$INTEL_DIR/telegram-bot-api"
          chmod +x "$ARM" "$INTEL"
          test -x "$ARM" && test -x "$INTEL"
          test "$(cat "$ARM_DIR/telegram-bot-api.commit")" = "$BOT_API_COMMIT"
          test "$(cat "$INTEL_DIR/telegram-bot-api.commit")" = "$BOT_API_COMMIT"
          test "$(cat "$ARM_DIR/telegram-bot-api.sha256")" = "$(shasum -a 256 "$ARM" | awk '{print $1}')"
          test "$(cat "$INTEL_DIR/telegram-bot-api.sha256")" = "$(shasum -a 256 "$INTEL" | awk '{print $1}')"
          lipo -create "$ARM" "$INTEL" -output src-tauri/resources/telegram-bot-api
          chmod +x src-tauri/resources/telegram-bot-api
          ARCHS="$(lipo -archs src-tauri/resources/telegram-bot-api)"
          echo "Universal Bot API architectures: $ARCHS"
          [[ "$ARCHS" == *"arm64"* ]]
          [[ "$ARCHS" == *"x86_64"* ]]

      - name: Build verified Universal Node runtime
        shell: bash
        run: |
          set -euo pipefail
          NODE_VERSION="22.23.2"
          ROOT="/tmp/beatgaler-node"
          mkdir -p "$ROOT" src-tauri/resources
          ARM_NAME="node-v${NODE_VERSION}-darwin-arm64.tar.gz"
          X64_NAME="node-v${NODE_VERSION}-darwin-x64.tar.gz"
          curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/${ARM_NAME}" -o "$ROOT/$ARM_NAME"
          curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/${X64_NAME}" -o "$ROOT/$X64_NAME"
          curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" -o "$ROOT/SHASUMS256.txt"
          (cd "$ROOT" && grep " ${ARM_NAME}$" SHASUMS256.txt | shasum -a 256 -c -)
          (cd "$ROOT" && grep " ${X64_NAME}$" SHASUMS256.txt | shasum -a 256 -c -)
          tar -xzf "$ROOT/$ARM_NAME" -C "$ROOT"
          tar -xzf "$ROOT/$X64_NAME" -C "$ROOT"
          lipo -create \
            "$ROOT/node-v${NODE_VERSION}-darwin-arm64/bin/node" \
            "$ROOT/node-v${NODE_VERSION}-darwin-x64/bin/node" \
            -output src-tauri/resources/node
          chmod +x src-tauri/resources/node
          test "$(src-tauri/resources/node --version)" = "v${NODE_VERSION}"

      - name: Build verified Universal FFmpeg runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FFMPEG_TAG="b6.1.1"
          REPO="eugeneware/ffmpeg-static"
          BASE_URL="https://github.com/${REPO}/releases/download/${FFMPEG_TAG}"
          mkdir -p /tmp/beatgaler-ffmpeg src-tauri/resources
          curl --fail --location --retry 3 "${BASE_URL}/ffmpeg-darwin-arm64" -o /tmp/beatgaler-ffmpeg/ffmpeg-arm64
          curl --fail --location --retry 3 "${BASE_URL}/ffmpeg-darwin-x64" -o /tmp/beatgaler-ffmpeg/ffmpeg-x64
          chmod +x /tmp/beatgaler-ffmpeg/ffmpeg-arm64 /tmp/beatgaler-ffmpeg/ffmpeg-x64
          RELEASE_JSON="$(gh api "repos/${REPO}/releases/tags/${FFMPEG_TAG}")"
          ARM_EXPECTED="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name=="ffmpeg-darwin-arm64") | .digest // empty' | sed 's/^sha256://')"
          X64_EXPECTED="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name=="ffmpeg-darwin-x64") | .digest // empty' | sed 's/^sha256://')"
          test "$ARM_EXPECTED" = "$(shasum -a 256 /tmp/beatgaler-ffmpeg/ffmpeg-arm64 | awk '{print $1}')"
          test "$X64_EXPECTED" = "$(shasum -a 256 /tmp/beatgaler-ffmpeg/ffmpeg-x64 | awk '{print $1}')"
          lipo -create /tmp/beatgaler-ffmpeg/ffmpeg-arm64 /tmp/beatgaler-ffmpeg/ffmpeg-x64 -output src-tauri/resources/ffmpeg
          chmod +x src-tauri/resources/ffmpeg

      - name: Verify Universal runtimes
        shell: bash
        run: |
          set -euo pipefail
          for path in src-tauri/resources/node src-tauri/resources/ffmpeg src-tauri/resources/telegram-bot-api; do
            ARCHS="$(lipo -archs "$path")"
            echo "$path -> $ARCHS"
            [[ "$ARCHS" == *"arm64"* ]]
            [[ "$ARCHS" == *"x86_64"* ]]
          done

      - name: Record test runtime provenance
        shell: bash
        run: |
          node scripts/write-runtime-provenance.mjs \
            --output artifacts/runtime-provenance-macos-test.json \
            --platform macos-universal-test \
            --sources supply-chain/runtime-sources.json \
            ffmpeg=src-tauri/resources/ffmpeg \
            node=src-tauri/resources/node \
            bot-api=src-tauri/resources/telegram-bot-api

      - name: Build unsigned Universal DMG
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          set -euo pipefail
          npm run build
          npx tauri build --bundles dmg --target universal-apple-darwin

      - name: Locate and checksum DMG
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          test -n "$DMG" && test -f "$DMG"
          mkdir -p artifacts
          shasum -a 256 "$DMG" | sed "s#  .*#  $(basename "$DMG")#" > artifacts/SHA256SUMS-macOS-Test.txt
          echo "DMG created: $DMG"

      - name: Upload Universal DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BeatGaler-macOS-Test-DMG
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            artifacts/runtime-provenance-macos-test.json
            artifacts/SHA256SUMS-macOS-Test.txt
          if-no-files-found: error
