name: Apply Task 7.1 Scope Fix

on:
  push:
    branches:
      - woz/task-7.1-direct-capabilities

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: woz/task-7.1-direct-capabilities
          fetch-depth: 0
      - name: Apply canonical scope comparison
        run: node scripts/apply-task-7.1-scope-canonical-patch.mjs
      - name: Commit production fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'BeatGaler WOZ'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud-server/direct-capability-boundary.js
          git commit -m 'fix(direct): canonicalize capability scope comparison'
          git push origin HEAD:woz/task-7.1-direct-capabilities
