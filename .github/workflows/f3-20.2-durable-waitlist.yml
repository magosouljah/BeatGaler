name: F3 20.2 Durable Waitlist

on:
  push:
    branches:
      - woz/night-074-durable-waitlist
  pull_request:
    paths:
      - 'cloud-server/durable-user-waitlist.js'
      - 'cloud-server/tests/durable-user-waitlist.test.cjs'
      - '.github/workflows/f3-20.2-durable-waitlist.yml'

permissions:
  contents: read

jobs:
  durable-waitlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: node cloud-server/tests/durable-user-waitlist.test.cjs
