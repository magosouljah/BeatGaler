name: Task 9.2 Apply

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-9-2-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Guard target branch and expected starting HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v0.9.0-test-noche"
          git fetch origin v0.9.0-test-noche
          test "$(git rev-parse origin/v0.9.0-test-noche)" = "${GITHUB_SHA}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare migration log directory
        run: mkdir -p artifacts/migration-check-logs

      - name: Preserve startup repair ownership in temporary applier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/task-9-2-apply.py')
          text = path.read_text()
          text = text.replace(
              'syncBeatMetadataToTelegram, pollTelegramCloudStatus, purgeInterruptedUploadLocal',
              'syncBeatMetadataToTelegram, repairStaleCloudLibraryRefs, pollTelegramCloudStatus, purgeInterruptedUploadLocal',
              1,
          )
          text = text.replace(
              'if "repairStaleCloudLibraryRefs" in app:\n    raise SystemExit("App still contains repairStaleCloudLibraryRefs after extraction")\n',
              '',
              1,
          )
          text = text.replace(
              '    expect(app).not.toContain("repairStaleCloudLibraryRefs");\n',
              '',
              1,
          )
          path.write_text(text)
          PY

      - name: Apply task 9.2 extraction
        shell: bash
        run: |
          set -euo pipefail
          python .github/task-9-2-apply.py 2>&1 | tee artifacts/migration-check-logs/00-apply-task-9-2.log

      - name: Adapt tests to extracted Reload ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          reload_test = Path('tests/component-dom/libraryReload.test.tsx')
          text = reload_test.read_text()
          text = text.replace('  vi.useFakeTimers();\n', '', 1)
          text = text.replace('  vi.useRealTimers();\n', '', 1)
          text = text.replace(
              '    await act(async () => {\n      await vi.runAllTimersAsync();\n      await pending;\n    });',
              '    await act(async () => {\n      await pending;\n    });'
          )
          text = text.replace(
              '    await act(async () => {\n      await vi.runAllTimersAsync();\n      await deferredAttempt;\n    });',
              '    await act(async () => {\n      await deferredAttempt;\n    });',
              1,
          )
          text = text.replace(
              '    await act(async () => {\n      await vi.runAllTimersAsync();\n    });',
              '    await act(async () => {\n      await new Promise(resolve => window.setTimeout(resolve, 360));\n    });',
              1,
          )
          text = text.replace(
              '    await act(async () => {\n      await vi.runAllTimersAsync();\n      await pending;\n    });',
              '    await act(async () => {\n      await pending;\n    });'
          )
          reload_test.write_text(text)

          architecture_test = Path('tests/component-dom/startupRevealArchitecture.test.ts')
          text = architecture_test.read_text()
          text = text.replace(
              'const libraryStateOwner = readFileSync("src/features/library/useLibraryState.ts", "utf8");',
              'const libraryStateOwner = readFileSync("src/features/library/useLibraryState.ts", "utf8");\nconst libraryReloadOwner = readFileSync("src/features/library/useLibraryReload.ts", "utf8");',
              1,
          )
          text = text.replace(
              '    expect(app).toContain("for (const beat of visible) next.add(beat.id)");',
              '    expect(libraryReloadOwner).toContain("for (const beat of visible) next.add(beat.id)");',
              1,
          )
          architecture_test.write_text(text)
          PY

      - name: Focused task 9.2 checks
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx vitest run \
            tests/component-dom/libraryReload.test.tsx \
            tests/component-dom/startupRevealArchitecture.test.ts \
            tests/integration/appLibraryReloadExtraction.test.ts \
            tests/integration/appMigrationCharacterization.test.ts \
            tests/integration/appCloudUploadQueueExtraction.test.ts \
            2>&1 | tee artifacts/migration-check-logs/00-focused-task-9-2.log
          status=${PIPESTATUS[0]}
          set -e
          test "${status}" -eq 0

      - name: Diff check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 2>&1 | tee artifacts/migration-check-logs/00-diff-check.log

      - name: Run migration matrix
        run: node scripts/run-migration-checks-with-logs.mjs

      - name: Require green migration matrix
        shell: bash
        run: grep -Fqx 'Migration checks: PASS' artifacts/migration-check-logs/summary.txt

      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-9-2-${{ github.run_id }}
          path: artifacts/migration-check-logs
          if-no-files-found: error

      - name: Recheck remote HEAD before publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v0.9.0-test-noche
          remote="$(git rev-parse origin/v0.9.0-test-noche)"
          test "${remote}" = "${GITHUB_SHA}"

      - name: Publish exact validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/migration-check-logs
          rm -f .github/task-9-2-apply.py
          rm -f .github/workflows/task-9-2-apply.yml

          allowed="$(git diff --name-only | sort)"
          expected="$(
            printf '%s\n' \
              '.github/task-9-2-apply.py' \
              '.github/workflows/task-9-2-apply.yml' \
              'src/App.tsx' \
              'src/features/library/useLibraryReload.ts' \
              'tests/component-dom/libraryReload.test.tsx' \
              'tests/component-dom/startupRevealArchitecture.test.ts' \
              'tests/integration/appCloudUploadQueueExtraction.test.ts' \
              'tests/integration/appLibraryReloadExtraction.test.ts' \
              'tests/integration/appMigrationCharacterization.test.ts' | sort
          )"
          test "${allowed}" = "${expected}"

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(app): extract library reload"
          git push origin HEAD:v0.9.0-test-noche
