name: Temporary Task 2.1 Validation

on:
  push:
    branches:
      - app-tsx-migration
    paths:
      - .github/workflows/task-2-1-apply.yml

permissions:
  contents: write

jobs:
  validate-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-tsx-migration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run test:typecheck

      - name: TypeScript unit tests
        run: npm run test:unit:ts

      - name: Component DOM tests
        run: npm run test:component:dom

      - name: Integration tests
        run: npm run test:integration

      - name: Regression guards
        run: npm run test:regressions

      - name: Web build
        run: npm run build:web

      - name: Desktop-source build
        run: npm run build

      - name: Remove temporary validation workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task-2-1-apply.yml
          git commit -m "chore: remove task 2.1 validation workflow"
          git push origin HEAD:app-tsx-migration
