name: Temporary task 7.4 retry

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/temp-task-7-4-retry.yml

permissions:
  contents: write

concurrency:
  group: task-7-4-v0.9.0-test-noche
  cancel-in-progress: false

jobs:
  apply-validate-document:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Verify task base is still in ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 45ca0eae03d1685a1f938f4beaffb4259097882b HEAD
          test -f .github/workflows/temp-task-7-4-apply.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recover original applier blocks
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/temp-task-7-4-apply.yml /tmp/task-7-4-original.yml
          python <<'PY'
          from pathlib import Path
          import textwrap

          text = Path('/tmp/task-7-4-original.yml').read_text(encoding='utf-8')
          marker = "          python <<'PY'\n"
          blocks = []
          cursor = 0
          while True:
              start = text.find(marker, cursor)
              if start < 0:
                  break
              start += len(marker)
              end = text.find("\n          PY", start)
              if end < 0:
                  raise SystemExit('unterminated embedded Python block')
              blocks.append(textwrap.dedent(text[start:end]))
              cursor = end + 1
          if len(blocks) != 3:
              raise SystemExit(f'expected 3 embedded Python blocks, found {len(blocks)}')
          for index, block in enumerate(blocks, start=1):
              Path(f'/tmp/task74-block-{index}.py').write_text(block, encoding='utf-8')
          PY

      - name: Apply extraction and adapt only the obsolete 7.2 assertion
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/task74-block-1.py
          python <<'PY'
          from pathlib import Path

          path = Path('tests/integration/appImportDiscoveryExtraction.test.ts')
          text = path.read_text(encoding='utf-8')
          old_title = '  it("keeps progressive discovery outside App while Save All consumes its worker and browser import remains for 7.4", () => {'
          new_title = '  it("keeps progressive discovery outside App while later import owners consume its worker", () => {'
          old_assertion = '    expect(app).toContain("const importDroppedBrowserFiles = useCallback");\n'
          new_assertion = '    expect(app).toContain("useBrowserImport({");\n    expect(app).not.toContain("const importDroppedBrowserFiles = useCallback");\n'
          if text.count(old_title) != 1 or text.count(old_assertion) != 1:
              raise SystemExit('task 7.2 ownership assertion no longer matches expected baseline')
          text = text.replace(old_title, new_title, 1).replace(old_assertion, new_assertion, 1)
          path.write_text(text, encoding='utf-8')

          retry = Path('.github/workflows/temp-task-7-4-retry.yml')
          if not retry.exists():
              raise SystemExit('retry workflow missing before self-cleanup')
          retry.unlink()
          PY
          git diff --check
          git status --short

      - name: Commit exact implementation tree before validation
        id: implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract browser import entry"
          impl_sha="$(git rev-parse HEAD)"
          echo "sha=$impl_sha" >> "$GITHUB_OUTPUT"
          git diff --check 45ca0eae03d1685a1f938f4beaffb4259097882b.."$impl_sha"

      - name: Run full migration matrix on implementation commit
        id: checks
        continue-on-error: true
        run: node scripts/run-migration-checks-with-logs.mjs

      - name: Upload readable migration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-7-4-retry-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/migration-check-logs/
          if-no-files-found: error
          retention-days: 7

      - name: Stop before publishing if validation failed
        if: steps.checks.outcome == 'failure'
        run: |
          echo "Task 7.4 retry was not pushed because migration checks failed."
          exit 1

      - name: Publish validated implementation only to test branch
        if: steps.checks.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:v0.9.0-test-noche

      - name: Record task 7.4 completion
        if: steps.checks.outcome == 'success'
        id: docs
        shell: bash
        env:
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
        run: |
          set -euo pipefail
          python /tmp/task74-block-2.py
          python <<'PY'
          from pathlib import Path

          path = Path('migration/Registro-de-avance.md')
          text = path.read_text(encoding='utf-8')
          marker = '### Registro — 7.4'
          start = text.rfind(marker)
          if start < 0:
              raise SystemExit('7.4 register entry missing after documentation block')
          prefix, section = text[:start], text[start:]
          section = section.replace(
              '- `tests/integration/appImportSaveAllExtraction.test.ts`\n',
              '- `tests/integration/appImportSaveAllExtraction.test.ts`\n- `tests/integration/appImportDiscoveryExtraction.test.ts`\n',
              1,
          )
          failure = '''Fallos encontrados y causa\n\n- Run 34298545804: la primera matriz falló únicamente en `tests/integration/appImportDiscoveryExtraction.test.ts` porque la prueba de 7.2 todavía exigía que `importDroppedBrowserFiles` permaneciera local en `App.tsx` hasta 7.4. Se clasificó como prueba existente acoplada a un ownership que 7.4 cambia legítimamente; typecheck, unit TS, component DOM, regressions y ambos builds ya habían pasado. Se adaptó solo esa expectativa al nuevo owner `useBrowserImport`.\n\n'''
          needle = 'Comprobaciones no ejecutadas\n\n'
          if needle not in section:
              raise SystemExit('could not place 7.4 failure diagnosis')
          section = section.replace(needle, failure + needle, 1)
          section = section.replace(
              '- Ninguna. `.github/workflows/temp-task-7-4-apply.yml` se elimina dentro del mismo commit de implementación antes de ejecutar la matriz.',
              '- Ninguna. Los workflows temporales `temp-task-7-4-apply.yml` y `temp-task-7-4-retry.yml` se eliminan dentro del mismo commit de implementación antes de ejecutar la matriz final.',
              1,
          )
          path.write_text(prefix + section, encoding='utf-8')
          PY
          git diff --check
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md
          git commit -m "migration: record task 7.4 completion"
          git push origin HEAD:v0.9.0-test-noche
          docs_sha="$(git rev-parse HEAD)"
          echo "sha=$docs_sha" >> "$GITHUB_OUTPUT"

      - name: Write final agent state from observed remote HEAD
        if: steps.checks.outcome == 'success'
        shell: bash
        env:
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
          DOCS_SHA: ${{ steps.docs.outputs.sha }}
        run: |
          set -euo pipefail
          observed="$(git ls-remote origin refs/heads/v0.9.0-test-noche | cut -f1)"
          test "$observed" = "$DOCS_SHA"
          export OBSERVED_HEAD="$observed"
          python /tmp/task74-block-3.py
          git diff --check
          git add migration/BeatGaler-agent-state.md
          git commit -m "migration: close task 7.4 agent state"
          git push origin HEAD:v0.9.0-test-noche
          echo "Final local commit after agent-state: $(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
