name: TMP Issue 97 hardening

on:
  push:
    branches:
      - issue-97-instant-stable-library-reveal

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'chore: run Issue 97 hardening patch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-97-instant-stable-library-reveal
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Apply hardening patch
        run: python scripts/tmp-issue-97-hardening.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run test:typecheck

      - name: Component DOM tests
        run: npm run test:component:dom

      - name: Integration tests
        run: npm run test:integration

      - name: Regression guards
        run: npm run test:regressions

      - name: Web production build
        run: npm run build:web

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/BeatCard.tsx src/features/artwork/artworkThumbnailCache.ts tests/component-dom/artworkThumbnailCache.test.ts tests/component-dom/startupRevealArchitecture.test.ts
          git commit -m "F2/97: harden cached reveal across Web and Desktop"
          git push origin HEAD:issue-97-instant-stable-library-reveal
