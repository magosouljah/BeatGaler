name: Temporary Task 4.3 Finalize 2
on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-4-3-finalize2.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - name: Apply closure
        shell: bash
        env:
          ENTRY_B64: 
          STATE_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          roadmap_path = Path('migration/BeatGaler-roadmap-para-trabajar-con-IAs.md')
          roadmap = roadmap_path.read_text()
          pending = '### [ ] 4.3 — Separar la cola y navegación'
          done = '### [x] 4.3 — Separar la cola y navegación'
          if done not in roadmap:
              if roadmap.count(pending) != 1:
                  raise SystemExit('roadmap 4.3 entry is ambiguous')
              roadmap_path.write_text(roadmap.replace(pending, done, 1))
          reg_path = Path('migration/Registro-de-avance.md')
          reg = reg_path.read_text().rstrip()
          marker = 'Tarea: 4.3 — Separar la cola y navegación'
          if marker not in reg:
              entry = base64.b64decode(os.environ['ENTRY_B64']).decode()
              reg_path.write_text(reg + '\n\n' + entry + '\n')
          state = base64.b64decode(os.environ['STATE_B64']).decode()
          Path('migration/BeatGaler-agent-state.md').write_text(state)
          for p in ['.github/workflows/task-4-3.yml','.github/workflows/task-4-3-retry.yml','.github/workflows/task-4-3-finalize.yml','.github/workflows/task-4-3-finalize2.yml']:
              Path(p).unlink(missing_ok=True)
          PY
          git diff --check
          test "$(grep -c '^### \[x\] 4.3 — Separar la cola y navegación$' migration/BeatGaler-roadmap-para-trabajar-con-IAs.md)" = 1
          test "$(grep -c '^Tarea: 4.3 — Separar la cola y navegación$' migration/Registro-de-avance.md)" = 1
          git status --short
      - name: Commit closure
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore(migration): close task 4.3"
          git push origin HEAD:v0.9.0-test-noche
