name: Temporary Task 4.2 Retry 2

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/task-4-2-retry2.yml

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply corrected extraction and guard adaptations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/task-4-2-retry.yml').read_text()
          marker = "          python - <<'PY'\n"
          starts = []
          pos = 0
          while True:
              i = text.find(marker, pos)
              if i < 0: break
              starts.append(i + len(marker))
              pos = i + len(marker)
          assert len(starts) >= 2
          def script_at(start):
              end = text.index("\n          PY", start)
              block = text[start:end]
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          first = script_at(starts[0])
          first = first.replace("assert 'cookingPlaybackUrlRef' not in s\n", '')
          first = first.replace("assert 'cookingWarmPromisesRef' not in s\n", '')
          exec(compile(first, '<apply-extraction>', 'exec'), {})
          second = script_at(starts[1])
          exec(compile(second, '<adapt-guards>', 'exec'), {})
          PY
          cat > tests/integration/appPlaybackExtraction.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { resolve } from "node:path";
          import { describe, expect, it } from "vitest";
          const appSource = readFileSync(resolve(process.cwd(), "src/App.tsx"), "utf8");
          const controllerSource = readFileSync(resolve(process.cwd(), "src/features/playback/usePlaybackController.ts"), "utf8");
          describe("App playback extraction", () => {
            it("moves playback preparation, cache invalidation, audio events and play routing out of App", () => {
              expect(appSource).toContain('usePlaybackController({');
              expect(appSource).not.toContain('const ensureWarmPlaybackUrl = useCallback');
              expect(appSource).not.toContain('APP_HANDLE_PLAY_ENTER');
              expect(appSource).not.toContain('beatgaler:playback-cache-cleared');
              expect(controllerSource).toContain('beatgaler:playback-cache-cleared');
              expect(controllerSource).toContain('beatgaler:audio-playing');
              expect(controllerSource).toContain('APP_HANDLE_PLAY_ENTER');
              expect(controllerSource).toContain('if (!isTauriAvailable)');
              expect(controllerSource).toContain('prepareBeatForPlayback(beat)');
            });
          });
          EOF
      - name: Checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p migration-check-logs
          : > migration-check-logs/summary.txt
          failed=0
          run_check() { name="$1"; shift; echo "== $name ==" | tee -a migration-check-logs/summary.txt; if "$@" > "migration-check-logs/$name.log" 2>&1; then echo "PASS $name" | tee -a migration-check-logs/summary.txt; else echo "FAIL $name" | tee -a migration-check-logs/summary.txt; failed=1; fi; }
          run_check diff-check git diff --check
          run_check typecheck npm run test:typecheck
          run_check unit-ts npm run test:unit:ts
          run_check component-dom npm run test:component:dom
          run_check integration npm run test:integration
          run_check regressions npm run test:regressions
          run_check build-web npm run build:web
          run_check build npm run build
          exit "$failed"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-4-2-${{ github.run_id }}
          path: migration-check-logs/
      - name: Commit verified implementation
        if: success()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/features/playback/usePlaybackController.ts tests/integration/appPlaybackExtraction.test.ts tests/integration/appMigrationCharacterization.test.ts tests/integration/issue97RuntimeWebFollowup.test.ts scripts/run-regressions.mjs
          git commit -m "refactor(app): extract playback controller"
          git push origin HEAD:v0.9.0-test-noche
