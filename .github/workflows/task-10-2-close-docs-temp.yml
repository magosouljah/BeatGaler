name: Task 10.2 close docs temp

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/task-10-2-close-docs-temp.yml
      - scripts/task-10-2-close-docs-temp.cjs

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Update 10.2 migration docs
        run: node scripts/task-10-2-close-docs-temp.cjs
      - name: Verify docs
        run: |
          grep -F '### [x] 10.2 — Dejar la composición mínima' migration/BeatGaler-roadmap-para-trabajar-con-IAs.md
          grep -F '## 2026-09-09 — Tarea 10.2 — Dejar la composición mínima' migration/Registro-de-avance.md
          grep -F 'Estado: `Terminada`' migration/BeatGaler-agent-state.md
          grep -F '10.3 — Retirar restos y conexiones temporales' migration/BeatGaler-agent-state.md
      - name: Remove temporary tooling
        run: |
          rm scripts/task-10-2-close-docs-temp.cjs
          rm .github/workflows/task-10-2-close-docs-temp.yml
      - name: Commit 10.2 documentation close
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md migration/BeatGaler-agent-state.md scripts/task-10-2-close-docs-temp.cjs .github/workflows/task-10-2-close-docs-temp.yml
          git commit -m "docs(migration): close task 10.2"
          git push origin HEAD:v0.9.0-test-noche
