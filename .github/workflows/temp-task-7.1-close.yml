name: Temporary task 7.1 closer

on:
  push:
    branches:
      - v0.9.0-test-noche

permissions:
  contents: write

jobs:
  close-task-7-1:
    if: contains(github.event.head_commit.message, '[close-7.1]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Close roadmap, register and agent state
        env:
          INITIAL_SHA: 182717a81061534658ab5b688e9808a5f38075f1
          VALIDATED_SHA: af916fd729d2ef6ceef16c8ce73b9caf84c4f657
          REG_Z: 
          AGENT_Z: 
        run: |
          set -euo pipefail
          export OBSERVED_SHA="$(git rev-parse HEAD)"
          python -c 'from pathlib import Path; p=Path("migration/BeatGaler-roadmap-para-trabajar-con-IAs.md"); t=p.read_text(encoding="utf-8"); old="### [ ] 7.1 — Separar Review y sus acciones básicas"; new="### [x] 7.1 — Separar Review y sus acciones básicas"; assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new,1),encoding="utf-8")'
          python -c 'import base64,zlib,os; from pathlib import Path; p=Path("migration/Registro-de-avance.md"); t=p.read_text(encoding="utf-8"); entry=zlib.decompress(base64.b64decode(os.environ["REG_Z"])).decode(); assert "### Registro — 7.1" not in t; p.write_text(t.rstrip()+entry,encoding="utf-8")'
          python -c 'import base64,zlib,os; from pathlib import Path; data=zlib.decompress(base64.b64decode(os.environ["AGENT_Z"])).decode().replace("__OBSERVED_SHA__",os.environ["OBSERVED_SHA"]); Path("migration/BeatGaler-agent-state.md").write_text(data,encoding="utf-8")'
          git rm .github/workflows/temp-task-7.1-close.yml
          actual="$(git diff --name-only "$VALIDATED_SHA" | sort)"
          expected="$(printf '%s\n' migration/BeatGaler-agent-state.md migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md | sort)"
          test "$actual" = "$expected"
          git diff --check "$INITIAL_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md migration/BeatGaler-agent-state.md
          git commit -m "docs(migration): close task 7.1"
          git push origin HEAD:v0.9.0-test-noche
