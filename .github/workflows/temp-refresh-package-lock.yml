name: TEMP - Refresh package lock for Task 4.2

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: task-4.2-supply-chain

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Regenerate locked npm graph
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lock and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-refresh-package-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/temp-refresh-package-lock.yml
          git diff --cached --exit-code && { echo "Expected lock/workflow changes are missing"; exit 1; } || true
          git commit -m "chore(deps): lock secure transitive overrides"
          git push origin HEAD:task-4.2-supply-chain
