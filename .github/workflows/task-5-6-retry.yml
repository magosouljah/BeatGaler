name: Task 5.6 Retry

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/task-5-6-retry.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply corrected extraction
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap

          workflow = Path('.github/workflows/task-5-6-apply.yml').read_text()
          for target in [
            'src/features/tags/useTagRename.ts',
            'src/features/tags/components/TagRenameDialog.tsx',
            'tests/integration/appTagRenameExtraction.test.ts',
          ]:
            pattern = rf"cat > {re.escape(target)} <<'EOF'\n(.*?)\n          EOF"
            match = re.search(pattern, workflow, re.S)
            if not match:
              raise SystemExit(f'could not recover template for {target}')
            body = textwrap.dedent(match.group(1)) + '\n'
            path = Path(target)
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_text(body)

          script_match = re.search(r"python - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if not script_match:
            raise SystemExit('could not recover App extraction script')
          script = textwrap.dedent(script_match.group(1))
          bad = "s = s.replace('import { sanitizeUserVisibleText } from \\\"./lib/userVisibleError\\\";\\n', '')\n"
          script = script.replace(bad, '')
          exec(compile(script, '<task-5-6-extraction>', 'exec'))
          PY
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Run migration checks
        shell: bash
        run: |
          mkdir -p migration-check-logs
          : > migration-check-logs/summary.txt
          failed=0
          run_check() {
            name="$1"; shift
            echo "===== $name =====" > "migration-check-logs/$name.log"
            if "$@" >> "migration-check-logs/$name.log" 2>&1; then
              echo "$name PASS" | tee -a migration-check-logs/summary.txt
            else
              code=$?
              echo "$name FAIL exit=$code" | tee -a migration-check-logs/summary.txt
              failed=1
            fi
          }
          run_check typecheck npm run test:typecheck
          run_check unit-ts npm run test:unit:ts
          run_check component-dom npm run test:component:dom
          run_check integration npm run test:integration
          run_check regressions npm run test:regressions
          run_check build-web npm run build:web
          run_check build npm run build
          exit "$failed"
      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-5-6-${{ github.run_id }}-${{ github.run_attempt }}
          path: migration-check-logs/
      - name: Commit verified implementation
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/tags/useTagRename.ts src/features/tags/components/TagRenameDialog.tsx tests/integration/appTagRenameExtraction.test.ts
          git commit -m "refactor(tags): extract global tag rename"
          git push origin HEAD:v0.9.0-test-noche
