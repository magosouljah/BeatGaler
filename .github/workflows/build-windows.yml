name: Build - Windows

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  BEATGALER_UPDATER_ENDPOINT: https://github.com/magosouljah/galer/releases/latest/download/latest.json

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify Cargo.lock before build
        shell: pwsh
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 | Out-Null

      - name: Build Tauri app
        run: npx tauri build --bundles nsis

      - name: Verify updater artifacts
        run: npm run updater:verify-artifacts

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatGaler-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            VERSION
          if-no-files-found: error