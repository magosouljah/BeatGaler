name: Build - Windows
run-name: Build Windows [${{ inputs.release_intent }}] @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      release_intent:
        description: "Artifact intent. Public artifacts require Authenticode + RFC3161."
        required: true
        default: internal
        type: choice
        options:
          - internal
          - public

permissions:
  contents: read

env:
  # Tauri updater signing protects updater payload integrity. It is NOT Windows Authenticode.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  WINDOWS_AUTHENTICODE_PROVIDER: ${{ vars.WINDOWS_AUTHENTICODE_PROVIDER || 'PENDING_OWNER_PROVIDER' }}
  WINDOWS_RFC3161_TIMESTAMP_URL: ${{ vars.WINDOWS_RFC3161_TIMESTAMP_URL }}
  WINDOWS_AUTHENTICODE_EXPECTED_SUBJECT: ${{ vars.WINDOWS_AUTHENTICODE_EXPECTED_SUBJECT }}

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Load canonical release manifest
        run: node scripts/release-manifest.mjs github-env

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache pinned Bot API runtime
        id: bot-api-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: runtime/windows-bot-api
          key: telegram-bot-api-windows-static-${{ hashFiles('supply-chain/runtime-sources.json') }}

      - name: Build official pinned Bot API runtime
        if: steps.bot-api-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/tdlib/telegram-bot-api.git runtime/telegram-bot-api-source
          git -C runtime/telegram-bot-api-source checkout $env:BEATGALER_BOT_API_COMMIT
          if ((git -C runtime/telegram-bot-api-source rev-parse HEAD).Trim() -ne $env:BEATGALER_BOT_API_COMMIT) { throw "Bot API source commit mismatch" }
          git -C runtime/telegram-bot-api-source submodule update --init --recursive

          git clone https://github.com/microsoft/vcpkg.git runtime/vcpkg
          git -C runtime/vcpkg checkout $env:BEATGALER_VCPKG_COMMIT
          if ((git -C runtime/vcpkg rev-parse HEAD).Trim() -ne $env:BEATGALER_VCPKG_COMMIT) { throw "vcpkg source commit mismatch" }
          & runtime/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed with exit code $LASTEXITCODE" }
          & runtime/vcpkg/vcpkg.exe install gperf:x64-windows-static openssl:x64-windows-static zlib:x64-windows-static --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg dependency installation failed with exit code $LASTEXITCODE" }

          cmake -S runtime/telegram-bot-api-source -B runtime/telegram-bot-api-build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$PWD/runtime/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_INSTALL_PREFIX="$PWD/runtime/telegram-bot-api-install"
          if ($LASTEXITCODE -ne 0) { throw "Telegram Bot API configure failed with exit code $LASTEXITCODE" }
          cmake --build runtime/telegram-bot-api-build --config Release --target install --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Telegram Bot API build failed with exit code $LASTEXITCODE" }

          $bot = Get-ChildItem runtime/telegram-bot-api-install,runtime/telegram-bot-api-build -Filter telegram-bot-api.exe -Recurse | Select-Object -First 1
          if (-not $bot) { throw "The official build did not produce telegram-bot-api.exe" }
          New-Item -ItemType Directory -Force runtime/windows-bot-api | Out-Null
          Copy-Item -LiteralPath $bot.FullName -Destination runtime/windows-bot-api/telegram-bot-api.exe

      - name: Stage and verify Windows runtimes
        shell: pwsh
        run: |
          $resourceDir = "src-tauri/resources/windows"
          New-Item -ItemType Directory -Force $resourceDir | Out-Null

          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $actualNodeVersion = (& $node --version).TrimStart('v')
          if ($actualNodeVersion -ne $env:BEATGALER_NODE_VERSION) { throw "Node runtime version mismatch: $actualNodeVersion" }
          Copy-Item -LiteralPath $node -Destination "$resourceDir/node.exe"
          Copy-Item -LiteralPath "runtime/windows-bot-api/telegram-bot-api.exe" -Destination "$resourceDir/telegram-bot-api.exe"

          $ffmpegAsset = $env:BEATGALER_FFMPEG_WINDOWS_ASSET
          $ffmpegRepo = $env:BEATGALER_FFMPEG_REPOSITORY
          $ffmpegTag = $env:BEATGALER_FFMPEG_TAG
          $ffmpegDownload = Join-Path $env:RUNNER_TEMP $ffmpegAsset
          $ffmpegUrl = "https://github.com/$ffmpegRepo/releases/download/$ffmpegTag/$ffmpegAsset"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegDownload -UseBasicParsing
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$ffmpegRepo/releases/tags/$ffmpegTag" -Headers @{ Accept = "application/vnd.github+json" }
          $asset = $release.assets | Where-Object { $_.name -eq $ffmpegAsset } | Select-Object -First 1
          if (-not $asset -or -not $asset.digest) { throw "Pinned FFmpeg asset digest is unavailable" }
          $expectedFfmpegHash = ($asset.digest -replace '^sha256:', '').ToLowerInvariant()
          $actualFfmpegHash = (Get-FileHash $ffmpegDownload -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedFfmpegHash -ne $actualFfmpegHash) { throw "FFmpeg release digest mismatch" }
          Copy-Item -LiteralPath $ffmpegDownload -Destination "$resourceDir/ffmpeg.exe"

          foreach ($runtime in @("$resourceDir/ffmpeg.exe", "$resourceDir/node.exe", "$resourceDir/telegram-bot-api.exe")) {
            $item = Get-Item -LiteralPath $runtime -ErrorAction Stop
            if ($item.Length -lt 1MB) { throw "$runtime is unexpectedly small: $($item.Length) bytes" }
            $magic = [System.IO.File]::ReadAllBytes($item.FullName)[0..1]
            if ($magic[0] -ne 0x4D -or $magic[1] -ne 0x5A) { throw "$runtime is not a Windows PE executable" }
          }
          & "$resourceDir/ffmpeg.exe" -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ffmpeg.exe is not executable" }
          & "$resourceDir/node.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled node.exe is not executable" }
          & "$resourceDir/telegram-bot-api.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "Bundled telegram-bot-api.exe is not executable" }

      - name: Record Windows runtime provenance
        shell: pwsh
        run: |
          node scripts/write-runtime-provenance.mjs `
            --output artifacts/runtime-provenance-windows.json `
            --platform windows-x64 `
            --sources supply-chain/runtime-sources.json `
            ffmpeg=src-tauri/resources/windows/ffmpeg.exe `
            node=src-tauri/resources/windows/node.exe `
            bot-api=src-tauri/resources/windows/telegram-bot-api.exe

      - name: Verify Windows packaging and Authenticode seam contracts
        shell: pwsh
        run: |
          npm run test:windows-packaging
          npm run test:windows-authenticode-guard
          ./scripts/test-windows-authenticode-seam.ps1

      - name: Verify Cargo.lock before build
        shell: pwsh
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 | Out-Null

      - name: Prepare Authenticode config for public intent
        if: ${{ inputs.release_intent == 'public' }}
        shell: pwsh
        env:
          WINDOWS_AUTHENTICODE_CERT_SHA1: ${{ secrets.WINDOWS_AUTHENTICODE_CERT_SHA1 }}
        run: |
          ./scripts/prepare-windows-authenticode-config.ps1 `
            -BaseConfigPath "src-tauri/tauri.windows-release.conf.json" `
            -OutputPath "$env:RUNNER_TEMP/tauri.windows-authenticode.conf.json"

      - name: Build Tauri app - internal
        if: ${{ inputs.release_intent == 'internal' }}
        run: npx tauri build --bundles nsis --config src-tauri/tauri.windows-release.conf.json

      - name: Build Tauri app - public Authenticode
        if: ${{ inputs.release_intent == 'public' }}
        run: npx tauri build --bundles nsis --config "${{ runner.temp }}/tauri.windows-authenticode.conf.json"

      - name: Verify Windows Authenticode public release gate
        if: ${{ inputs.release_intent == 'public' }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer; found $($installers.Count)."
          }
          $installer = $installers[0]
          ./scripts/windows-authenticode.ps1 -Path $installer.FullName -RequireExpectedSubject

          $updaterSig = Get-Item -LiteralPath "$($installer.FullName).sig" -ErrorAction Stop
          if ($updaterSig.LastWriteTimeUtc -lt $installer.LastWriteTimeUtc) {
            throw "Tauri updater signature is older than the final Authenticode-signed installer."
          }

      - name: Verify installed Windows runtimes by content digest
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $installDir = Join-Path $env:RUNNER_TEMP "BeatGaler-install-check"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS test installation failed with exit code $($process.ExitCode)" }

          foreach ($relative in @("ffmpeg.exe", "node.exe", "telegram-bot-api.exe", "direct-transport/transport-helper.cjs", "direct-transport/runtime-watchdog.cjs")) {
            $installed = Join-Path $installDir $relative
            if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) { throw "Installer omitted required runtime: $relative" }
          }
          $ffmpeg = Join-Path $installDir "ffmpeg.exe"
          $node = Join-Path $installDir "node.exe"
          $bot = Join-Path $installDir "telegram-bot-api.exe"
          & $ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw "Installed ffmpeg.exe is not executable" }
          & $node --version
          if ($LASTEXITCODE -ne 0) { throw "Installed node.exe is not executable" }
          & $bot --help
          if ($LASTEXITCODE -ne 0) { throw "Installed telegram-bot-api.exe is not executable" }

          $stagedFfmpegHash = (Get-FileHash "src-tauri/resources/windows/ffmpeg.exe" -Algorithm SHA256).Hash
          $installedFfmpegHash = (Get-FileHash $ffmpeg -Algorithm SHA256).Hash
          if ($stagedFfmpegHash -ne $installedFfmpegHash) { throw "Installed FFmpeg digest differs from staged runtime" }
          $stagedNodeHash = (Get-FileHash "src-tauri/resources/windows/node.exe" -Algorithm SHA256).Hash
          $installedNodeHash = (Get-FileHash $node -Algorithm SHA256).Hash
          if ($stagedNodeHash -ne $installedNodeHash) { throw "Installed Node digest differs from staged runtime" }
          $stagedBotHash = (Get-FileHash "src-tauri/resources/windows/telegram-bot-api.exe" -Algorithm SHA256).Hash
          $installedBotHash = (Get-FileHash $bot -Algorithm SHA256).Hash
          if ($stagedBotHash -ne $installedBotHash) { throw "Installed Bot API digest differs from staged runtime" }

          if ("${{ inputs.release_intent }}" -eq "public") {
            $appCandidates = @(Get-ChildItem -LiteralPath $installDir -Filter *.exe -File | Where-Object {
              $_.Name -notin @("ffmpeg.exe", "node.exe", "telegram-bot-api.exe", "uninstall.exe") -and
              $_.Name -notmatch '^unins\d+\.exe$'
            })
            if ($appCandidates.Count -ne 1) {
              $names = ($appCandidates | ForEach-Object Name) -join ", "
              throw "Expected exactly one installed application executable; found $($appCandidates.Count): $names"
            }
            ./scripts/windows-authenticode.ps1 -Path $appCandidates[0].FullName -RequireExpectedSubject
          }

      - name: Verify updater artifacts
        run: npm run updater:verify-artifacts

      - name: Record Windows release eligibility
        shell: pwsh
        run: |
          $intent = "${{ inputs.release_intent }}"
          if ($intent -notin @("internal", "public")) { throw "Unknown release_intent '$intent'." }
          $publicEligible = $intent -eq "public"
          $record = [ordered]@{
            schema = 1
            release_intent = $intent
            public_release_eligible = $publicEligible
            authenticode = if ($publicEligible) { "valid" } else { "not-required-internal" }
            digest = if ($publicEligible) { "SHA256" } else { $null }
            timestamp = if ($publicEligible) { "RFC3161" } else { $null }
            provider = $env:WINDOWS_AUTHENTICODE_PROVIDER
            tauri_updater_signature = "separate-control"
            note = if ($publicEligible) { "PUBLIC_AUTHENTICODE_VERIFIED" } else { "INTERNAL_NOT_FOR_PUBLIC_RELEASE" }
          }
          if (-not $publicEligible -and $record.public_release_eligible -ne $false) {
            throw "Internal build must remain non-public."
          }
          $record | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath "WINDOWS-AUTHENTICODE-STATUS.json" -Encoding utf8

      - name: Create Windows artifact checksums
        shell: pwsh
        run: |
          $out = "artifacts/SHA256SUMS-Windows.txt"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis -File | Sort-Object Name
          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Add-Content -Path $out -Value "$hash  $($file.Name)"
          }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BeatGaler-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            artifacts/runtime-provenance-windows.json
            artifacts/SHA256SUMS-Windows.txt
            WINDOWS-AUTHENTICODE-STATUS.json
            VERSION
          if-no-files-found: error
