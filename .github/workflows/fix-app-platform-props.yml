name: Fix App Platform Props

on:
  push:
    branches:
      - integration-v0.8.0-alpha.1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration-v0.8.0-alpha.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile shared component capability props
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()

          old_import = 'import { libraryStateManager } from "./lib/libraryStateManager";\n'
          new_import = old_import + 'import { platform } from "./platform";\n'
          if 'import { platform } from "./platform";' not in text:
              if old_import not in text:
                  raise SystemExit('App platform import anchor not found')
              text = text.replace(old_import, new_import, 1)

          old_open = 'openableProject={openableCloudProjectIds.has(beat.id) || Boolean(beat.offline_available && (beat.has_flp || beat.has_als) && (beat.flp_path || beat.als_path))}'
          new_open = 'openableProject={platform.capabilities.openProjectInDaw && (openableCloudProjectIds.has(beat.id) || Boolean(beat.offline_available && (beat.has_flp || beat.has_als) && (beat.flp_path || beat.als_path)))}'
          if old_open in text:
              text = text.replace(old_open, new_open, 1)
          elif new_open not in text:
              raise SystemExit('BeatCard openableProject anchor not found')

          old_drag = 'dragEnabled={!selectMode}'
          new_drag = 'dragEnabled={!selectMode && platform.capabilities.manualLibraryReorder}'
          if old_drag in text:
              text = text.replace(old_drag, new_drag, 1)
          elif new_drag not in text:
              raise SystemExit('BeatCard dragEnabled anchor not found')

          anchor = 'offlineBusy={offlineBusyIds.has(beat.id)}\n'
          props = anchor + '                    canUseOfflinePackage={platform.capabilities.offlinePackage}\n                    canUseLocalHelper={platform.capabilities.localHelper}\n                    canInspectNativeProject={platform.capabilities.openProjectInDaw}\n'
          if 'canUseOfflinePackage={platform.capabilities.offlinePackage}' not in text:
              if anchor not in text:
                  raise SystemExit('BeatCard capability prop anchor not found')
              text = text.replace(anchor, props, 1)

          player_anchor = 'onAddBeat={() => { if (!rejectOfflineMutation("Adding a beat")) setShowAdd(true); }}\n'
          player_props = 'canAddBeat={platform.capabilities.browserFileImport || platform.capabilities.nativeFilesystemDrop}\n          ' + player_anchor
          if 'canAddBeat={platform.capabilities.browserFileImport || platform.capabilities.nativeFilesystemDrop}' not in text:
              if player_anchor not in text:
                  raise SystemExit('Player canAddBeat anchor not found')
              text = text.replace(player_anchor, player_props, 1)

          path.write_text(text)
          PY
          npm ci
          npm run test:typecheck
          rm .github/workflows/fix-app-platform-props.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/fix-app-platform-props.yml
          git commit -m "fix(web): reconcile shared platform capability props"
          git push origin HEAD:integration-v0.8.0-alpha.1
