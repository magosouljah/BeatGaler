name: Temporary Task 4.2 Finalize

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/task-4-2-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - name: Close task 4.2
        shell: bash
        run: |
          set -euo pipefail
          python scripts/task42-finalize.py
          rm -f .github/workflows/task-4-2-final.yml .github/workflows/task-4-2-final2.yml .github/workflows/task-4-2-final3.yml .github/workflows/task-4-2-final4.yml .github/workflows/task-4-2-finalize.yml scripts/task42-finalize.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md migration/BeatGaler-agent-state.md .github/workflows scripts/task42-finalize.py
          git commit -m 'chore(migration): close task 4.2'
          git push origin HEAD:v0.9.0-test-noche
