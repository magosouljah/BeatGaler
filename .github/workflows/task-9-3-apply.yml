name: Task 9.3 Apply

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-9-3-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Prepare evidence directory
        run: |
          mkdir -p migration-check-logs
          printf 'Task 9.3 run %s\n' "$GITHUB_RUN_ID" > migration-check-logs/summary.txt

      - name: Safety preflight
        shell: bash
        run: |
          set -euo pipefail
          INITIAL_SHA="18ad9a91f3a6207c652587509d27f4e3ee4907ca"
          test "$(git branch --show-current)" = "v0.9.0-test-noche"
          git merge-base --is-ancestor "$INITIAL_SHA" HEAD
          if test -n "$(git rev-list --merges "$INITIAL_SHA"..HEAD)"; then
            echo "Unexpected merge commit in this round" | tee -a migration-check-logs/summary.txt
            exit 1
          fi
          unexpected="$(git diff --name-only "$INITIAL_SHA"..HEAD | grep -Ev '^(\.github/task-9-3-apply\.py|\.github/workflows/task-9-3-apply\.yml)$' || true)"
          if test -n "$unexpected"; then
            printf 'Unexpected preflight files:\n%s\n' "$unexpected" | tee -a migration-check-logs/summary.txt
            exit 1
          fi
          printf 'Safety preflight: PASS\n' | tee -a migration-check-logs/summary.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Setup npm
        run: npm install --global npm@10.9.8

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee migration-check-logs/npm-ci.log
          printf 'npm ci: PASS\n' >> migration-check-logs/summary.txt

      - name: Apply task 9.3 and adapt ownership guards
        shell: bash
        run: |
          set -euo pipefail
          cp .github/task-9-3-apply.py /tmp/task-9-3-apply.py
          python .github/task-9-3-apply.py --apply
          python - <<'PY'
          from pathlib import Path

          helper_path = Path("tests/integration/appHelperExtraction.test.ts")
          helper = helper_path.read_text()
          helper = helper.replace(
              'const journal = readFileSync(resolve(root, "src/features/cloud/interruptedUploadJournal.ts"), "utf8");\n',
              'const journal = readFileSync(resolve(root, "src/features/cloud/interruptedUploadJournal.ts"), "utf8");\nconst startupBootstrap = readFileSync(resolve(root, "src/features/startup/useStartupBootstrap.ts"), "utf8");\n',
              1,
          )
          helper = helper.replace('      "./features/cloud/interruptedUploadJournal",\n', '', 1)
          marker = '    expect(artworkHydration).toContain(\'from "./decodeArtworkDataUrl"\');\n'
          replacement = marker + '    expect(startupBootstrap).toContain(\'from "../cloud/interruptedUploadJournal"\');\n'
          if marker not in helper:
              raise SystemExit("Could not adapt appHelperExtraction journal ownership")
          helper = helper.replace(marker, replacement, 1)
          helper_path.write_text(helper)

          routing_path = Path("tests/integration/issue97WebRoutingContract.test.ts")
          routing = routing_path.read_text()
          routing = routing.replace(
              'const drawerPersistence = readFileSync(resolve(process.cwd(), "src/features/edit/useDrawerCloudPersistence.ts"), "utf8");\n',
              'const drawerPersistence = readFileSync(resolve(process.cwd(), "src/features/edit/useDrawerCloudPersistence.ts"), "utf8");\nconst startupBootstrap = readFileSync(resolve(process.cwd(), "src/features/startup/useStartupBootstrap.ts"), "utf8");\n',
              1,
          )
          old_function = '''function section(startMarker: string, endMarker: string): string {\n  const start = app.indexOf(startMarker);\n  const end = app.indexOf(endMarker, start + startMarker.length);\n  if (start < 0 || end < 0) throw new Error(`Could not find App.tsx section: ${startMarker}`);\n  return app.slice(start, end);\n}\n'''
          new_function = '''function sourceSection(source: string, startMarker: string, endMarker: string, label: string): string {\n  const start = source.indexOf(startMarker);\n  const end = source.indexOf(endMarker, start + startMarker.length);\n  if (start < 0 || end < 0) throw new Error(`Could not find ${label} section: ${startMarker}`);\n  return source.slice(start, end);\n}\n\nfunction section(startMarker: string, endMarker: string): string {\n  return sourceSection(app, startMarker, endMarker, "App.tsx");\n}\n'''
          if old_function not in routing:
              raise SystemExit("Could not adapt issue97 section helper")
          routing = routing.replace(old_function, new_function, 1)
          old_call = '''    const startupCatch = section(\n      'console.warn("Telegram vault startup check failed:", error);',\n      "return () => { cancelled = true; };",\n    );'''
          new_call = '''    const startupCatch = sourceSection(\n      startupBootstrap,\n      'console.warn("Telegram vault startup check failed:", error);',\n      "return () => { cancelled = true; };",\n      "useStartupBootstrap.ts",\n    );'''
          if old_call not in routing:
              raise SystemExit("Could not redirect issue97 startup contract")
          routing = routing.replace(old_call, new_call, 1)
          routing_path.write_text(routing)

          regression_path = Path("scripts/run-regressions.mjs")
          regression = regression_path.read_text()
          regression = regression.replace(
              '  const libraryStateOwner = readFileSync(path.join(root, "src", "features", "library", "useLibraryState.ts"), "utf8");\n',
              '  const libraryStateOwner = readFileSync(path.join(root, "src", "features", "library", "useLibraryState.ts"), "utf8");\n  const startupBootstrap = readFileSync(path.join(root, "src", "features", "startup", "useStartupBootstrap.ts"), "utf8");\n',
              1,
          )
          regression = regression.replace(
              '  if (!app.includes(\'loadOfflineLibrary()\')) fail("Cold Offline startup lost native durable-library validation.");',
              '  if (!startupBootstrap.includes(\'loadOfflineLibrary()\')) fail("Cold Offline startup lost native durable-library validation.");',
              1,
          )
          regression = regression.replace(
              '  if (!app.includes(\'if (!status.reachable)\')) fail("Offline startup/reconnect lost explicit Telegram transport reachability.");',
              '  if (!startupBootstrap.includes(\'if (!status.reachable)\') || !app.includes(\'if (!status.reachable)\')) fail("Offline startup/reconnect lost explicit Telegram transport reachability.");',
              1,
          )
          regression = regression.replace(
              '  if (!app.includes(\'setRevealedBeatIds(new Set(offline.map(beat => beat.id)))\')) fail("Validated Offline beats no longer resolve the startup reveal atomically.");',
              '  if (!startupBootstrap.includes(\'setRevealedBeatIds(new Set(offline.map(beat => beat.id)))\')) fail("Validated Offline beats no longer resolve the startup reveal atomically.");',
              1,
          )
          regression = regression.replace(
              "  const startupReachableIndex = app.indexOf('if (!status.reachable)', app.indexOf('Telegram startup connectivity check failed'));\n  const startupConnectedIndex = app.indexOf('if (!status.connected)', app.indexOf('Telegram startup connectivity check failed'));",
              "  const startupReachableIndex = startupBootstrap.indexOf('if (!status.reachable)', startupBootstrap.indexOf('Telegram startup connectivity check failed'));\n  const startupConnectedIndex = startupBootstrap.indexOf('if (!status.connected)', startupBootstrap.indexOf('Telegram startup connectivity check failed'));",
              1,
          )
          required = [
              'const startupBootstrap = readFileSync(path.join(root, "src", "features", "startup", "useStartupBootstrap.ts"), "utf8");',
              "startupBootstrap.includes('loadOfflineLibrary()')",
              "startupBootstrap.includes('setRevealedBeatIds(new Set(offline.map(beat => beat.id)))')",
              "startupBootstrap.indexOf('if (!status.reachable)'",
          ]
          if not all(item in regression for item in required):
              raise SystemExit("Could not adapt startup regression ownership")
          regression_path.write_text(regression)
          PY
          rm .github/task-9-3-apply.py
          rm .github/workflows/task-9-3-apply.yml
          printf 'Task 9.3 extraction and ownership-guard adaptation applied: PASS\n' >> migration-check-logs/summary.txt

      - name: Prepublication validation
        shell: bash
        run: |
          set -euo pipefail
          run_check() {
            local name="$1"
            shift
            if "$@" >"migration-check-logs/${name}.log" 2>&1; then
              printf '%s: PASS\n' "$name" | tee -a migration-check-logs/summary.txt
            else
              printf '%s: FAIL\n' "$name" | tee -a migration-check-logs/summary.txt
              cat "migration-check-logs/${name}.log"
              exit 1
            fi
          }
          run_check focal npx vitest run tests/component-dom/startupBootstrap.test.tsx tests/component-dom/startupRevealArchitecture.test.ts tests/integration/appStartupBootstrapExtraction.test.ts tests/integration/appMigrationCharacterization.test.ts tests/integration/appHelperExtraction.test.ts tests/integration/issue97WebRoutingContract.test.ts --environment jsdom
          run_check diff-check git diff --check
          run_check typecheck npm run test:typecheck
          run_check unit-ts npm run test:unit:ts
          run_check component-dom npm run test:component:dom
          run_check integration npm run test:integration
          run_check regressions npm run test:regressions
          run_check build-web npm run build:web
          run_check build-desktop npm run build

      - name: Publish implementation commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          expected="$(printf '%s\n' \
            .github/task-9-3-apply.py \
            .github/workflows/task-9-3-apply.yml \
            scripts/run-regressions.mjs \
            src/App.tsx \
            src/features/startup/useStartupBootstrap.ts \
            tests/component-dom/startupBootstrap.test.tsx \
            tests/integration/appHelperExtraction.test.ts \
            tests/integration/appMigrationCharacterization.test.ts \
            tests/integration/appStartupBootstrapExtraction.test.ts \
            tests/integration/issue97WebRoutingContract.test.ts | sort)"
          actual="$(git diff --cached --name-only | sort)"
          if test "$actual" != "$expected"; then
            printf 'Unexpected staged implementation files:\n%s\n' "$actual" | tee -a migration-check-logs/summary.txt
            exit 1
          fi
          git diff --cached --check
          git commit -m "refactor: extract startup bootstrap"
          IMPLEMENTATION_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:v0.9.0-test-noche
          printf 'Implementation published: %s\n' "$IMPLEMENTATION_SHA" | tee -a migration-check-logs/summary.txt
          echo "implementation_sha=$IMPLEMENTATION_SHA" >> "$GITHUB_OUTPUT"

      - name: Exact implementation validation
        shell: bash
        run: |
          set -euo pipefail
          IMPLEMENTATION_SHA="${{ steps.publish.outputs.implementation_sha }}"
          REMOTE_SHA="$(git ls-remote origin refs/heads/v0.9.0-test-noche | cut -f1)"
          test "$IMPLEMENTATION_SHA" = "$REMOTE_SHA"
          run_check() {
            local name="$1"
            shift
            if "$@" >"migration-check-logs/exact-${name}.log" 2>&1; then
              printf 'exact-%s: PASS\n' "$name" | tee -a migration-check-logs/summary.txt
            else
              printf 'exact-%s: FAIL\n' "$name" | tee -a migration-check-logs/summary.txt
              cat "migration-check-logs/exact-${name}.log"
              exit 1
            fi
          }
          run_check focal npx vitest run tests/component-dom/startupBootstrap.test.tsx tests/component-dom/startupRevealArchitecture.test.ts tests/integration/appStartupBootstrapExtraction.test.ts tests/integration/appMigrationCharacterization.test.ts tests/integration/appHelperExtraction.test.ts tests/integration/issue97WebRoutingContract.test.ts --environment jsdom
          run_check diff-check git diff --check
          run_check typecheck npm run test:typecheck
          run_check unit-ts npm run test:unit:ts
          run_check component-dom npm run test:component:dom
          run_check integration npm run test:integration
          run_check regressions npm run test:regressions
          run_check build-web npm run build:web
          run_check build-desktop npm run build
          printf 'Validated implementation SHA: %s\n' "$IMPLEMENTATION_SHA" | tee -a migration-check-logs/summary.txt

      - name: Close task documentation
        shell: bash
        env:
          IMPLEMENTATION_SHA: ${{ steps.publish.outputs.implementation_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          PRE_CLOSE_HEAD="$(git ls-remote origin refs/heads/v0.9.0-test-noche | cut -f1)"
          test "$PRE_CLOSE_HEAD" = "$IMPLEMENTATION_SHA"
          export PRE_CLOSE_HEAD
          python /tmp/task-9-3-apply.py --close
          python - <<'PY'
          from pathlib import Path
          path = Path("migration/Registro-de-avance.md")
          text = path.read_text()
          old = "- Ninguno en la corrida final; si existieron intentos previos fallidos de esta misma ronda, quedan identificables en GitHub Actions y no se usaron como evidencia de cierre."
          new = "- Run 34321548287 fue rechazado antes de crear jobs por YAML temporal inválido (un heredoc sin indentación válida dentro de `run:`); no ejecutó ni publicó producto y no pudo generar artifact. Se corrigió únicamente el tooling temporal.\n- Run 34321631406 llegó a la matriz previa y el artifact mostró dos pruebas existentes acopladas físicamente a `App.tsx`: `appHelperExtraction.test.ts` exigía el import directo del journal y `issue97WebRoutingContract.test.ts` buscaba el catch de startup dentro de App. Focalizadas, diff-check, typecheck, unit TS y component DOM habían pasado; integration falló antes de publicar producto. Se adaptaron esas guardas para seguir al nuevo owner sin cambiar semántica de producción.\n- Run 34321874031 dejó focalizadas, diff-check, typecheck, unit TS, component DOM e integración en PASS; `test:regressions` falló porque `scripts/run-regressions.mjs` todavía buscaba `loadOfflineLibrary()` y el orden reachability→connected en App. No publicó producto.\n- Run 34322128673 confirmó esas correcciones pero destapó una segunda assertion estática del mismo guard que todavía buscaba el reveal Offline atómico en App. El artifact mostró todo verde hasta `test:regressions`; se redirigió también esa assertion al bootstrap, sin cambiar producción y sin publicar producto en ese intento.\n- La corrida final completó la extracción y toda la matriz sobre el SHA publicado."
          if old not in text:
              raise SystemExit("Could not locate task 9.3 failure placeholder")
          path.write_text(text.replace(old, new, 1))
          PY
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md migration/BeatGaler-agent-state.md
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' migration/BeatGaler-agent-state.md migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m "docs: close task 9.3"
          git push origin HEAD:v0.9.0-test-noche
          FINAL_PUSH_SHA="$(git rev-parse HEAD)"
          printf 'Documentation close published: %s\n' "$FINAL_PUSH_SHA" | tee -a migration-check-logs/summary.txt

      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-9-3-${{ github.run_id }}
          path: migration-check-logs
          if-no-files-found: warn
