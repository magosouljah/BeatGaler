name: Release BeatGaler Windows Updater

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag, e.g. v0.6.2"
        required: true
        type: string
      release_notes:
        description: "Short release notes"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-windows-updater:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      BEATGALER_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Verify source version and regression shield
        shell: pwsh
        run: |
          npm run version:check
          npm run test:regressions
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ inputs.release_tag }}") {
            throw "VERSION ($version) does not match release_tag (${{ inputs.release_tag }})."
          }

      - name: Require updater signing secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY GitHub secret is missing."
          }

      - name: Build signed NSIS updater artifact
        run: npx tauri build --bundles nsis

      - name: Verify updater signatures
        run: npm run updater:verify-artifacts

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found." }
          $sig = "$($exe.FullName).sig"
          if (-not (Test-Path $sig)) { throw "NSIS updater signature not found: $sig" }
          $assetName = $exe.Name
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/${{ inputs.release_tag }}/$assetName"
          node scripts/updater-manifest.mjs generate --version $version --platform windows-x86_64 --artifact $exe.FullName --signature $sig --url $url --output latest.json --notes "${{ inputs.release_notes }}"
          node scripts/updater-manifest.mjs validate-release latest.json

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $sig = "$($exe.FullName).sig"
          gh release view "${{ inputs.release_tag }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ inputs.release_tag }}" $exe.FullName $sig latest.json --clobber
          } else {
            gh release create "${{ inputs.release_tag }}" $exe.FullName $sig latest.json --title "Beat Galer ${{ inputs.release_tag }}" --notes "${{ inputs.release_notes }}"
          }
