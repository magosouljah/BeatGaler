name: Release BeatGaler Windows Updater

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v0.8.0"
        required: true
        type: string
      release_notes:
        description: "Short release notes"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: beatgaler-public-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  PUBLIC_RELEASE_REPO: magosouljah/galer
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
  BEATGALER_UPDATER_ENDPOINT: https://github.com/magosouljah/galer/releases/latest/download/latest.json

jobs:
  release-windows-updater:
    runs-on: windows-latest

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Verify source version and release tag
        shell: pwsh
        run: |
          npm run version:check
          npm run test:regressions
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "VERSION ($version) does not match release tag ($env:RELEASE_TAG)."
          }

      - name: Require release secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY GitHub secret is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_RELEASE_TOKEN)) {
            throw "PUBLIC_RELEASE_TOKEN GitHub secret is missing."
          }

      - name: Verify Cargo.lock before release build
        shell: pwsh
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 | Out-Null

      - name: Build signed NSIS updater artifact
        run: npx tauri build --bundles nsis

      - name: Verify updater signatures
        run: npm run updater:verify-artifacts

      - name: Prepare public release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $sourceExe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $sourceExe) { throw "NSIS installer not found." }
          $sourceSig = "$($sourceExe.FullName).sig"
          if (-not (Test-Path $sourceSig)) { throw "NSIS updater signature not found: $sourceSig" }

          New-Item -ItemType Directory -Force "release-assets" | Out-Null
          $publicExeName = "Beat.Galer_${version}_x64-setup.exe"
          $publicExe = Join-Path (Resolve-Path "release-assets") $publicExeName
          $publicSig = "$publicExe.sig"
          Copy-Item $sourceExe.FullName $publicExe -Force
          Copy-Item $sourceSig $publicSig -Force

          # Preserve already-published Mac updater entries if the Mac workflow ran first.
          New-Item -ItemType Directory -Force "release-existing" | Out-Null
          $existingManifest = "release-existing/latest.json"
          gh release download "$env:RELEASE_TAG" --repo "$env:PUBLIC_RELEASE_REPO" --pattern "latest.json" --dir "release-existing" --clobber *> $null
          if ($LASTEXITCODE -ne 0) {
            Remove-Item $existingManifest -Force -ErrorAction SilentlyContinue
            $global:LASTEXITCODE = 0
          }

          $url = "https://github.com/$env:PUBLIC_RELEASE_REPO/releases/download/$env:RELEASE_TAG/$publicExeName"
          node scripts/updater-manifest.mjs generate --version $version --platform windows-x86_64 --artifact $publicExe --signature $publicSig --url $url --output release-assets/latest.json --notes "Beat Galer $version" --merge-existing $existingManifest
          node scripts/updater-manifest.mjs validate-release release-assets/latest.json

      - name: Create or update public GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          $notes = "${{ inputs.release_notes }}"
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Beat Galer $env:RELEASE_TAG" }

          gh release view "$env:RELEASE_TAG" --repo "$env:PUBLIC_RELEASE_REPO" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --repo "$env:PUBLIC_RELEASE_REPO" --target main --title "Beat Galer $env:RELEASE_TAG" --notes "$notes"
            if ($LASTEXITCODE -ne 0) {
              gh release view "$env:RELEASE_TAG" --repo "$env:PUBLIC_RELEASE_REPO" *> $null
              if ($LASTEXITCODE -ne 0) { throw "Could not create or find public release $env:RELEASE_TAG." }
            }
          }

          $exe = Get-ChildItem "release-assets/*.exe" | Select-Object -First 1
          $sig = Get-ChildItem "release-assets/*.exe.sig" | Select-Object -First 1
          gh release upload "$env:RELEASE_TAG" $exe.FullName $sig.FullName "release-assets/latest.json" --repo "$env:PUBLIC_RELEASE_REPO" --clobber
