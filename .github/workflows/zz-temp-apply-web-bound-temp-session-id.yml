name: TEMP - Apply Web Bound Temp Session ID

on:
  pull_request:
    branches:
      - integration-v0.8.0-alpha.1

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/web-bound-temp-session-id'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply exact source patch
        run: |
          node scripts/zz-apply-web-bound-temp-session-id.mjs
          node scripts/zz-apply-worker-client-session-id.mjs

      - name: Install locked graph
        run: npm ci

      - name: Run bound-session regression
        run: node scripts/regression-web-bound-temp-rpc.mjs

      - name: Run worker component contract
        run: npx vitest run tests/component-dom/webTransportWorker.test.ts

      - name: Build production Web bundle
        run: npm run build:web

      - name: Commit verified patch and remove temporary applicator
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm -f scripts/zz-apply-web-bound-temp-session-id.mjs
          rm -f scripts/zz-apply-worker-client-session-id.mjs
          rm -f .github/workflows/zz-temp-apply-web-bound-temp-session-id.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(web): preserve bound temporary session id"
          git push origin "HEAD:${HEAD_BRANCH}"
