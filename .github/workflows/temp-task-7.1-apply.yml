name: Temporary task 7.1 applier

on:
  push:
    branches:
      - v0.9.0-test-noche

permissions:
  contents: write

jobs:
  apply-task-7-1:
    if: contains(github.event.head_commit.message, '[apply-7.1]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Apply task 7.1 extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          text = app_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once('import ReviewBeatSkeleton from "./components/ReviewBeatSkeleton";\n', '')
          replace_once(
              'import { useCloudUploadQueue } from "./features/cloud/useCloudUploadQueue";\n',
              'import { useCloudUploadQueue } from "./features/cloud/useCloudUploadQueue";\n'
              'import ImportReviewHost from "./features/import/components/ImportReviewHost";\n'
              'import { reviewSourceKey, useImportSession } from "./features/import/useImportSession";\n'
              'import { useImportReview } from "./features/import/useImportReview";\n'
          )

          review_type = '''type ReviewQueueState = {
            beats: Beat[];
            index: number;
            // Streaming discovery intentionally does not know N when Beat 1 appears.
            total: number | null;
            batchId: string | null;
            preparing: boolean;
          };

          '''
          replace_once(review_type, '')

          review_key = '''function reviewSourceKey(beat: Beat): string {
            return (beat.mp3_path || beat.wav_path || beat.playback_path || "")
              .replace(/\\\\/g, "/")
              .trim()
              .toLocaleLowerCase();
          }

          '''
          replace_once(review_key, '')

          replace_once(
              '  const [reviewQueue, setReviewQueue] = useState<ReviewQueueState | null>(null);\n',
              '  const {\n'
              '    reviewQueue,\n'
              '    setReviewQueue,\n'
              '    reviewQueueLatestRef,\n'
              '    skippedReviewSourceKeysRef,\n'
              '    startReview,\n'
              '  } = useImportSession();\n'
          )
          replace_once('  const reviewQueueLatestRef = useRef<ReviewQueueState | null>(null);\n', '')
          replace_once('  const skippedReviewSourceKeysRef = useRef<Set<string>>(new Set());\n', '')
          replace_once('  useEffect(() => { reviewQueueLatestRef.current = reviewQueue; }, [reviewQueue]);\n', '')

          replace_once(
              '    setReviewQueue({ beats: sanitized, index: 0, total: sanitized.length, batchId: null, preparing: false });\n',
              '    startReview(sanitized);\n'
          )
          replace_once('  }, [connectionState]);\n\n  const skipCurrentReviewBeat = useCallback(() => {', '  }, [connectionState, startReview]);\n\n  const skipCurrentReviewBeat = useCallback(() => {')

          actions_start = text.index('  const skipCurrentReviewBeat = useCallback(() => {')
          actions_end = text.index('  const handleReviewedSaveAll = useCallback', actions_start)
          actions_replacement = '''  const cancelPendingReviewWork = useCallback(() => {
            importReviewRequestRunRef.current += 1;
            reviewPreparationRunRef.current += 1;
            reviewPreparationPromiseRef.current = null;
            setReviewPreparationDone(true);
            setReviewBootstrap(null);
            setAudioConflictBatch(null);
            setDeferredImportBatch(current => {
              if (current?.batch_id) void discardImportReviewBatch(current.batch_id);
              return null;
            });
          }, []);

          const {
            skipCurrentReviewBeat,
            cancelReview,
            handleReviewedBeatSaved,
          } = useImportReview({
            setBeats,
            beatsLatestRef,
            setReviewQueue,
            skippedReviewSourceKeysRef,
            cloudifyImportedBeats,
            getQueuedBeatsSnapshot,
            onCancelPendingWork: cancelPendingReviewWork,
            releaseBeat: platform.capabilities.reviewBeatCloudCommit
              ? beatId => platform.importer.releaseBeat(beatId)
              : undefined,
            discardBatch: batchId => discardImportReviewBatch(batchId),
            cleanupStaging: protectedBeats => cleanupOrphanedDropStaging(protectedBeats),
          });

          '''
          text = text[:actions_start] + actions_replacement + text[actions_end:]

          ui_start_marker = '      {libraryDropStaging && !reviewBootstrap && !reviewQueue && REVIEW_SKELETON_ENABLED && ('
          ui_end_marker = '\n\n      {beatFileDrop && ('
          ui_start = text.index(ui_start_marker)
          ui_end = text.index(ui_end_marker, ui_start)
          ui_replacement = '''      <ImportReviewHost
            libraryDropStaging={libraryDropStaging}
            reviewBootstrap={reviewBootstrap}
            reviewQueue={reviewQueue}
            skeletonEnabled={REVIEW_SKELETON_ENABLED}
            tagSuggestions={tagSuggestions}
            mutationAllowed={connectionState === "online"}
            onSkipCurrent={skipCurrentReviewBeat}
            onCancel={cancelReview}
            onSaveAll={platform.capabilities.reviewBeatCloudCommit ? undefined : handleReviewedSaveAll}
            isReviewNameTaken={(candidateName) => {
              const normalized = candidateName.trim().toLocaleLowerCase();
              if (!normalized) return false;
              return beats.some(existing =>
                existing.name.trim().toLocaleLowerCase() === normalized
              );
            }}
            onCloudMutationCommit={platform.capabilities.browserCloudEditing ? undefined : commitDrawerCloudMutation}
            onSaved={handleReviewedBeatSaved}
            onReleaseAudio={beat => {
              if (audio.playingId === beat.id) releaseFile();
            }}
          />'''
          text = text[:ui_start] + ui_replacement + text[ui_end:]

          if 'skipAllReviewQueue' in text:
              raise SystemExit('skipAllReviewQueue still present after extraction')
          if 'ReviewQueueState' in text:
              raise SystemExit('legacy ReviewQueueState still present in App.tsx')

          app_path.write_text(text, encoding='utf-8')
          PY

          mkdir -p src/features/import/components
          cat > src/features/import/useImportSession.ts <<'EOF'
          import { useCallback, useEffect, useRef, useState } from "react";
          import type { Beat } from "../../types";

          export type ImportReviewQueueState = {
            beats: Beat[];
            index: number;
            // Streaming discovery intentionally does not know N when Beat 1 appears.
            total: number | null;
            batchId: string | null;
            preparing: boolean;
          };

          export function reviewSourceKey(beat: Beat): string {
            return (beat.mp3_path || beat.wav_path || beat.playback_path || "")
              .replace(/\\/g, "/")
              .trim()
              .toLocaleLowerCase();
          }

          type StartReviewOptions = {
            total?: number | null;
            batchId?: string | null;
            preparing?: boolean;
          };

          export function useImportSession() {
            const [reviewQueue, setReviewQueue] = useState<ImportReviewQueueState | null>(null);
            // Background uploads can finish while Review is still open. Keep the
            // latest queue readable by the upload/staging bridge until later import
            // tasks can own that coordination directly.
            const reviewQueueLatestRef = useRef<ImportReviewQueueState | null>(null);
            const skippedReviewSourceKeysRef = useRef<Set<string>>(new Set());

            useEffect(() => {
              reviewQueueLatestRef.current = reviewQueue;
            }, [reviewQueue]);

            const startReview = useCallback((beats: Beat[], options: StartReviewOptions = {}) => {
              if (beats.length === 0) {
                setReviewQueue(null);
                return;
              }
              setReviewQueue({
                beats,
                index: 0,
                total: options.total === undefined ? beats.length : options.total,
                batchId: options.batchId ?? null,
                preparing: options.preparing ?? false,
              });
            }, []);

            return {
              reviewQueue,
              setReviewQueue,
              reviewQueueLatestRef,
              skippedReviewSourceKeysRef,
              startReview,
            };
          }

          export type ImportSession = ReturnType<typeof useImportSession>;
          EOF

          cat > src/features/import/useImportReview.ts <<'EOF'
          import { useCallback, type Dispatch, type MutableRefObject, type SetStateAction } from "react";
          import type { Beat } from "../../types";
          import { reviewSourceKey, type ImportReviewQueueState } from "./useImportSession";

          type UseImportReviewOptions = {
            setBeats: Dispatch<SetStateAction<Beat[]>>;
            beatsLatestRef: MutableRefObject<Beat[]>;
            setReviewQueue: Dispatch<SetStateAction<ImportReviewQueueState | null>>;
            skippedReviewSourceKeysRef: MutableRefObject<Set<string>>;
            cloudifyImportedBeats: (beats: Beat[]) => void;
            getQueuedBeatsSnapshot: () => Beat[];
            onCancelPendingWork: () => void;
            releaseBeat?: (beatId: string) => void;
            discardBatch: (batchId: string) => void | Promise<unknown>;
            cleanupStaging: (protectedBeats: Beat[]) => void | Promise<unknown>;
          };

          export function useImportReview({
            setBeats,
            beatsLatestRef,
            setReviewQueue,
            skippedReviewSourceKeysRef,
            cloudifyImportedBeats,
            getQueuedBeatsSnapshot,
            onCancelPendingWork,
            releaseBeat,
            discardBatch,
            cleanupStaging,
          }: UseImportReviewOptions) {
            const cleanupUnusedStaging = useCallback(() => {
              window.setTimeout(() => {
                void cleanupStaging([
                  ...beatsLatestRef.current,
                  ...getQueuedBeatsSnapshot(),
                ]);
              }, 0);
            }, [beatsLatestRef, cleanupStaging, getQueuedBeatsSnapshot]);

            const skipCurrentReviewBeat = useCallback(() => {
              setReviewQueue(queue => {
                if (!queue) return null;
                const currentBeat = queue.beats[queue.index];
                const sourceKey = currentBeat ? reviewSourceKey(currentBeat) : "";
                if (sourceKey) skippedReviewSourceKeysRef.current.add(sourceKey);
                if (currentBeat) releaseBeat?.(currentBeat.id);

                const knownLast = queue.total !== null && queue.index >= queue.total - 1;
                if (knownLast && !queue.preparing) {
                  cleanupUnusedStaging();
                  return null;
                }
                // Discovery may still be filling Beat N+1. Advancing the cursor
                // preserves the existing skeleton handoff without owning discovery.
                return { ...queue, index: queue.index + 1 };
              });
            }, [cleanupUnusedStaging, releaseBeat, setReviewQueue, skippedReviewSourceKeysRef]);

            const cancelReview = useCallback(() => {
              onCancelPendingWork();
              skippedReviewSourceKeysRef.current.clear();
              setReviewQueue(queue => {
                if (!queue) return null;
                for (const beat of queue.beats.slice(queue.index)) releaseBeat?.(beat.id);
                if (queue.batchId) void discardBatch(queue.batchId);
                cleanupUnusedStaging();
                return null;
              });
            }, [cleanupUnusedStaging, discardBatch, onCancelPendingWork, releaseBeat, setReviewQueue, skippedReviewSourceKeysRef]);

            const handleReviewedBeatSaved = useCallback((updated: Beat) => {
              setBeats(current => {
                const exists = current.some(beat => beat.id === updated.id);
                const next = exists
                  ? current.map(beat => beat.id === updated.id ? updated : beat)
                  : [updated, ...current];
                beatsLatestRef.current = next;
                return next;
              });
              setReviewQueue(queue => {
                if (!queue) return null;
                const nextBeats = queue.beats.map(beat => beat.id === updated.id ? updated : beat);
                const knownLast = queue.total !== null && queue.index >= queue.total - 1;
                if (knownLast && !queue.preparing) return null;
                return { ...queue, beats: nextBeats, index: queue.index + 1 };
              });

              // Save/next stays immediate; the extracted cloud queue owns upload work.
              cloudifyImportedBeats([updated]);
            }, [beatsLatestRef, cloudifyImportedBeats, setBeats, setReviewQueue]);

            return {
              skipCurrentReviewBeat,
              cancelReview,
              handleReviewedBeatSaved,
            };
          }
          EOF

          cat > src/features/import/components/ImportReviewHost.tsx <<'EOF'
          import type { ComponentProps } from "react";
          import type { Beat } from "../../../types";
          import Drawer from "../../../components/Drawer";
          import ReviewBeatSkeleton from "../../../components/ReviewBeatSkeleton";
          import type { ImportReviewQueueState } from "../useImportSession";

          type DrawerProps = ComponentProps<typeof Drawer>;

          type ImportReviewHostProps = {
            libraryDropStaging: boolean;
            reviewBootstrap: { total: number | null } | null;
            reviewQueue: ImportReviewQueueState | null;
            skeletonEnabled: boolean;
            tagSuggestions: string[];
            mutationAllowed: boolean;
            onSkipCurrent: () => void;
            onCancel: () => void;
            onSaveAll?: DrawerProps["onSaveAll"];
            isReviewNameTaken: NonNullable<DrawerProps["isReviewNameTaken"]>;
            onCloudMutationCommit?: DrawerProps["onCloudMutationCommit"];
            onSaved: DrawerProps["onSaved"];
            onReleaseAudio: (beat: Beat) => void;
          };

          export default function ImportReviewHost({
            libraryDropStaging,
            reviewBootstrap,
            reviewQueue,
            skeletonEnabled,
            tagSuggestions,
            mutationAllowed,
            onSkipCurrent,
            onCancel,
            onSaveAll,
            isReviewNameTaken,
            onCloudMutationCommit,
            onSaved,
            onReleaseAudio,
          }: ImportReviewHostProps) {
            const currentBeat = reviewQueue?.beats[reviewQueue.index];

            return (
              <>
                {libraryDropStaging && !reviewBootstrap && !reviewQueue && skeletonEnabled && (
                  <ReviewBeatSkeleton current={1} total={null} />
                )}

                {reviewBootstrap && skeletonEnabled && (
                  <ReviewBeatSkeleton current={1} total={reviewBootstrap.total} onCancel={onCancel} />
                )}

                {reviewQueue && !currentBeat && skeletonEnabled && (
                  <ReviewBeatSkeleton current={reviewQueue.index + 1} total={reviewQueue.total} onCancel={onCancel} />
                )}

                {reviewQueue && currentBeat && (
                  <Drawer
                    beat={currentBeat}
                    mode="edit"
                    tagSuggestions={tagSuggestions}
                    reviewInfo={{ current: reviewQueue.index + 1, total: reviewQueue.total }}
                    closeAfterSave={false}
                    onClose={onSkipCurrent}
                    onSkipCurrent={onSkipCurrent}
                    onSkipAll={onCancel}
                    onSaveAll={onSaveAll}
                    mutationAllowed={mutationAllowed}
                    isReviewNameTaken={isReviewNameTaken}
                    onCloudMutationCommit={onCloudMutationCommit}
                    onSaved={onSaved}
                    onReleaseAudio={() => onReleaseAudio(currentBeat)}
                  />
                )}
              </>
            );
          }
          EOF

          cat > tests/component-dom/importReviewBasics.test.tsx <<'EOF'
          // @vitest-environment jsdom
          import React, { act, useRef, useState } from "react";
          import { createRoot, type Root } from "react-dom/client";
          import { afterEach, beforeEach, describe, expect, it } from "vitest";
          import type { Beat } from "../../src/types";
          import { useImportSession, type ImportSession } from "../../src/features/import/useImportSession";
          import { useImportReview } from "../../src/features/import/useImportReview";

          (globalThis as typeof globalThis & { IS_REACT_ACT_ENVIRONMENT?: boolean }).IS_REACT_ACT_ENVIRONMENT = true;

          const beat = (id: string): Beat => ({
            id,
            name: id,
            bpm: 120,
            key: "c",
            tags: [],
            rating: 0,
            mp3_path: `C:\\staging\\${id}.mp3`,
          } as Beat);

          type Latest = {
            session: ImportSession;
            actions: ReturnType<typeof useImportReview>;
            library: Beat[];
          };

          let host: HTMLDivElement | null = null;
          let root: Root | null = null;
          let latest: Latest | null = null;
          let uploads: string[][] = [];
          let released: string[] = [];
          let discarded: string[] = [];
          let cleanupSnapshots: string[][] = [];
          let cancelPendingCalls = 0;

          function Harness() {
            const [library, setLibrary] = useState<Beat[]>([]);
            const beatsLatestRef = useRef<Beat[]>([]);
            const session = useImportSession();
            const actions = useImportReview({
              setBeats: setLibrary,
              beatsLatestRef,
              setReviewQueue: session.setReviewQueue,
              skippedReviewSourceKeysRef: session.skippedReviewSourceKeysRef,
              cloudifyImportedBeats: beats => uploads.push(beats.map(item => item.id)),
              getQueuedBeatsSnapshot: () => [],
              onCancelPendingWork: () => { cancelPendingCalls += 1; },
              releaseBeat: id => released.push(id),
              discardBatch: id => { discarded.push(id); },
              cleanupStaging: protectedBeats => { cleanupSnapshots.push(protectedBeats.map(item => item.id)); },
            });
            latest = { session, actions, library };
            return <div />;
          }

          async function renderHarness() {
            host = document.createElement("div");
            document.body.appendChild(host);
            root = createRoot(host);
            await act(async () => { root!.render(<Harness />); });
          }

          async function flushTimers() {
            await act(async () => {
              await new Promise(resolve => window.setTimeout(resolve, 0));
            });
          }

          beforeEach(() => {
            uploads = [];
            released = [];
            discarded = [];
            cleanupSnapshots = [];
            cancelPendingCalls = 0;
          });

          afterEach(async () => {
            if (root) await act(async () => root!.unmount());
            root = null;
            host?.remove();
            host = null;
            latest = null;
          });

          describe("basic import Review actions", () => {
            it("keeps candidates outside the library until Save and sends only the saved beat to the upload queue", async () => {
              await renderHarness();
              const first = beat("first");
              const second = beat("second");

              await act(async () => { latest!.session.startReview([first, second]); });
              expect(latest!.library).toEqual([]);
              expect(latest!.session.reviewQueue?.index).toBe(0);

              const saved = { ...first, name: "first edited" };
              await act(async () => { latest!.actions.handleReviewedBeatSaved(saved); });

              expect(latest!.library.map(item => item.id)).toEqual(["first"]);
              expect(latest!.library[0].name).toBe("first edited");
              expect(latest!.session.reviewQueue?.index).toBe(1);
              expect(uploads).toEqual([["first"]]);
            });

            it("Skip never adds candidates and closes after the same last known beat", async () => {
              await renderHarness();
              const first = beat("first");
              const second = beat("second");
              await act(async () => { latest!.session.startReview([first, second]); });

              await act(async () => { latest!.actions.skipCurrentReviewBeat(); });
              expect(latest!.library).toEqual([]);
              expect(latest!.session.reviewQueue?.index).toBe(1);

              await act(async () => { latest!.actions.skipCurrentReviewBeat(); });
              expect(latest!.library).toEqual([]);
              expect(latest!.session.reviewQueue).toBeNull();
              expect(released).toEqual(["first", "second"]);
              await flushTimers();
              expect(cleanupSnapshots).toEqual([[]]);
            });

            it("Cancel preserves already-saved beats while discarding and releasing only the unsaved tail", async () => {
              await renderHarness();
              const first = beat("first");
              const second = beat("second");
              const third = beat("third");
              await act(async () => {
                latest!.session.startReview([first, second, third], { batchId: "batch-1" });
              });
              await act(async () => { latest!.actions.handleReviewedBeatSaved(first); });
              await act(async () => { latest!.actions.cancelReview(); });

              expect(latest!.library.map(item => item.id)).toEqual(["first"]);
              expect(latest!.session.reviewQueue).toBeNull();
              expect(cancelPendingCalls).toBe(1);
              expect(discarded).toEqual(["batch-1"]);
              expect(released).toEqual(["second", "third"]);
              await flushTimers();
              expect(cleanupSnapshots).toEqual([["first"]]);
            });
          });
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Typecheck extracted Review
        run: npm run test:typecheck

      - name: Run focused Review tests
        run: npx vitest run tests/component-dom/importReviewBasics.test.tsx --environment jsdom

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/import/useImportSession.ts src/features/import/useImportReview.ts src/features/import/components/ImportReviewHost.tsx tests/component-dom/importReviewBasics.test.tsx
          git commit -m "refactor(import): extract basic Review session actions"
          git push origin HEAD:v0.9.0-test-noche
