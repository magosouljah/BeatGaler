name: F0 - 0.20 HEAD Secret Scan

on:
  pull_request:
  push:
    branches:
      - integration-v0.8.0-alpha.1

permissions:
  contents: read

jobs:
  head-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Enforce OAuth secret boundary
        shell: bash
        run: |
          set -euo pipefail

          # OAuth client secrets are backend-only. A variable-name reference in
          # browser sources or a build workflow is itself a boundary violation,
          # even when no secret value is committed.
          if git grep -nE '(GOOGLE_CLIENT_SECRET|X_CLIENT_SECRET|VITE_[A-Z0-9_]*(CLIENT_)?SECRET)' -- src public 2>/dev/null; then
            echo 'OAuth/client secret variable reference found in frontend sources.' >&2
            exit 1
          fi

          if git grep -nE '(GOOGLE_CLIENT_SECRET|X_CLIENT_SECRET)' -- .github/workflows ':!.github/workflows/f0-0.20-secret-scan.yml' 2>/dev/null; then
            echo 'OAuth client secret variable reference found in a GitHub Actions workflow.' >&2
            exit 1
          fi

      - name: Install pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan current checkout only
        shell: bash
        run: |
          set -euo pipefail
          # Deliberately scan HEAD/working tree only. Historical remediation is
          # owned separately by F0/0.12 and must not be coupled to this gate.
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact=100 \
            --no-banner
