name: Task 9.1 Documentation Closure

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-9-1-close.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard branch
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v0.9.0-test-noche"
          git fetch origin v0.9.0-test-noche
          test "$(git rev-parse origin/v0.9.0-test-noche)" = "${GITHUB_SHA}"

      - name: Apply documentation closure
        run: python .github/task-9-1-close.py

      - name: Remove temporary tooling and verify scope
        run: |
          set -euo pipefail
          rm .github/task-9-1-close.py
          rm .github/workflows/task-9-1-close.yml
          git diff --check
          actual="$(git diff --name-only f381d77a50280a4a1c19bbfbd7c717019ba9fd3b -- | sort)"
          expected="$(printf '%s\n' migration/BeatGaler-agent-state.md migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md | sort)"
          test "$actual" = "$expected"
          git diff --quiet f381d77a50280a4a1c19bbfbd7c717019ba9fd3b -- src scripts tests package.json package-lock.json src-tauri

      - name: Commit closure
        run: |
          set -euo pipefail
          git fetch origin v0.9.0-test-noche
          test "$(git rev-parse origin/v0.9.0-test-noche)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close task 9.1"
          git push origin HEAD:v0.9.0-test-noche
