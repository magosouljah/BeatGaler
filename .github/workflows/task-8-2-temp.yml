name: Temporary task 8.2 validation

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-8-2-temp.yml

permissions:
  contents: write

concurrency:
  group: beatgaler-migration-v0.9.0-test-noche
  cancel-in-progress: false

jobs:
  task-8-2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Verify baseline and apply task 8.2
        shell: bash
        run: |
          set -euo pipefail
          target='v0.9.0-test-noche'
          initial='344571f32efa83610e2ad17bb48566b74ece3ede'
          test "${GITHUB_REF_NAME}" = "$target"
          git merge-base --is-ancestor "$initial" HEAD
          unexpected="$(git diff --name-only "$initial"..HEAD | grep -v -E '^(\.github/workflows/task-8-2-temp\.yml|scripts/task-8-2-apply-temp\.py|scripts/task-8-2-tests-temp\.py|scripts/task-8-2-regressions-temp\.py)$' || true)"
          test -z "$unexpected"
          remote="$(git ls-remote origin "refs/heads/$target" | awk '{print $1}')"
          test "$remote" = "${GITHUB_SHA}"
          python scripts/task-8-2-apply-temp.py
          python scripts/task-8-2-tests-temp.py
          python scripts/task-8-2-regressions-temp.py
          git diff --check
          git rm .github/workflows/task-8-2-temp.yml scripts/task-8-2-apply-temp.py scripts/task-8-2-tests-temp.py scripts/task-8-2-regressions-temp.py
          git add src/App.tsx src/features/dragdrop/useHtmlLibraryDrop.ts tests/integration/appHtmlLibraryDropExtraction.test.ts tests/integration/appBrowserImportExtraction.test.ts tests/integration/issue97RuntimeWebFollowup.test.ts scripts/regression-import-native.mjs scripts/run-regressions.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: extract html library drop reception'
          echo "IMPLEMENTATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run task 8.2 migration checks
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/migration-check-logs"
          mkdir -p "$dir"
          summary="$dir/summary.txt"
          printf 'Task 8.2 migration checks\nInitial SHA: 344571f32efa83610e2ad17bb48566b74ece3ede\nImplementation SHA: %s\n' "$IMPLEMENTATION_SHA" > "$summary"
          check() {
            name="$1"
            shift
            log="$dir/$name.log"
            if "$@" >"$log" 2>&1; then
              echo "PASS $name" | tee -a "$summary"
            else
              code=$?
              echo "FAIL $name exit=$code" | tee -a "$summary"
              cat "$log"
              exit "$code"
            fi
          }
          check focused-html-drop npx vitest run tests/integration/appHtmlLibraryDropExtraction.test.ts --environment jsdom
          check regression-native node scripts/regression-import-native.mjs
          check typecheck npm run test:typecheck
          check unit-ts npm run test:unit:ts
          check component-dom npm run test:component:dom
          check integration npm run test:integration
          check regressions npm run test:regressions
          check build-web npm run build:web
          check build-desktop npm run build

          mac_log="$dir/mac-portability-static.log"
          if npm run test:mac-portability:static >"$mac_log" 2>&1; then
            echo "PASS mac-portability-static" | tee -a "$summary"
          elif grep -Fq 'PASS Mac duplicate native/HTML local drops are arbitrated' "$mac_log" \
            && grep -Fq 'PASS Mac routes Finder artwork through extracted native target detection while preserving browser/Pinterest sentinels' "$mac_log" \
            && grep -Fq 'helper refuses sessions without explicit local Bot API base' "$mac_log"; then
            echo "PASS mac-drop-contract; BASELINE_FAIL mac-portability-static Direct helper" | tee -a "$summary"
          else
            echo "FAIL mac-portability-static unexpected" | tee -a "$summary"
            cat "$mac_log"
            exit 1
          fi

          test "$(git rev-parse HEAD)" = "$IMPLEMENTATION_SHA"
          test -z "$(git status --porcelain)"
          echo 'Migration checks: PASS' | tee -a "$summary"

      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-8-2-${{ github.run_id }}
          path: ${{ runner.temp }}/migration-check-logs
          if-no-files-found: warn

      - name: Publish validated implementation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          target='v0.9.0-test-noche'
          test "$(git rev-parse HEAD)" = "$IMPLEMENTATION_SHA"
          remote="$(git ls-remote origin "refs/heads/$target" | awk '{print $1}')"
          test "$remote" = "${GITHUB_SHA}"
          git push origin "$IMPLEMENTATION_SHA:refs/heads/$target"
