name: Temporary Task 9.1 Apply

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-9-1-apply.yml

permissions:
  contents: write

jobs:
  task-9-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard target branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v0.9.0-test-noche"
          git fetch origin v0.9.0-test-noche
          test "$(git rev-parse origin/v0.9.0-test-noche)" = "${GITHUB_SHA}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply task 9.1 extraction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/task-9-1-apply.yml
          mkdir -p src/features/session tests/component-dom tests/integration
          cat > src/features/session/useSessionState.ts <<'EOF'
          import { useState } from "react";
          import type { AppSettings } from "../../types";

          export type ConnectionState = "checking" | "online" | "poor" | "offline";

          export interface SessionState {
            settings: AppSettings | null;
            setSettings: React.Dispatch<React.SetStateAction<AppSettings | null>>;
            setupDone: boolean;
            setSetupDone: React.Dispatch<React.SetStateAction<boolean>>;
            connectionState: ConnectionState;
            setConnectionState: React.Dispatch<React.SetStateAction<ConnectionState>>;
            cloudSessionVerified: boolean;
            setCloudSessionVerified: React.Dispatch<React.SetStateAction<boolean>>;
          }

          export function useSessionState(): SessionState {
            const [settings, setSettings] = useState<AppSettings | null>(null);
            const [setupDone, setSetupDone] = useState(false);
            const [cloudSessionVerified, setCloudSessionVerified] = useState(false);
            const [connectionState, setConnectionState] = useState<ConnectionState>(() =>
              typeof navigator !== "undefined" && navigator.onLine === false ? "offline" : "checking"
            );

            return {
              settings,
              setSettings,
              setupDone,
              setSetupDone,
              connectionState,
              setConnectionState,
              cloudSessionVerified,
              setCloudSessionVerified,
            };
          }
          EOF

          cat > src/features/session/useCustomCursor.ts <<'EOF'
          import { useEffect } from "react";

          const CUSTOM_CURSOR_STYLE_ID = "beatgaler-custom-cursor-style";

          export function useCustomCursor(enabled: boolean): void {
            useEffect(() => {
              let style = document.getElementById(CUSTOM_CURSOR_STYLE_ID) as HTMLStyleElement | null;

              if (enabled) {
                if (!style) {
                  style = document.createElement("style");
                  style.id = CUSTOM_CURSOR_STYLE_ID;
                  style.textContent = `
                    html, body, body * {
                      cursor: url('/beatgaler-custom-cursor.cur'), url('/beatgaler-custom-cursor.png') 0 0, auto !important;
                    }
                    input[type="text"],
                    input[type="email"],
                    input[type="password"],
                    input[type="search"],
                    input[type="url"],
                    input[type="tel"],
                    input[type="number"],
                    textarea,
                    [contenteditable="true"] {
                      cursor: text !important;
                    }
                  `;
                  document.head.appendChild(style);
                }
              } else {
                style?.remove();
              }

              return () => {
                // Keep the current setting active across React re-renders.
              };
            }, [enabled]);
          }
          EOF

          cat > src/features/session/useSessionActions.ts <<'EOF'
          import { useCallback } from "react";
          import type { Dispatch, SetStateAction } from "react";
          import type { AppSettings, Beat } from "../../types";

          interface SessionActionsOptions {
            setSettings: Dispatch<SetStateAction<AppSettings | null>>;
            setCloudSessionVerified: Dispatch<SetStateAction<boolean>>;
            logoutAccount: () => Promise<unknown>;
            releaseFile: () => void;
            progressiveRevealRunRef: { current: number };
            clearPlaybackPreparation: () => void;
            clearArtworkHydration: () => void;
            setRevealedBeatIds: Dispatch<SetStateAction<Set<string>>>;
            setBeats: Dispatch<SetStateAction<Beat[]>>;
            clearSelection: () => void;
          }

          export interface SessionActions {
            handleIncompleteWarningsChanged: (enabled: boolean) => void;
            handleCustomCursorChanged: (enabled: boolean) => void;
            handleFolderChanged: (folder: string) => void;
            handleDisconnectTelegramAccount: () => Promise<void>;
          }

          export function useSessionActions({
            setSettings,
            setCloudSessionVerified,
            logoutAccount,
            releaseFile,
            progressiveRevealRunRef,
            clearPlaybackPreparation,
            clearArtworkHydration,
            setRevealedBeatIds,
            setBeats,
            clearSelection,
          }: SessionActionsOptions): SessionActions {
            const handleIncompleteWarningsChanged = useCallback((enabled: boolean) => {
              setSettings(current => current
                ? { ...current, incomplete_warnings_enabled: enabled }
                : { beats_folder: null, incomplete_warnings_enabled: enabled, custom_cursor_enabled: true });
            }, [setSettings]);

            const handleCustomCursorChanged = useCallback((enabled: boolean) => {
              setSettings(current => current
                ? { ...current, custom_cursor_enabled: enabled }
                : { beats_folder: null, incomplete_warnings_enabled: true, custom_cursor_enabled: enabled });
            }, [setSettings]);

            const handleFolderChanged = useCallback((folder: string) => {
              setSettings(current => current
                ? { ...current, beats_folder: folder }
                : { beats_folder: folder, incomplete_warnings_enabled: true, custom_cursor_enabled: true });
            }, [setSettings]);

            const handleDisconnectTelegramAccount = useCallback(async () => {
              await logoutAccount().catch(() => {});
              releaseFile();
              progressiveRevealRunRef.current += 1;
              clearPlaybackPreparation();
              clearArtworkHydration();
              setRevealedBeatIds(new Set());
              setCloudSessionVerified(false);
              setBeats([]);
              clearSelection();
              setSettings(current => current ? {
                ...current,
                telegram_cloud_connected: false,
                telegram_cloud_username: null,
              } : current);
            }, [
              logoutAccount,
              releaseFile,
              progressiveRevealRunRef,
              clearPlaybackPreparation,
              clearArtworkHydration,
              setRevealedBeatIds,
              setCloudSessionVerified,
              setBeats,
              clearSelection,
              setSettings,
            ]);

            return {
              handleIncompleteWarningsChanged,
              handleCustomCursorChanged,
              handleFolderChanged,
              handleDisconnectTelegramAccount,
            };
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/App.tsx")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              text = text.replace(old, new, 1)

          replace_once(
              'import type { Beat, AppSettings } from "./types";',
              'import type { Beat } from "./types";',
              "AppSettings import",
          )
          replace_once(
              'import { useBeatRuntimeRegistry } from "./features/state/useBeatRuntimeRegistry";\n',
              'import { useBeatRuntimeRegistry } from "./features/state/useBeatRuntimeRegistry";\n'
              'import { useSessionState } from "./features/session/useSessionState";\n'
              'import { useSessionActions } from "./features/session/useSessionActions";\n'
              'import { useCustomCursor } from "./features/session/useCustomCursor";\n',
              "session imports",
          )
          replace_once(
              'type ConnectionState = "checking" | "online" | "poor" | "offline";\n\n',
              '',
              "local ConnectionState type",
          )
          old_state = '''  const [showSettings, setShowSettings] = useState(false);\n  const [settings, setSettings] = useState<AppSettings | null>(null);\n  // Prevent cached/local state from being pushed back to Telegram before this\n  // app session has first verified and pulled the authoritative pinned index.\n  const [cloudSessionVerified, setCloudSessionVerified] = useState(false);\n  const [connectionState, setConnectionState] = useState<ConnectionState>(() =>\n    typeof navigator !== "undefined" && navigator.onLine === false ? "offline" : "checking"\n  );\n'''
          new_state = '''  const [showSettings, setShowSettings] = useState(false);\n  const {\n    settings,\n    setSettings,\n    setupDone,\n    setSetupDone,\n    connectionState,\n    setConnectionState,\n    cloudSessionVerified,\n    setCloudSessionVerified,\n  } = useSessionState();\n'''
          replace_once(old_state, new_state, "session state block")
          replace_once(
              '  const [setupDone, setSetupDone] = useState(false);\n',
              '',
              "setup state",
          )

          cursor_pattern = re.compile(
              r'\n  useEffect\(\(\) => \{\n    const styleId = "beatgaler-custom-cursor-style";.*?\n  \}, \[settings\?\.custom_cursor_enabled\]\);\n',
              re.S,
          )
          text, count = cursor_pattern.subn(
              '\n  useCustomCursor(settings?.custom_cursor_enabled ?? true);\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"custom cursor effect: expected one match, got {count}")

          disconnect_pattern = re.compile(
              r'  const handleDisconnectTelegramAccount = useCallback\(async \(\) => \{\n'
              r'.*?\n  \}, \[releaseFile\]\);\n',
              re.S,
          )
          disconnect_replacement = '''  const {\n    handleIncompleteWarningsChanged,\n    handleCustomCursorChanged,\n    handleFolderChanged,\n    handleDisconnectTelegramAccount,\n  } = useSessionActions({\n    setSettings,\n    setCloudSessionVerified,\n    logoutAccount: logoutBeatGalerAccount,\n    releaseFile,\n    progressiveRevealRunRef,\n    clearPlaybackPreparation,\n    clearArtworkHydration,\n    setRevealedBeatIds,\n    setBeats,\n    clearSelection,\n  });\n'''
          text, count = disconnect_pattern.subn(disconnect_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"disconnect action: expected one match, got {count}")

          old_settings_props = '''          onIncompleteWarningsChanged={(enabled: boolean) => setSettings(current => current\n            ? { ...current, incomplete_warnings_enabled: enabled }\n            : { beats_folder: null, incomplete_warnings_enabled: enabled, custom_cursor_enabled: true })}\n          customCursorEnabled={settings?.custom_cursor_enabled ?? true}\n          onCustomCursorChanged={(enabled: boolean) => setSettings(current => current\n            ? { ...current, custom_cursor_enabled: enabled }\n            : { beats_folder: null, incomplete_warnings_enabled: true, custom_cursor_enabled: enabled })}\n'''
          new_settings_props = '''          onIncompleteWarningsChanged={handleIncompleteWarningsChanged}\n          customCursorEnabled={settings?.custom_cursor_enabled ?? true}\n          onCustomCursorChanged={handleCustomCursorChanged}\n'''
          replace_once(old_settings_props, new_settings_props, "settings preference props")
          replace_once(
              '          onFolderChanged={folder => setSettings(s => s ? { ...s, beats_folder: folder } : { beats_folder: folder, incomplete_warnings_enabled: true, custom_cursor_enabled: true })}\n',
              '          onFolderChanged={handleFolderChanged}\n',
              "folder preference prop",
          )

          path.write_text(text)
          PY

          cat > tests/component-dom/sessionState.test.tsx <<'EOF'
          // @vitest-environment jsdom
          import React, { act, useRef, useState } from "react";
          import { createRoot, type Root } from "react-dom/client";
          import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";
          import type { AppSettings, Beat } from "../../src/types";
          import { useSessionState, type SessionState } from "../../src/features/session/useSessionState";
          import { useSessionActions, type SessionActions } from "../../src/features/session/useSessionActions";
          import { useCustomCursor } from "../../src/features/session/useCustomCursor";

          (globalThis as typeof globalThis & { IS_REACT_ACT_ENVIRONMENT?: boolean }).IS_REACT_ACT_ENVIRONMENT = true;

          let host: HTMLDivElement | null = null;
          let root: Root | null = null;
          let session: SessionState | null = null;
          let actions: SessionActions | null = null;
          let setCursorEnabled: React.Dispatch<React.SetStateAction<boolean>> | null = null;
          let latestBeats: Beat[] = [];
          let latestRevealed = new Set<string>();
          let revealRun = 0;

          const logoutAccount = vi.fn(async () => undefined);
          const releaseFile = vi.fn();
          const clearPlaybackPreparation = vi.fn();
          const clearArtworkHydration = vi.fn();
          const clearSelection = vi.fn();

          const beat = { id: "beat-1" } as Beat;

          function Harness() {
            session = useSessionState();
            const [beats, setBeats] = useState<Beat[]>([beat]);
            const [revealed, setRevealedBeatIds] = useState<Set<string>>(() => new Set([beat.id]));
            const [cursorEnabled, setEnabled] = useState(true);
            const progressiveRevealRunRef = useRef(0);
            useCustomCursor(cursorEnabled);
            setCursorEnabled = setEnabled;
            latestBeats = beats;
            latestRevealed = revealed;
            revealRun = progressiveRevealRunRef.current;
            actions = useSessionActions({
              setSettings: session.setSettings,
              setCloudSessionVerified: session.setCloudSessionVerified,
              logoutAccount,
              releaseFile,
              progressiveRevealRunRef,
              clearPlaybackPreparation,
              clearArtworkHydration,
              setRevealedBeatIds,
              setBeats,
              clearSelection,
            });
            return null;
          }

          async function renderHarness() {
            host = document.createElement("div");
            document.body.appendChild(host);
            root = createRoot(host);
            await act(async () => { root!.render(<Harness />); });
          }

          beforeEach(() => {
            logoutAccount.mockClear();
            releaseFile.mockClear();
            clearPlaybackPreparation.mockClear();
            clearArtworkHydration.mockClear();
            clearSelection.mockClear();
            document.getElementById("beatgaler-custom-cursor-style")?.remove();
          });

          afterEach(async () => {
            if (root) await act(async () => root!.unmount());
            root = null;
            host?.remove();
            host = null;
            session = null;
            actions = null;
            setCursorEnabled = null;
            document.getElementById("beatgaler-custom-cursor-style")?.remove();
          });

          describe("session ownership", () => {
            it("keeps connectivity and cloud verification as independent state", async () => {
              await renderHarness();
              await act(async () => {
                session!.setConnectionState("poor");
                session!.setCloudSessionVerified(true);
              });
              expect(session!.connectionState).toBe("poor");
              expect(session!.cloudSessionVerified).toBe(true);

              await act(async () => { session!.setCloudSessionVerified(false); });
              expect(session!.connectionState).toBe("poor");
              expect(session!.cloudSessionVerified).toBe(false);
            });

            it("owns local preference mutations and the custom cursor effect", async () => {
              await renderHarness();
              expect(document.getElementById("beatgaler-custom-cursor-style")?.textContent).toContain("beatgaler-custom-cursor.cur");

              await act(async () => {
                actions!.handleIncompleteWarningsChanged(false);
                actions!.handleCustomCursorChanged(false);
                actions!.handleFolderChanged("C:/Beats");
              });
              expect(session!.settings).toMatchObject({
                beats_folder: "C:/Beats",
                incomplete_warnings_enabled: false,
                custom_cursor_enabled: false,
              } satisfies Partial<AppSettings>);

              await act(async () => { setCursorEnabled!(false); });
              expect(document.getElementById("beatgaler-custom-cursor-style")).toBeNull();
            });

            it("preserves sign-out cleanup of audio, presentation and session state", async () => {
              await renderHarness();
              await act(async () => {
                session!.setSettings({
                  beats_folder: null,
                  incomplete_warnings_enabled: true,
                  custom_cursor_enabled: true,
                  telegram_cloud_connected: true,
                  telegram_cloud_username: "linked-user",
                });
                session!.setCloudSessionVerified(true);
              });

              await act(async () => { await actions!.handleDisconnectTelegramAccount(); });
              expect(logoutAccount).toHaveBeenCalledTimes(1);
              expect(releaseFile).toHaveBeenCalledTimes(1);
              expect(clearPlaybackPreparation).toHaveBeenCalledTimes(1);
              expect(clearArtworkHydration).toHaveBeenCalledTimes(1);
              expect(clearSelection).toHaveBeenCalledTimes(1);
              expect(session!.cloudSessionVerified).toBe(false);
              expect(session!.settings?.telegram_cloud_connected).toBe(false);
              expect(session!.settings?.telegram_cloud_username).toBeNull();
              expect(latestBeats).toEqual([]);
              expect(Array.from(latestRevealed)).toEqual([]);
              expect(revealRun).toBe(1);
            });
          });
          EOF

          cat > tests/integration/appSessionExtraction.test.ts <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          import { describe, expect, it } from "vitest";

          const root = process.cwd();
          const app = fs.readFileSync(path.join(root, "src/App.tsx"), "utf8");
          const state = fs.readFileSync(path.join(root, "src/features/session/useSessionState.ts"), "utf8");
          const actions = fs.readFileSync(path.join(root, "src/features/session/useSessionActions.ts"), "utf8");
          const cursor = fs.readFileSync(path.join(root, "src/features/session/useCustomCursor.ts"), "utf8");

          describe("task 9.1 session/settings extraction", () => {
            it("moves session state ownership out of App without collapsing connectivity into verification", () => {
              expect(app).toContain("} = useSessionState();");
              expect(app).not.toContain("useState<AppSettings | null>");
              expect(app).not.toContain('type ConnectionState = "checking"');
              expect(state).toContain("const [connectionState, setConnectionState]");
              expect(state).toContain("const [cloudSessionVerified, setCloudSessionVerified] = useState(false)");
              expect(state).toContain("const [setupDone, setSetupDone] = useState(false)");
              expect(state).not.toContain("cloudSessionVerified = connectionState");
            });

            it("moves preferences, cursor and disconnect cleanup to session owners", () => {
              expect(app).toContain("useCustomCursor(settings?.custom_cursor_enabled ?? true);");
              expect(app).toContain("} = useSessionActions({");
              expect(app).toContain("onIncompleteWarningsChanged={handleIncompleteWarningsChanged}");
              expect(app).toContain("onCustomCursorChanged={handleCustomCursorChanged}");
              expect(app).toContain("onFolderChanged={handleFolderChanged}");
              expect(app).toContain("onDisconnectTelegram={handleDisconnectTelegramAccount}");
              expect(cursor).toContain('CUSTOM_CURSOR_STYLE_ID = "beatgaler-custom-cursor-style"');
              expect(cursor).toContain("beatgaler-custom-cursor.cur");
              expect(actions).toContain("await logoutAccount().catch(() => {});");
              expect(actions).toContain("releaseFile();");
              expect(actions).toContain("progressiveRevealRunRef.current += 1;");
              expect(actions).toContain("clearPlaybackPreparation();");
              expect(actions).toContain("clearArtworkHydration();");
              expect(actions).toContain("setRevealedBeatIds(new Set());");
              expect(actions).toContain("setCloudSessionVerified(false);");
              expect(actions).toContain("setBeats([]);");
              expect(actions).toContain("clearSelection();");
            });

            it("does not pull forward startup, reconnect or SSE from their later roadmap tasks", () => {
              expect(app).toContain("pollTelegramCloudStatus");
              expect(app).toContain('window.addEventListener("offline", onOffline)');
              expect(app).toContain("new EventSource(url)");
              expect(app).toContain("libraryStateManager.reloadAuthoritative()");
              expect(state).not.toContain("pollTelegramCloudStatus");
              expect(actions).not.toContain("EventSource");
            });
          });
          EOF

      - name: Focused task 9.1 tests
        run: npx vitest run tests/component-dom/sessionState.test.tsx tests/integration/appSessionExtraction.test.ts

      - name: Diff check
        run: git diff --check

      - name: Run migration matrix
        id: migration_checks
        continue-on-error: true
        run: node scripts/run-migration-checks-with-logs.mjs

      - name: Upload migration check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-9-1-${{ github.run_id }}
          path: artifacts/migration-check-logs/
          if-no-files-found: warn

      - name: Require migration matrix
        if: steps.migration_checks.outcome != 'success'
        run: exit 1

      - name: Commit exact validated implementation
        if: steps.migration_checks.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/migration-check-logs
          git diff --check
          git fetch origin v0.9.0-test-noche
          test "$(git rev-parse origin/v0.9.0-test-noche)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract session and settings ownership"
          git push origin HEAD:v0.9.0-test-noche
