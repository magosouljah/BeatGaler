name: Temporary Task 3.4 Close

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-3-4-close.yml

permissions:
  contents: write

jobs:
  close-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0
      - name: Close task 3.4 documentation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "v0.9.0-test-noche"
          echo '... (truncated) ...' | base64 -d > /tmp/close_task.py
          python /tmp/close_task.py
          rm .github/workflows/task-3-4-close.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migration/BeatGaler-roadmap-para-trabajar-con-IAs.md migration/Registro-de-avance.md migration/BeatGaler-agent-state.md .github/workflows/task-3-4-close.yml
          git commit -m 'chore(migration): close task 3.4 state'
          git push origin HEAD:v0.9.0-test-noche
