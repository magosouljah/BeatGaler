name: Integration Web Backend Patch

on:
  push:
    branches:
      - integration-v0.8.0-alpha.1
    paths:
      - .github/workflows/integration-web-backend-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration-v0.8.0-alpha.1
          fetch-depth: 0
      - name: Patch Web transport envelope into split Cloud backend
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server_path = Path('cloud-server/server-core.js')
          server = server_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          server = replace_once(
              server,
              'const directTransport = require("./direct-transport-control");\n',
              'const directTransport = require("./direct-transport-control");\nconst { wrapWebTransportSession } = require("./web-transport-envelope");\n',
              'transport envelope import',
          )

          server = replace_once(
              server,
              '''    const session = await directTransport.startSession({
                installationId: beatgalerUserId,
                chatId: storageChatId(account),
              });
              res.json(session);''',
              '''    const session = await directTransport.startSession({
                installationId: beatgalerUserId,
                chatId: storageChatId(account),
              });
              res.json(wrapWebTransportSession(session, req.body?.webTransportPublicKey));''',
              'session start response',
          )

          server = replace_once(
              server,
              '''    res.json(await directTransport.heartbeat({
                installationId: beatgalerUserId,
                sessionId: String(req.body?.sessionId || ""),
                generation: Number(req.body?.generation || 0),
                credentialVersion: Number(req.body?.credentialVersion || 0),
              }));''',
              '''    const heartbeat = await directTransport.heartbeat({
                installationId: beatgalerUserId,
                sessionId: String(req.body?.sessionId || ""),
                generation: Number(req.body?.generation || 0),
                credentialVersion: Number(req.body?.credentialVersion || 0),
              });
              if (heartbeat?.credential_refresh) {
                heartbeat.credential_refresh = wrapWebTransportSession(
                  heartbeat.credential_refresh,
                  req.body?.webTransportPublicKey,
                );
              }
              res.json(heartbeat);''',
              'heartbeat response',
          )

          server = replace_once(
              server,
              '''    res.json(await directTransport.beginOperation({
                installationId: beatgalerUserId,
                sessionId: String(req.body?.sessionId || ""),
                generation: Number(req.body?.generation || 0),
                credentialVersion: Number(req.body?.credentialVersion || 0),
                kind: String(req.body?.kind || "data"),
              }));''',
              '''    const operation = await directTransport.beginOperation({
                installationId: beatgalerUserId,
                sessionId: String(req.body?.sessionId || ""),
                generation: Number(req.body?.generation || 0),
                credentialVersion: Number(req.body?.credentialVersion || 0),
                kind: String(req.body?.kind || "data"),
              });
              if (operation?.credential_refresh) {
                operation.credential_refresh = wrapWebTransportSession(
                  operation.credential_refresh,
                  req.body?.webTransportPublicKey,
                );
              }
              res.json(operation);''',
              'operation begin response',
          )
          server_path.write_text(server, encoding='utf-8')

          envelope = r'''\'use strict\';

          const crypto = require(\'crypto\');

          const ENVELOPE_FORMAT = \'beatgaler-web-transport-v1\';

          function importBrowserPublicKey(publicJwk) {
            if (!publicJwk || typeof publicJwk !== \'object\' || Array.isArray(publicJwk)) {
              throw new Error(\'Web transport public key is required.\');
            }
            if (publicJwk.kty !== \'RSA\' || publicJwk.alg !== \'RSA-OAEP-256\' || publicJwk.key_ops?.includes(\'encrypt\') === false) {
              throw new Error(\'Web transport public key is invalid.\');
            }
            const key = crypto.createPublicKey({ key: publicJwk, format: \'jwk\' });
            const bits = Number(key.asymmetricKeyDetails?.modulusLength || 0);
            if (key.asymmetricKeyType !== \'rsa\' || bits < 2048) {
              throw new Error(\'Web transport public key must use RSA-2048 or stronger.\');
            }
            return key;
          }

          function wrapWebTransportSession(session, publicJwk) {
            if (!publicJwk) return session;
            const key = importBrowserPublicKey(publicJwk);
            const compactCredentials = {
              t: String(session?.bot_token || \'\'),
              i: Number(session?.telegram_api_id || 0),
              h: String(session?.telegram_api_hash || \'\'),
            };
            if (!compactCredentials.t || !compactCredentials.i || !compactCredentials.h) {
              throw new Error(\'Web transport credentials are incomplete.\');
            }

            const plaintext = Buffer.from(JSON.stringify(compactCredentials), \'utf8\');
            const ciphertext = crypto.publicEncrypt({
              key,
              padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
              oaepHash: \'sha256\',
            }, plaintext);

            const wrapped = { ...session };
            delete wrapped.bot_token;
            delete wrapped.telegram_api_id;
            delete wrapped.telegram_api_hash;
            wrapped.mode = \'galer-direct-web-mtproto\';
            wrapped.credential_envelope = {
              version: 1,
              format: ENVELOPE_FORMAT,
              algorithm: \'RSA-OAEP-256\',
              ciphertext: ciphertext.toString(\'base64url\'),
            };
            return wrapped;
          }

          module.exports = { ENVELOPE_FORMAT, importBrowserPublicKey, wrapWebTransportSession };
          '''
          # Remove workflow indentation from the embedded source.
          envelope = '\n'.join(line[10:] if line.startswith('          ') else line for line in envelope.splitlines()) + '\n'
          Path('cloud-server/web-transport-envelope.js').write_text(envelope, encoding='utf-8')

          tests_path = Path('cloud-server/tests/unit.test.cjs')
          tests = tests_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              "const Module = require('module');\n",
              "const Module = require('module');\nconst crypto = require('crypto');\n",
              'unit crypto import',
          )

          insert = r'''
          const { wrapWebTransportSession } = require('../web-transport-envelope.js');
          passed += test('Web transport credentials are encrypted for the browser session key', () => {
            const { publicKey, privateKey } = crypto.generateKeyPairSync('rsa', { modulusLength: 2048 });
            const wrapped = wrapWebTransportSession({
              ok: true,
              mode: 'telegram-direct-botapi-local',
              session_id: 'session-1',
              bot_token: '123456:prototype-secret',
              telegram_api_id: 12345,
              telegram_api_hash: 'REDACTED_TELEGRAM_API_HASH',
            }, { ...publicKey.export({ format: 'jwk' }), alg: 'RSA-OAEP-256', key_ops: ['encrypt'] });

            assert.equal(wrapped.mode, 'galer-direct-web-mtproto');
            assert.equal(wrapped.bot_token, undefined);
            assert.equal(wrapped.telegram_api_id, undefined);
            assert.equal(wrapped.telegram_api_hash, undefined);
            const decrypted = crypto.privateDecrypt({
              key: privateKey,
              padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
              oaepHash: 'sha256',
            }, Buffer.from(wrapped.credential_envelope.ciphertext, 'base64url'));
            assert.deepEqual(JSON.parse(decrypted.toString('utf8')), {
              t: '123456:prototype-secret',
              i: 12345,
              h: 'REDACTED_TELEGRAM_API_HASH',
            });
          }) ? 1 : 0;

          passed += test('Web transport rejects weak browser encryption keys', () => {
            const { publicKey } = crypto.generateKeyPairSync('rsa', { modulusLength: 1024 });
            assert.throws(() => wrapWebTransportSession({
              bot_token: 'token', telegram_api_id: 1, telegram_api_hash: 'hash',
            }, { ...publicKey.export({ format: 'jwk' }), alg: 'RSA-OAEP-256', key_ops: ['encrypt'] }), /RSA-2048/);
          }) ? 1 : 0;

          passed += test('operation credential refreshes remain encrypted for Web clients', () => {
            const serverSource = fs.readFileSync(path.join(__dirname, '..', 'server-core.js'), 'utf8');
            const routeStart = serverSource.indexOf('app.post("/transport/operation/begin"');
            const routeEnd = serverSource.indexOf('app.post("/transport/operation/end"', routeStart);
            const route = serverSource.slice(routeStart, routeEnd);
            assert(route.includes('wrapWebTransportSession'));
            assert(route.includes('req.body?.webTransportPublicKey'));
          }) ? 1 : 0;

          '''
          insert = '\n'.join(line[10:] if line.startswith('          ') else line for line in insert.splitlines())
          marker = "fs.rmSync(tmp, { recursive: true, force: true });"
          if marker not in tests:
              raise SystemExit('unit insertion marker missing')
          tests = tests.replace(marker, insert + marker, 1)
          tests = tests.replace('PASS cloud/direct unit tests: ${passed}/11', 'PASS cloud/direct unit tests: ${passed}/14')
          tests_path.write_text(tests, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-server/server-core.js cloud-server/web-transport-envelope.js cloud-server/tests/unit.test.cjs
          git rm .github/workflows/integration-web-backend-patch.yml
          git commit -m "integration: secure web transport credentials"
          git push origin HEAD:integration-v0.8.0-alpha.1
