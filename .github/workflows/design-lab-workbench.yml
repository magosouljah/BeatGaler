name: Design Lab Workbench
on:
  push:
    branches:
      - design/beatgaler-design-system-lab-v1
    paths:
      - design-lab/**
      - BLUEPRINT/DESIGN-SYSTEM/**
      - .github/workflows/design-lab-workbench.yml
  workflow_dispatch:
jobs:
  isolated-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Design Lab contracts and motion tests
        run: node --test design-lab/lab-contract.test.mjs design-lab/system-contract.test.mjs
      - name: Design Lab TypeScript only
        run: npx --no-install tsc --project design-lab/tsconfig.json --noEmit
      - name: Standalone Design Lab build only
        run: npx --no-install vite build --config design-lab/vite.config.ts
