name: Design Lab standalone
on:
  push:
    branches: [design/beatgaler-design-system-lab-v1]
    paths:
      - "DESIGN/**"
      - "BLUEPRINT/DESIGN-SYSTEM/**"
      - ".github/workflows/design-lab-workbench.yml"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test DESIGN/lab-contract.test.mjs
      - run: npx --no-install tsc --project DESIGN/tsconfig.json --noEmit
      - run: npx --no-install vite build --config DESIGN/vite.config.ts
