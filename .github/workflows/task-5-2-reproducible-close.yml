name: Task 5.2 Reproducible Close

on:
  push:
    branches:
      - v0.9.0-test-noche
    paths:
      - .github/workflows/task-5-2-reproducible-close.yml

permissions:
  contents: write

jobs:
  verify-and-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Apply versioned regression-owner adaptation
        run: python3 scripts/task-5-2-regression-owner-temp.py

      - name: Install dependencies
        run: npm ci

      - name: Run migration checks
        id: checks
        continue-on-error: true
        run: node scripts/run-migration-checks-with-logs.mjs

      - name: Upload readable migration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check-logs-task-5-2-repro-${{ github.run_id }}
          path: artifacts/migration-check-logs/
          if-no-files-found: error
          retention-days: 7

      - name: Commit only if the versioned result is green
        if: steps.checks.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-regressions.mjs
          git rm scripts/task-5-2-regression-owner-temp.py .github/workflows/task-5-2-reproducible-close.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "test(regressions): follow beat asset update owner"
          git push origin HEAD:v0.9.0-test-noche

      - name: Fail after artifact upload
        if: steps.checks.outcome == 'failure'
        run: exit 1
