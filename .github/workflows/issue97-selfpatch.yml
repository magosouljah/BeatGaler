name: Issue 97 bounded App patch

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-97-temp-auth-artwork-resilience-v2
          fetch-depth: 0
      - name: Patch App
        run: python scripts/issue97-selfpatch.py
      - name: Commit bounded patch
        run: |
          rm .github/workflows/issue97-selfpatch.yml scripts/issue97-selfpatch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/issue97-selfpatch.yml scripts/issue97-selfpatch.py
          git commit -m "fix(web): route artwork drop through Web editor adapter"
          git push origin HEAD:issue-97-temp-auth-artwork-resilience-v2
