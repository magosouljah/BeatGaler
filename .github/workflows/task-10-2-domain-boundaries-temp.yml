name: Task 10.2 domain boundary split temp

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/task-10-2-domain-boundaries-temp.yml
      - scripts/task-10-2-domain-boundaries-temp.cjs

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Split active domain logic from root composition
        run: node scripts/task-10-2-domain-boundaries-temp.cjs
      - name: Follow moved Review characterization
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'tests/integration/appMigrationCharacterization.test.ts';
          let source = fs.readFileSync(path, 'utf8');
          const importSessionLine = 'const importSession = readFileSync(resolve(process.cwd(), "src/features/import/useImportSession.ts"), "utf8");';
          if (!source.includes(importSessionLine)) throw new Error('Import-session characterization anchor changed');
          source = source.replace(
            importSessionLine,
            `${importSessionLine}\nconst importEntry = readFileSync(resolve(process.cwd(), "src/features/import/useImportEntry.ts"), "utf8");`,
          );
          const oldAdd = '    const add = section("const addBeatsAndReview = useCallback", "const {\\n  skipCurrentReviewBeat,");';
          const newAdd = '    const add = sourceSection(importEntry, "const addBeatsAndReview = useCallback", "\\n  return { addBeatsAndReview };", "useImportEntry.ts");';
          if (!source.includes(oldAdd)) throw new Error('Review entry characterization anchor changed');
          source = source.replace(oldAdd, newAdd);
          const oldReviewOwners = 'owners: ["src/features/import/useImportReview.ts", "src/features/import/useImportDiscovery.ts", "src/features/import/useImportSaveAll.ts", "src/features/import/useBrowserImport.ts"]';
          const newReviewOwners = 'owners: ["src/features/import/useImportReview.ts", "src/features/import/useImportDiscovery.ts", "src/features/import/useImportSaveAll.ts", "src/features/import/useBrowserImport.ts", "src/features/import/useImportEntry.ts"]';
          if (!source.includes(oldReviewOwners)) throw new Error('Review owner characterization anchor changed');
          source = source.replace(oldReviewOwners, newReviewOwners);
          fs.writeFileSync(path, source);
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Focused architecture check
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('src/App.tsx', 'utf8');
          const beatGalerApp = fs.readFileSync('src/app/BeatGalerApp.tsx', 'utf8');
          const composition = fs.readFileSync('src/app/useBeatGalerComposition.ts', 'utf8');
          const lines = app.trimEnd().split(/\r?\n/).length;
          if (lines < 5 || lines > 15) throw new Error(`App.tsx must remain 5-15 lines, got ${lines}`);
          if (!app.includes('<BeatGalerApp />') || app.includes('AccountGate') || app.includes('platform.kind')) throw new Error('App.tsx is not a minimal entry point');
          if (!beatGalerApp.includes('platform.kind === "web"') || !beatGalerApp.includes('<AccountGate><BeatGalerWorkspace /></AccountGate>')) throw new Error('Platform authentication route changed');
          for (const forbidden of [
            'recoverTelegramLibraryOnceIfEmpty',
            'const handleUploadTelegram = useCallback',
            'BeatGaler does not import new beats while offline',
            'const rejectOfflineMutation = useCallback',
          ]) {
            if (composition.includes(forbidden)) throw new Error(`Domain logic remained in root composition: ${forbidden}`);
          }
          for (const required of ['useMutationAvailability(', 'useCloudLibraryRecovery(', 'useCloudBeatTransfer(', 'useImportEntry(']) {
            if (!composition.includes(required)) throw new Error(`Missing feature boundary wiring: ${required}`);
          }
          NODE
      - name: Typecheck
        run: npm run test:typecheck
      - name: Unit TS
        run: npm run test:unit:ts
      - name: Component DOM
        run: npm run test:component:dom
      - name: Integration
        run: npm run test:integration
      - name: Regressions
        run: npm run test:regressions
      - name: Build web
        run: npm run build:web
      - name: Build desktop
        run: npm run build
      - name: Commit validated boundary split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(app): move domain actions behind feature boundaries"
          git push origin HEAD:v0.9.0-test-noche
