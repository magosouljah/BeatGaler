name: Task 10.2 composition refactor temp

on:
  push:
    branches: [v0.9.0-test-noche]
    paths:
      - .github/workflows/task-10-2-composition-temp.yml

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.0-test-noche
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Create explicit composition boundary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sourcePath = 'src/App.tsx';
          const source = fs.readFileSync(sourcePath, 'utf8');
          const functionMarker = 'function BeatGalerApp() {';
          const appMarker = '\n\nexport default function App() {';
          if (!source.includes(functionMarker) || !source.includes(appMarker)) {
            throw new Error('App.tsx no longer matches the validated 10.1 composition shape');
          }
          const appStart = source.lastIndexOf(appMarker);
          const legacy = source
            .slice(0, appStart)
            .replace(functionMarker, 'export function BeatGalerCompositionLegacy() {')
            .trimEnd() + '\n';
          fs.writeFileSync('src/BeatGalerCompositionLegacy.tsx', legacy);
          fs.writeFileSync('src/app/useBeatGalerComposition.tsx', `import React from "react";\nimport { BeatGalerCompositionLegacy } from "../BeatGalerCompositionLegacy";\n\n/**\n * Transitional composition bridge. Domain owners stay in features; this hook\n * only selects the assembled application body while 10.3 removes legacy glue.\n */\nexport function useBeatGalerComposition() {\n  return <BeatGalerCompositionLegacy />;\n}\n`);
          fs.writeFileSync('src/app/BeatGalerApp.tsx', `import React from "react";\nimport { useBeatGalerComposition } from "./useBeatGalerComposition";\n\n/** Application-level composition. Platform authentication stays at App.tsx. */\nexport default function BeatGalerApp() {\n  return useBeatGalerComposition();\n}\n`);
          fs.writeFileSync(sourcePath, `import React from "react";\nimport AccountGate from "./components/AccountGate";\nimport { platform } from "./platform";\nimport BeatGalerApp from "./app/BeatGalerApp";\n\nexport default function App() {\n  return platform.kind === "web"\n    ? <BeatGalerApp />\n    : <AccountGate><BeatGalerApp /></AccountGate>;\n}\n`);
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Focused structural check
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('src/App.tsx', 'utf8');
          const beatGalerApp = fs.readFileSync('src/app/BeatGalerApp.tsx', 'utf8');
          const composition = fs.readFileSync('src/app/useBeatGalerComposition.tsx', 'utf8');
          const lines = app.trimEnd().split(/\r?\n/).length;
          if (lines < 5 || lines > 15) throw new Error(`App.tsx must remain 5-15 lines, got ${lines}`);
          if (!app.includes('<BeatGalerApp />') || !app.includes('<AccountGate><BeatGalerApp /></AccountGate>')) throw new Error('Platform auth composition changed');
          if (!beatGalerApp.includes('useBeatGalerComposition')) throw new Error('BeatGalerApp must use the composition boundary');
          if (!composition.includes('BeatGalerCompositionLegacy')) throw new Error('Transitional composition bridge missing');
          NODE
      - name: Typecheck
        run: npm run test:typecheck
      - name: Unit TS
        run: npm run test:unit:ts
      - name: Component DOM
        run: npm run test:component:dom
      - name: Integration
        run: npm run test:integration
      - name: Regressions
        run: npm run test:regressions
      - name: Build web
        run: npm run build:web
      - name: Build desktop
        run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/BeatGalerCompositionLegacy.tsx src/app/BeatGalerApp.tsx src/app/useBeatGalerComposition.tsx
          git commit -m "refactor(app): establish minimal composition root for 10.2"
          git push origin HEAD:v0.9.0-test-noche
