name: Direct - Persistent Vault Assignment

on:
  push:
    branches:
      - direct/persistent-vault-assignment
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - scripts/regression-direct-manager-only.mjs
      - scripts/regression-direct-manager-only.test.mjs
      - cloud-server/direct-transport-control.js
      - cloud-server/direct-persistent-assignment-runtime.js
      - cloud-server/direct-persistent-session-runtime.js
      - cloud-server/direct-persistent-membership-runtime.js
      - cloud-server/direct-vault-assignment.js
      - cloud-server/server.js
      - cloud-server/server-core.js
      - cloud-server/master-storage.js
      - cloud-server/productive-temp-auth-boundary.js
      - cloud-server/.env.example
      - cloud-server/TELEGRAM-DIRECT-V5-BOTAPI.md
      - cloud-server/package.json
      - src-tauri/direct-transport/transport-helper.source.mjs
      - src-tauri/src/commands.rs
      - src/features/**
      - tests/**
      - cloud-server/atomic-library-index.js
      - cloud-server/tests/atomic-library-index.test.cjs
      - cloud-server/migrations/**
      - cloud-server/tests/direct-allocator-no-cap.test.cjs
      - cloud-server/tests/direct-membership-provisioning-primitive.test.cjs
      - cloud-server/tests/direct-persistent-assignment-runtime.test.cjs
      - cloud-server/tests/direct-persistent-session-runtime.test.cjs
      - cloud-server/tests/direct-persistent-membership-runtime.test.cjs
      - cloud-server/tests/direct-persistent-ready-no-master.test.cjs
      - cloud-server/tests/direct-persistent-cleanup.test.cjs
      - cloud-server/tests/direct-persistent-legacy-lazy*
      - cloud-server/tests/direct-vault-assignment*
      - cloud-server/tests/postgres-live.integration.cjs
      - .github/workflows/direct-persistent-vault-assignment.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-persistent-assignment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud_unit:
    name: Cloud unit gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked npm graphs
        run: |
          npm ci
          npm ci --prefix cloud-server --ignore-scripts --no-audit --no-fund

      - name: Check persistent assignment sources
        run: |
          node --check cloud-server/direct-transport-control.js
          node --check cloud-server/direct-persistent-assignment-runtime.js
          node --check cloud-server/direct-persistent-session-runtime.js
          node --check cloud-server/direct-persistent-membership-runtime.js
          node --check cloud-server/direct-vault-assignment.js
          node --check cloud-server/server.js
          node --check cloud-server/server-core.js
          node --check cloud-server/tests/direct-allocator-no-cap.test.cjs
          node --check cloud-server/tests/direct-membership-provisioning-primitive.test.cjs
          node --check cloud-server/tests/direct-persistent-assignment-runtime.test.cjs
          node --check cloud-server/tests/direct-persistent-session-runtime.test.cjs
          node --check cloud-server/tests/direct-persistent-membership-runtime.test.cjs
          node --check cloud-server/tests/direct-persistent-ready-no-master.test.cjs
          node --check cloud-server/tests/direct-persistent-cleanup.test.cjs
          node --check cloud-server/tests/direct-persistent-legacy-lazy.test.cjs
          node --check cloud-server/tests/direct-persistent-legacy-lazy.postgres.integration.cjs
          node --check cloud-server/tests/direct-vault-assignment.test.cjs
          node --check cloud-server/tests/direct-vault-assignment.postgres.integration.cjs
          node --check cloud-server/tests/direct-vault-assignment.postgres.worker.cjs
          node --check cloud-server/tests/postgres-live.integration.cjs
          node --check scripts/regression-direct-manager-only.mjs
          node --check scripts/regression-direct-manager-only.test.mjs

      - name: Guard persistent Direct architecture and guard failure cases
        run: |
          node scripts/regression-direct-manager-only.mjs
          node scripts/regression-direct-manager-only.test.mjs

      - name: Run required Cloud unit gate
        run: npm run test:unit:cloud

  postgres_assignment:
    name: PostgreSQL persistent assignment gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beatgaler_direct_assignment_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beatgaler_direct_assignment_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/beatgaler_direct_assignment_ci
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install locked cloud-server graph
        run: npm ci --prefix cloud-server --ignore-scripts --no-audit --no-fund

      - name: Run real PostgreSQL assignment integration
        run: node cloud-server/tests/direct-vault-assignment.postgres.integration.cjs

      - name: Run legacy lazy PostgreSQL rollout integration
        run: node cloud-server/tests/direct-persistent-legacy-lazy.postgres.integration.cjs

      - name: Run existing PostgreSQL live integration
        run: node cloud-server/tests/postgres-live.integration.cjs

      - name: Run PostgreSQL Direct capability contract
        run: node cloud-server/tests/direct-capability-postgres.integration.cjs

  direct_clients:
    name: Direct data plane and Web regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked npm graphs
        run: |
          npm ci
          npm ci --prefix cloud-server --ignore-scripts --no-audit --no-fund
      - name: Execute Desktop and Web Direct data-plane implementations
        run: npm run test:direct:data-plane
      - name: TypeScript unit, component and integration suites
        run: |
          npm run test:typecheck
          npm run test:unit:ts
          npm run test:component:dom
          npm run test:integration
      - name: Full regression suite
        run: npm run test:regressions
      - name: Build and smoke real Web bundle
        run: |
          npm run build:web
          npm run test:web:smoke
