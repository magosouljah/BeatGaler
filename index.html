<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeatVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body {
        background: #0c0c0c;
        color: #fff;
        font-family: 'DM Sans', sans-serif;
        overflow: hidden;
      }
      ::-webkit-scrollbar { width: 4px; background: #0c0c0c; }
      ::-webkit-scrollbar-thumb { background: #1e1e1e; border-radius: 2px; }
      input::placeholder { color: #2e2e2e; }
      input, button { font-family: 'DM Sans', sans-serif; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes drawerIn {
        from { transform: translateX(100%); }
        to   { transform: translateX(0); }
      }
      @keyframes pgb1 { from{transform:scaleY(.25)} to{transform:scaleY(1)} }
      @keyframes pgb2 { from{transform:scaleY(.6)}  to{transform:scaleY(.2)} }
      @keyframes pgb3 { from{transform:scaleY(1)}   to{transform:scaleY(.35)} }
      @keyframes pgb4 { from{transform:scaleY(.4)}  to{transform:scaleY(.85)} }
      @keyframes dot  { from{opacity:.2} to{opacity:1} }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
