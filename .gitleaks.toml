title = "BeatGaler HEAD secret scan"
minVersion = "8.30.1"

[extend]
useDefault = true

# These are exact, non-secret values that intentionally look like generic keys.
# Every allowlist is constrained to the generic-api-key rule, the specific path,
# and the exact line shape. Any unrelated finding still fails the gate.
[[allowlists]]
description = "Pinned public Bot API source commit used by packaging workflows"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^\.github/workflows/(build-windows|build-macos|fast-build-macos-test)\.yml$''']
regexes = ['''^\s*BOT_API_COMMIT:\s*[0-9a-f]{40}\s*$''']

[[allowlists]]
description = "Deterministic fake API hash used only by the Web transport unit test"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^cloud-server/tests/unit\.test\.cjs$''']
regexes = ['''^\s*telegram_api_hash:\s*['"]REDACTED_TELEGRAM_API_HASH['"],?\s*$''']

[[allowlists]]
description = "STEP15 isolation guard compares an environment variable name, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^scripts/step15-isolated-env-guard\.mjs$''']
regexes = ['''^\s*key\.startsWith\('BILLING_E2E_'\) \|\| key === '[A-Z0-9_]{16}' \|\| key === 'STAGE1_COHORT_PASSWORD'\);$''']
