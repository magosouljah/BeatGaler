server {
    listen 80;
    listen [::]:80;
    server_name beatgaler.com www.beatgaler.com;

    root /var/www/beatgaler-web/current;
    index index.html;
    server_tokens off;

    location = /web-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # PROJECT is the only Web payload allowed to reach the commercial file-size
    # ceiling. Keep the rest of the API at 2 MiB so unrelated endpoints do not
    # inherit a multi-gigabyte request surface. Disable request buffering here so
    # Nginx does not create a second full multi-gigabyte temp copy before multer.
    location = /beatgaler-api/transport/project/upload {
        proxy_pass http://127.0.0.1:4000/transport/project/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        client_body_timeout 30m;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
        send_timeout 30m;
        client_max_body_size 2g;
    }

    location /beatgaler-api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        client_max_body_size 2m;
    }

    location = /.well-known/security.txt {
        types { }
        default_type "text/plain; charset=utf-8";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name status.beatgaler.com;

    root /var/www/beatgaler-web/current;
    server_tokens off;

    location = / {
        try_files /status/index.html =404;
    }

    location / {
        return 404;
    }
}
