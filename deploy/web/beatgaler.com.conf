server {
    listen 80;
    listen [::]:80;
    server_name beatgaler.com www.beatgaler.com;
    return 301 https://beatgaler.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name status.beatgaler.com;
    return 301 https://status.beatgaler.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.beatgaler.com;

    ssl_certificate /etc/letsencrypt/live/beatgaler.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beatgaler.com/privkey.pem;

    return 301 https://beatgaler.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.beatgaler.com;

    root /var/www/beatgaler-web/current;
    index status/index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/beatgaler.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beatgaler.com/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    location = / {
        try_files /status/index.html =404;
    }

    location = /index.html {
        try_files /status/index.html =404;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beatgaler.com;

    root /var/www/beatgaler-web/current;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/beatgaler.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beatgaler.com/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /web-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /.well-known/source-sha.txt {
        access_log off;
        types { }
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Browser Web uses this same-origin path first. Nginx strips /beatgaler-api/
    # and forwards requests to the existing Galer Cloud process on localhost:4000.
    location /beatgaler-api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        client_max_body_size 2m;
    }

    location = /.well-known/security.txt {
        types { }
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
